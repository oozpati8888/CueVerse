name: Build OOZ BALL Android APK

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/main.yml"
- "index.html"
- "ooz-table.jpg"
- "12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 22

- name: Create Android app
run: |
mkdir ooz-ball-app
cd ooz-ball-app
npm init -y
npm install @capacitor/core @capacitor/android
npm install --save-dev @capacitor/cli
mkdir www
cp ../index.html www/index.html
cp ../ooz-table.jpg www/ooz-table.jpg
cp ../12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png www/12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png
npx cap init "OOZ BALL" "com.oozball.app" --web-dir www
npx cap add android
npx cap sync android

- name: Build APK
run: |
cd ooz-ball-app/android
chmod +x gradlew
./gradlew assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: OOZ-BALL-Android
path: ooz-ball-app/android/app/build/outputs/apk/debug/app-debug.apk

