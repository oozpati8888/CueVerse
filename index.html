<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0,

<title>CueVerse OOZ Ball</title>

<style>

* {
box-sizing: border-box;
}

html,
body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;

font-family:
Arial,
Helvetica,
sans-serif;

background:
radial-gradient(
circle at center,
#263e55 0%,
#08111c 75%
);

color: white;

user-select: none;
-webkit-user-select: none;

touch-action: none;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

.game {
width: min(1120px, 97vw);

display: flex;
flex-direction: column;
align-items: center;
}


/* =========================================================
TOP BAR
========================================================= */

.topbar {
width: 100%;
height: 68px;

margin-bottom: 16px;
padding: 8px 20px;

display: flex;
align-items: center;
justify-content: space-between;

border-radius: 40px;

background:
linear-gradient(
180deg,
#1d2c3b,
#09121d
);

border: 1px solid #405365;

box-shadow:
0 15px 40px rgba(0,0,0,.55),
inset 0 1px rgba(255,255,255,.1);
}

display: flex;
align-items: center;
gap: 10px;
}

.avatar {
width: 46px;
height: 46px;

border-radius: 10px;

background:
radial-gradient(
circle at 35% 30%,
#777,
#222 55%,
#080808
);

border: 2px solid #d7ad3d;
}

.player-name {
font-size: 15px;
font-weight: 800;
}

.level {
margin-top: 3px;

color: #d7ad3d;

font-size: 12px;
}

.vs {
padding: 6px 15px;

border-radius: 6px;

background:
linear-gradient(
#e8c75f,
#997020
);

color: #111;

font-size: 12px;
font-weight: 900;
}


/* =========================================================
SPIELBEREICH
========================================================= */

.table-area {
display: flex;
align-items: center;
gap: 16px;
}


/* =========================================================
POWER
========================================================= */

.power-box {
width: 24px;
height: 400px;

position: relative;

overflow: hidden;

background: #080c10;

border: 2px solid #394650;

border-radius: 13px;

box-shadow:
inset 0 0 15px #000,

}

.power-fill {
position: absolute;

left: 0;
bottom: 0;

width: 100%;
height: 0%;

background:
linear-gradient(
to top,
#21c96c 0%,
#ffd42e 55%,
#ff3c21 100%
);

height .03s linear;

/* =========================================================
HOLZRAHMEN
========================================================= */

.table-frame {
padding: 25px;

border-radius: 18px;

background:
linear-gradient(
135deg,
#ad7431,
#70401d 45%,
#301706
);

border: 3px solid #291106;

box-shadow:
0 25px 60px rgba(0,0,0,.7),
inset 0 2px 2px rgba(255,255,255,.2),

CANVAS
========================================================= */

#poolCanvas {
display: block;

width: min(840px, 82vw);
height: auto;

border-radius: 5px;

box-shadow:
inset 0 0 35px rgba(0,0,0,.55);

INFO
========================================================= */

@media(max-width:800px) {

<script>

/* =========================================================
CUEVERSE OOZ BALL
STABILE NEUE VERSION
========================================================= */


/* =========================================================
ELEMENTE
========================================================= */

const canvas =
document.getElementById(
"poolCanvas"
);

const ctx =
canvas.getContext("2d");

const powerFill =
document.getElementById(
"powerFill"
);

const info =
document.getElementById(
"info"
);


/* =========================================================
TISCH
========================================================= */

const TABLE = {

left: 30,

right: 810,

top: 30,

bottom: 390

};


/* =========================================================
KUGEL
========================================================= */

const BALL_RADIUS = 13;


/* =========================================================
TASCHEN
========================================================= */

const POCKET_RADIUS = 25;


/* =========================================================
PHYSIK
========================================================= */

const FRICTION = 0.992;

const WALL_BOUNCE = 0.94;

const BALL_BOUNCE = 0.98;

const MAX_SPEED = 32;


/* =========================================================
TASCHEN
========================================================= */

const pockets = [

{
x: TABLE.left,
y: TABLE.top
},

{
x:
(TABLE.left +
TABLE.right) / 2,

y: TABLE.top
},

{
x: TABLE.right,
y: TABLE.top
},

{
x: TABLE.left,
y: TABLE.bottom
},

{
x:
(TABLE.left +
TABLE.right) / 2,

y: TABLE.bottom
},

{
x: TABLE.right,
y: TABLE.bottom
}

];


/* =========================================================
FARBEN
========================================================= */

const COLORS = {

1: "#f5c518",
2: "#176dcc",
3: "#df3535",
4: "#7137a9",
5: "#ed791c",
6: "#168d4c",

8: "#080808",

9: "#f5c518",
10: "#176dcc",
11: "#df3535",
12: "#7137a9",
13: "#ed791c",
14: "#168d4c"

};


/* =========================================================
KUGEL-KLASSE
========================================================= */

class Ball {

constructor(
x,
y,
number,
isCue = false
) {

this.x = x;

this.y = y;

this.vx = 0;

this.vy = 0;

this.number = number;

this.isCue = isCue;

this.active = true;

this.isStriped =
!isCue &&
number >= 9 &&
number <= 14;

this.color =
isCue
? "#ffffff"
: COLORS[number];

}


speed() {

return Math.hypot(
this.vx,
this.vy
);

}


update() {

if (!this.active)
return;


/* Bewegung */

this.x += this.vx;

this.y += this.vy;


/* Reibung */

this.vx *= FRICTION;

this.vy *= FRICTION;


if (
Math.abs(this.vx) < 0.015
) {
this.vx = 0;
}


if (
Math.abs(this.vy) < 0.015
) {
this.vy = 0;
}


/* ================================================
TASCHEN
================================================ */

for (
const pocket of pockets
) {

const distance =
Math.hypot(
this.x - pocket.x,
this.y - pocket.y
);


if (
distance <
POCKET_RADIUS
) {

this.active = false;

this.vx = 0;

this.vy = 0;


/* Weiße Kugel wieder einsetzen */

if (this.isCue) {

info.textContent =
"Weiße Kugel gefallen – Foul.";


setTimeout(() => {

this.active = true;

this.x = 220;

this.y = 210;

}, 600);

}

return;
}

}


/* ================================================
BANDEN
================================================ */

const minX =
TABLE.left +
BALL_RADIUS;

const maxX =
TABLE.right -
BALL_RADIUS;

const minY =
TABLE.top +
BALL_RADIUS;

const maxY =
TABLE.bottom -
BALL_RADIUS;


if (
this.x < minX
) {

this.x = minX;

this.vx =
Math.abs(this.vx) *
WALL_BOUNCE;

}


if (
this.x > maxX
) {

this.x = maxX;

this.vx =
-Math.abs(this.vx) *
WALL_BOUNCE;

}


if (
this.y < minY
) {

this.y = minY;

this.vy =
Math.abs(this.vy) *
WALL_BOUNCE;

}


if (
this.y > maxY
) {

this.y = maxY;

this.vy =
-Math.abs(this.vy) *
WALL_BOUNCE;

}

}


/* =====================================================
KUGEL ZEICHNEN
===================================================== */

draw() {

if (!this.active)
return;


ctx.save();


/* Schatten */

ctx.beginPath();

ctx.ellipse(
this.x + 3,
this.y + 4,
BALL_RADIUS * 1.05,
BALL_RADIUS * .72,
0,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(0,0,0,.42)";

ctx.fill();


/* ================================================
GRUNDKUGEL
================================================ */

const gradient =
ctx.createRadialGradient(
this.x - 5,
this.y - 5,
1,
this.x,
this.y,
BALL_RADIUS + 2
);


if (this.isCue) {

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.35,
"#fafafa"
);

gradient.addColorStop(
.78,
"#d0d0d0"
);

gradient.addColorStop(
1,
"#6c6c6c"
);

} else {

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.15,
this.color
);

gradient.addColorStop(
.70,
this.color
);

gradient.addColorStop(
1,
"#111111"
);

}


ctx.beginPath();

ctx.arc(
this.x,
this.y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle = gradient;

ctx.fill();


/* ================================================
HALBE KUGEL
================================================ */

if (
this.isStriped
) {

ctx.save();


/*
* Kugel als Clip
*/

ctx.beginPath();

ctx.arc(
this.x,
this.y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.clip();


/*
* komplett weiß
*/

ctx.fillStyle =
"#f8f8f8";

ctx.fillRect(
this.x - BALL_RADIUS,
this.y - BALL_RADIUS,
BALL_RADIUS * 2,
BALL_RADIUS * 2
);


/*
* farbiges Band
*/

ctx.fillStyle =
this.color;

ctx.fillRect(
this.x - BALL_RADIUS,
this.y - BALL_RADIUS * .48,
BALL_RADIUS * 2,
BALL_RADIUS * .96
);


ctx.restore();

}


/* ================================================
NUMMER
================================================ */

if (!this.isCue) {

ctx.beginPath();

ctx.arc(
this.x,
this.y,
5,
0,
Math.PI * 2
);

ctx.fillStyle =
"#ffffff";

ctx.fill();


ctx.fillStyle =
"#111111";

ctx.font =
"bold 7px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillText(
this.number,
this.x,
this.y
);

}


/* ================================================
GLANZ
================================================ */

ctx.beginPath();

ctx.arc(
this.x - 4.5,
this.y - 5,
2.5,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(255,255,255,.85)";

ctx.fill();


ctx.restore();

}

}


/* =========================================================
SPIELKUGELN
========================================================= */

let balls = [];

let cueBall;


/* =========================================================
RACK ERSTELLEN
========================================================= */

function createRack() {

balls = [];


/* ================================================
WEISSE KUGEL
================================================ */

cueBall =
new Ball(
220,
210,
0,
true
);

balls.push(
cueBall
);


/* ================================================
EXAKT 13 OBJEKTKUGELN

6 volle
6 halbe
1 schwarze
================================================ */

const rackNumbers = [

8,

1,
9,

2,
10,
3,

11,
4,
12,
5,

13,
6,
14

];


/*
Insgesamt:
1 + 2 + 3 + 4 + 3 = 13
*/


const startX = 600;

const startY = 210;

const spacing =
BALL_RADIUS * 2 + 2;


let index = 0;


for (
let row = 0;
row < 5;
row++
) {


/*
* 1 / 2 / 3 / 4 / 3
*
* ergibt exakt 13
*/

const count =
row === 4
? 3
: row + 1;


for (
let col = 0;
col < count;
col++
) {


const x =
startX +
row *
spacing *
.866;


const y =
startY +
(
col -
(count - 1) / 2
) *
spacing;


balls.push(

new Ball(
x,
y,
rackNumbers[index]
)

);


index++;

}

}

}


/* =========================================================
KOLLISIONEN
========================================================= */

function collideBalls(
a,
b
) {

if (
!a.active ||
!b.active
) {
return;
}


let dx =
b.x - a.x;

let dy =
b.y - a.y;


let distance =
Math.hypot(
dx,
dy
);


const minimum =
BALL_RADIUS * 2;


if (
distance === 0
) {

dx = 1;

dy = 0;

distance = 1;

}


if (
distance >= minimum
) {
return;
}


const nx =
dx / distance;

const ny =
dy / distance;


/* auseinanderdrücken */

const overlap =
minimum - distance;


a.x -=
nx *
overlap /
2;

a.y -=
ny *
overlap /
2;


b.x +=
nx *
overlap /
2;

b.y +=
ny *
overlap /
2;


/* relative Geschwindigkeit */

const relativeX =
b.vx - a.vx;

const relativeY =
b.vy - a.vy;


const relativeVelocity =
relativeX * nx +
relativeY * ny;


if (
relativeVelocity > 0
) {
return;
}


/* Impuls */

const impulse =
-(1 + BALL_BOUNCE) *
relativeVelocity /
2;


const ix =
impulse * nx;

const iy =
impulse * ny;


a.vx -= ix;
a.vy -= iy;

b.vx += ix;
b.vy += iy;

}


/* =========================================================
TISCH
========================================================= */

function drawTable() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* ================================================
Tuch
================================================ */

const cloth =
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);


cloth.addColorStop(
0,
"#087b4b"
);

cloth.addColorStop(
.5,
"#087247"
);

cloth.addColorStop(
1,
"#045b37"
);


ctx.fillStyle =
cloth;


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* ================================================
Bande
================================================ */

ctx.strokeStyle =
"rgba(0,0,0,.5)";

ctx.lineWidth = 8;


ctx.strokeRect(
TABLE.left,
TABLE.top,
TABLE.right -
TABLE.left,
TABLE.bottom -
TABLE.top
);


/* ================================================
Kopflinie
================================================ */

ctx.strokeStyle =
"rgba(255,255,255,.14)";

ctx.lineWidth = 1;


ctx.beginPath();

ctx.moveTo(
260,
TABLE.top
);

ctx.lineTo(
260,
TABLE.bottom
);

ctx.stroke();


/* ================================================
TASCHEN
================================================ */

for (
const pocket of pockets
) {

const pocketGradient =
ctx.createRadialGradient(
pocket.x - 4,
pocket.y - 4,
1,
pocket.x,
pocket.y,
POCKET_RADIUS
);


pocketGradient.addColorStop(
0,
"#000000"
);

pocketGradient.addColorStop(
.70,
"#020202"
);

pocketGradient.addColorStop(
1,
"#28332e"
);


ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
POCKET_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle =
pocketGradient;

ctx.fill();


ctx.strokeStyle =
"rgba(255,255,255,.08)";

ctx.lineWidth = 2;

ctx.stroke();

}

}


/* =========================================================
ZIELEN
========================================================= */

let aiming = false;

let pointerX = 0;

let pointerY = 0;

let power = 0;


/* =========================================================
POINTER POSITION
========================================================= */

function getPointerPosition(e) {

const rect =
canvas.getBoundingClientRect();


return {

x:
(
e.clientX -
rect.left
) *
canvas.width /
rect.width,

y:
(
e.clientY -
rect.top
) *
canvas.height /
rect.height

};

}


/* =========================================================
KÖ ZEICHNEN
========================================================= */

function drawCue() {

if (
!cueBall ||
!cueBall.active
) {
return;
}


let dx;
let dy;


/*
* Wenn wir zielen:
* Richtung von Pointer zur weißen Kugel
*/

if (aiming) {

dx =
cueBall.x -
pointerX;

dy =
cueBall.y -
pointerY;

} else {

/*
* Kö im Ruhezustand
* immer sichtbar.
*/

dx = 1;

dy = 0;

}


const length =
Math.hypot(
dx,
dy
);


if (length < .001)
return;


const nx =
dx / length;

const ny =
dy / length;


/*
* Wie weit der Kö zurückgezogen wird
*/

const pullBack =
aiming
? 20 + power * 1.3
: 20;


const cueLength = 170;


/*
* Spitze
*/

const tipX =
cueBall.x -
nx *
pullBack;


const tipY =
cueBall.y -
ny *
pullBack;


/*
* Hinteres Ende
*/

const buttX =
cueBall.x -
nx *
(
pullBack +
cueLength
);


const buttY =
cueBall.y -
ny *
(
pullBack +
cueLength
);


ctx.save();


/* Schatten */

ctx.beginPath();

ctx.moveTo(
buttX + 3,
buttY + 3
);

ctx.lineTo(
tipX + 3,
tipY + 3
);

ctx.strokeStyle =
"rgba(0,0,0,.5)";

ctx.lineWidth = 9;

ctx.lineCap =
"round";

ctx.stroke();


/* Kö */

const cueGradient =
ctx.createLinearGradient(
buttX,
buttY,
tipX,
tipY
);


cueGradient.addColorStop(
0,
"#3c190b"
);

cueGradient.addColorStop(
.35,
"#87501f"
);

cueGradient.addColorStop(
.72,
"#d19b52"
);

cueGradient.addColorStop(
.92,
"#ead8b2"
);

cueGradient.addColorStop(
1,
"#ffffff"
);


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
tipX,
tipY
);

ctx.strokeStyle =
cueGradient;

ctx.lineWidth = 6;

ctx.lineCap =
"round";

ctx.stroke();


/* Spitze */

ctx.beginPath();

ctx.arc(
tipX,
tipY,
3,
0,
Math.PI * 2
);

ctx.fillStyle =
"#dceeff";

ctx.fill();


/* ================================================
ZIELLINIE
================================================ */

if (aiming) {

ctx.save();

ctx.setLineDash([
7,
7
]);


ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);


ctx.lineTo(
cueBall.x +
nx * 260,

cueBall.y +
ny * 260
);


ctx.strokeStyle =
"rgba(255,255,255,.62)";

ctx.lineWidth = 1.5;

ctx.stroke();

ctx.restore();

}


ctx.restore();

}


/* =========================================================
START ZIELEN
========================================================= */

function startAiming(e) {

e.preventDefault();


/*
* Keine Bewegung = kein neuer Stoß
*/

if (
!cueBall.active ||
ballsMoving()
) {
return;
}


const p =
getPointerPosition(e);


/*
* WICHTIG:
*
* Wir verlangen NICHT mehr,
* dass man exakt die weiße Kugel
* anklickt.
*
* Jeder Klick/Touch auf dem
* Spielfeld startet das Zielen.
*/

aiming = true;


pointerX = p.x;

pointerY = p.y;

power = 0;


try {

canvas.setPointerCapture(
e.pointerId
);

} catch (_) {}


info.textContent =
"Ziehe zurück – loslassen zum Stoß.";
}


/* =========================================================
ZIELEN
========================================================= */

function moveAiming(e) {

if (!aiming)
return;


e.preventDefault();


const p =
getPointerPosition(e);


pointerX = p.x;

pointerY = p.y;


/*
* Abstand zwischen Pointer
* und weißer Kugel
*/

const distance =
Math.hypot(
cueBall.x -
pointerX,

cueBall.y -
pointerY
);


/*
* Stärke
*/

power =
Math.min(
100,
Math.max(
0,
distance * .70
)
);


powerFill.style.height =
power + "%";


info.textContent =
"Stärke: " +
Math.round(power) +
"%";

}


/* =========================================================
STOß
========================================================= */

function releaseAiming(e) {

if (!aiming)
return;


e.preventDefault();


aiming = false;


powerFill.style.height =
"0%";


/*
* Richtung:
*
* vom Pointer
* zur weißen Kugel
*/

const dx =
cueBall.x -
pointerX;

const dy =
cueBall.y -
pointerY;


const distance =
Math.hypot(
dx,
dy
);


/*
* Zu wenig gezogen
*/

if (
distance < 12
) {

info.textContent =
"Ziehe den Kö weiter zurück.";

return;
}


const nx =
dx / distance;

const ny =
dy / distance;


/*
* Geschwindigkeit
*
* Minimum 6
* Maximum 32
*/

const force =
Math.min(
MAX_SPEED,
6 + power * .30
);


cueBall.vx =
nx * force;

cueBall.vy =
ny * force;


info.textContent =
"Stoß läuft …";

}


/* =========================================================
POINTER EVENTS
========================================================= */

canvas.addEventListener(
"pointerdown",
startAiming
);


canvas.addEventListener(
"pointermove",
moveAiming
);


canvas.addEventListener(
"pointerup",
releaseAiming
);


canvas.addEventListener(
"pointercancel",
releaseAiming
);


/* =========================================================
PHYSIK
========================================================= */

function updatePhysics() {


/*
* Alle Kugeln bewegen
*/

for (
const ball of balls
) {

ball.update();

}


/*
* Kollisionen zweimal berechnen,
* damit Kugeln nicht ineinander stecken.
*/

for (
let pass = 0;
pass < 2;
pass++
) {

for (
let i = 0;
i < balls.length;
i++
) {

for (
let j = i + 1;
j < balls.length;
j++
) {

collideBalls(
balls[i],
balls[j]
);

}

}

}

}


/* =========================================================
ZEICHNEN
========================================================= */

function draw() {

drawTable();


/*
* Kö ZUERST,
* damit die Kugel ihn teilweise
* überdecken kann.
*/

if (
!ballsMoving()
) {

drawCue();

}


/*
* Kugeln danach
*/

for (
const ball of balls
) {

ball.draw();

}

}


/* =========================================================
SIND KUGELN IN BEWEGUNG?
========================================================= */

function ballsMoving() {

return balls.some(
ball =>
ball.active &&
ball.speed() > .10
);

}


/* =========================================================
GAME LOOP
========================================================= */

function gameLoop() {

updatePhysics();

draw();

requestAnimationFrame(
gameLoop
);

}


/* =========================================================
START
========================================================= */

createRack();

gameLoop();

</script>
