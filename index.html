<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OOZ BALL</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#07111c;
}

body{
display:flex;
align-items:center;
justify-content:center;
}

canvas{
display:block;
touch-action:none;
user-select:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
"use strict";

/* =========================================================
OOZ BALL
REALISTISCHES BILLARD - PHYSIK + ZIELEN + KÖ
========================================================= */

const {
Engine,
Bodies,
Body,
Composite,
Events
} = Matter;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* =========================================================
SPIELFELD 2:1
========================================================= */

const W = 1200;
const H = 600;

const TABLE = {
x:100,
y:50,
w:1000,
h:500
};

const PLAY = {
x:125,
y:75,
w:950,
h:450
};

const BALL_RADIUS = 15;
const POCKET_RADIUS = 29;


/* =========================================================
RESPONSIVE DARSTELLUNG
========================================================= */

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let dpr = 1;

function resize(){

dpr = Math.min(window.devicePixelRatio || 1,2);

scale = Math.min(
window.innerWidth / W,
window.innerHeight / H
);

offsetX =
(window.innerWidth - W * scale) / 2;

offsetY =
(window.innerHeight - H * scale) / 2;

canvas.width =
Math.round(window.innerWidth * dpr);

canvas.height =
Math.round(window.innerHeight * dpr);

canvas.style.width =
window.innerWidth + "px";

canvas.style.height =
window.innerHeight + "px";
}

window.addEventListener("resize",resize);

resize();


function worldPosition(event){

return {
x:(event.clientX-offsetX)/scale,
y:(event.clientY-offsetY)/scale
};

}


/* =========================================================
PHYSIK
========================================================= */

const engine = Engine.create({

enableSleeping:true,

positionIterations:14,
velocityIterations:12,
constraintIterations:4

});

engine.gravity.x = 0;
engine.gravity.y = 0;

const world = engine.world;


/* =========================================================
TASCHEN
========================================================= */

const pockets = [

{
x:PLAY.x,
y:PLAY.y
},

{
x:PLAY.x + PLAY.w/2,
y:PLAY.y
},

{
x:PLAY.x + PLAY.w,
y:PLAY.y
},

{
x:PLAY.x,
y:PLAY.y + PLAY.h
},

{
x:PLAY.x + PLAY.w/2,
y:PLAY.y + PLAY.h
},

{
x:PLAY.x + PLAY.w,
y:PLAY.y + PLAY.h
}

];


/* =========================================================
BANDEN
========================================================= */

function addRail(x,y,w,h){

Composite.add(
world,

Bodies.rectangle(
x,
y,
w,
h,
{
isStatic:true,
restitution:0.90,
friction:0.01
}
)
);

}

const pocketGap = POCKET_RADIUS + 7;

const centerX =
PLAY.x + PLAY.w/2;


/* obere Bande */

addRail(
(PLAY.x+pocketGap + centerX-pocketGap)/2,
PLAY.y-4,
centerX-PLAY.x-pocketGap*2,
12
);

addRail(
(centerX+pocketGap +
PLAY.x+PLAY.w-pocketGap)/2,

PLAY.y-4,

PLAY.x+PLAY.w-centerX-pocketGap*2,

12
);


/* untere Bande */

addRail(
(PLAY.x+pocketGap + centerX-pocketGap)/2,

PLAY.y+PLAY.h+4,

centerX-PLAY.x-pocketGap*2,

12
);

addRail(
(centerX+pocketGap +
PLAY.x+PLAY.w-pocketGap)/2,

PLAY.y+PLAY.h+4,

PLAY.x+PLAY.w-centerX-pocketGap*2,

12
);


/* linke Bande */

addRail(
PLAY.x-4,

(PLAY.y+pocketGap +
PLAY.y+PLAY.h-pocketGap)/2,

12,

PLAY.h-pocketGap*2
);


/* rechte Bande */

addRail(
PLAY.x+PLAY.w+4,

(PLAY.y+pocketGap +
PLAY.y+PLAY.h-pocketGap)/2,

12,

PLAY.h-pocketGap*2
);


/* =========================================================
KUGELN
========================================================= */

let balls = [];
let cueBall = null;


function createBall(
x,
y,
type,
color,
number
){

const body =
Bodies.circle(
x,
y,
BALL_RADIUS,
{

restitution:0.94,

friction:0.002,

frictionAir:0.004,

density:0.001,

slop:0.001,

label:
type === "cue"
? "cueBall"
: "objectBall"

}
);


body.plugin = {

type:type,

color:color,

number:number,

pocketed:false

};


Composite.add(world,body);

balls.push(body);

return body;

}


/* =========================================================
WEISSE KUGEL
========================================================= */

cueBall =
createBall(
330,
300,
"cue",
"#ffffff",
0
);


/* =========================================================
FARBEN
========================================================= */

const solids = {

1:"#f4c51c",
2:"#2458c7",
3:"#c92d31",
4:"#7040a8",
5:"#e98d21",
6:"#209348",
7:"#7d3b25"

};


const stripes = {

9:"#f4c51c",
10:"#2458c7",
11:"#c92d31",
12:"#7040a8",
13:"#e98d21",
14:"#209348",
15:"#7d3b25"

};


/* =========================================================
RACK
15 KUGELN
8-BALL GENAU IM ZENTRUM
========================================================= */

const rackX = 850;
const rackY = 300;

const rowDistance =
Math.sqrt(3) * BALL_RADIUS;

const rack = [

[0,0,1,"solid"],

[1,-0.5,2,"solid"],
[1,0.5,9,"stripe"],

[2,-1,3,"solid"],
[2,0,8,"eight"],
[2,1,10,"stripe"],

[3,-1.5,4,"solid"],
[3,-0.5,11,"stripe"],
[3,0.5,12,"stripe"],
[3,1.5,5,"solid"],

[4,-2,6,"solid"],
[4,-1,13,"stripe"],
[4,0,7,"solid"],
[4,1,14,"stripe"],
[4,2,15,"stripe"]

];


rack.forEach(
([row,col,number,type]) => {

let color;

if(type === "eight"){

color = "#050506";

}
else if(type === "solid"){

color = solids[number];

}
else{

color = stripes[number];

}


createBall(

rackX + row * rowDistance,

rackY + col * BALL_RADIUS * 2,

type,

color,

number

);

}
);


/* =========================================================
ZIELEN
========================================================= */

let aimAngle = 0;

let aiming = false;

let pulling = false;

let pullDistance = 0;

let dragStart = {
x:0,
y:0
};

let shotInProgress = false;


const MAX_PULL = 250;

const MAX_SPEED = 34;

const MIN_PULL = 5;


/* =========================================================
POINTER DOWN
========================================================= */

canvas.addEventListener(
"pointerdown",

function(event){

event.preventDefault();

if(shotInProgress)
return;


const p =
worldPosition(event);


const dx =
p.x - cueBall.position.x;

const dy =
p.y - cueBall.position.y;


const distance =
Math.hypot(dx,dy);


/*
Man muss die Maus auf der weißen Kugel
bzw. sehr nahe daran starten.
*/

if(distance < 100){

aiming = true;

pulling = true;

aimAngle =
Math.atan2(dy,dx);

dragStart = p;

pullDistance = 0;

if(canvas.setPointerCapture){

canvas.setPointerCapture(
event.pointerId
);

}

}

}

);


/* =========================================================
POINTER MOVE
========================================================= */

canvas.addEventListener(
"pointermove",

function(event){

event.preventDefault();

if(!aiming)
return;


const p =
worldPosition(event);


/*
Der Winkel wird NUR beim Start
des Zielvorgangs bestimmt.

Dadurch entsteht kein Maus-Jitter.
*/


const ux =
Math.cos(aimAngle);

const uy =
Math.sin(aimAngle);


const mx =
p.x - dragStart.x;

const my =
p.y - dragStart.y;


/*
Nur nach hinten ziehen.
*/

const projection =
mx * ux +
my * uy;


pullDistance =
Math.max(
0,
Math.min(
MAX_PULL,
-projection
)
);

}

);


/* =========================================================
POINTER UP
========================================================= */

canvas.addEventListener(
"pointerup",

function(event){

event.preventDefault();

if(!aiming)
return;


aiming = false;

pulling = false;


if(canvas.releasePointerCapture){

canvas.releasePointerCapture(
event.pointerId
);

}


if(pullDistance < MIN_PULL){

pullDistance = 0;

return;

}


/*
KRAFT MATHEMATISCH
IN DIE ZIELRICHTUNG
*/

const speed =
MAX_SPEED *
(pullDistance/MAX_PULL);


Body.setSleeping(
cueBall,
false
);


Body.setVelocity(
cueBall,
{

x:
Math.cos(aimAngle) *
speed,

y:
Math.sin(aimAngle) *
speed

}
);


Body.setAngularVelocity(
cueBall,
0
);


shotInProgress = true;

pullDistance = 0;

}

);


/* =========================================================
POINTER CANCEL
========================================================= */

canvas.addEventListener(
"pointercancel",

function(){

aiming = false;

pulling = false;

pullDistance = 0;

}

);


/* =========================================================
KUGELN SAUBER AUSROLLEN
========================================================= */

Events.on(
engine,
"beforeUpdate",

function(){

for(const ball of balls){

if(ball.plugin.pocketed)
continue;


const vx =
ball.velocity.x;

const vy =
ball.velocity.y;


const speed =
Math.hypot(vx,vy);


if(speed < 0.025){

Body.setVelocity(
ball,
{
x:0,
y:0
}
);

Body.setAngularVelocity(
ball,
0
);

}

}

}

);


/* =========================================================
TASCHEN
========================================================= */

Events.on(
engine,
"afterUpdate",

function(){

for(const ball of balls){

if(ball.plugin.pocketed)
continue;


for(const pocket of pockets){

const distance =
Math.hypot(
ball.position.x-pocket.x,
ball.position.y-pocket.y
);


if(
distance <
POCKET_RADIUS - 3
){

ball.plugin.pocketed =
true;


Body.setVelocity(
ball,
{
x:0,
y:0
}
);


/*
Weiße Kugel fällt nicht endgültig raus.
*/

if(ball === cueBall){

setTimeout(

function(){

ball.plugin.pocketed =
false;

Body.setPosition(
ball,
{
x:330,
y:300
}
);

Body.setVelocity(
ball,
{
x:0,
y:0
}
);

Body.setAngularVelocity(
ball,
0
);

shotInProgress =
false;

},

500

);

}

else{

setTimeout(

function(){

Composite.remove(
world,
ball
);

},

150

);

}


break;

}

}

}


/*
Schuss beendet
*/

if(shotInProgress){

let moving = false;


for(const ball of balls){

if(
!ball.plugin.pocketed &&
Math.hypot(
ball.velocity.x,
ball.velocity.y
) > 0.06
){

moving = true;

break;

}

}


if(!moving){

shotInProgress =
false;

}

}

}

);


/* =========================================================
ROUNDED RECT
========================================================= */

function roundedRect(
x,
y,
width,
height,
radius
){

ctx.beginPath();

ctx.moveTo(
x + radius,
y
);

ctx.arcTo(
x+width,
y,
x+width,
y+height,
radius
);

ctx.arcTo(
x+width,
y+height,
x,
y+height,
radius
);

ctx.arcTo(
x,
y+height,
x,
y,
radius
);

ctx.arcTo(
x,
y,
x+width,
y,
radius
);

ctx.closePath();

}


/* =========================================================
TASCHEN ZEICHNEN
========================================================= */

function drawPocket(pocket){

const r =
POCKET_RADIUS;


ctx.save();

ctx.translate(
pocket.x,
pocket.y
);


ctx.fillStyle =
"#030405";


ctx.beginPath();

/*
Keine perfekten Kreise.
Echte Pooltaschen sind
in die Bande eingelassen.
*/

ctx.moveTo(
-r,
-r*0.20
);

ctx.quadraticCurveTo(
-r*0.75,
-r,
0,
-r
);

ctx.quadraticCurveTo(
r*0.75,
-r,
r,
-r*0.20
);

ctx.lineTo(
r*0.72,
r*0.62
);

ctx.quadraticCurveTo(
0,
r*1.02,
-r*0.72,
r*0.62
);

ctx.closePath();

ctx.fill();


ctx.strokeStyle =
"rgba(70,210,225,.45)";

ctx.lineWidth = 3;

ctx.stroke();


ctx.restore();

}


/* =========================================================
TISCH
========================================================= */

function drawTable(){

ctx.fillStyle =
"#07111c";

ctx.fillRect(
0,
0,
W,
H
);


/*
Außenrahmen
*/

ctx.fillStyle =
"#15171b";

roundedRect(
TABLE.x-27,
TABLE.y-27,
TABLE.w+54,
TABLE.h+54,
30
);

ctx.fill();


ctx.strokeStyle =
"#d8b477";

ctx.lineWidth = 3;

ctx.stroke();


/*
Holz / Bande
*/

ctx.fillStyle =
"#681e19";

roundedRect(
TABLE.x,
TABLE.y,
TABLE.w,
TABLE.h,
23
);

ctx.fill();


ctx.strokeStyle =
"#b87943";

ctx.lineWidth = 5;

ctx.stroke();


/*
Spielfläche
*/

const cloth =
ctx.createLinearGradient(
PLAY.x,
PLAY.y,
PLAY.x+PLAY.w,
PLAY.y+PLAY.h
);


cloth.addColorStop(
0,
"#1594a6"
);

cloth.addColorStop(
0.5,
"#16869a"
);

cloth.addColorStop(
1,
"#0b6374"
);


ctx.fillStyle = cloth;


roundedRect(
PLAY.x,
PLAY.y,
PLAY.w,
PLAY.h,
8
);

ctx.fill();


/*
feine Lichtkante
*/

ctx.strokeStyle =
"rgba(255,255,255,.16)";

ctx.lineWidth = 2;

ctx.stroke();


/*
Kopflinie
*/

ctx.strokeStyle =
"rgba(255,255,255,.15)";

ctx.lineWidth = 2;

ctx.beginPath();

ctx.moveTo(
PLAY.x+PLAY.w*0.25,
PLAY.y
);

ctx.lineTo(
PLAY.x+PLAY.w*0.25,
PLAY.y+PLAY.h
);

ctx.stroke();


/*
OOZ BALL Wasserzeichen
*/

ctx.fillStyle =
"rgba(255,255,255,.12)";

ctx.font =
"bold 52px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillText(
"OOZ BALL",
W/2,
H/2
);


ctx.textAlign =
"left";

ctx.textBaseline =
"alphabetic";


/*
Taschen
*/

pockets.forEach(
drawPocket
);

}


/* =========================================================
KUGEL ZEICHNEN
========================================================= */

function drawBall(ball){

if(ball.plugin.pocketed)
return;


const x =
ball.position.x;

const y =
ball.position.y;


ctx.save();


/*
Schatten
*/

ctx.fillStyle =
"rgba(0,0,0,.28)";


ctx.beginPath();

ctx.ellipse(
x+2,
y+3,
BALL_RADIUS*1.05,
BALL_RADIUS*.75,
0,
0,
Math.PI*2
);

ctx.fill();


/*
Kugelmaterial
*/

const gradient =
ctx.createRadialGradient(
x-5,
y-6,
1,
x,
y,
BALL_RADIUS
);


if(ball === cueBall){

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.65,
"#f2f2f2"
);

gradient.addColorStop(
1,
"#bdbdbd"
);

}

else if(ball.plugin.number === 8){

gradient.addColorStop(
0,
"#555555"
);

gradient.addColorStop(
0.35,
"#191a1c"
);

gradient.addColorStop(
1,
"#020203"
);

}

else{

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.16,
ball.plugin.color
);

gradient.addColorStop(
0.75,
ball.plugin.color
);

gradient.addColorStop(
1,
"#111111"
);

}


ctx.fillStyle =
gradient;


ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI*2
);

ctx.fill();


/*
Streifen
*/

if(
ball.plugin.type ===
"stripe"
){

ctx.save();

ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS-1,
0,
Math.PI*2
);

ctx.clip();


ctx.fillStyle =
"rgba(255,255,255,.96)";


ctx.fillRect(
x-BALL_RADIUS,
y-5,
BALL_RADIUS*2,
10
);


ctx.restore();

}


/*
Nummernfeld
*/

if(ball !== cueBall){

ctx.fillStyle =
"#ffffff";


ctx.beginPath();

ctx.arc(
x,
y,
6.2,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle =
"#111111";

ctx.font =
"bold 6px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";


ctx.fillText(
String(ball.plugin.number),
x,
y
);

}


/*
Rand
*/

ctx.strokeStyle =
"rgba(0,0,0,.40)";

ctx.lineWidth = 1;

ctx.stroke();


/*
Glanzpunkt
*/

ctx.fillStyle =
"rgba(255,255,255,.78)";


ctx.beginPath();

ctx.arc(
x-5,
y-6,
2.2,
0,
Math.PI*2
);

ctx.fill();


ctx.restore();

}


/* =========================================================
ZIELLINIE + KÖ
========================================================= */

function drawCueAndAim(){

if(cueBall.plugin.pocketed)
return;


const ux =
Math.cos(aimAngle);

const uy =
Math.sin(aimAngle);


/*
ZIELLINIE
*/

if(!shotInProgress){

ctx.save();

ctx.strokeStyle =
"rgba(255,255,255,.72)";

ctx.lineWidth = 2;

ctx.setLineDash([
11,
8
]);


ctx.beginPath();

ctx.moveTo(
cueBall.position.x +
ux*(BALL_RADIUS+3),

cueBall.position.y +
uy*(BALL_RADIUS+3)
);


ctx.lineTo(
cueBall.position.x +
ux*430,

cueBall.position.y +
uy*430
);


ctx.stroke();

ctx.setLineDash([]);

ctx.restore();

}


/*
KÖ POSITION

Der KÖ bleibt immer HINTER
der weißen Kugel.

Je stärker man nach hinten zieht,
desto weiter entfernt er sich.
*/

const baseGap =
14;

const pullGap =
pullDistance * 0.95;

const tipDistance =
BALL_RADIUS +
baseGap +
pullGap;


const tipX =
cueBall.position.x -
ux*tipDistance;

const tipY =
cueBall.position.y -
uy*tipDistance;


/*
Sehr langer hochwertiger Kö
*/

const cueLength =
390;


const buttX =
tipX -
ux*cueLength;

const buttY =
tipY -
uy*cueLength;


ctx.save();

ctx.lineCap =
"round";


/*
Kö-Schatten
*/

ctx.strokeStyle =
"rgba(0,0,0,.38)";

ctx.lineWidth = 13;


ctx.beginPath();

ctx.moveTo(
buttX+3,
buttY+4
);

ctx.lineTo(
tipX+3,
tipY+4
);

ctx.stroke();


/*
Holzschaft
*/

const wood =
ctx.createLinearGradient(
buttX,
buttY,
tipX,
tipY
);


wood.addColorStop(
0,
"#160c08"
);

wood.addColorStop(
0.15,
"#704728"
);

wood.addColorStop(
0.70,
"#e6caa3"
);

wood.addColorStop(
1,
"#fff1d5"
);


ctx.strokeStyle =
wood;

ctx.lineWidth = 7;


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
tipX,
tipY
);

ctx.stroke();


/*
Griff
*/

ctx.strokeStyle =
"#131419";

ctx.lineWidth = 15;


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
buttX+ux*85,
buttY+uy*85
);

ctx.stroke();


/*
Goldringe
*/

ctx.strokeStyle =
"#c59a54";

ctx.lineWidth = 2;


for(
let i=0;
i<6;
i++
){

const d =
12+i*13;


ctx.beginPath();

ctx.moveTo(
buttX+ux*d-uy*7,
buttY+uy*d+ux*7
);

ctx.lineTo(
buttX+ux*d+uy*7,
buttY+uy*d-ux*7
);

ctx.stroke();

}


/*
Joint
*/

ctx.strokeStyle =
"#d6d6d6";

ctx.lineWidth = 8;


ctx.beginPath();

ctx.moveTo(
tipX-ux*24,
tipY-uy*24
);

ctx.lineTo(
tipX-ux*10,
tipY-uy*10
);

ctx.stroke();


/*
Leder-Tip
*/

ctx.strokeStyle =
"#292929";

ctx.lineWidth = 5;


ctx.beginPath();

ctx.moveTo(
tipX-ux*6,
tipY-uy*6
);

ctx.lineTo(
tipX,
tipY
);

ctx.stroke();


/*
Zielkreis
*/

ctx.strokeStyle =
"rgba(255,255,255,.75)";

ctx.lineWidth = 2;


ctx.beginPath();

ctx.arc(
cueBall.position.x,
cueBall.position.y,
23,
0,
Math.PI*2
);

ctx.stroke();


ctx.restore();

}


/* =========================================================
POWER BAR
========================================================= */

function drawPower(){

const x = 35;
const y = 160;

const width = 22;
const height = 280;


ctx.strokeStyle =
"#d8b477";

ctx.lineWidth = 3;


ctx.strokeRect(
x,
y,
width,
height
);


const amount =
pullDistance/MAX_PULL;


ctx.fillStyle =
amount > .75
? "#d94336"
: "#e6bc3d";


ctx.fillRect(

x+4,

y+height-4 -
amount*(height-8),

width-8,

amount*(height-8)

);


ctx.fillStyle =
"#eeeeee";

ctx.font =
"13px Arial";

ctx.fillText(
"POWER",
22,
148
);

}


/* =========================================================
HUD
========================================================= */

function drawHUD(){

ctx.fillStyle =
"#e7c99b";

ctx.font =
"bold 28px Arial";

ctx.fillText(
"OOZ BALL",
42,
38
);


ctx.font =
"bold 16px Arial";

ctx.fillText(
"8 BALL",
W-100,
38
);


drawPower();

}


/* =========================================================
RENDER
========================================================= */

function render(){

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.save();


ctx.translate(
offsetX,
offsetY
);


ctx.scale(
scale,
scale
);


drawTable();


for(
const ball of balls
){

drawBall(ball);

}


drawCueAndAim();


drawHUD();


ctx.restore();


requestAnimationFrame(
render
);

}


/* =========================================================
PHYSIK LOOP
========================================================= */

let lastTime =
performance.now();


function physicsLoop(time){

const delta =
Math.min(
20,
time-lastTime
);


lastTime = time;


Engine.update(
engine,
delta
);


requestAnimationFrame(
physicsLoop
);

}


requestAnimationFrame(
physicsLoop
);


requestAnimationFrame(
render
);

</script>

</body>
</html>
