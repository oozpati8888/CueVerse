<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
background: #111;
overflow: hidden;
touch-action: none;
user-select: none;
-webkit-user-select: none;
}

#table {
position: relative;
width: min(100vw, 1536px);
aspect-ratio: 2 / 1;

margin: auto;

background-image: url("12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png");
background-size: 100% 100%;
background-repeat: no-repeat;

overflow: hidden;
}

#gameCanvas {
position: absolute;
left: 0;
top: 0;

width: 100%;
height: 100%;

display: block;
}

#power {
position: absolute;
left: 50%;
bottom: 12px;
transform: translateX(-50%);

width: 180px;
height: 10px;

border: 1px solid rgba(255,255,255,.6);
border-radius: 20px;

background: rgba(0,0,0,.55);

overflow: hidden;

z-index: 10;
}

#powerFill {
width: 0%;
height: 100%;
background: linear-gradient(90deg, #777, #fff);
}
</style>
</head>

<body>

<div id="table">
<canvas id="gameCanvas" width="1536" height="768"></canvas>

<div id="power">
<div id="powerFill"></div>
</div>
</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const powerFill = document.getElementById("powerFill");

const W = 1536;
const H = 768;


/* =========================================================
BILLARD-TISCH
========================================================= */

const TABLE = {
left: 82,
right: 1454,
top: 78,
bottom: 690
};


/* =========================================================
KUGELN
========================================================= */

const BALL_RADIUS = 18;

let balls = [];

let cueBall = null;

let aiming = false;

let aimX = 0;
let aimY = 0;

let shotPower = 0;

let mouseX = 0;
let mouseY = 0;


/* =========================================================
FARBEN
========================================================= */

const ballColors = {
1: "#f5d21f",
2: "#1748d1",
3: "#d51e25",
4: "#7213a8",
5: "#ed6a16",
6: "#158b45",
7: "#7c211c",

9: "#f5d21f",
10: "#1748d1",
11: "#d51e25",
12: "#7213a8",
13: "#ed6a16",
14: "#158b45",
15: "#7c211c"
};


/* =========================================================
KUGEL ERSTELLEN
========================================================= */

function createBall(x, y, number, type) {

const ball = {
x: x,
y: y,

vx: 0,
vy: 0,

number: number,

type: type,

radius: BALL_RADIUS,

active: true
};

balls.push(ball);

return ball;
}


/* =========================================================
STANDARD 8-BALL RACK
========================================================= */

function setupBalls() {

balls = [];

/*
Das Dreieck steht rechts.

1
2 3
4 8 5
6 9 10 7
11 12 13 14 15

= 15 Objektkugeln
+ weiße Kugel
*/

const startX = 1130;
const startY = 384;

const spacingX = BALL_RADIUS * 1.72;
const spacingY = BALL_RADIUS * 1.98;

const rack = [
[1],

[2, 3],

[4, 8, 5],

[6, 9, 10, 7],

[11, 12, 13, 14, 15]
];

rack.forEach((row, rowIndex) => {

const x = startX + rowIndex * spacingX;

const total = row.length;

const firstY =
startY - ((total - 1) * spacingY / 2);

row.forEach((number, index) => {

const y = firstY + index * spacingY;

let type;

if (number === 8) {
type = "eight";
}
else if (number >= 1 && number <= 7) {
type = "solid";
}
else {
type = "stripe";
}

createBall(x, y, number, type);
});
});


/*
Weiße Kugel links
*/

cueBall = createBall(
430,
startY,
0,
"cue"
);
}


/* =========================================================
KUGEL-ZEICHNEN
========================================================= */

function drawBall(ball) {

if (!ball.active) return;

ctx.save();

/*
Schatten
*/

ctx.beginPath();

ctx.arc(
ball.x + 3,
ball.y + 4,
ball.radius + 1,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,.45)";
ctx.fill();


/*
Kugel
*/

const gradient = ctx.createRadialGradient(
ball.x - 6,
ball.y - 7,
2,
ball.x,
ball.y,
ball.radius
);


if (ball.type === "cue") {

gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(.55, "#eeeeee");
gradient.addColorStop(1, "#bdbdbd");

}

else if (ball.type === "eight") {

gradient.addColorStop(0, "#555");
gradient.addColorStop(.4, "#151515");
gradient.addColorStop(1, "#000");

}

else {

const color = ballColors[ball.number];

gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(.18, color);
gradient.addColorStop(.72, color);
gradient.addColorStop(1, "#111");
}


ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI * 2
);

ctx.fillStyle = gradient;
ctx.fill();


/*
Streifen
*/

if (ball.type === "stripe") {

ctx.save();

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI * 2
);

ctx.clip();

ctx.fillStyle = "#f4f4f4";

ctx.fillRect(
ball.x - ball.radius,
ball.y - 7,
ball.radius * 2,
14
);

ctx.restore();
}


/*
Nummernkreis
*/

if (ball.number !== 0) {

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
7,
0,
Math.PI * 2
);

ctx.fillStyle = "#ffffff";
ctx.fill();


ctx.fillStyle =
ball.type === "eight"
? "#000"
: "#111";

ctx.font = "bold 8px Arial";

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
ball.number,
ball.x,
ball.y + .5
);
}


/*
Glanzpunkt
*/

ctx.beginPath();

ctx.arc(
ball.x - 6,
ball.y - 7,
3,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(255,255,255,.75)";
ctx.fill();


ctx.restore();
}


/* =========================================================
AIM-LINIE
========================================================= */

function drawAim() {

if (!aiming || !cueBall || !cueBall.active) {
return;
}

const dx = aimX - cueBall.x;
const dy = aimY - cueBall.y;

const distance = Math.sqrt(dx * dx + dy * dy);

if (distance < 1) return;

const nx = dx / distance;
const ny = dy / distance;


/*
Richtung umkehren:
Wir ziehen zurück und schießen nach vorne.
*/

const shootX = -nx;
const shootY = -ny;


/*
Ziel-Linie
*/

ctx.save();

ctx.setLineDash([12, 10]);

ctx.lineWidth = 2;

ctx.strokeStyle = "rgba(255,255,255,.75)";

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x + shootX * 500,
cueBall.y + shootY * 500
);

ctx.stroke();

ctx.restore();


/*
Queue
*/

const cueLength = 230 + shotPower * 1.5;

const startX =
cueBall.x - shootX * cueLength;

const startY =
cueBall.y - shootY * cueLength;

ctx.save();

ctx.lineWidth = 9;

ctx.lineCap = "round";

ctx.strokeStyle = "#d2a34a";

ctx.beginPath();

ctx.moveTo(
startX,
startY
);

ctx.lineTo(
cueBall.x - shootX * 28,
cueBall.y - shootY * 28
);

ctx.stroke();


ctx.lineWidth = 4;

ctx.strokeStyle = "#f1d78b";

ctx.beginPath();

ctx.moveTo(
startX,
startY
);

ctx.lineTo(
cueBall.x - shootX * 28,
cueBall.y - shootY * 28
);

ctx.stroke();

ctx.restore();
}


/* =========================================================
KUGEL-KOLLISION
========================================================= */

function collideBalls(a, b) {

if (!a.active || !b.active) return;

const dx = b.x - a.x;
const dy = b.y - a.y;

const distance = Math.sqrt(dx * dx + dy * dy);

const minDistance =
a.radius + b.radius;

if (distance === 0) return;

if (distance >= minDistance) return;


/*
Normal
*/

const nx = dx / distance;
const ny = dy / distance;


/*
Überlappung korrigieren
*/

const overlap =
minDistance - distance;

a.x -= nx * overlap / 2;
a.y -= ny * overlap / 2;

b.x += nx * overlap / 2;
b.y += ny * overlap / 2;


/*
Relativgeschwindigkeit
*/

const rvx = b.vx - a.vx;
const rvy = b.vy - a.vy;

const relativeVelocity =
rvx * nx + rvy * ny;


/*
Wenn sie sich bereits voneinander entfernen
*/

if (relativeVelocity > 0) {
return;
}


/*
Elastischer Stoß
*/

const restitution = 0.98;

const impulse =
-(1 + restitution) *
relativeVelocity / 2;


const ix = impulse * nx;
const iy = impulse * ny;


a.vx -= ix;
a.vy -= iy;

b.vx += ix;
b.vy += iy;
}


/* =========================================================
BANDEN
========================================================= */

function updateWalls(ball) {

const r = ball.radius;

if (ball.x - r < TABLE.left) {

ball.x = TABLE.left + r;

ball.vx = Math.abs(ball.vx) * .92;
}


if (ball.x + r > TABLE.right) {

ball.x = TABLE.right - r;

ball.vx = -Math.abs(ball.vx) * .92;
}


if (ball.y - r < TABLE.top) {

ball.y = TABLE.top + r;

ball.vy = Math.abs(ball.vy) * .92;
}


if (ball.y + r > TABLE.bottom) {

ball.y = TABLE.bottom - r;

ball.vy = -Math.abs(ball.vy) * .92;
}
}


/* =========================================================
PHYSIK
========================================================= */

function updatePhysics() {

const friction = 0.992;

balls.forEach(ball => {

if (!ball.active) return;

ball.x += ball.vx;

ball.y += ball.vy;


/*
Reibung
*/

ball.vx *= friction;
ball.vy *= friction;


/*
sehr langsame Kugeln stoppen
*/

if (
Math.abs(ball.vx) < 0.015 &&
Math.abs(ball.vy) < 0.015
) {
ball.vx = 0;
ball.vy = 0;
}


updateWalls(ball);
});


/*
Alle Kugeln gegeneinander
*/

for (let i = 0; i < balls.length; i++) {

for (let j = i + 1; j < balls.length; j++) {

collideBalls(
balls[i],
balls[j]
);
}
}
}


/* =========================================================
ALLES ZEICHNEN
========================================================= */

function draw() {

ctx.clearRect(
0,
0,
W,
H
);


/*
Kugeln
*/

balls.forEach(drawBall);


/*
Aim / Queue
*/

drawAim();
}


/* =========================================================
SPIEL-LOOP
========================================================= */

function gameLoop() {

updatePhysics();

draw();

requestAnimationFrame(gameLoop);
}


/* =========================================================
POINTER POSITION
========================================================= */

function getPointerPosition(event) {

const rect =
canvas.getBoundingClientRect();

const source =
event.touches
? event.touches[0]
: event;

const x =
(source.clientX - rect.left)
* W / rect.width;

const y =
(source.clientY - rect.top)
* H / rect.height;

return {
x: x,
y: y
};
}


/* =========================================================
START SCHUSS
========================================================= */

function pointerDown(event) {

event.preventDefault();

const p =
getPointerPosition(event);

mouseX = p.x;
mouseY = p.y;


/*
Nur wenn die weiße Kugel stillsteht
*/

if (
Math.abs(cueBall.vx) > .1 ||
Math.abs(cueBall.vy) > .1
) {
return;
}


const dx =
p.x - cueBall.x;

const dy =
p.y - cueBall.y;

const distance =
Math.sqrt(dx * dx + dy * dy);


/*
Finger muss in der Nähe
der weißen Kugel starten
*/

if (distance < 70) {

aiming = true;

aimX = p.x;
aimY = p.y;

shotPower = 0;
}
}


/* =========================================================
ZIELEN
========================================================= */

function pointerMove(event) {

event.preventDefault();

if (!aiming) return;

const p =
getPointerPosition(event);

aimX = p.x;
aimY = p.y;


const dx =
aimX - cueBall.x;

const dy =
aimY - cueBall.y;

const distance =
Math.sqrt(dx * dx + dy * dy);


/*
Je weiter zurückgezogen,
desto stärker der Stoß.
*/

shotPower =
Math.min(
distance,
350
);

powerFill.style.width =
(shotPower / 350 * 100) + "%";
}


/* =========================================================
SCHUSS
========================================================= */

function pointerUp(event) {

event.preventDefault();

if (!aiming) return;

aiming = false;


const dx =
aimX - cueBall.x;

const dy =
aimY - cueBall.y;

const distance =
Math.sqrt(dx * dx + dy * dy);

if (distance < 8) {

shotPower = 0;

powerFill.style.width = "0%";

return;
}


/*
Ziehrichtung
*/

const nx =
dx / distance;

const ny =
dy / distance;


/*
Schussrichtung ist entgegengesetzt
*/

const shootX = -nx;
const shootY = -ny;


/*
MAXIMALE SCHUSSKRAFT
*/

const power =
Math.min(
shotPower,
350
);


/*
Geschwindigkeit

350 * .10 = 35 Pixel pro Frame
Das ist deutlich kräftiger.
*/

const velocity =
power * 0.85;


cueBall.vx =
shootX * velocity;

cueBall.vy =
shootY * velocity;


shotPower = 0;

powerFill.style.width = "0%";
}


/* =========================================================
TOUCH
========================================================= */

canvas.addEventListener(
"touchstart",
pointerDown,
{ passive: false }
);

canvas.addEventListener(
"touchmove",
pointerMove,
{ passive: false }
);

canvas.addEventListener(
"touchend",
pointerUp,
{ passive: false }
);


/* =========================================================
MOUSE
========================================================= */

canvas.addEventListener(
"mousedown",
pointerDown
);

canvas.addEventListener(
"mousemove",
pointerMove
);

canvas.addEventListener(
"mouseup",
pointerUp
);


/* =========================================================
START
========================================================= */

setupBalls();

draw();

gameLoop();

</script>

</body>
</html>
