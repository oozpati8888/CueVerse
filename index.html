<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse Royal Table</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: radial-gradient(circle at top, #292929 0%, #090909 55%, #000 100%);
color: white;
font-family: Arial, sans-serif;
text-align: center;
overflow-x: hidden;
}

.topbar {
width: 96%;
max-width: 1200px;
margin: auto;
padding: 14px 10px;
display: flex;
align-items: center;
justify-content: space-between;
}

.player {
min-width: 170px;
line-height: 1.45;
font-size: 15px;
}

.gold {
color: #e0b83f;
}

.logo {
color: #e0b83f;
font-size: 29px;
font-weight: bold;
letter-spacing: 4px;
text-shadow: 0 0 18px rgba(224,184,63,.5);
}

.stake {
color: #e0b83f;
font-weight: bold;
margin: 4px 0 14px;
}

.game {
width: 96%;
max-width: 1200px;
margin: auto;
}

.frame {
padding: 20px;
border-radius: 24px;
background: linear-gradient(135deg, #080808, #4b3110, #090909);
border: 3px solid #c99d35;
box-shadow:
0 0 35px rgba(212,175,55,.28),
inset 0 0 30px #000;
}

canvas {
width: 100%;
height: auto;
display: block;
border-radius: 12px;
cursor: crosshair;
box-shadow: 0 15px 45px #000;
}

.controls {
max-width: 850px;
margin: 18px auto;
}

.powerRow {
display: flex;
align-items: center;
gap: 12px;
}

.powerLabel {
color: #e0b83f;
font-weight: bold;
}

#power {
flex: 1;
accent-color: #e0b83f;
}

#powerValue {
width: 55px;
color: #e0b83f;
}

button {
padding: 14px 28px;
margin: 10px 6px;
border: 1px solid #d4af37;
border-radius: 10px;
background: linear-gradient(#f4d267, #b88618);
color: #080808;
font-weight: bold;
cursor: pointer;
}

button:disabled {
opacity: .4;
cursor: not-allowed;
}

.status {
min-height: 25px;
color: #bbb;
}

.help {
color: #777;
font-size: 12px;
}
</style>
</head>

<body>

<div class="topbar">

<div class="player">
👤 <strong class="gold">Orhan</strong><br>
Level 1<br>
🪙 10.000 Coins
</div>

<div class="logo">
CUEVERSE
</div>

<div class="player">
<strong class="gold">OOZ Player</strong><br>
Level 12<br>
🪙 10.000 Coins
</div>

</div>

<div class="stake">
ROYAL TABLE · Einsatz 100 Coins
</div>

<div class="game">

<div class="frame">
<canvas id="table" width="1200" height="600"></canvas>
</div>

<div class="controls">

<div class="powerRow">
<span class="powerLabel">POWER</span>

<input
id="power"
type="range"
min="1"
max="100"
value="55"
>

<span id="powerValue">55%</span>
</div>

<button id="shootButton">
STOSS AUSFÜHREN
</button>

<button id="resetButton">
NEUSTART
</button>

<div id="status" class="status">
Zielen und Stoßstärke einstellen.
</div>

<div class="help">
Maus bewegen = zielen · Power einstellen · Stoß ausführen
</div>

</div>

</div>

<script>

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const powerSlider = document.getElementById("power");
const powerValue = document.getElementById("powerValue");
const shootButton = document.getElementById("shootButton");
const resetButton = document.getElementById("resetButton");
const statusText = document.getElementById("status");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const RAIL = 58;

const FIELD_LEFT = RAIL + 15;
const FIELD_RIGHT = WIDTH - RAIL - 15;
const FIELD_TOP = RAIL + 15;
const FIELD_BOTTOM = HEIGHT - RAIL - 15;

const BALL_RADIUS = 15;

const FRICTION = 0.988;
const CUSHION_RESTITUTION = 0.88;
const BALL_RESTITUTION = 0.97;

let balls = [];

let mouseX = 780;
let mouseY = HEIGHT / 2;

let aiming = true;

const pockets = [
{ x: RAIL, y: RAIL },
{ x: WIDTH / 2, y: RAIL },
{ x: WIDTH - RAIL, y: RAIL },

{ x: RAIL, y: HEIGHT - RAIL },
{ x: WIDTH / 2, y: HEIGHT - RAIL },
{ x: WIDTH - RAIL, y: HEIGHT - RAIL }
];


/* =========================
KUGELN
========================= */

function createBall(x, y, color, number) {

balls.push({
x: x,
y: y,
vx: 0,
vy: 0,
color: color,
number: number,
active: true
});

}


function setupTable() {

balls = [];

/* Weiße Kugel */

createBall(
260,
HEIGHT / 2,
"#ffffff",
0
);


/* Kugelfarben */

const colors = [
"#f2c438",
"#2875d5",
"#d93645",
"#9146d1",
"#ee8b22",
"#21a56d",
"#b63b28",
"#050505",
"#f2c438",
"#2875d5",
"#d93645",
"#9146d1",
"#ee8b22",
"#21a56d",
"#d93645"
];


/*
Enges 15-Ball-Dreieck
*/

const startX = 850;
const startY = HEIGHT / 2;

const spacing = BALL_RADIUS * 2 + 0.5;

let number = 1;

for (let row = 0; row < 5; row++) {

for (let column = 0; column <= row; column++) {

const x =
startX + row * spacing;

const y =
startY +
(column - row / 2) * spacing;

createBall(
x,
y,
colors[number - 1],
number
);

number++;
}
}
}


/* =========================
TISCH
========================= */

function drawTable() {

ctx.clearRect(
0,
0,
WIDTH,
HEIGHT
);


/* Holz */

const wood = ctx.createLinearGradient(
0,
0,
WIDTH,
HEIGHT
);

wood.addColorStop(0, "#160b04");
wood.addColorStop(.5, "#6b4216");
wood.addColorStop(1, "#120802");

ctx.fillStyle = wood;

ctx.fillRect(
0,
0,
WIDTH,
HEIGHT
);


/* Tuch */

const cloth = ctx.createRadialGradient(
WIDTH / 2,
HEIGHT / 2,
30,
WIDTH / 2,
HEIGHT / 2,
700
);

cloth.addColorStop(
0,
"#0b8058"
);

cloth.addColorStop(
.55,
"#075c40"
);

cloth.addColorStop(
1,
"#023321"
);

ctx.fillStyle = cloth;

ctx.fillRect(
RAIL,
RAIL,
WIDTH - RAIL * 2,
HEIGHT - RAIL * 2
);


/* Bande */

ctx.strokeStyle = "#173f31";
ctx.lineWidth = 30;

ctx.strokeRect(
RAIL,
RAIL,
WIDTH - RAIL * 2,
HEIGHT - RAIL * 2
);


/* Gold-Linie */

ctx.strokeStyle = "#c59a32";
ctx.lineWidth = 2;

ctx.strokeRect(
RAIL + 15,
RAIL + 15,
WIDTH - (RAIL + 15) * 2,
HEIGHT - (RAIL + 15) * 2
);


/* Mittellinie */

ctx.strokeStyle =
"rgba(255,255,255,.10)";

ctx.lineWidth = 2;

ctx.beginPath();

ctx.moveTo(
WIDTH / 2,
FIELD_TOP
);

ctx.lineTo(
WIDTH / 2,
FIELD_BOTTOM
);

ctx.stroke();


/* Taschen */

pockets.forEach(drawPocket);


/* Diamanten */

ctx.fillStyle = "#d8bd77";

for (
let x = 150;
x < WIDTH - 150;
x += 150
) {

drawDiamond(
x,
RAIL / 2
);

drawDiamond(
x,
HEIGHT - RAIL / 2
);
}
}


function drawDiamond(x, y) {

ctx.beginPath();

ctx.moveTo(
x,
y - 5
);

ctx.lineTo(
x + 5,
y
);

ctx.lineTo(
x,
y + 5
);

ctx.lineTo(
x - 5,
y
);

ctx.closePath();

ctx.fill();
}


function drawPocket(pocket) {

const gradient =
ctx.createRadialGradient(
pocket.x - 5,
pocket.y - 5,
2,
pocket.x,
pocket.y,
34
);

gradient.addColorStop(
0,
"#222"
);

gradient.addColorStop(
.55,
"#000"
);

gradient.addColorStop(
1,
"#050505"
);

ctx.fillStyle = gradient;

ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
31,
0,
Math.PI * 2
);

ctx.fill();
}


/* =========================
KUGEL ZEICHNEN
========================= */

function drawBall(ball) {

if (!ball.active) {
return;
}


/* Schatten */

ctx.fillStyle =
"rgba(0,0,0,.35)";

ctx.beginPath();

ctx.ellipse(
ball.x + 5,
ball.y + 7,
BALL_RADIUS,
BALL_RADIUS * .55,
0,
0,
Math.PI * 2
);

ctx.fill();


/* Kugel */

const gradient =
ctx.createRadialGradient(
ball.x - 5,
ball.y - 6,
2,
ball.x,
ball.y,
BALL_RADIUS
);


if (ball.number === 0) {

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.55,
"#eeeeee"
);

gradient.addColorStop(
1,
"#999999"
);

} else {

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.12,
ball.color
);

gradient.addColorStop(
.72,
ball.color
);

gradient.addColorStop(
1,
"#111111"
);
}


ctx.fillStyle = gradient;

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fill();


/* Glanzpunkt */

ctx.fillStyle =
"rgba(255,255,255,.75)";

ctx.beginPath();

ctx.arc(
ball.x - 5,
ball.y - 6,
3,
0,
Math.PI * 2
);

ctx.fill();


/* Nummer */

if (ball.number > 0) {

ctx.fillStyle = "#ffffff";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
6,
0,
Math.PI * 2
);

ctx.fill();

ctx.fillStyle = "#111";

ctx.font =
"bold 8px Arial";

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
ball.number,
ball.x,
ball.y
);
}
}


/* =========================
AIM + QUEUE
========================= */

function drawAim() {

if (!aiming) {
return;
}

const cueBall = balls[0];

if (!cueBall || !cueBall.active) {
return;
}


const dx =
mouseX - cueBall.x;

const dy =
mouseY - cueBall.y;

const distance =
Math.hypot(dx, dy);

if (distance < 1) {
return;
}


const nx = dx / distance;
const ny = dy / distance;


/* Aim-Linie */

ctx.save();

ctx.setLineDash([
12,
8
]);

ctx.strokeStyle =
"rgba(255,255,255,.85)";

ctx.lineWidth = 2;

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x + nx * 550,
cueBall.y + ny * 550
);

ctx.stroke();

ctx.restore();


/* Queue */

const queueLength = 300;

ctx.save();

ctx.translate(
cueBall.x - nx * queueLength,
cueBall.y - ny * queueLength
);

ctx.rotate(
Math.atan2(
ny,
nx
)
);


const queueGradient =
ctx.createLinearGradient(
0,
-6,
0,
6
);

queueGradient.addColorStop(
0,
"#3c1909"
);

queueGradient.addColorStop(
.45,
"#d0a044"
);

queueGradient.addColorStop(
.65,
"#e6c06d"
);

queueGradient.addColorStop(
1,
"#321206"
);

ctx.fillStyle =
queueGradient;

ctx.fillRect(
0,
-5,
queueLength,
10
);


/* Queue-Spitze */

ctx.fillStyle = "#eeeeee";

ctx.fillRect(
queueLength - 14,
-4,
14,
8
);

ctx.restore();
}


/* =========================
STOß
========================= */

function shoot() {

if (!aiming) {
return;
}

const cueBall = balls[0];

if (!cueBall || !cueBall.active) {
return;
}


const dx =
mouseX - cueBall.x;

const dy =
mouseY - cueBall.y;

const distance =
Math.hypot(dx, dy);

if (distance < 10) {
return;
}


const nx = dx / distance;
const ny = dy / distance;


const power =
Number(powerSlider.value) / 100;


/*
Hohe Geschwindigkeit,
damit ein kräftiger Break möglich ist.
*/

const minimumSpeed = 4;
const maximumSpeed = 30;

const speed =
minimumSpeed +
power *
maximumSpeed;


cueBall.vx =
nx * speed;

cueBall.vy =
ny * speed;


aiming = false;

shootButton.disabled = true;

statusText.textContent =
"🎱 Stoß ausgeführt!";
}


/* =========================
KOLLISION
========================= */

function collideBalls(a, b) {

const dx =
b.x - a.x;

const dy =
b.y - a.y;

const distance =
Math.hypot(dx, dy);


if (
distance === 0 ||
distance > BALL_RADIUS * 2
) {
return;
}


const nx =
dx / distance;

const ny =
dy / distance;


/* Überlappung entfernen */

const overlap =
BALL_RADIUS * 2 -
distance;

a.x -=
nx *
overlap /
2;

a.y -=
ny *
overlap /
2;

b.x +=
nx *
overlap /
2;

b.y +=
ny *
overlap /
2;


/* Relativgeschwindigkeit */

const relativeX =
b.vx - a.vx;

const relativeY =
b.vy - a.vy;


const velocityAlongNormal =
relativeX * nx +
relativeY * ny;


if (
velocityAlongNormal > 0
) {
return;
}


const impulse =
-(1 + BALL_RESTITUTION) *
velocityAlongNormal /
2;


a.vx -=
impulse * nx;

a.vy -=
impulse * ny;

b.vx +=
impulse * nx;

b.vy +=
impulse * ny;
}


/* =========================
PHYSIK
========================= */

function updatePhysics() {

let anyMoving = false;


balls.forEach(ball => {

if (!ball.active) {
return;
}


ball.x += ball.vx;
ball.y += ball.vy;


/* Reibung */

ball.vx *= FRICTION;
ball.vy *= FRICTION;


if (
Math.abs(ball.vx) < .035
) {
ball.vx = 0;
}

if (
Math.abs(ball.vy) < .035
) {
ball.vy = 0;
}


if (
Math.abs(ball.vx) > .035 ||
Math.abs(ball.vy) > .035
) {
anyMoving = true;
}


/* Linke Bande */

if (
ball.x - BALL_RADIUS <
FIELD_LEFT
) {

ball.x =
FIELD_LEFT +
BALL_RADIUS;

ball.vx =
Math.abs(ball.vx) *
CUSHION_RESTITUTION;
}


/* Rechte Bande */

if (
ball.x + BALL_RADIUS >
FIELD_RIGHT
) {

ball.x =
FIELD_RIGHT -
BALL_RADIUS;

ball.vx =
-Math.abs(ball.vx) *
CUSHION_RESTITUTION;
}


/* Obere Bande */

if (
ball.y - BALL_RADIUS <
FIELD_TOP
) {

ball.y =
FIELD_TOP +
BALL_RADIUS;

ball.vy =
Math.abs(ball.vy) *
CUSHION_RESTITUTION;
}


/* Untere Bande */

if (
ball.y + BALL_RADIUS >
FIELD_BOTTOM
) {

ball.y =
FIELD_BOTTOM -
BALL_RADIUS;

ball.vy =
-Math.abs(ball.vy) *
CUSHION_RESTITUTION;
}


/* Taschen */

pockets.forEach(pocket => {

const distance =
Math.hypot(
ball.x - pocket.x,
ball.y - pocket.y
);


if (
distance <
28
) {

ball.active = false;

ball.vx = 0;
ball.vy = 0;
}

});

});


/* Kugel-Kollisionen */

for (
let i = 0;
i < balls.length;
i++
) {

for (
let j = i + 1;
j < balls.length;
j++
) {

if (
balls[i].active &&
balls[j].active
) {

collideBalls(
balls[i],
balls[j]
);
}
}
}


if (
!anyMoving &&
!aiming
) {

aiming = true;

shootButton.disabled =
false;

statusText.textContent =
"Deine Runde – ziele und stoße.";
}


requestAnimationFrame(
updatePhysics
);
}


/* =========================
RENDER
========================= */

function render() {

drawTable();

balls.forEach(
drawBall
);

drawAim();

requestAnimationFrame(
render
);
}


/* =========================
MAUS
========================= */

canvas.addEventListener(
"mousemove",
function(event) {

const rect =
canvas.getBoundingClientRect();


mouseX =
(event.clientX - rect.left) *
WIDTH /
rect.width;


mouseY =
(event.clientY - rect.top) *
HEIGHT /
rect.height;
}
);


/* =========================
TOUCH
========================= */

canvas.addEventListener(
"touchmove",
function(event) {

event.preventDefault();

const rect =
canvas.getBoundingClientRect();

const touch =
event.touches[0];


mouseX =
(touch.clientX - rect.left) *
WIDTH /
rect.width;


mouseY =
(touch.clientY - rect.top) *
HEIGHT /
rect.height;

},
{ passive: false }
);


/* =========================
BUTTONS
========================= */

powerSlider.addEventListener(
"input",
function() {

powerValue.textContent =
this.value + "%";
}
);


shootButton.addEventListener(
"click",
shoot
);


resetButton.addEventListener(
"click",
function() {

setupTable();

aiming = true;

shootButton.disabled =
false;

statusText.textContent =
"Break bereit – ziele und stoße.";
}
);


/* =========================
START
========================= */

setupTable();

updatePhysics();

render();

</script>

</body>
</html>
