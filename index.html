<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse – Royal Table</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:
radial-gradient(circle at top,#202020,#050505 65%);
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

header{
padding:12px 15px;
display:flex;
justify-content:space-between;
align-items:center;
max-width:1100px;
margin:auto;
}

.player{
font-size:14px;
}

.player strong{
color:#d4af37;
}

.logo{
color:#d4af37;
font-size:22px;
font-weight:bold;
letter-spacing:3px;
}

.stake{
color:#d4af37;
font-size:13px;
}

#gameArea{
width:96%;
max-width:1100px;
margin:auto;
}

#tableFrame{
padding:22px;
border-radius:22px;
background:
linear-gradient(145deg,#080808,#292929,#080808);
border:3px solid #8f7220;
box-shadow:
0 0 35px rgba(212,175,55,.22),
inset 0 0 25px #000;
}

canvas{
display:block;
width:100%;
height:auto;
background:#07583f;
border-radius:12px;
box-shadow:
inset 0 0 35px #00150e,
0 10px 30px #000;
cursor:crosshair;
}

.controls{
max-width:800px;
margin:16px auto;
}

.powerRow{
display:flex;
align-items:center;
gap:12px;
}

.powerRow span{
color:#d4af37;
min-width:55px;
}

input[type=range]{
flex:1;
accent-color:#d4af37;
}

button{
margin:8px;
padding:13px 24px;
border:1px solid #d4af37;
border-radius:10px;
background:#d4af37;
color:#050505;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.4;
}

.status{
min-height:24px;
color:#aaa;
margin-top:8px;
}

.help{
color:#777;
font-size:12px;
margin-top:8px;
}
</style>
</head>

<body>

<header>

<div class="player">
👤 <strong>Orhan</strong><br>
Level 1
</div>

<div class="logo">
CUEVERSE
</div>

<div class="player">
<strong>OOZ Player</strong><br>
Level 12
</div>

</header>

<div id="gameArea">

<div class="stake">
🪙 Einsatz: 100 Coins
</div>

<div id="tableFrame">
<canvas id="table" width="1000" height="500"></canvas>
</div>

<div class="controls">

<div class="powerRow">
<span>POWER</span>
<input
id="power"
type="range"
min="5"
max="100"
value="50"
>
<span id="powerValue">50%</span>
</div>

<button id="shoot">STOSS AUSFÜHREN</button>
<button id="reset">NEUSTART</button>

<div id="status" class="status">
Ziehe mit der Maus über den Tisch, um zu zielen.
</div>

<div class="help">
Maus bewegen = zielen · Stoßstärke einstellen · STOSS AUSFÜHREN
</div>

</div>

</div>

<script>

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const powerSlider = document.getElementById("power");
const powerValue = document.getElementById("powerValue");
const shootButton = document.getElementById("shoot");
const resetButton = document.getElementById("reset");
const statusText = document.getElementById("status");

const W = canvas.width;
const H = canvas.height;

const ballRadius = 14;

const pockets = [
{x:20,y:20},
{x:W/2,y:20},
{x:W-20,y:20},
{x:20,y:H-20},
{x:W/2,y:H-20},
{x:W-20,y:H-20}
];

let mouse = {
x:650,
y:250
};

let shooting = false;

let balls = [];

const colors = [
"#f4d03f",
"#2980b9",
"#c0392b",
"#8e44ad",
"#e67e22",
"#16a085",
"#d35400",
"#050505",
"#f1c40f",
"#3498db",
"#e74c3c",
"#9b59b6",
"#f39c12",
"#1abc9c",
"#c0392b"
];

function createBall(x,y,color,number){

balls.push({
x:x,
y:y,
vx:0,
vy:0,
color:color,
number:number,
active:true
});

}

function setup(){

balls=[];

// Weiße Kugel
createBall(230,250,"#ffffff",0);

// Dreieck
const startX=650;
const startY=250;
const gap=30;

let n=0;

for(let row=0;row<5;row++){

for(let col=0;col<=row;col++){

const x=startX + row*gap;
const y=startY + (col-row/2)*gap;

createBall(
x,
y,
colors[n % colors.length],
n+1
);

n++;

}

}

}

setup();

function drawTable(){

ctx.clearRect(0,0,W,H);

// Tuch
const cloth=ctx.createLinearGradient(0,0,0,H);
cloth.addColorStop(0,"#0b6b4c");
cloth.addColorStop(.5,"#07583f");
cloth.addColorStop(1,"#034531");

ctx.fillStyle=cloth;
ctx.fillRect(0,0,W,H);

// Bande
ctx.strokeStyle="#14382d";
ctx.lineWidth=28;
ctx.strokeRect(14,14,W-28,H-28);

// Gold inner line
ctx.strokeStyle="#8f7220";
ctx.lineWidth=2;
ctx.strokeRect(29,29,W-58,H-58);

// Taschen
pockets.forEach(p=>{

const g=ctx.createRadialGradient(
p.x-4,p.y-4,2,
p.x,p.y,27
);

g.addColorStop(0,"#000");
g.addColorStop(.7,"#020202");
g.addColorStop(1,"#171717");

ctx.fillStyle=g;

ctx.beginPath();
ctx.arc(p.x,p.y,25,0,Math.PI*2);
ctx.fill();

});

}

function drawBall(ball){

if(!ball.active) return;

const gradient=ctx.createRadialGradient(
ball.x-5,
ball.y-6,
2,
ball.x,
ball.y,
ballRadius
);

if(ball.number===0){

gradient.addColorStop(0,"#fff");
gradient.addColorStop(.55,"#eee");
gradient.addColorStop(1,"#aaa");

}else{

gradient.addColorStop(0,"#fff");
gradient.addColorStop(.15,ball.color);
gradient.addColorStop(.8,ball.color);
gradient.addColorStop(1,"#111");

}

ctx.fillStyle=gradient;

ctx.beginPath();
ctx.arc(
ball.x,
ball.y,
ballRadius,
0,
Math.PI*2
);
ctx.fill();

ctx.strokeStyle="rgba(0,0,0,.5)";
ctx.lineWidth=1;
ctx.stroke();

if(ball.number>0){

ctx.fillStyle="#fff";

ctx.beginPath();
ctx.arc(
ball.x,
ball.y,
5,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle="#111";
ctx.font="8px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
ball.number,
ball.x,
ball.y
);

}

}

function drawAim(){

const cueBall=balls[0];

if(!cueBall || shooting) return;

const dx=mouse.x-cueBall.x;
const dy=mouse.y-cueBall.y;

const length=Math.sqrt(dx*dx+dy*dy);

if(length<1) return;

const nx=dx/length;
const ny=dy/length;

// Ziel-Linie
ctx.save();

ctx.setLineDash([10,8]);
ctx.strokeStyle="rgba(255,255,255,.8)";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x+nx*300,
cueBall.y+ny*300
);

ctx.stroke();

ctx.restore();

// Queue
const queueLength=210;

ctx.save();

ctx.translate(
cueBall.x-nx*queueLength,
cueBall.y-ny*queueLength
);

ctx.rotate(Math.atan2(ny,nx));

const wood=ctx.createLinearGradient(
0,-4,
0,4
);

wood.addColorStop(0,"#eee");
wood.addColorStop(.45,"#d4af37");
wood.addColorStop(1,"#5a3015");

ctx.fillStyle=wood;

ctx.fillRect(
0,
-3,
queueLength,
6
);

ctx.fillStyle="#fff";

ctx.fillRect(
queueLength-10,
-4,
10,
8
);

ctx.restore();

}

function draw(){

drawTable();

balls.forEach(drawBall);

drawAim();

requestAnimationFrame(draw);

}

draw();

function updatePhysics(){

let moving=false;

balls.forEach(ball=>{

if(!ball.active) return;

ball.x += ball.vx;
ball.y += ball.vy;

ball.vx *= .985;
ball.vy *= .985;

if(
Math.abs(ball.vx)>.03 ||
Math.abs(ball.vy)>.03
){
moving=true;
}else{
ball.vx=0;
ball.vy=0;
}

// Bande
if(ball.x-ballRadius<30){

ball.x=30+ballRadius;
ball.vx=Math.abs(ball.vx)*.9;

}

if(ball.x+ballRadius>W-30){

ball.x=W-30-ballRadius;
ball.vx=-Math.abs(ball.vx)*.9;

}

if(ball.y-ballRadius<30){

ball.y=30+ballRadius;
ball.vy=Math.abs(ball.vy)*.9;

}

if(ball.y+ballRadius>H-30){

ball.y=H-30-ballRadius;
ball.vy=-Math.abs(ball.vy)*.9;

}

// Taschen
pockets.forEach(p=>{

const dx=ball.x-p.x;
const dy=ball.y-p.y;

const d=Math.sqrt(dx*dx+dy*dy);

if(d<24){

ball.active=false;
ball.vx=0;
ball.vy=0;

}

});

});

// Kugel-Kollisionen
for(let i=0;i<balls.length;i++){

for(let j=i+1;j<balls.length;j++){

const a=balls[i];
const b=balls[j];

if(!a.active || !b.active) continue;

const dx=b.x-a.x;
const dy=b.y-a.y;

const dist=Math.sqrt(dx*dx+dy*dy);

if(dist>0 && dist<ballRadius*2){

const nx=dx/dist;
const ny=dy/dist;

const relativeVelocity=
(a.vx-b.vx)*nx+
(a.vy-b.vy)*ny;

if(relativeVelocity>0){

a.vx-=relativeVelocity*nx;
a.vy-=relativeVelocity*ny;

b.vx+=relativeVelocity*nx;
b.vy+=relativeVelocity*ny;

}

const overlap=
ballRadius*2-dist;

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;

b.x+=nx*overlap/2;
b.y+=ny*overlap/2;

}

}

}

if(!moving){
shooting=false;
shootButton.disabled=false;
statusText.textContent=
"Deine Runde – ziele und stoße.";
}

requestAnimationFrame(updatePhysics);

}

updatePhysics();

canvas.addEventListener("mousemove",function(e){

const rect=canvas.getBoundingClientRect();

mouse.x=
(e.clientX-rect.left)*
(canvas.width/rect.width);

mouse.y=
(e.clientY-rect.top)*
(canvas.height/rect.height);

});

shootButton.addEventListener("click",function(){

if(shooting) return;

const cueBall=balls[0];

if(!cueBall.active){

statusText.textContent=
"Die weiße Kugel ist versenkt.";

return;

}

const dx=mouse.x-cueBall.x;
const dy=mouse.y-cueBall.y;

const length=Math.sqrt(dx*dx+dy*dy);

if(length<5) return;

const nx=dx/length;
const ny=dy/length;

const strength=
Number(powerSlider.value)/100;

cueBall.vx=
nx*strength*18;

cueBall.vy=
ny*strength*18;

shooting=true;
shootButton.disabled=true;

statusText.textContent=
"🎱 Stoß ausgeführt!";

});

powerSlider.addEventListener("input",function(){

powerValue.textContent=
this.value+"%";

});

resetButton.addEventListener("click",function(){

setup();

shooting=false;

shootButton.disabled=false;

statusText.textContent=
"Tisch neu aufgebaut.";

});

</script>

</body>
</html>
