<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#05070c;
}

body{
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

canvas{
display:block;
}
</style>
</head>

<body>

<script>

const W = 1536;
const H = 768;

/* -------------------------------------------------
TISCHBILD
Das ist genau unser Bild ohne Kugeln.
------------------------------------------------- */

const TABLE_IMAGE =
"12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png";

/* -------------------------------------------------
KUGELN
------------------------------------------------- */

const BALL_RADIUS = 14;

let cueBall;
let objectBalls = [];

let aiming = false;
let aimX = 0;
let aimY = 0;

const BALL_COLORS = [
0xffd52f, // 1
0x1747d1, // 2
0xd52d30, // 3
0x6426a8, // 4
0xf36b18, // 5
0x149447, // 6
0x8c171c, // 7
0x111111, // 8
0xffd52f, // 9
0x1747d1, // 10
0xd52d30, // 11
0x6426a8, // 12
0xf36b18 // 13
];


/* -------------------------------------------------
PHASER
------------------------------------------------- */

const config = {

type: Phaser.AUTO,

width: W,
height: H,

backgroundColor: "#05070c",

scale:{
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH,
width: W,
height: H
},

physics:{
default:"matter",

matter:{
gravity:{
x:0,
y:0
},

enableSleeping:true,

positionIterations:12,
velocityIterations:10,
constraintIterations:2
}
},

scene:{
preload:preload,
create:create,
update:update
}
};

new Phaser.Game(config);


/* -------------------------------------------------
PRELOAD
------------------------------------------------- */

function preload(){

this.load.image(
"table",
TABLE_IMAGE
);
}


/* -------------------------------------------------
CREATE
------------------------------------------------- */

function create(){

/*
Tischbild
*/

this.add.image(
W/2,
H/2,
"table"
)
.setDisplaySize(W,H);


/*
Spielfläche

Die Kugeln dürfen nur innerhalb
des Tisches spielen.
*/

createRails(this);


/*
13 Objektkugeln
*/

createRack(this);


/*
Weiße Kugel
*/

cueBall = createBall(
this,
350,
384,
0xffffff,
true
);


/*
Ziel-/Amlinie
*/

this.aimGraphics = this.add.graphics();


/*
Maus / Touch
*/

this.input.on(
"pointerdown",
pointerDown,
this
);

this.input.on(
"pointermove",
pointerMove,
this
);

this.input.on(
"pointerup",
pointerUp,
this
);


/*
Taschen
*/

createPockets(this);
}


/* -------------------------------------------------
RAILS
------------------------------------------------- */

function createRails(scene){

const options = {
isStatic:true,
restitution:0.95,
friction:0
};

/*
Obere Bande
*/

scene.matter.add.rectangle(
420,92,
620,18,
options
);

scene.matter.add.rectangle(
1115,92,
620,18,
options
);


/*
Untere Bande
*/

scene.matter.add.rectangle(
420,676,
620,18,
options
);

scene.matter.add.rectangle(
1115,676,
620,18,
options
);


/*
Linke Bande
*/

scene.matter.add.rectangle(
88,385,
18,520,
options
);


/*
Rechte Bande
*/

scene.matter.add.rectangle(
1448,385,
18,520,
options
);
}


/* -------------------------------------------------
TASCHEN
------------------------------------------------- */

function createPockets(scene){

const pockets = [

{x:72,y:50},
{x:768,y:45},
{x:1464,y:50},

{x:72,y:688},
{x:768,y:700},
{x:1464,y:688}

];

for(const p of pockets){

const pocket =
scene.matter.add.circle(
p.x,
p.y,
38,
{
isStatic:true,
isSensor:true,
label:"pocket"
}
);

pocket.plugin = {
isPocket:true
};
}
}


/* -------------------------------------------------
RACK
------------------------------------------------- */

function createRack(scene){

/*
13 Kugeln:
6 ganze
6 gestreifte
1 schwarze 8
*/

const startX = 1160;
const startY = 384;

const spacing = 29;

const positions = [

[0,0],

[-1,-0.5],
[-1,0.5],

[-2,-1],
[-2,0],
[-2,1],

[-3,-1.5],
[-3,-0.5],
[-3,0.5],
[-3,1.5],

[-4,-1],
[-4,0],
[-4,1]

];

for(let i=0;i<13;i++){

const x =
startX +
positions[i][0] * spacing;

const y =
startY +
positions[i][1] * spacing;

let color;

if(i === 7){

color = 0x111111;

}else{

color =
BALL_COLORS[i];
}

const ball =
createBall(
scene,
x,
y,
color,
false
);

ball.ballNumber = i + 1;

objectBalls.push(ball);
}
}


/* -------------------------------------------------
BALL
------------------------------------------------- */

function createBall(
scene,
x,
y,
color,
isCue
){

const body =
scene.matter.add.circle(
x,
y,
BALL_RADIUS,
{
restitution:0.93,

friction:0.004,

frictionAir:0.018,

density:0.004,

label:
isCue
? "cueBall"
: "objectBall"
}
);


/*
Kugelgrafik
*/

const graphics =
scene.add.graphics();


drawBall(
graphics,
color,
isCue
);


body.ballGraphics = graphics;

return body;
}


/* -------------------------------------------------
BALL GRAPHIC
------------------------------------------------- */

function drawBall(
graphics,
color,
isCue
){

graphics.clear();


/*
Schatten
*/

graphics.fillStyle(
0x000000,
0.35
);

graphics.fillCircle(
3,
4,
BALL_RADIUS
);


/*
Kugel
*/

graphics.fillStyle(
color,
1
);

graphics.fillCircle(
0,
0,
BALL_RADIUS
);


/*
Glanz
*/

graphics.fillStyle(
0xffffff,
0.75
);

graphics.fillCircle(
-5,
-5,
4
);


/*
Weiße Kugel
*/

if(isCue){

graphics.lineStyle(
1,
0xcccccc,
0.8
);

graphics.strokeCircle(
0,
0,
BALL_RADIUS
);
}
}


/* -------------------------------------------------
AIMING
------------------------------------------------- */

function pointerDown(pointer){

if(!cueBall) return;

const dx =
pointer.worldX -
cueBall.position.x;

const dy =
pointer.worldY -
cueBall.position.y;

const distance =
Math.sqrt(
dx*dx +
dy*dy
);

/*
Nur in der Nähe der weißen Kugel
starten.
*/

if(distance < 60){

aiming = true;

aimX =
pointer.worldX;

aimY =
pointer.worldY;
}
}


/* -------------------------------------------------
AIM LINE
------------------------------------------------- */

function pointerMove(pointer){

if(!aiming) return;

aimX =
pointer.worldX;

aimY =
pointer.worldY;

drawAimLine(
this
);
}


/* -------------------------------------------------
SHOOT
------------------------------------------------- */

function pointerUp(pointer){

if(!aiming) return;

aiming = false;

this.aimGraphics.clear();


/*
Zugrichtung
*/

const dx =
cueBall.position.x -
pointer.worldX;

const dy =
cueBall.position.y -
pointer.worldY;


const distance =
Math.sqrt(
dx*dx +
dy*dy
);


if(distance < 8)
return;


/*
Maximale Stärke
*/

const power =
Math.min(
distance,
350
);


const nx =
dx / distance;

const ny =
dy / distance;


/*
Kräftiger Stoß
*/

const FORCE =
power * 0.00042;


this.matter.body.applyForce(
cueBall,
cueBall.position,
{
x:nx * FORCE,
y:ny * FORCE
}
);
}


/* -------------------------------------------------
AIM LINE DRAW
------------------------------------------------- */

function drawAimLine(scene){

scene.aimGraphics.clear();

const dx =
cueBall.position.x -
aimX;

const dy =
cueBall.position.y -
aimY;

const distance =
Math.sqrt(
dx*dx +
dy*dy
);

if(distance < 1)
return;


const nx =
dx / distance;

const ny =
dy / distance;


const length =
Math.min(
distance * 1.5,
500
);


scene.aimGraphics.lineStyle(
3,
0xffffff,
0.75
);

scene.aimGraphics.beginPath();

scene.aimGraphics.moveTo(
cueBall.position.x,
cueBall.position.y
);

scene.aimGraphics.lineTo(
cueBall.position.x +
nx * length,

cueBall.position.y +
ny * length
);

scene.aimGraphics.strokePath();


/*
Kraftanzeige
*/

scene.aimGraphics.lineStyle(
6,
0xd4af37,
0.5
);

scene.aimGraphics.beginPath();

scene.aimGraphics.moveTo(
cueBall.position.x,
cueBall.position.y
);

scene.aimGraphics.lineTo(
cueBall.position.x -
nx * Math.min(distance,250),

cueBall.position.y -
ny * Math.min(distance,250)
);

scene.aimGraphics.strokePath();
}


/* -------------------------------------------------
UPDATE
------------------------------------------------- */

function update(){

/*
Kugelgrafiken an Matter-Körper koppeln
*/

if(cueBall){

cueBall.ballGraphics.x =
cueBall.position.x;

cueBall.ballGraphics.y =
cueBall.position.y;
}


for(
const ball
of objectBalls
){

ball.ballGraphics.x =
ball.position.x;

ball.ballGraphics.y =
ball.position.y;

/*
Rotation der Kugel leicht darstellen
*/

ball.ballGraphics.rotation =
ball.angle;
}
}

</script>

</body>
</html>
