<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #111;
}

body {
display: flex;
justify-content: center;
align-items: center;
touch-action: none;
}

canvas {
display: block;
}
</style>

<!-- Phaser 3 -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>

<body>

<script>

const TABLE_W = 800;
const TABLE_H = 400;

const MARGIN_X = 80;
const MARGIN_Y = 80;

const BALL_RADIUS = 10;

let game;
let scene;
let whiteBall;

let aimGraphics;
let ballGraphics;

let dragging = false;
let dragStartX = 0;
let dragStartY = 0;

const MAX_DRAG = 220;
const FORCE_SCALE = 0.000055;


/* =========================================================
GAME SCENE
========================================================= */

class PoolScene extends Phaser.Scene {

constructor() {
super("PoolScene");
}

create() {

scene = this;

/*
* PHYSIK
*/

this.matter.world.setGravity(0, 0);


/*
* HINTERGRUND
*/

this.add.rectangle(
TABLE_W / 2 + MARGIN_X,
TABLE_H / 2 + MARGIN_Y,
TABLE_W + 160,
TABLE_H + 160,
0x151515
);


/*
* SPIELFELD
* exakt 2:1
* 800 x 400
*/

this.add.rectangle(
TABLE_W / 2 + MARGIN_X,
TABLE_H / 2 + MARGIN_Y,
TABLE_W,
TABLE_H,
0x08745f
);


/*
* LEICHTE TISCHLINIEN
*/

const field = this.add.graphics();

field.lineStyle(3, 0x1db395, 1);

field.strokeRect(
MARGIN_X,
MARGIN_Y,
TABLE_W,
TABLE_H
);


/*
* MITTELLINIE
*/

field.lineStyle(1, 0x4fcab1, 0.35);

field.lineBetween(
MARGIN_X + TABLE_W / 2,
MARGIN_Y,
MARGIN_X + TABLE_W / 2,
MARGIN_Y + TABLE_H
);


/*
* MATTER-RAILS
*/

const railThickness = 18;

this.matter.add.rectangle(
MARGIN_X + TABLE_W / 2,
MARGIN_Y - railThickness / 2,
TABLE_W,
railThickness,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

this.matter.add.rectangle(
MARGIN_X + TABLE_W / 2,
MARGIN_Y + TABLE_H + railThickness / 2,
TABLE_W,
railThickness,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

this.matter.add.rectangle(
MARGIN_X - railThickness / 2,
MARGIN_Y + TABLE_H / 2,
railThickness,
TABLE_H,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

this.matter.add.rectangle(
MARGIN_X + TABLE_W + railThickness / 2,
MARGIN_Y + TABLE_H / 2,
railThickness,
TABLE_H,
{
isStatic: true,
restitution: 1,
friction: 0
}
);


/*
* WEISSE KUGEL
*/

whiteBall = this.matter.add.circle(
MARGIN_X + 190,
MARGIN_Y + TABLE_H / 2,
BALL_RADIUS,
{
restitution: 0.92,
friction: 0.02,
frictionAir: 0.025,
density: 0.004
}
);


/*
* KUGEL-GRAFIK
*/

ballGraphics = this.add.graphics();


/*
* ZIELLINIE
*/

aimGraphics = this.add.graphics();


/*
* TOUCH / MAUS
*/

this.input.on(
"pointerdown",
this.pointerDown,
this
);

this.input.on(
"pointermove",
this.pointerMove,
this
);

this.input.on(
"pointerup",
this.pointerUp,
this
);
}


pointerDown(pointer) {

if (!whiteBall) return;

const dx =
pointer.worldX -
whiteBall.position.x;

const dy =
pointer.worldY -
whiteBall.position.y;

const distance =
Math.sqrt(dx * dx + dy * dy);

/*
* Nur greifen,
* wenn Finger/Maus nahe an der Kugel ist.
*/

if (distance < 35) {

dragging = true;

dragStartX = pointer.worldX;
dragStartY = pointer.worldY;
}
}


pointerMove(pointer) {

if (!dragging || !whiteBall) return;

this.drawAim(
pointer.worldX,
pointer.worldY
);
}


pointerUp(pointer) {

if (!dragging || !whiteBall) return;

dragging = false;

this.shoot(
pointer.worldX,
pointer.worldY
);

aimGraphics.clear();
}


drawAim(pointerX, pointerY) {

aimGraphics.clear();

const ballX =
whiteBall.position.x;

const ballY =
whiteBall.position.y;

let dx =
pointerX - ballX;

let dy =
pointerY - ballY;

let distance =
Math.sqrt(dx * dx + dy * dy);

if (distance < 1) return;

/*
* maximale Zuglänge
*/

if (distance > MAX_DRAG) {

dx =
dx / distance * MAX_DRAG;

dy =
dy / distance * MAX_DRAG;
}

/*
* ZIELRICHTUNG:
* entgegengesetzt zum Ziehen
*/

const aimX =
ballX - dx;

const aimY =
ballY - dy;


/*
* Linie zeichnen
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.8
);

aimGraphics.beginPath();

aimGraphics.moveTo(
ballX,
ballY
);

aimGraphics.lineTo(
aimX,
aimY
);

aimGraphics.strokePath();


/*
* kleines Zielkreuz
*/

aimGraphics.lineStyle(
1,
0xffffff,
0.5
);

aimGraphics.strokeCircle(
aimX,
aimY,
7
);
}


shoot(pointerX, pointerY) {

/*
* Kugel darf nicht
* während der Bewegung erneut
* geschossen werden.
*/

const vx =
whiteBall.velocity.x;

const vy =
whiteBall.velocity.y;

const currentSpeed =
Math.sqrt(vx * vx + vy * vy);

if (currentSpeed > 0.15) {
return;
}


/*
* Zugvektor
*/

let dx =
pointerX -
whiteBall.position.x;

let dy =
pointerY -
whiteBall.position.y;

let distance =
Math.sqrt(dx * dx + dy * dy);


if (distance < 5) return;


if (distance > MAX_DRAG) {

dx =
dx / distance * MAX_DRAG;

dy =
dy / distance * MAX_DRAG;

distance = MAX_DRAG;
}


/*
* ENTGEGENGESETZTE RICHTUNG
*/

const forceX =
-dx * FORCE_SCALE;

const forceY =
-dy * FORCE_SCALE;


/*
* IMPULS / KRAFT
*/

this.matter.body.applyForce(
whiteBall,
whiteBall.position,
{
x: forceX,
y: forceY
}
);
}


update() {

if (!whiteBall) return;


/*
* Kugel zeichnen
*/

ballGraphics.clear();

ballGraphics.fillStyle(
0xffffff,
1
);

ballGraphics.fillCircle(
whiteBall.position.x,
whiteBall.position.y,
BALL_RADIUS
);


/*
* Kugel-Schatten
*/

ballGraphics.lineStyle(
1,
0xbbbbbb,
1
);

ballGraphics.strokeCircle(
whiteBall.position.x,
whiteBall.position.y,
BALL_RADIUS
);


/*
* kleiner Glanzpunkt
*/

ballGraphics.fillStyle(
0xffffff,
0.9
);

ballGraphics.fillCircle(
whiteBall.position.x - 3,
whiteBall.position.y - 3,
2
);
}
}


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

width: TABLE_W + MARGIN_X * 2,

height: TABLE_H + MARGIN_Y * 2,

backgroundColor: "#111111",

scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},

physics: {

default: "matter",

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

positionIterations: 12,

velocityIterations: 10,

constraintIterations: 4
}
},

scene: PoolScene
};


game = new Phaser.Game(config);

</script>

</body>
</html>
