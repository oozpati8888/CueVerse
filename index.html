<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101218;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

/* =========================================================
OOZ BALL
SAUBERE STOßMECHANIK
========================================================= */

const GAME_W = 1000;
const GAME_H = 600;

const TABLE_X = 100;
const TABLE_Y = 100;

const TABLE_W = 800;
const TABLE_H = 400;

const RAIL = 24;
const POCKET_R = 25;

const BALL_R = 11;


/* =========================================================
VARIABLEN
========================================================= */

let ball = null;

let ballGraphic = null;
let tableGraphic = null;

let aimGraphic = null;
let cueGraphic = null;
let powerGraphic = null;

let dragging = false;

let aimX = 1;
let aimY = 0;

let power = 0;

const MAX_POWER = 180;


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101218',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {

create: create,

update: update
}
};

new Phaser.Game(config);


/* =========================================================
CREATE
========================================================= */

function create() {

const scene = this;


/* TABLE */

tableGraphic =
scene.add.graphics();

drawTable(scene);


/* RAILS */

createRails(scene);


/* BALL */

ball =
scene.matter.add.circle(

TABLE_X + 250,

TABLE_Y + TABLE_H / 2,

BALL_R,

{

restitution: 0.94,

friction: 0.001,

frictionStatic: 0,

frictionAir: 0.002,

density: 0.004
}
);


/* BALL GRAPHIC */

ballGraphic =
scene.add.graphics();


/* AIM */

aimGraphic =
scene.add.graphics();


/* CUE */

cueGraphic =
scene.add.graphics();


/* POWER */

powerGraphic =
scene.add.graphics();


/* STARTING AIM */

aimX = 1;

aimY = 0;


/* INPUT */

scene.input.on(
'pointerdown',
function(pointer) {

if (!ball) {
return;
}

/* Während die Kugel läuft nicht schlagen */

if (isMoving()) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/* Nur nahe an der weißen Kugel starten */

if (distance <= 45) {

dragging = true;

power = 0;

updateAim(pointer);
}

}
);


scene.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

updateAim(pointer);

}
);


scene.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}

updateAim(pointer);

dragging = false;

shoot();

}
);


/* TOUCH */

scene.input.addPointer(2);


/* LOGO */

scene.add.text(

TABLE_X,

48,

'OOZ BALL',

{

fontFamily: 'Arial',

fontSize: '28px',

fontStyle: 'bold',

color: '#d8b56a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 65,

52,

'8 BALL',

{

fontFamily: 'Arial',

fontSize: '14px',

color: '#ffffff',

alpha: 0.65
}
);

}


/* =========================================================
TABLE
========================================================= */

function drawTable(scene) {

const g =
tableGraphic;


/* Schatten */

g.fillStyle(
0x000000,
0.45
);

g.fillRoundedRect(

TABLE_X - 38,

TABLE_Y - 38,

TABLE_W + 76,

TABLE_H + 76,

22
);


/* Außenrahmen */

g.fillStyle(
0x151515,
1
);

g.fillRoundedRect(

TABLE_X - 30,

TABLE_Y - 30,

TABLE_W + 60,

TABLE_H + 60,

18
);


/* Goldkante */

g.lineStyle(

4,

0xc9a34a,

1
);

g.strokeRoundedRect(

TABLE_X - 26,

TABLE_Y - 26,

TABLE_W + 52,

TABLE_H + 52,

15
);


/* Holz */

g.fillStyle(
0x3d2418,
1
);

g.fillRoundedRect(

TABLE_X - 19,

TABLE_Y - 19,

TABLE_W + 38,

TABLE_H + 38,

12
);


/* Tuch */

g.fillStyle(
0x08705d,
1
);

g.fillRect(

TABLE_X,

TABLE_Y,

TABLE_W,

TABLE_H
);


/* Tuchkante */

g.lineStyle(

3,

0x06483d,

1
);

g.strokeRect(

TABLE_X,

TABLE_Y,

TABLE_W,

TABLE_H
);


/* dezenter Mittelbereich */

g.lineStyle(

1,

0x59a99a,

0.18
);

g.lineBetween(

TABLE_X + TABLE_W / 2,

TABLE_Y,

TABLE_X + TABLE_W / 2,

TABLE_Y + TABLE_H
);


/* Taschen */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);

}


/* =========================================================
POCKET
========================================================= */

function drawPocket(scene, x, y) {

const g =
scene.add.graphics();


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R + 6
);


g.fillStyle(
0x050505,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x252525,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);

}


/* =========================================================
RAILS
========================================================= */

function createRails(scene) {

const gap =
POCKET_R * 2.1;


const half =
TABLE_W / 2;


/* OBEN LINKS */

addRail(

scene,

TABLE_X +
(half - gap) / 2,

TABLE_Y - RAIL / 2,

half - gap,

RAIL
);


/* OBEN RECHTS */

addRail(

scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y - RAIL / 2,

half - gap,

RAIL
);


/* UNTEN LINKS */

addRail(

scene,

TABLE_X +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


/* UNTEN RECHTS */

addRail(

scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


const sideHalf =
TABLE_H / 2;


/* LINKS OBEN */

addRail(

scene,

TABLE_X - RAIL / 2,

TABLE_Y +
(sideHalf - gap) / 2,

RAIL,

sideHalf - gap
);


/* LINKS UNTEN */

addRail(

scene,

TABLE_X - RAIL / 2,

TABLE_Y +
sideHalf +
(sideHalf - gap) / 2,

RAIL,

sideHalf - gap
);


/* RECHTS OBEN */

addRail(

scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
(sideHalf - gap) / 2,

RAIL,

sideHalf - gap
);


/* RECHTS UNTEN */

addRail(

scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
sideHalf +
(sideHalf - gap) / 2,

RAIL,

sideHalf - gap
);

}


/* =========================================================
MATTER RAIL
========================================================= */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,

y,

width,

height,

{

isStatic: true,

restitution: 0.96,

friction: 0,

frictionStatic: 0
}
);

}


/* =========================================================
AIM
========================================================= */

function updateAim(pointer) {

if (!ball) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance < 0.001) {
return;
}


/*
WICHTIG:

Der Finger/Mauszeiger befindet sich
HINTER der weißen Kugel.

Die Kugel läuft genau in die
entgegengesetzte Richtung.
*/

aimX =
-dx / distance;

aimY =
-dy / distance;


power =
Math.min(
distance,
MAX_POWER
);


drawAim();

}


/* =========================================================
AIM + CUE
========================================================= */

function drawAim() {

aimGraphic.clear();

cueGraphic.clear();

powerGraphic.clear();


if (!ball) {
return;
}


/* =====================================================
ZIELLINIE
===================================================== */

const aimLength = 360;


const targetX =
ball.position.x +
aimX * aimLength;

const targetY =
ball.position.y +
aimY * aimLength;


aimGraphic.lineStyle(

2,

0xffffff,

0.75
);


aimGraphic.beginPath();


aimGraphic.moveTo(

ball.position.x,

ball.position.y
);


aimGraphic.lineTo(

targetX,

targetY
);


aimGraphic.strokePath();


/* =====================================================
KÖ

Die Spitze sitzt knapp HINTER
der weißen Kugel.

Der Kö wird beim Zurückziehen
länger nach hinten bewegt.
===================================================== */


const tipDistance =
BALL_R + 3;


const cueLength =
150 +
power * 0.75;


const tipX =
ball.position.x -
aimX * tipDistance;

const tipY =
ball.position.y -
aimY * tipDistance;


const buttX =
ball.position.x -
aimX * (tipDistance + cueLength);

const buttY =
ball.position.y -
aimY * (tipDistance + cueLength);


/* Schatten */

cueGraphic.lineStyle(

10,

0x000000,

0.25
);


cueGraphic.lineBetween(

buttX + 3,

buttY + 3,

tipX + 3,

tipY + 3
);


/* dunkler Griff */

cueGraphic.lineStyle(

8,

0x24150d,

1
);


cueGraphic.lineBetween(

buttX,

buttY,

tipX,

tipY
);


/* Holz */

cueGraphic.lineStyle(

5,

0xd6a45b,

1
);


cueGraphic.lineBetween(

buttX,

buttY,

tipX,

tipY
);


/* helle Mittellinie */

cueGraphic.lineStyle(

2,

0xffe2a2,

0.9
);


cueGraphic.lineBetween(

buttX,

buttY,

tipX,

tipY
);


/* Spitze */

cueGraphic.lineStyle(

6,

0xf0e4d2,

1
);


cueGraphic.lineBetween(

tipX,

tipY,

tipX + aimX * 9,

tipY + aimY * 9
);


/* Griffende */

cueGraphic.fillStyle(

0x111111,

1
);


cueGraphic.fillCircle(

buttX,

buttY,

5
);


/* =====================================================
KRAFTANZEIGE
===================================================== */

if (dragging) {

const barX = 35;
const barY = 160;
const barH = 260;
const barW = 14;


powerGraphic.fillStyle(

0x111111,

0.85
);


powerGraphic.fillRoundedRect(

barX,
barY,
barW,
barH,
7
);


const amount =
power / MAX_POWER;


const fillH =
barH * amount;


powerGraphic.fillStyle(

0xd4a73c,

1
);


powerGraphic.fillRoundedRect(

barX + 2,

barY +
barH -
fillH +
2,

barW - 4,

fillH - 4,

5
);

}

}


/* =========================================================
SHOOT
========================================================= */

function shoot() {

if (!ball) {
return;
}


if (power < 4) {

power = 0;

drawAim();

return;
}


/*
Die Richtung ist bereits normalisiert.

Dadurch gibt es KEINE
ungewollte Seitwärtsbewegung.
*/


const speed =
power * 0.075;


thisMatterSetVelocity(

aimX * speed,

aimY * speed
);


power = 0;

drawAim();

}


/* =========================================================
VELOCITY
========================================================= */

function thisMatterSetVelocity(vx, vy) {

if (!ball) {
return;
}


Matter.Body.setVelocity(

ball,

{
x: vx,
y: vy
}
);

}


/* =========================================================
MOVING
========================================================= */

function isMoving() {

if (!ball) {
return false;
}


const vx =
ball.velocity.x;

const vy =
ball.velocity.y;


return Math.sqrt(
vx * vx +
vy * vy
) > 0.05;

}


/* =========================================================
BALL GRAPHIC
========================================================= */

function drawBall() {

if (!ball) {
return;
}


ballGraphic.clear();


/* Schatten */

ballGraphic.fillStyle(

0x000000,

0.28
);


ballGraphic.fillCircle(

ball.position.x + 2,

ball.position.y + 2,

BALL_R + 2
);


/* Kugel */

ballGraphic.fillStyle(

0xf8f8f8,

1
);


ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/* Glanz */

ballGraphic.fillStyle(

0xffffff,

0.95
);


ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

2.5
);


/* kleines Zentrum */

ballGraphic.lineStyle(

1,

0xd8d8d8,

0.8
);


ballGraphic.strokeCircle(

ball.position.x,

ball.position.y,

BALL_R
);

}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!ball) {
return;
}


/*
Sehr langsame Restbewegung
komplett entfernen.
*/

const vx =
ball.velocity.x;

const vy =
ball.velocity.y;


const speed =
Math.sqrt(
vx * vx +
vy * vy
);


if (
speed > 0 &&
speed < 0.06
) {

Matter.Body.setVelocity(

ball,

{
x: 0,
y: 0
}
);

}


drawBall();


/*
Kö und Zielhilfe nur während
des Zielens anzeigen.
*/

if (dragging) {

drawAim();

}

}

</script>

</body>
</html>
