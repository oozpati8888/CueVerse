<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CueVerse – OOZ BALL</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#05080d;
}

#game{
width:100vw;
height:100vh;
display:block;
touch-action:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = window.devicePixelRatio || 1;

function resize(){

W = window.innerWidth;
H = window.innerHeight;

canvas.width = W * dpr;
canvas.height = H * dpr;

canvas.style.width = W + "px";
canvas.style.height = H + "px";

ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
CUEVERSE
OOZ BALL
14 KUGELN
========================================================= */

const table = {

x: 55,
y: 120,

width: W - 110,
height: Math.min(H * 0.68,520),

rail: 30

};


/* =========================================================
KUGELN
========================================================= */

const BALL_RADIUS = 13;

const balls = [

// WEISSE
{
x: table.x + 170,
y: table.y + table.height/2,
vx:0,
vy:0,
type:"cue",
number:0
},

// 6 VOLLE
{x:0,y:0,vx:0,vy:0,type:"solid",number:1},
{x:0,y:0,vx:0,vy:0,type:"solid",number:2},
{x:0,y:0,vx:0,vy:0,type:"solid",number:3},
{x:0,y:0,vx:0,vy:0,type:"solid",number:4},
{x:0,y:0,vx:0,vy:0,type:"solid",number:5},
{x:0,y:0,vx:0,vy:0,type:"solid",number:6},

// 6 GESTREIFTE
{x:0,y:0,vx:0,vy:0,type:"stripe",number:9},
{x:0,y:0,vx:0,vy:0,type:"stripe",number:10},
{x:0,y:0,vx:0,vy:0,type:"stripe",number:11},
{x:0,y:0,vx:0,vy:0,type:"stripe",number:12},
{x:0,y:0,vx:0,vy:0,type:"stripe",number:13},
{x:0,y:0,vx:0,vy:0,type:"stripe",number:14},

// SCHWARZE 8
{x:0,y:0,vx:0,vy:0,type:"eight",number:8}

];


/* =========================================================
FARBEN
========================================================= */

const colors = {

1:"#e52323",
2:"#245cff",
3:"#f1b800",
4:"#8d35c7",
5:"#f47b16",
6:"#20a447",

9:"#e52323",
10:"#245cff",
11:"#f1b800",
12:"#8d35c7",
13:"#f47b16",
14:"#20a447"

};


/* =========================================================
DREIECK AUFSTELLEN
========================================================= */

function rackBalls(){

const startX =
table.x +
table.width -
210;

const centerY =
table.y +
table.height/2;

const spacing = BALL_RADIUS * 2 + 2;

const positions = [

[0,0],

[-1,-0.5],
[-1,0.5],

[-2,-1],
[-2,0],
[-2,1],

[-3,-1.5],
[-3,-0.5],
[-3,0.5],
[-3,1.5],

[-4,-2],
[-4,-1],
[-4,0],
[-4,1]

];

let rack = balls.slice(1);

for(let i=0;i<rack.length;i++){

rack[i].x =
startX +
Math.abs(positions[i][0]) * spacing;

rack[i].y =
centerY +
positions[i][1] * spacing;

rack[i].vx = 0;
rack[i].vy = 0;
}

}

rackBalls();


/* =========================================================
TASCHEN
========================================================= */

function getPockets(){

return [

{
x:table.x,
y:table.y
},

{
x:table.x + table.width/2,
y:table.y
},

{
x:table.x + table.width,
y:table.y
},

{
x:table.x,
y:table.y + table.height
},

{
x:table.x + table.width/2,
y:table.y + table.height
},

{
x:table.x + table.width,
y:table.y + table.height
}

];

}


/* =========================================================
SOUND
========================================================= */

let audioContext = null;

function startAudio(){

if(!audioContext){

audioContext =
new (window.AudioContext ||
window.webkitAudioContext)();

}

if(audioContext.state === "suspended"){

audioContext.resume();

}

}


function playSound(type){

if(!audioContext) return;

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.connect(gain);
gain.connect(audioContext.destination);


if(type === "cue"){

oscillator.frequency.value = 150;

gain.gain.setValueAtTime(
0.15,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + 0.12
);

}


if(type === "ball"){

oscillator.frequency.value = 300;

gain.gain.setValueAtTime(
0.08,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + 0.08
);

}


if(type === "rail"){

oscillator.frequency.value = 110;

gain.gain.setValueAtTime(
0.06,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + 0.1
);

}


if(type === "pocket"){

oscillator.frequency.value = 80;

gain.gain.setValueAtTime(
0.12,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime + 0.25
);

}


oscillator.start();

oscillator.stop(
audioContext.currentTime + 0.3
);

}


/* =========================================================
ZEICHNEN
========================================================= */

function drawTable(){

/* Hintergrund */

ctx.fillStyle = "#05080d";

ctx.fillRect(
0,
0,
W,
H
);


/* SILBERNER RAHMEN */

const gradient =
ctx.createLinearGradient(
0,
table.y,
0,
table.y + table.height
);

gradient.addColorStop(
0,
"#f1f1f1"
);

gradient.addColorStop(
0.45,
"#8c8c8c"
);

gradient.addColorStop(
1,
"#343434"
);


ctx.fillStyle = gradient;

ctx.fillRect(
table.x - 22,
table.y - 22,
table.width + 44,
table.height + 44
);


/* GOLDENE INNENKANTE */

ctx.strokeStyle = "#c9a64a";

ctx.lineWidth = 7;

ctx.strokeRect(
table.x - 5,
table.y - 5,
table.width + 10,
table.height + 10
);


/* SPIELFLÄCHE */

const cloth =
ctx.createLinearGradient(
0,
table.y,
0,
table.y + table.height
);

cloth.addColorStop(
0,
"#dce2e6"
);

cloth.addColorStop(
0.5,
"#aeb7bd"
);

cloth.addColorStop(
1,
"#8f999f"
);


ctx.fillStyle = cloth;

ctx.fillRect(
table.x,
table.y,
table.width,
table.height
);


/* OOZ BALL GRAVUR */

ctx.save();

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.font =
"bold " +
Math.min(42,W*0.035) +
"px Georgia";

ctx.fillStyle =
"rgba(212,170,55,0.72)";

ctx.shadowColor =
"rgba(255,220,100,0.4)";

ctx.shadowBlur = 5;

ctx.fillText(
"OOZ BALL",
table.x + table.width/2,
table.y + table.height/2
);

ctx.restore();


/* TASCHEN */

const pockets =
getPockets();

for(const p of pockets){

const r = 25;

const pg =
ctx.createRadialGradient(
p.x,
p.y,
3,
p.x,
p.y,
r
);

pg.addColorStop(
0,
"#000"
);

pg.addColorStop(
0.7,
"#080808"
);

pg.addColorStop(
1,
"#b78a2a"
);


ctx.beginPath();

ctx.arc(
p.x,
p.y,
r,
0,
Math.PI*2
);

ctx.fillStyle = pg;

ctx.fill();

}

}


/* =========================================================
KUGEL ZEICHNEN
========================================================= */

function drawBall(ball){

const r = BALL_RADIUS;

/* Schatten */

ctx.beginPath();

ctx.ellipse(
ball.x + 2,
ball.y + 3,
r,
r*0.55,
0,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(0,0,0,0.4)";

ctx.fill();


/* Kugel */

let gradient =
ctx.createRadialGradient(
ball.x-r*0.4,
ball.y-r*0.45,
2,
ball.x,
ball.y,
r
);


if(ball.type === "cue"){

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.8,
"#eeeeee"
);

gradient.addColorStop(
1,
"#999999"
);

}


else if(ball.type === "eight"){

gradient.addColorStop(
0,
"#666"
);

gradient.addColorStop(
0.35,
"#222"
);

gradient.addColorStop(
1,
"#000"
);

}


else if(ball.type === "solid"){

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.15,
colors[ball.number]
);

gradient.addColorStop(
1,
colors[ball.number]
);

}


else{

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
1,
"#d9d9d9"
);

}


ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
r,
0,
Math.PI*2
);

ctx.fillStyle =
gradient;

ctx.fill();


/* Streifen */

if(ball.type === "stripe"){

ctx.save();

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
r,
0,
Math.PI*2
);

ctx.clip();

ctx.fillStyle =
colors[ball.number];

ctx.fillRect(
ball.x-r,
ball.y-r*0.3,
r*2,
r*0.6
);

ctx.restore();

}


/* Nummer */

if(ball.type !== "cue"){

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
r*0.34,
0,
Math.PI*2
);

ctx.fillStyle =
"#fff";

ctx.fill();


ctx.fillStyle =
"#111";

ctx.font =
"bold 8px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillText(
ball.number,
ball.x,
ball.y
);

}

}


/* =========================================================
QUEUE
========================================================= */

let aimX = 900;
let aimY = table.y + table.height/2;

function drawCue(){

const white =
balls[0];

const angle =
Math.atan2(
white.y-aimY,
white.x-aimX
);


const cueLength = 350;


const startX =
white.x +
Math.cos(angle) *
cueLength;

const startY =
white.y +
Math.sin(angle) *
cueLength;


ctx.save();

ctx.lineCap =
"round";


ctx.strokeStyle =
"#111";

ctx.lineWidth =
9;


ctx.beginPath();

ctx.moveTo(
startX,
startY
);

ctx.lineTo(
white.x,
white.y
);

ctx.stroke();


ctx.strokeStyle =
"#d5d5d5";

ctx.lineWidth =
4;


ctx.beginPath();

ctx.moveTo(
startX,
startY
);

ctx.lineTo(
white.x,
white.y
);

ctx.stroke();


ctx.restore();


/* Ziel-Linie */

ctx.strokeStyle =
"rgba(255,255,255,0.85)";

ctx.lineWidth =
2;


ctx.setLineDash([
8,
8
]);


ctx.beginPath();

ctx.moveTo(
white.x,
white.y
);

ctx.lineTo(
aimX,
aimY
);

ctx.stroke();


ctx.setLineDash([]);


/* Zielkreis */

ctx.beginPath();

ctx.arc(
aimX,
aimY,
15,
0,
Math.PI*2
);

ctx.strokeStyle =
"rgba(255,255,255,0.9)";

ctx.stroke();

}


/* =========================================================
PHYSIK
========================================================= */

function physics(){

const friction =
0.985;


for(const b of balls){

b.x += b.vx;

b.y += b.vy;


b.vx *= friction;

b.vy *= friction;


if(
Math.abs(b.vx)<0.02 &&
Math.abs(b.vy)<0.02
){

b.vx = 0;
b.vy = 0;

}


const left =
table.x + BALL_RADIUS;

const right =
table.x +
table.width -
BALL_RADIUS;

const top =
table.y +
BALL_RADIUS;

const bottom =
table.y +
table.height -
BALL_RADIUS;


if(b.x < left){

b.x = left;

b.vx =
Math.abs(b.vx)*0.82;

playSound("rail");

}


if(b.x > right){

b.x = right;

b.vx =
-Math.abs(b.vx)*0.82;

playSound("rail");

}


if(b.y < top){

b.y = top;

b.vy =
Math.abs(b.vy)*0.82;

playSound("rail");

}


if(b.y > bottom){

b.y = bottom;

b.vy =
-Math.abs(b.vy)*0.82;

playSound("rail");

}

}


/* Kugel-Kollisionen */

for(
let i=0;
i<balls.length;
i++
){

for(
let j=i+1;
j<balls.length;
j++
){

const a =
balls[i];

const b =
balls[j];


const dx =
b.x-a.x;

const dy =
b.y-a.y;

const distance =
Math.sqrt(
dx*dx+dy*dy
);


const minDistance =
BALL_RADIUS*2;


if(
distance > 0 &&
distance < minDistance
){

const nx =
dx/distance;

const ny =
dy/distance;


const overlap =
minDistance-distance;


a.x -=
nx*overlap/2;

a.y -=
ny*overlap/2;


b.x +=
nx*overlap/2;

b.y +=
ny*overlap/2;


const relativeVelocity =
(b.vx-a.vx)*nx +
(b.vy-a.vy)*ny;


if(
relativeVelocity < 0
){

const impulse =
-relativeVelocity*0.96;


a.vx -=
impulse*nx;

a.vy -=
impulse*ny;


b.vx +=
impulse*nx;

b.vy +=
impulse*ny;


playSound(
"ball"
);

}

}

}

}

}


/* =========================================================
SCHUSS
========================================================= */

let dragging = false;


canvas.addEventListener(
"pointermove",
function(e){

aimX =
e.clientX;

aimY =
e.clientY;

}
);


canvas.addEventListener(
"pointerdown",
function(){

startAudio();

dragging =
true;

}
);


canvas.addEventListener(
"pointerup",
function(){

if(!dragging)
return;

dragging =
false;


const white =
balls[0];


const dx =
white.x-aimX;

const dy =
white.y-aimY;


const distance =
Math.sqrt(
dx*dx+dy*dy
);


if(distance < 10)
return;


const power =
Math.min(
25,
Math.max(
5,
distance/15
)
);


white.vx =
dx/distance*
power;


white.vy =
dy/distance*
power;


playSound(
"cue"
);

}
);


/* =========================================================
LOOP
========================================================= */

function loop(){

physics();

drawTable();

balls.forEach(
drawBall
);

drawCue();


requestAnimationFrame(
loop
);

}


loop();

</script>

</body>
</html>
