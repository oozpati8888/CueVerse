<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CueVerse Royal</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
background:#050505;
color:white;
font-family:Arial,sans-serif;
}

body{
overflow-x:hidden;
}

.top{
width:96%;
max-width:1400px;
margin:auto;
height:82px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
}

.player{
font-size:14px;
line-height:1.5;
color:#ccc;
}

.player.right{text-align:right}

.player b{
color:#e7c260;
font-size:16px;
}

.logo{
font-size:29px;
font-weight:bold;
letter-spacing:6px;
color:#e4bc54;
text-shadow:0 0 18px rgba(228,188,84,.35);
}

.stake{
text-align:center;
color:#dfbd60;
font-size:13px;
font-weight:bold;
letter-spacing:1px;
margin-bottom:12px;
}

.wrapper{
width:97%;
max-width:1400px;
margin:auto;
}

.outer{
padding:22px;
border-radius:25px;

background:
linear-gradient(
135deg,
#050403,
#17100a 12%,
#5b3512 27%,
#130c06 45%,
#6b4116 72%,
#080604
);

border:1px solid #b98a2c;

box-shadow:
0 30px 70px rgba(0,0,0,.9),
inset 0 0 35px rgba(0,0,0,.9);
}

canvas{
width:100%;
height:auto;
display:block;
border-radius:12px;
cursor:crosshair;
touch-action:none;
box-shadow:0 15px 45px rgba(0,0,0,.9);
}

.controls{
max-width:950px;
margin:18px auto 30px;
}

.power{
display:flex;
align-items:center;
gap:14px;
}

.power label{
font-size:12px;
font-weight:bold;
letter-spacing:2px;
color:#e2bd5d;
}

#power{
flex:1;
accent-color:#d8ad3d;
}

#powerValue{
width:55px;
color:#e3bd5b;
font-weight:bold;
}

button{
padding:13px 27px;
margin:10px 5px;
border-radius:9px;
border:1px solid #d4ae49;
background:linear-gradient(#f2d476,#b6821d);
color:#100d07;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.4;
}

.status{
min-height:22px;
font-size:13px;
color:#bbb;
}

.help{
font-size:11px;
color:#666;
}
</style>
</head>

<body>

<div class="top">

<div class="player">
<b>ORHAN</b><br>
Level 1 · 🪙 10.000
</div>

<div class="logo">CUEVERSE</div>

<div class="player right">
<b>OOZ PLAYER</b><br>
Level 12 · 🪙 10.000
</div>

</div>

<div class="stake">
ROYAL TABLE · 100 COINS
</div>

<div class="wrapper">

<div class="outer">
<canvas id="table" width="1400" height="700"></canvas>
</div>

<div class="controls">

<div class="power">
<label>SHOT POWER</label>

<input
id="power"
type="range"
min="1"
max="100"
value="70">

<span id="powerValue">70%</span>
</div>

<button id="shoot">
STOSS AUSFÜHREN
</button>

<button id="reset">
NEUSTART
</button>

<div id="status" class="status">
Zielen und Stoßstärke einstellen.
</div>

<div class="help">
Maus bewegen = zielen · Power einstellen · Stoß ausführen
</div>

</div>
</div>

<script>

const canvas=document.getElementById("table");
const ctx=canvas.getContext("2d");

const power=document.getElementById("power");
const powerValue=document.getElementById("powerValue");
const shoot=document.getElementById("shoot");
const reset=document.getElementById("reset");
const status=document.getElementById("status");

const W=1400;
const H=700;

const rail=72;

const L=rail+18;
const R=W-rail-18;
const T=rail+18;
const B=H-rail-18;

const radius=18;

/* --------------------------------
PHYSIK
-------------------------------- */

const restitution=.96;
const railBounce=.91;

/*
Geschwindigkeit wird direkt in
Pixeln pro Physikschritt geführt.
Dadurch ist 100 % wirklich schnell.
*/

const maxSpeed=42;

const friction=.992;

let balls=[];
let aiming=true;

let mouseX=280;
let mouseY=H/2;


/* --------------------------------
TASCHEN
-------------------------------- */

const pockets=[
{x:rail,y:rail},
{x:W/2,y:rail},
{x:W-rail,y:rail},
{x:rail,y:H-rail},
{x:W/2,y:H-rail},
{x:W-rail,y:H-rail}
];


/* --------------------------------
FARBEN
-------------------------------- */

const colors=[
"#e5b82e",
"#2774d5",
"#d62f3e",
"#8242c6",
"#eb8120",
"#15986a",
"#aa3426",
"#090909",
"#e5b82e",
"#2774d5",
"#d62f3e",
"#8242c6",
"#eb8120",
"#15986a",
"#d62f3e"
];


/* --------------------------------
KUGEL
-------------------------------- */

function addBall(x,y,n){

balls.push({
x:x,
y:y,
vx:0,
vy:0,
n:n,
active:true,
color:n===0?"#fff":colors[n-1]
});

}


/* --------------------------------
NEUES SPIEL
-------------------------------- */

function newGame(){

balls=[];

addBall(
275,
H/2,
0
);

const startX=1000;
const centerY=H/2;

const spacing=radius*2.02;

let n=1;

for(let row=0;row<5;row++){

for(let col=0;col<=row;col++){

let x=
startX+
row*spacing;

let y=
centerY+
(col-row/2)*spacing;

addBall(
x,
y,
n
);

n++;

}

}

aiming=true;
shoot.disabled=false;

status.textContent=
"Break bereit – ziele und stoße.";
}


/* --------------------------------
TISCH
-------------------------------- */

function drawTable(){

ctx.clearRect(
0,
0,
W,
H
);


/* Holzrahmen */

const wood=
ctx.createLinearGradient(
0,
0,
W,
H
);

wood.addColorStop(0,"#080402");
wood.addColorStop(.15,"#40230d");
wood.addColorStop(.27,"#8b581d");
wood.addColorStop(.38,"#241205");
wood.addColorStop(.62,"#704516");
wood.addColorStop(.82,"#321a08");
wood.addColorStop(1,"#050302");

ctx.fillStyle=wood;

ctx.fillRect(
0,
0,
W,
H
);


/* Holzmaserung */

ctx.save();

ctx.globalAlpha=.18;

for(let i=0;i<22;i++){

let y=
20+i*31;

ctx.strokeStyle=
i%2
?"#d19a42"
:"#160b04";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
0,
y
);

ctx.bezierCurveTo(
300,
y-18,
700,
y+20,
1400,
y-10
);

ctx.stroke();

}

ctx.restore();


/* innere Goldkante */

ctx.strokeStyle="#d4ad4b";
ctx.lineWidth=3;

ctx.strokeRect(
28,
28,
W-56,
H-56
);


/* grünes Tuch */

const cloth=
ctx.createRadialGradient(
W/2,
H/2,
40,
W/2,
H/2,
800
);

cloth.addColorStop(
0,
"#14805a"
);

cloth.addColorStop(
.4,
"#08704d"
);

cloth.addColorStop(
.72,
"#07563c"
);

cloth.addColorStop(
1,
"#022d20"
);

ctx.fillStyle=cloth;

ctx.fillRect(
rail,
rail,
W-rail*2,
H-rail*2
);


/* Tuchfasern */

ctx.save();

ctx.globalAlpha=.07;

for(
let y=T;
y<B;
y+=5
){

ctx.strokeStyle=
y%10===0
?"#ffffff"
:"#001d13";

ctx.beginPath();

ctx.moveTo(
L,
y
);

ctx.lineTo(
R,
y
);

ctx.stroke();

}

ctx.restore();


/* Banden */

const cushion=
ctx.createLinearGradient(
0,
rail,
0,
rail+50
);

cushion.addColorStop(
0,
"#184d3a"
);

cushion.addColorStop(
.45,
"#0c382a"
);

cushion.addColorStop(
1,
"#041d15"
);

ctx.strokeStyle=cushion;
ctx.lineWidth=43;

ctx.strokeRect(
rail,
rail,
W-rail*2,
H-rail*2
);


/* Banden-Inlay */

ctx.strokeStyle="#b88c31";
ctx.lineWidth=2;

ctx.strokeRect(
rail+20,
rail+20,
W-(rail+20)*2,
H-(rail+20)*2
);


/* Mittellinie */

ctx.strokeStyle=
"rgba(255,255,255,.07)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
W/2,
T
);

ctx.lineTo(
W/2,
B
);

ctx.stroke();


/* Taschen */

pockets.forEach(drawPocket);


/* Diamanten */

drawDiamonds();

}


/* --------------------------------
TASCHEN
-------------------------------- */

function drawPocket(p){

const g=
ctx.createRadialGradient(
p.x-7,
p.y-7,
2,
p.x,
p.y,
38
);

g.addColorStop(
0,
"#252525"
);

g.addColorStop(
.4,
"#030303"
);

g.addColorStop(
1,
"#000"
);

ctx.fillStyle=g;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
35,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#17100a";
ctx.lineWidth=5;
ctx.stroke();

}


/* --------------------------------
DIAMANTEN
-------------------------------- */

function diamond(x,y){

ctx.fillStyle="#dfc77e";

ctx.beginPath();

ctx.moveTo(x,y-5);
ctx.lineTo(x+5,y);
ctx.lineTo(x,y+5);
ctx.lineTo(x-5,y);

ctx.closePath();
ctx.fill();

}

function drawDiamonds(){

for(
let p=.15;
p<=.85;
p+=.175
){

let x=
rail+
(W-rail*2)*p;

diamond(x,34);
diamond(x,H-34);

}

for(
let p=.25;
p<=.75;
p+=.25
){

let y=
rail+
(H-rail*2)*p;

diamond(34,y);
diamond(W-34,y);

}

}


/* --------------------------------
KUGEL
-------------------------------- */

function drawBall(b){

if(!b.active)return;


/* Schatten */

ctx.save();

ctx.globalAlpha=.4;

ctx.fillStyle="#000";

ctx.beginPath();

ctx.ellipse(
b.x+6,
b.y+8,
radius*1.05,
radius*.55,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();


/* 3D-Licht */

const g=
ctx.createRadialGradient(
b.x-7,
b.y-8,
2,
b.x,
b.y,
radius
);

if(b.n===0){

g.addColorStop(0,"#ffffff");
g.addColorStop(.28,"#ffffff");
g.addColorStop(.65,"#e8e8e8");
g.addColorStop(1,"#8d8d8d");

}else{

g.addColorStop(0,"#ffffff");
g.addColorStop(.11,b.color);
g.addColorStop(.5,b.color);
g.addColorStop(.82,b.color);
g.addColorStop(1,"#050505");

}

ctx.fillStyle=g;

ctx.beginPath();

ctx.arc(
b.x,
b.y,
radius,
0,
Math.PI*2
);

ctx.fill();


/*
Streifen für 9-15
*/

if(
b.n>=9 &&
b.n<=15
){

ctx.save();

ctx.beginPath();

ctx.arc(
b.x,
b.y,
radius-.5,
0,
Math.PI*2
);

ctx.clip();

ctx.fillStyle="#f7f7f7";

ctx.fillRect(
b.x-radius,
b.y-6,
radius*2,
12
);

ctx.restore();

}


/* Nummerkreis */

if(b.n>0){

ctx.fillStyle="#f9f9f9";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
6.8,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#111";

ctx.font="bold 8px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
b.n,
b.x,
b.y
);

}


/* Reflexion */

ctx.fillStyle=
"rgba(255,255,255,.82)";

ctx.beginPath();

ctx.ellipse(
b.x-6,
b.y-7,
3.8,
2.5,
-.4,
0,
Math.PI*2
);

ctx.fill();


/* Rand */

ctx.strokeStyle=
"rgba(0,0,0,.45)";

ctx.lineWidth=1;

ctx.beginPath();

ctx.arc(
b.x,
b.y,
radius,
0,
Math.PI*2
);

ctx.stroke();

}


/* --------------------------------
ZIELEN
-------------------------------- */

function aimDirection(){

let cue=balls[0];

if(!cue)return null;

let dx=
mouseX-cue.x;

let dy=
mouseY-cue.y;

let d=
Math.hypot(dx,dy);

if(d<1)return null;

return{
x:dx/d,
y:dy/d
};

}


/* --------------------------------
QUEUE
-------------------------------- */

function drawCue(nx,ny){

let cue=balls[0];

if(!cue)return;

const length=390;

ctx.save();

ctx.translate(
cue.x-nx*length,
cue.y-ny*length
);

ctx.rotate(
Math.atan2(ny,nx)
);


/* Premium shaft */

const shaft=
ctx.createLinearGradient(
0,-4,
0,4
);

shaft.addColorStop(
0,
"#fff1cf"
);

shaft.addColorStop(
.35,
"#d8b77d"
);

shaft.addColorStop(
.75,
"#a06c32"
);

shaft.addColorStop(
1,
"#4d2810"
);

ctx.fillStyle=shaft;

ctx.fillRect(
40,
-4,
270,
8
);


/* Gold rings */

ctx.fillStyle="#e0b44b";

ctx.fillRect(
300,
-7,
5,
14
);

ctx.fillRect(
310,
-7,
4,
14
);


/* Ebenholz-Griff */

const grip=
ctx.createLinearGradient(
0,
-8,
0,
8
);

grip.addColorStop(
0,
"#030303"
);

grip.addColorStop(
.45,
"#321a0b"
);

grip.addColorStop(
1,
"#020202"
);

ctx.fillStyle=grip;

ctx.fillRect(
314,
-8,
65,
16
);


/* Lederwicklung */

ctx.strokeStyle=
"rgba(210,170,86,.7)";

for(
let x=320;
x<376;
x+=7
){

ctx.beginPath();

ctx.moveTo(
x,
-8
);

ctx.lineTo(
x-4,
8
);

ctx.stroke();

}


/* Butt */

ctx.fillStyle="#d8ad42";

ctx.fillRect(
379,
-9,
8,
18
);


/* Ferrule */

ctx.fillStyle="#f4eee0";

ctx.fillRect(
31,
-4,
10,
8
);


/* Spitze */

ctx.fillStyle="#bca886";

ctx.fillRect(
23,
-3,
9,
6
);

ctx.restore();

}


/* --------------------------------
AIM-LINIE
-------------------------------- */

function drawAim(){

if(!aiming)return;

let cue=balls[0];

if(
!cue ||
!cue.active
)return;

let aim=aimDirection();

if(!aim)return;


/* Linie */

ctx.save();

ctx.setLineDash([12,9]);

ctx.strokeStyle=
"rgba(255,255,255,.82)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
cue.x,
cue.y
);

ctx.lineTo(
cue.x+aim.x*650,
cue.y+aim.y*650
);

ctx.stroke();

ctx.restore();


drawCue(
aim.x,
aim.y
);

}


/* --------------------------------
KOLLISION
-------------------------------- */

function collide(a,b){

let dx=b.x-a.x;
let dy=b.y-a.y;

let d=Math.hypot(dx,dy);

let min=radius*2;

if(
d<=0 ||
d>min
)return;

let nx=dx/d;
let ny=dy/d;


/* Trennen */

let overlap=min-d;

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;

b.x+=nx*overlap/2;
b.y+=ny*overlap/2;


/* Relativgeschwindigkeit */

let rvx=b.vx-a.vx;
let rvy=b.vy-a.vy;

let vel=
rvx*nx+
rvy*ny;

if(vel>0)return;


/* Impuls */

let impulse=
-(1+restitution)*vel/2;

a.vx-=impulse*nx;
a.vy-=impulse*ny;

b.vx+=impulse*nx;
b.vy+=impulse*ny;

}


/* --------------------------------
PHYSIK
-------------------------------- */

function physics(){

let moving=false;


/* Bewegung */

for(
let b of balls
){

if(!b.active)continue;

b.x+=b.vx;
b.y+=b.vy;


/* Reibung */

b.vx*=friction;
b.vy*=friction;


/* Stop */

if(
Math.abs(b.vx)<.06
){
b.vx=0;
}

if(
Math.abs(b.vy)<.06
){
b.vy=0;
}


/* Bewegung merken */

if(
Math.abs(b.vx)>.06 ||
Math.abs(b.vy)>.06
){
moving=true;
}


/* Linke Bande */

if(
b.x-radius<L
){

b.x=L+radius;

b.vx=
Math.abs(b.vx)*
railBounce;
}


/* Rechte Bande */

if(
b.x+radius>R
){

b.x=R-radius;

b.vx=
-Math.abs(b.vx)*
railBounce;
}


/* Oben */

if(
b.y-radius<T
){

b.y=T+radius;

b.vy=
Math.abs(b.vy)*
railBounce;
}


/* Unten */

if(
b.y+radius>B
){

b.y=B-radius;

b.vy=
-Math.abs(b.vy)*
railBounce;
}


/* Taschen */

for(
let p of pockets
){

let d=
Math.hypot(
b.x-p.x,
b.y-p.y
);

if(d<29){

b.active=false;
b.vx=0;
b.vy=0;

}

}

}


/* Mehrere Kollisionsdurchläufe */

for(
let pass=0;
pass<3;
pass++
){

for(
let i=0;
i<balls.length;
i++
){

for(
let j=i+1;
j<balls.length;
j++
){

if(
balls[i].active &&
balls[j].active
){

collide(
balls[i],
balls[j]
);

}

}

}

}


/* Runde beendet */

if(
!moving &&
!aiming
){

aiming=true;

shoot.disabled=false;

status.textContent=
"Deine Runde – ziele und stoße.";

}

}


/* --------------------------------
RENDER
-------------------------------- */

function render(){

drawTable();

for(
let b of balls
){
drawBall(b);
}

drawAim();

requestAnimationFrame(render);

}


/* --------------------------------
STOß
-------------------------------- */

shoot.addEventListener(
"click",
function(){

if(!aiming)return;

let cue=balls[0];

if(
!cue ||
!cue.active
)return;

let aim=aimDirection();

if(!aim)return;

let p=
Number(power.value)/100;


/*
ABSICHTLICH sehr direkte
Geschwindigkeit.

1% = 4 px/frame
100% = 42 px/frame

Dadurch sieht man den
Break deutlich schneller.
*/

let speed=
4+
p*38;

cue.vx=
aim.x*speed;

cue.vy=
aim.y*speed;

aiming=false;

shoot.disabled=true;

status.textContent=
"🎱 KRÄFTIGER STOß!";

});


/* --------------------------------
POWER
-------------------------------- */

power.addEventListener(
"input",
function(){

powerValue.textContent=
this.value+"%";

});


/* --------------------------------
RESET
-------------------------------- */

reset.addEventListener(
"click",
function(){

newGame();

});


/* --------------------------------
MOUSE
-------------------------------- */

canvas.addEventListener(
"mousemove",
function(e){

let rect=
canvas.getBoundingClientRect();

mouseX=
(e.clientX-rect.left)*
W/rect.width;

mouseY=
(e.clientY-rect.top)*
H/rect.height;

});


/* --------------------------------
TOUCH
-------------------------------- */

canvas.addEventListener(
"touchmove",
function(e){

e.preventDefault();

let rect=
canvas.getBoundingClientRect();

let t=e.touches[0];

mouseX=
(t.clientX-rect.left)*
W/rect.width;

mouseY=
(t.clientY-rect.top)*
H/rect.height;

},
{passive:false}
);


/* --------------------------------
START
-------------------------------- */

newGame();

function loop(){

physics();

requestAnimationFrame(loop);

}

loop();

render();

</script>

</body>
</html>
