<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OOZ BALL</title>

<style>
* { box-sizing: border-box; }

html, body {
margin: 0;
padding: 0;
min-height: 100%;
background: #07101d;
color: #fff;
font-family: Arial, sans-serif;
}

body {
display: flex;
flex-direction: column;
align-items: center;
overflow-x: hidden;
}
#gameLayout {
display: flex;
align-items: center;
justify-content: center;
gap: 12px;
width: 100%;
max-width: 1536px;
margin: 0 auto;
}

#gameLayout #powerSliderPanel {
position: relative;
left: auto;
top: auto;
transform: none;
flex: 0 0 46px;
width: 46px;
height: 300px;
min-height: 180px;
}

#gameLayout #table {
flex: 1 1 auto;
min-width: 0;
width: auto;
}

#table {
position: relative;
width: min(100vw, 1536px);
aspect-ratio: 2 / 1;
background-image: url("12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png");
background-size: 100% 100%;
background-repeat: no-repeat;
overflow: hidden;
touch-action: none;
}

#gameCanvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
display: block;
touch-action: none;
}

#controls {
width: min(100vw, 1536px);
background: #101b2b;
padding: 12px;
text-align: center;
}
#powerSliderPanel {
position: absolute;
left: 12px;
top: 50%;
transform: translateY(-50%);
width: 46px;
height: 42%;
min-height: 180px;
margin: 0;
padding: 8px 5px;
border: 2px solid #bda56b;
border-radius: 12px;
background: linear-gradient(90deg, #101827, #26364b, #101827);
box-shadow: 0 0 12px rgba(218, 177, 85, 0.35);
z-index: 5;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

#powerSliderLabel {
color: #ead08a;
font-size: 13px;
font-weight: bold;
margin-bottom: 8px;
}

#powerSlider {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
opacity: 0;
cursor: pointer;
writing-mode: vertical-lr;
direction: rtl;
z-index: 3;
}

#cuePowerControl {
position: relative;
width: 44px;
height: 300px;
margin: 0 auto;
}

#powerCue {
position: absolute;
left: 50%;
bottom: 8px;
width: 8px;
height: 75%;
transform: translateX(-50%);
border-radius: 5px;
background: linear-gradient(
to right,
#704511,
#fff0a6,
#b98223,
#fff7cf,
#c28b2d,
#fff0b0
);
box-shadow: 0 0 5px #d9b45e;
pointer-events: none;
z-index: 2;
}

#status {
color: #ead08a;
font-weight: bold;
font-size: 14px;
margin-bottom: 9px;
}

#powerTrack {
width: min(400px, 90%);
height: 9px;
margin: 8px auto;
background: #29374a;
border: 1px solid #bda56b;
border-radius: 8px;
overflow: hidden;
}

#powerFill {
width: 0%;
height: 100%;
background: linear-gradient(90deg, #42d6ce, #e9c365, #f0523e);
}

#instructions {
color: #d8dfeb;
font-size: 12px;
line-height: 1.5;
}

button {
background: linear-gradient(#ead393, #a77b37);
color: #101827;
border: 1px solid #f5e4b3;
border-radius: 7px;
padding: 10px 20px;
margin: 5px;
font-weight: bold;
cursor: pointer;
}
</style>
</head>

<body>

<div id="gameLayout">
<div id="powerSliderPanel">
<div id="powerSliderLabel">STOSSKRAFT</div>
<div id="cuePowerControl">
<div id="powerCue"></div>
<input id="powerSlider" type="range" min="0" max="100" value="0">
</div>
</div>

<div id="table">
<canvas id="gameCanvas" width="1536" height="768"></canvas>
</div>
</div>


<div id="controls">
<div id="status">OOZ BALL · BEREIT</div>
<div id="powerTrack"><div id="powerFill"></div></div>
<button id="resetButton">NEU STARTEN</button>
<div id="instructions">
Zum Zielen von der weißen Kugel nach hinten ziehen.
Loslassen stößt die Kugel. Je weiter du ziehst, desto kräftiger der Stoß.
</div>
</div>

<script>
"use strict";

/* =========================================
OOZ BALL – EINSTELLUNGEN
========================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const powerFill = document.getElementById("powerFill");

const W = 1536;
const H = 768;

const TABLE = {
left: 82,
right: 1454,
top: 78,
bottom: 650
};

const BALL_RADIUS = 18;

/* Stärkerer Stoß, kontrolliertes Ausrollen */
const MAX_POWER = 110;
const powerSlider = document.getElementById("powerSlider");
const powerCue = document.getElementById("powerCue");
const MAX_DRAG = 190;
const FRICTION = 0.99;
const WALL_BOUNCE = 1.0;
const BALL_BOUNCE = 1.0;

/* Taschenradius und sichtbare Versenk-Animation */
const POCKET_CAPTURE = 20;
const POCKET_OPENING = 52;
const POCKET_ANIMATION_SPEED = 0.025;

const COLORS = {
1: "#f5d32c",
2: "#2455d8",
3: "#d83232",
4: "#753cc5",
5: "#f18a28",
6: "#23944f",
7: "#8b2525",
8: "#101010",
9: "#f5d32c",
10: "#2455d8",
11: "#d83232",
12: "#753cc5",
13: "#f18a28",
14: "#23944f",
15: "#8b2525"
};

const POCKETS = [
{ x: TABLE.left, y: TABLE.top },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.top },
{ x: TABLE.right, y: TABLE.top },
{ x: TABLE.left, y: TABLE.bottom },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.bottom },
{ x: TABLE.right, y: TABLE.bottom }
];

let balls = [];
let cueBall = null;
let aiming = false;
let aimX = 0;
let aimY = 0;
let cueDirX = 1;
let cueDirY = 0;
let shotInProgress = false;
let gameOver = false;
let currentPlayer = 1;
let playerGroups = {
1: null,
2: null
};

let firstContactBall = null;
let foulThisTurn = false;
let ballInHand = false;
let draggingCueBall = false;
let handX = 0;
let handY = 0;
let turnPocketedBalls = [];
let turnMessage = "";

/* =========================================
KUGELN ERZEUGEN
========================================= */

function createBall(x, y, number, type) {
const ball = {
x, y,
vx: 0,
vy: 0,
number,
type,
radius: BALL_RADIUS,
angle: 0,
active: true,
pocketing: false,
pocketScale: 1,
pocketX: x,
pocketY: y
};

balls.push(ball);
return ball;
}

function setupBalls() {
balls = [];
console.log("setupBalls gestartet");
gameOver = false;
currentPlayer = 1;

/* 15 Objektkugeln: 7 Volle (1-7), die schwarze 8 und 7 Halbe (9-15) */
const rack = [,
[2, 9],
[3, 8, 10],
[4, 11, 12, 5],
[6, 13, 14, 15, 7]
];

const startX = 1120;
const startY = 384;
const spacingX = BALL_RADIUS * Math.sqrt(3);
const spacingY = BALL_RADIUS * 2.04;

rack.forEach((row, rowIndex) => {
row.forEach((number, index) => {
const x = startX + rowIndex * spacingX;
const y = startY +
(index - (row.length - 1) / 2) * spacingY;

let type = "solid";

if (number === 8) {
type = "eight";
} else if (number >= 9) {
type = "stripe";
}

createBall(x, y, number, type);
});
});

cueBall = createBall(430, 384, 0, "cue");
ballInHand = true;

aiming = false;
shotInProgress = false;
powerFill.style.width = "0%";

updateStatus();
}

/* =========================================
KUGEL ZEICHNEN
========================================= */

function drawBall(ball) {
if (!ball.active && !ball.pocketing) return;

const r = ball.radius;
const scale = 1;

ctx.save();
ctx.translate(ball.x, ball.y);
if (ball.pocketing) {
const fall = ball.pocketFall || 0;
ctx.translate(0, fall * ball.radius * 0.8);
ctx.beginPath();
ctx.arc(0, 0, ball.radius * 0.72, 0, Math.PI * 2);
ctx.clip();
}
ctx.scale(scale, scale);

/* Schatten */
ctx.beginPath();
ctx.ellipse(3, 5, r * 1.02, r * 0.78, 0, 0, Math.PI * 2);
ctx.fillStyle = "rgba(0,0,0,0.42)";
ctx.fill();

/* Rotation */
ctx.rotate(ball.angle || 0);

/* Grundkugel */
ctx.beginPath();
ctx.arc(0, 0, r, 0, Math.PI * 2);
ctx.fillStyle = "#10131a";
ctx.fill();

ctx.save();
ctx.beginPath();
ctx.arc(0, 0, r - 0.7, 0, Math.PI * 2);
ctx.clip();

const color = ball.type === "cue" ? "#ffffff" : COLORS[ball.number];

const gradient = ctx.createRadialGradient(
-r * 0.38, -r * 0.45, 1,
r * 0.12, r * 0.18, r * 1.3
);

if (ball.type === "cue") {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.65, "#eeeeee");
gradient.addColorStop(1, "#aab2c0");
} else {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.17, color);
gradient.addColorStop(0.7, color);
gradient.addColorStop(1, "#090c13");
}

ctx.fillStyle = gradient;
ctx.fillRect(-r, -r, r * 2, r * 2);
ctx.restore();

/* Weiße Fläche für die Nummer (außer bei der weißen Kugel) */
if (ball.type !== "cue") {
ctx.beginPath();
ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();

/* Gestreifte Kugeln (Nummer 9-15) erhalten ihren farbigen Streifen */
if (ball.type === "stripe") {
ctx.save();
ctx.beginPath();
ctx.arc(0, 0, r - 0.7, 0, Math.PI * 2);
ctx.clip();

ctx.fillStyle = COLORS[ball.number];
ctx.fillRect(-r, -r, r * 2, r * 0.35);
ctx.fillRect(-r, r * 0.65, r * 2, r * 0.35);
ctx.restore();

ctx.beginPath();
ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();
}

/* Kugelnummer Text */
ctx.fillStyle = "#111111";
ctx.font = `bold ${r * 0.52}px Arial`;
ctx.textBaseline = "middle";
ctx.textAlign = "center";
ctx.fillText(ball.number, 0, 1);
}

/* Glanzpunkt */
ctx.beginPath();
ctx.ellipse(
-r * 0.36, -r * 0.48,
r * 0.24, r * 0.12,
-0.55, 0, Math.PI * 2
);
ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
ctx.fill();

ctx.beginPath();
ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(255,255,255,0.23)";
ctx.lineWidth = 1;
ctx.stroke();

ctx.restore();
}

/* =========================================
UPDATE & PHYSIK
========================================= */

function updatePhysics() {
let ballsMoving = false;

balls.forEach(ball => {
if (!ball.active) {
if (ball.pocketing) {
ball.pocketFall = (ball.pocketFall || 0) + POCKET_ANIMATION_SPEED;
if (ball.pocketFall >= 1) {
ball.pocketing = false;
}
}
return;
}

ball.x += ball.vx;
ball.y += ball.vy;

let speed = Math.hypot(ball.vx, ball.vy);
if (speed > 0.05) {
ball.angle = (ball.angle || 0) + speed * 0.05;
ball.vx *= FRICTION;
ball.vy *= FRICTION;
ballsMoving = true;
} else {
ball.vx = 0;
ball.vy = 0;
}


if (ball.x < TABLE.left + ball.radius) {
ball.x = TABLE.left + ball.radius;
ball.vx = -ball.vx * WALL_BOUNCE;
}
if (ball.x > TABLE.right - ball.radius) {
ball.x = TABLE.right - ball.radius;
ball.vx = -ball.vx * WALL_BOUNCE;
}
if (ball.y < TABLE.top + ball.radius) {
ball.y = TABLE.top + ball.radius;
ball.vy = -ball.vy * WALL_BOUNCE;
}
if (ball.y > TABLE.bottom - ball.radius) {
ball.y = TABLE.bottom - ball.radius;
ball.vy = -ball.vy * WALL_BOUNCE;
}
POCKETS.forEach(pocket => {
let dist = Math.hypot(ball.x - pocket.x, ball.y - pocket.y);
if (dist < POCKET_CAPTURE) {
ball.active = false;
ball.pocketing = true;
ball.pocketFall = 0;
ball.vx = 0;
ball.vy = 0;
turnPocketedBalls.push(ball);
}
});
});
for (let i = 0; i < balls.length; i++) {
for (let j = i + 1; j < balls.length; j++) {
let b1 = balls[i];
let b2 = balls[j];
if (!b1.active || !b2.active) continue;
let dx = b2.x - b1.x;
let dy = b2.y - b1.y;
let dist = Math.hypot(dx, dy);
let minDist = b1.radius + b2.radius;
if (dist < minDist) {
let overlap = minDist - dist;
let nx = dx / dist;
let ny = dy / dist;
b1.x -= nx * overlap * 0.5;
b1.y -= ny * overlap * 0.5;
let kx = b1.vx - b2.vx;
let ky = b1.vy - b2.vy;
let p = 2 * (nx * kx + ny * ky) / 2;
b1.vx -= p * nx * BALL_BOUNCE;
b1.vy -= p * ny * BALL_BOUNCE;
b2.vx += p * nx * BALL_BOUNCE;
b2.vy += p * ny * BALL_BOUNCE;
if (!firstContactBall && (b1.type === "cue" || b2.type === "cue")) {
firstContactBall = b1.type === "cue" ? b2 : b1;
}
}
}
}
if (shotInProgress && !ballsMoving) {
shotInProgress = false;
evaluateTurn();
}
}
/* =========================================
REGELWERK & ZUWEISUNG
========================================= */
function evaluateTurn() {
let nextPlayer = currentPlayer === 1 ? 2 : 1;
let cueBallPocketed = turnPocketedBalls.some(b => b.type === "cue");
let eightBallPocketed = turnPocketedBalls.some(b => b.type === "eight");
foulThisTurn = false;
turnMessage = "";
if (cueBallPocketed) {
foulThisTurn = true;
turnMessage = "Foul: Weiße Kugel versenkt! ";
cueBall.active = true;
cueBall.x = 430;
cueBall.y = 384;
cueBall.vx = 0;
cueBall.vy = 0;
ballInHand = true;
}
if (!foulThisTurn && !cueBallPocketed) {
if (!firstContactBall) {
foulThisTurn = true;
turnMessage = "Foul: Keine Kugel berührt! ";
} else if (playerGroups[currentPlayer] && firstContactBall.type !== "eight") {
if (firstContactBall.type !== playerGroups[currentPlayer]) {
foulThisTurn = true;
turnMessage = "Foul: Falsche Gruppe zuerst getroffen! ";
}
}
}
if (eightBallPocketed) {
gameOver = true;
let remainingOfPlayer = balls.filter(b => b.active && b.type === playerGroups[currentPlayer]);
if (remainingOfPlayer.length === 0 && !foulThisTurn) {
turnMessage = Spieler ${currentPlayer} gewinnt das Spiel! 🎉;
} else {
turnMessage = Spieler ${nextPlayer} gewinnt! (8 zu früh oder mit Foul versenkt);
}
updateStatus();
return;
}
let correctBallPocketed = false;
turnPocketedBalls.forEach(ball => {
if (ball.type === "cue" || ball.type === "eight") return;
if (!playerGroups[1] && !playerGroups[2]) {
playerGroups[currentPlayer] = ball.type;
playerGroups[nextPlayer] = ball.type === "solid" ? "stripe" : "solid";
correctBallPocketed = true;
turnMessage = Gruppen: Spieler 1 = ${playerGroups[1] === "solid" ? "VOLLE" : "HALBE"}. ;
} else {
if (ball.type === playerGroups[currentPlayer]) {
correctBallPocketed = true;
}
}
});
if (correctBallPocketed && !foulThisTurn) {
nextPlayer = currentPlayer;
turnMessage += Spieler ${currentPlayer} bleibt am Zug.;
} else {
if (foulThisTurn) {
ballInHand = true;
turnMessage += Spieler ${nextPlayer} hat Ball-in-Hand.;
} else {
turnMessage += Spieler ${nextPlayer} ist am Zug.;
}
currentPlayer = nextPlayer;
}
turnPocketedBalls = [];
firstContactBall = null;
updateStatus();
}
function updateStatus() {
if (gameOver) {
statusText.innerText = turnMessage;
return;
}
let groupText = "";
if (playerGroups[currentPlayer]) {
groupText = playerGroups[currentPlayer] === "solid" ? " (VOLLE)" : " (HALBE)";
} else {
groupText = " (OFFEN)";
}
if (turnMessage !== "") {
statusText.innerText = ${turnMessage} | Aktuell: Spieler ${currentPlayer}${groupText};
} else {
statusText.innerText = Spieler ${currentPlayer}${groupText} · BEREIT;
}
}
/* =========================================
EINGABE-STEUERUNG (MAUS & TOUCH)
========================================= */
let currentPower = 0;
powerSlider.addEventListener("input", (e) => {
if (shotInProgress || gameOver) {
powerSlider.value = 0;
return;
}
currentPower = parseFloat(e.target.value);
powerFill.style.width = ${currentPower}%;
let maxOffset = 60;
powerCue.style.transform = translateX(-50%) translateY(${ (currentPower / 100) * maxOffset }px);
});
function getCanvasCoords(e) {
const rect = canvas.getBoundingClientRect();
const clientX = e.touches ? e.touches.clientX : e.clientX;
const clientY = e.touches ? e.touches.clientY : e.clientY;
return {
x: (clientX - rect.left) * (W / rect.width),
y: (clientY - rect.top) * (H / rect.height)
};
}
function handleStart(e) {
if (shotInProgress || gameOver) return;
const coords = getCanvasCoords(e);
if (ballInHand) {
let dist = Math.hypot(coords.x - cueBall.x, coords.y - cueBall.y);
if (dist < cueBall.radius * 1.5) {
draggingCueBall = true;
return;
}
}
aiming = true;
aimX = coords.x;
aimY = coords.y;
}
function handleMove(e) {
const coords = getCanvasCoords(e);
if (draggingCueBall) {
let targetX = Math.max(TABLE.left + cueBall.radius, Math.min(TABLE.right - cueBall.radius, coords.x));
let targetY = Math.max(TABLE.top + cueBall.radius, Math.min(TABLE.bottom - cueBall.radius, coords.y));
let collision = balls.some(b => b !== cueBall && b.active && Math.hypot(b.x - targetX, b.y - targetY) < b.radius + cueBall.radius);
if (!collision) {
cueBall.x = targetX;
cueBall.y = targetY;
}
return;
}
if (!aiming) return;
aimX = coords.x;
aimY = coords.y;
let dx = cueBall.x - aimX;
let dy = cueBall.y - aimY;
let dist = Math.hypot(dx, dy);
if (dist > 5) {
cueDirX = dx / dist;
cueDirY = dy / dist;
if (currentPower === 0) {
let powerPct = Math.min(100, (dist / MAX_DRAG) * 100);
powerFill.style.width = ${powerPct}%;
}
}
}
function handleEnd() {
if (draggingCueBall) {
draggingCueBall = false;
ballInHand = false;
return;
}
if (!aiming) return;
aiming = false;
let dx = cueBall.x - aimX;
let dy = cueBall.y - aimY;
let dist = Math.hypot(dx, dy);
let finalPower = currentPower > 0 ? currentPower : Math.min(100, (dist / MAX_DRAG) * 100);
if (finalPower > 2) {
let actualPush = (finalPower / 100) * MAX_POWER * 0.15;
cueBall.vx = cueDirX * actualPush;
cueBall.vy = cueDirY * actualPush;
shotInProgress = true;
}
currentPower = 0;
powerSlider.value = 0;
powerFill.style.width = "0%";
powerCue.style.transform = "translateX(-50%) translateY(0px)";
}
canvas.addEventListener("mousedown", handleStart);
canvas.addEventListener("mousemove", handleMove);
window.addEventListener("mouseup", handleEnd);
canvas.addEventListener("touchstart", handleStart, { passive: true });
canvas.addEventListener("touchmove", handleMove, { passive: true });
window.addEventListener("touchend", handleEnd);
document.getElementById("resetButton").addEventListener("click", () => {
playerGroups = { 1: null, 2: null };
turnMessage = "Spiel zurückgesetzt!";
setupBalls();
});
/* =========================================
GAME LOOP & RENDERING
========================================= */
function drawAimLine() {
if (!aiming || shotInProgress) return;
ctx.beginPath();
ctx.moveTo(cueBall.x, cueBall.y);
ctx.lineTo(cueBall.x + cueDirX * 180, cueBall.y + cueDirY * 180);
ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
ctx.lineWidth = 3;
ctx.stroke();
ctx.save();
ctx.translate(cueBall.x, cueBall.y);
ctx.rotate(Math.atan2(cueDirY, cueDirX) + Math.PI);
let queueGrad = ctx.createLinearGradient(25, 0, 245, 0);
queueGrad.addColorStop(0, "#fff0a6");
queueGrad.addColorStop(0.1, "#c28b2d");
queueGrad.addColorStop(1, "#3a2208");
ctx.fillStyle = queueGrad;
ctx.beginPath();
ctx.rect(25, -3, 220, 6);
ctx.fill();
ctx.restore();
}
function gameLoop() {
ctx.clearRect(0, 0, W, H);
updatePhysics();
drawAimLine();
balls.forEach(ball => drawBall(ball));
if (ballInHand && !shotInProgress && !gameOver) {
ctx.beginPath();
ctx.arc(cueBall.x, cueBall.y, cueBall.radius * 1.4, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(66, 214, 206, 0.6)";
ctx.lineWidth = 2;
ctx.stroke();
}
requestAnimationFrame(gameLoop);
}
setupBalls();
gameLoop();




</script>
</body>
</html>
