<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OOZ BALL</title>

<style>
* { box-sizing: border-box; }

html, body {
margin: 0;
padding: 0;
min-height: 100%;
background: #07101d;
color: #fff;
font-family: Arial, sans-serif;
}

body {
display: flex;
flex-direction: column;
align-items: center;
overflow-x: hidden;
}

#table {
position: relative;
width: min(100vw, 1536px);
aspect-ratio: 2 / 1;
background-image: url("12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png");
background-size: 100% 100%;
background-repeat: no-repeat;
overflow: hidden;
touch-action: none;
}

#gameCanvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
display: block;
touch-action: none;
}

#controls {
width: min(100vw, 1536px);
background: #101b2b;
padding: 12px;
text-align: center;
}

#status {
color: #ead08a;
font-weight: bold;
font-size: 14px;
margin-bottom: 9px;
}

#powerTrack {
width: min(400px, 90%);
height: 9px;
margin: 8px auto;
background: #29374a;
border: 1px solid #bda56b;
border-radius: 8px;
overflow: hidden;
}

#powerFill {
width: 0%;
height: 100%;
background: linear-gradient(90deg, #42d6ce, #e9c365, #f0523e);
}

#instructions {
color: #d8dfeb;
font-size: 12px;
line-height: 1.5;
}

button {
background: linear-gradient(#ead393, #a77b37);
color: #101827;
border: 1px solid #f5e4b3;
border-radius: 7px;
padding: 10px 20px;
margin: 5px;
font-weight: bold;
cursor: pointer;
}
</style>
</head>

<body>

<div id="table">
<canvas id="gameCanvas" width="1536" height="768"></canvas>
</div>

<div id="controls">
<div id="status">OOZ BALL · BEREIT</div>
<div id="powerTrack"><div id="powerFill"></div></div>
<button id="resetButton">NEU STARTEN</button>
<div id="instructions">
Zum Zielen von der weißen Kugel nach hinten ziehen.
Loslassen stößt die Kugel. Je weiter du ziehst, desto kräftiger der Stoß.
</div>
</div>

<script>
"use strict";

/* =========================================
OOZ BALL – EINSTELLUNGEN
========================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const powerFill = document.getElementById("powerFill");

const W = 1536;
const H = 768;

const TABLE = {
left: 82,
right: 1454,
top: 78,
bottom: 690
};

const BALL_RADIUS = 18;

/* Stärkerer Stoß, kontrolliertes Ausrollen */
const MAX_POWER = 100;
const MAX_DRAG = 180;
const FRICTION = 0.77;
const WALL_BOUNCE = 0.92;
const BALL_BOUNCE = 0.99;

/* Taschenradius und sichtbare Versenk-Animation */
const POCKET_CAPTURE = 35;
const POCKET_OPENING = 43;
const POCKET_ANIMATION_SPEED = 0.065;

const COLORS = {
1: "#f5d32c",
2: "#2455d8",
3: "#d83232",
4: "#753cc5",
5: "#f18a28",
6: "#23944f",
7: "#8b2525",
8: "#101010",
9: "#f5d32c",
10: "#2455d8",
11: "#d83232",
12: "#753cc5",
13: "#f18a28",
14: "#23944f",
15: "#8b2525"
};

const POCKETS = [
{ x: TABLE.left, y: TABLE.top },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.top },
{ x: TABLE.right, y: TABLE.top },
{ x: TABLE.left, y: TABLE.bottom },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.bottom },
{ x: TABLE.right, y: TABLE.bottom }
];

let balls = [];
let cueBall = null;
let aiming = false;
let aimX = 0;
let aimY = 0;
let shotInProgress = false;

/* =========================================
KUGELN ERZEUGEN
========================================= */

function createBall(x, y, number, type) {
const ball = {
x, y,
vx: 0,
vy: 0,
number,
type,
radius: BALL_RADIUS,
angle: 0,
active: true,
pocketing: false,
pocketScale: 1,
pocketX: x,
pocketY: y
};

balls.push(ball);
return ball;
}

function setupBalls() {
balls = [];

/* 15 Objektkugeln: 7 Volle, 7 Halbe und die schwarze 8 */
const rack = [
[1],
[2, 3],
[4, 8, 5],
[6, 9, 10, 7],
[11, 12, 13, 14, 15]
];

const startX = 1120;
const startY = 384;
const spacingX = BALL_RADIUS * Math.sqrt(3);
const spacingY = BALL_RADIUS * 2.04;

rack.forEach((row, rowIndex) => {
row.forEach((number, index) => {
const x = startX + rowIndex * spacingX;
const y = startY +
(index - (row.length - 1) / 2) * spacingY;

let type = "solid";

if (number === 8) {
type = "eight";
} else if (number >= 9) {
type = "stripe";
}

createBall(x, y, number, type);
});
});

cueBall = createBall(430, 384, 0, "cue");

aiming = false;
shotInProgress = false;
powerFill.style.width = "0%";

updateStatus();
}

/* =========================================
KUGEL ZEICHNEN
Die Nummern drehen sich mit der Kugel.
========================================= */

function drawBall(ball) {
if (!ball.active && !ball.pocketing) return;

const r = ball.radius;
const scale = ball.pocketing ? ball.pocketScale : 1;

ctx.save();

ctx.translate(ball.x, ball.y);
ctx.scale(scale, scale);

/* Schatten */
ctx.beginPath();
ctx.ellipse(3, 5, r * 1.02, r * 0.78, 0, 0, Math.PI * 2);
ctx.fillStyle = "rgba(0,0,0,0.42)";
ctx.fill();

/* Rotation der Kugeloberfläche */
ctx.rotate(ball.angle || 0);

/* Grundkugel */
ctx.beginPath();
ctx.arc(0, 0, r, 0, Math.PI * 2);
ctx.fillStyle = "#10131a";
ctx.fill();

ctx.save();
ctx.beginPath();
ctx.arc(0, 0, r - 0.7, 0, Math.PI * 2);
ctx.clip();

const color = ball.type === "cue"
? "#ffffff"
: COLORS[ball.number];

const gradient = ctx.createRadialGradient(
-r * 0.38, -r * 0.45, 1,
r * 0.12, r * 0.18, r * 1.3
);

if (ball.type === "cue") {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.65, "#eeeeee");
gradient.addColorStop(1, "#aab2c0");
} else {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.17, color);
gradient.addColorStop(0.7, color);
gradient.addColorStop(1, "#090c13");
}

ctx.fillStyle = gradient;
ctx.fillRect(-r, -r, r * 2, r * 2);

/* Streifen */
if (ball.type === "stripe") {
ctx.fillStyle = "#f7f7f4";
ctx.fillRect(-r, -r * 0.48, r * 2, r * 0.96);

ctx.fillStyle = color;
ctx.fillRect(-r, -r * 0.29, r * 2, r * 0.58);
}

ctx.restore();

/* Nummernkreis */
if (ball.type !== "cue") {
ctx.beginPath();
ctx.arc(0, 0, r * 0.43, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();

ctx.fillStyle = "#111111";
ctx.font = "bold 12px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText(String(ball.number), 0, 0.5);
}

/* Glanzpunkt */
ctx.beginPath();
ctx.ellipse(
-r * 0.36, -r * 0.48,
r * 0.24, r * 0.12,
-0.55, 0, Math.PI * 2
);
ctx.fillStyle = "rgba(255,255,255,0.82)";
ctx.fill();

ctx.beginPath();
ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(255,255,255,0.23)";
ctx.lineWidth = 1;
ctx.stroke();

ctx.restore();
}

/* =========================================
ZIELLINIE UND QUEUE
========================================= */

function drawAim() {
if (!aiming || !cueBall || !cueBall.active) return;

const dx = cueBall.x - aimX;
const dy = cueBall.y - aimY;
const distance = Math.hypot(dx, dy);

if (distance < 2) return;

const nx = dx / distance;
const ny = dy / distance;
const power = Math.min(distance, MAX_DRAG) / MAX_DRAG;

ctx.save();

ctx.beginPath();
ctx.moveTo(cueBall.x, cueBall.y);
ctx.lineTo(cueBall.x + nx * 270, cueBall.y + ny * 270);
ctx.setLineDash([7, 7]);
ctx.strokeStyle = "rgba(255,255,255,0.85)";
ctx.lineWidth = 2;
ctx.stroke();
ctx.setLineDash([]);

const back = 35 + power * 65;
const frontX = cueBall.x - nx * back;
const frontY = cueBall.y - ny * back;
const tailX = frontX - nx * 235;
const tailY = frontY - ny * 235;

ctx.lineCap = "round";

ctx.beginPath();
ctx.moveTo(tailX, tailY);
ctx.lineTo(frontX, frontY);
ctx.lineWidth = 8;
ctx.strokeStyle = "#5a361f";
ctx.stroke();

ctx.beginPath();
ctx.moveTo(tailX, tailY);
ctx.lineTo(frontX, frontY);
ctx.lineWidth = 3;
ctx.strokeStyle = "#d8b879";
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cueBall.x - nx * 20, cueBall.y - ny * 20);
ctx.lineTo(frontX, frontY);
ctx.lineWidth = 3;
ctx.strokeStyle = "#eee0c1";
ctx.stroke();

ctx.restore();

powerFill.style.width = (power * 100) + "%";
}

/* =========================================
TASCHEN
Kugeln werden animiert statt sofort gelöscht.
========================================= */

function checkPockets(ball) {
for (const pocket of POCKETS) {
const dx = ball.x - pocket.x;
const dy = ball.y - pocket.y;
const distance = Math.hypot(dx, dy);

if (distance < POCKET_CAPTURE) {
ball.pocketing = true;
ball.pocketScale = 1;
ball.pocketX = pocket.x;
ball.pocketY = pocket.y;
ball.vx = 0;
ball.vy = 0;
return true;
}
}

return false;
}

function updatePocketAnimation(ball) {
ball.pocketScale -= POCKET_ANIMATION_SPEED;

/* Die Kugel wandert zum Taschenzentrum */
ball.x += (ball.pocketX - ball.x) * 0.24;
ball.y += (ball.pocketY - ball.y) * 0.24;

if (ball.pocketScale <= 0) {
ball.pocketScale = 0;
ball.pocketing = false;
ball.active = false;

if (ball.type === "cue") {
statusText.textContent =
"Weiße Kugel versenkt · NEU STARTEN drücken";
}
}
}

/* =========================================
BANDEN
========================================= */

function nearPocketOpening(ball, edge) {
return POCKETS.some(pocket => {
if (edge === "left" || edge === "right") {
return Math.abs(ball.y - pocket.y) < POCKET_OPENING &&
Math.abs(ball.x - pocket.x) < POCKET_OPENING + 20;
}

return Math.abs(ball.x - pocket.x) < POCKET_OPENING &&
Math.abs(ball.y - pocket.y) < POCKET_OPENING + 20;
});
}

function updateWalls(ball) {
const r = ball.radius;

/* Taschen immer vor Banden prüfen */
if (checkPockets(ball)) return;

if (ball.x - r < TABLE.left &&
!nearPocketOpening(ball, "left")) {
ball.x = TABLE.left + r;
ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
}

if (ball.x + r > TABLE.right &&
!nearPocketOpening(ball, "right")) {
ball.x = TABLE.right - r;
ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
}

if (ball.y - r < TABLE.top &&
!nearPocketOpening(ball, "top")) {
ball.y = TABLE.top + r;
ball.vy = Math.abs(ball.vy) * WALL_BOUNCE;
}

if (ball.y + r > TABLE.bottom &&
!nearPocketOpening(ball, "bottom")) {
ball.y = TABLE.bottom - r;
ball.vy = -Math.abs(ball.vy) * WALL_BOUNCE;
}
}

/* =========================================
PHYSIK
========================================= */

function updatePhysics() {
for (const ball of balls) {
if (!ball.active) continue;

if (ball.pocketing) {
updatePocketAnimation(ball);
continue;
}

ball.x += ball.vx;
ball.y += ball.vy;

/* Sichtbare Rollrotation */
ball.angle = (ball.angle || 0) +
Math.hypot(ball.vx, ball.vy) / ball.radius;

ball.vx *= FRICTION;
ball.vy *= FRICTION;

if (Math.abs(ball.vx) < 0.035) ball.vx = 0;
if (Math.abs(ball.vy) < 0.035) ball.vy = 0;

updateWalls(ball);
}

/* Kugel-Kugel-Kollisionen */
const activeBalls = balls.filter(
ball => ball.active && !ball.pocketing
);

for (let i = 0; i < activeBalls.length; i++) {
for (let j = i + 1; j < activeBalls.length; j++) {
const a = activeBalls[i];
const b = activeBalls[j];

let dx = b.x - a.x;
let dy = b.y - a.y;
let distance = Math.hypot(dx, dy);

if (distance === 0) {
dx = 0.01;
distance = 0.01;
}

const minimumDistance = a.radius + b.radius;
if (distance >= minimumDistance) continue;

const nx = dx / distance;
const ny = dy / distance;

/* Überlappung korrigieren */
const overlap = minimumDistance - distance;
a.x -= nx * overlap * 0.5;
a.y -= ny * overlap * 0.5;
b.x += nx * overlap * 0.5;
b.y += ny * overlap * 0.5;

const relativeX = b.vx - a.vx;
const relativeY = b.vy - a.vy;
const relativeVelocity =
relativeX * nx + relativeY * ny;

if (relativeVelocity < 0) {
const impulse = -relativeVelocity * BALL_BOUNCE;

a.vx -= impulse * nx;
a.vy -= impulse * ny;
b.vx += impulse * nx;
b.vy += impulse * ny;
}
}
}

shotInProgress = balls.some(ball =>
ball.active && !ball.pocketing &&
(Math.abs(ball.vx) > 0.035 ||
Math.abs(ball.vy) > 0.035)
);

updateStatus();
}

/* =========================================
STATUS UND RENDERING
========================================= */

function updateStatus() {
const remaining = balls.filter(ball =>
ball.active && ball.type !== "cue"
).length;

if (cueBall && !cueBall.active) return;

statusText.textContent = shotInProgress
? "OOZ BALL · Kugeln in Bewegung · Übrig: " + remaining
: "OOZ BALL · Bereit · Objektkugeln: " + remaining;
}

function draw() {
ctx.clearRect(0, 0, W, H);

for (const ball of balls) {
drawBall(ball);
}

drawAim();
}

/* =========================================
MAUS UND TOUCH
========================================= */

function getPointerPosition(event) {
const rect = canvas.getBoundingClientRect();

return {
x: (event.clientX - rect.left) * W / rect.width,
y: (event.clientY - rect.top) * H / rect.height
};
}

function pointerDown(event) {
if (!cueBall || !cueBall.active || shotInProgress) return;

const p = getPointerPosition(event);
aimX = p.x;
aimY = p.y;
aiming = true;

canvas.setPointerCapture(event.pointerId);
draw();
}

function pointerMove(event) {
if (!aiming) return;

const p = getPointerPosition(event);
aimX = p.x;
aimY = p.y;

draw();
}

function pointerUp() {
if (!aiming) return;

aiming = false;

if (!cueBall || !cueBall.active) {
draw();
return;
}

const dx = cueBall.x - aimX;
const dy = cueBall.y - aimY;
const distance = Math.hypot(dx, dy);

if (distance > 5) {
const power = Math.min(distance, MAX_DRAG) / MAX_DRAG;
const strength = power * MAX_POWER;

cueBall.vx = (dx / distance) * strength;
cueBall.vy = (dy / distance) * strength;

shotInProgress = true;
}

powerFill.style.width = "0%";
draw();
}

canvas.addEventListener("pointerdown", pointerDown);
canvas.addEventListener("pointermove", pointerMove);
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);

document.getElementById("resetButton").addEventListener(
"click",
setupBalls
);

/* =========================================
SPIELSCHLEIFE
========================================= */

function gameLoop() {
updatePhysics();
draw();
requestAnimationFrame(gameLoop);
}

/* START */
setupBalls();
draw();
gameLoop();

</script>
</body>
</html>
