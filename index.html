<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>OOZ BALL – Phaser 3 + Matter.js</title>

<!--
Phaser 3 enthält eine Integration für Matter.js.
Für diesen ersten Entwicklungsschritt verwenden wir
ausschließlich Phaser + Matter.
-->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html,
body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #111;
}

body {
display: flex;
align-items: center;
justify-content: center;
}

canvas {
display: block;
}
</style>
</head>

<body>

<script>

/*
=========================================================
OOZ BALL – ENTWICKLUNGSSCHRITT 1

Technik:
- HTML5
- Phaser 3
- Matter.js über Phaser
- 2D Billardtisch
- Exaktes 2:1 Spielfeld
- Statische Banden
- Weiße Kugel
- Drag-to-Shoot Steuerung

Noch NICHT enthalten:
- weitere Billardkugeln
- Taschen
- Spieler
- Score
- Fouls
- Multiplayer
- komplexe Billardregeln

Dieser Schritt bildet ausschließlich die physikalische
Grundlage.
=========================================================
*/


/* =====================================================
SPIELKONSTANTEN
===================================================== */

/*
Reine Spielfläche:

Breite = 800
Höhe = 400

Damit exakt:

800 / 400 = 2:1
*/
const TABLE_WIDTH = 800;
const TABLE_HEIGHT = 400;


/*
Außenabstand für Rahmen/Banden.
*/
const TABLE_MARGIN = 70;


/*
Kugelradius.

Durchmesser = 20 Pixel.
*/
const BALL_RADIUS = 10;


/*
Farbe des Tisches.
*/
const CLOTH_COLOR = 0x087b68;


/*
Farbe der Banden.
*/
const RAIL_COLOR = 0x5c3816;


/* =====================================================
PHASER KONFIGURATION
===================================================== */

const config = {

type: Phaser.AUTO,

width: TABLE_WIDTH + TABLE_MARGIN * 2,

height: TABLE_HEIGHT + TABLE_MARGIN * 2,

backgroundColor: "#111111",

physics: {

default: "matter",

matter: {

/*
Keine Schwerkraft.

Billard findet ausschließlich auf einer
horizontalen Ebene statt.
*/
gravity: {
x: 0,
y: 0
},

/*
Debug kann später zum Testen aktiviert werden:

debug: true
*/
debug: false,

/*
Matter läuft mit Kollisionsphysik.
*/
enableSleeping: true
}
},

scene: {
create: create,
update: update
}
};


/* =====================================================
SPIEL STARTEN
===================================================== */

const game = new Phaser.Game(config);


/* =====================================================
GLOBALE VARIABLEN
===================================================== */

let whiteBall;


/*
Anzeige für die Zuglinie.
*/
let aimGraphics;


/*
Speichert, ob der Spieler gerade
die weiße Kugel zieht.
*/
let isAiming = false;


/*
Startpunkt des Ziehens.
*/
let dragStartX = 0;
let dragStartY = 0;


/*
Aktuelle Mausposition.
*/
let dragCurrentX = 0;
let dragCurrentY = 0;


/*
Maximale Zugdistanz.

Dadurch kann die Kraft nicht unbegrenzt
groß werden.
*/
const MAX_DRAG_DISTANCE = 200;


/*
Faktor für die Schusskraft.

Dieser Wert wird später beim Balancing
des Spiels angepasst.
*/
const FORCE_SCALE = 0.00005;


/* =====================================================
CREATE
===================================================== */

function create() {

/*
-----------------------------------------------------
KOORDINATEN DER REINEN SPIELFLÄCHE
-----------------------------------------------------
*/

const tableX = TABLE_MARGIN;
const tableY = TABLE_MARGIN;

const tableRight =
tableX + TABLE_WIDTH;

const tableBottom =
tableY + TABLE_HEIGHT;


/*
-----------------------------------------------------
TISCHRAHMEN
-----------------------------------------------------
*/

const graphics = this.add.graphics();


/*
Äußerer Rahmen.
*/

graphics.fillStyle(0x24150a, 1);

graphics.fillRoundedRect(
tableX - 35,
tableY - 35,
TABLE_WIDTH + 70,
TABLE_HEIGHT + 70,
20
);


/*
Goldene innere Linie.
*/

graphics.lineStyle(
5,
0xd0a33b,
1
);

graphics.strokeRoundedRect(
tableX - 25,
tableY - 25,
TABLE_WIDTH + 50,
TABLE_HEIGHT + 50,
15
);


/*
-----------------------------------------------------
SPIELFELD
-----------------------------------------------------
*/

graphics.fillStyle(
CLOTH_COLOR,
1
);

graphics.fillRect(
tableX,
tableY,
TABLE_WIDTH,
TABLE_HEIGHT
);


/*
Leichter optischer Verlauf.
*/

graphics.fillStyle(
0x0a8f78,
0.15
);

graphics.fillRect(
tableX,
tableY,
TABLE_WIDTH,
TABLE_HEIGHT / 2
);


/*
-----------------------------------------------------
MATTER.JS BANDEN
-----------------------------------------------------

Wir erstellen vier statische Rechtecke.

Wichtig:

Die Banden sind STATIC.
Sie können sich also nicht bewegen.

Die Kugel prallt davon ab.
-----------------------------------------------------
*/

const railThickness = 24;


/*
Obere Bande
*/

this.matter.add.rectangle(

tableX + TABLE_WIDTH / 2,

tableY - railThickness / 2,

TABLE_WIDTH,

railThickness,

{

isStatic: true,

restitution: 1.0,

friction: 0
}
);


/*
Untere Bande
*/

this.matter.add.rectangle(

tableX + TABLE_WIDTH / 2,

tableBottom + railThickness / 2,

TABLE_WIDTH,

railThickness,

{

isStatic: true,

restitution: 1.0,

friction: 0
}
);


/*
Linke Bande
*/

this.matter.add.rectangle(

tableX - railThickness / 2,

tableY + TABLE_HEIGHT / 2,

railThickness,

TABLE_HEIGHT,

{

isStatic: true,

restitution: 1.0,

friction: 0
}
);


/*
Rechte Bande
*/

this.matter.add.rectangle(

tableRight + railThickness / 2,

tableY + TABLE_HEIGHT / 2,

railThickness,

TABLE_HEIGHT,

{

isStatic: true,

restitution: 1.0,

friction: 0
}
);


/*
-----------------------------------------------------
WEISSE KUGEL
-----------------------------------------------------
*/

/*
Startposition:

Links auf dem Tisch,
ungefähr auf halber Höhe.
*/

const ballX =
tableX + TABLE_WIDTH * 0.22;

const ballY =
tableY + TABLE_HEIGHT / 2;


whiteBall =
this.matter.add.circle(

ballX,
ballY,

BALL_RADIUS,

{

/*
Physikalische Eigenschaften
*/

restitution: 0.92,

/*
Reibung zwischen Kugel
und Oberfläche.
*/

friction: 0.01,

/*
Luftreibung sorgt dafür,
dass die Kugel langsam ausrollt.
*/

frictionAir: 0.025,

/*
Dichte der Kugel.
*/

density: 0.004,

/*
Keine Rotation notwendig.
*/

inertia: Infinity,

/*
Kugel darf schlafen,
wenn sie komplett zur Ruhe kommt.
*/

sleepThreshold: 10
}
);


/*
-----------------------------------------------------
KUGEL OPTISCH DARSTELLEN
-----------------------------------------------------
*/

const ballGraphics =
this.add.graphics();


/*
Matter-Körper und Grafik werden miteinander
verbunden.

Phaser aktualisiert die Position der Grafik
später in update().
*/

whiteBall.renderSprite = ballGraphics;


/*
-----------------------------------------------------
ZIEL-/AIMING-LINIE
-----------------------------------------------------
*/

aimGraphics =
this.add.graphics();


/*
-----------------------------------------------------
MOUSE / POINTER STEUERUNG
-----------------------------------------------------
*/

this.input.on(
"pointerdown",
function(pointer) {

/*
Wenn die Kugel noch rollt,
darf kein neuer Schuss beginnen.
*/

if (whiteBall.speed > 0.05) {
return;
}


/*
Abstand Maus -> Kugel
*/

const distance =
Phaser.Math.Distance.Between(

pointer.worldX,
pointer.worldY,

whiteBall.position.x,
whiteBall.position.y
);


/*
Nur wenn die Maus tatsächlich
auf bzw. nahe der weißen Kugel ist.
*/

if (distance <= BALL_RADIUS + 15) {

isAiming = true;

dragStartX =
whiteBall.position.x;

dragStartY =
whiteBall.position.y;

dragCurrentX =
pointer.worldX;

dragCurrentY =
pointer.worldY;
}
}
);


/*
-----------------------------------------------------
POINTER MOVE
-----------------------------------------------------
*/

this.input.on(
"pointermove",
function(pointer) {

if (!isAiming) {
return;
}


dragCurrentX =
pointer.worldX;

dragCurrentY =
pointer.worldY;


/*
Linie aktualisieren.
*/

drawAimLine();
}
);


/*
-----------------------------------------------------
POINTER UP
-----------------------------------------------------
*/

this.input.on(
"pointerup",
function(pointer) {

if (!isAiming) {
return;
}


/*
Schuss ausführen.
*/

shoot();


/*
Ziehen beenden.
*/

isAiming = false;


/*
Linie entfernen.
*/

aimGraphics.clear();
}
);
}


/* =====================================================
AIMING-LINIE
===================================================== */

function drawAimLine() {

aimGraphics.clear();


/*
Zugvektor:

Kugel -> Maus
*/

let dx =
dragCurrentX -
dragStartX;

let dy =
dragCurrentY -
dragStartY;


let distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
Zugdistanz begrenzen.
*/

if (distance > MAX_DRAG_DISTANCE) {

const factor =
MAX_DRAG_DISTANCE /
distance;

dx *= factor;
dy *= factor;

distance =
MAX_DRAG_DISTANCE;
}


/*
-----------------------------------------------------
AIM-LINIE

Die Linie zeigt vom weißen Ball
zum gezogenen Mauspunkt.

Beim Loslassen wird genau die
entgegengesetzte Richtung verwendet.
-----------------------------------------------------
*/

aimGraphics.lineStyle(
4,
0xffffff,
0.85
);


aimGraphics.beginPath();

aimGraphics.moveTo(
dragStartX,
dragStartY
);

aimGraphics.lineTo(
dragStartX + dx,
dragStartY + dy
);

aimGraphics.strokePath();


/*
Kleiner Kreis am Ende der Linie.
*/

aimGraphics.fillStyle(
0xffffff,
0.8
);

aimGraphics.fillCircle(
dragStartX + dx,
dragStartY + dy,
5
);
}


/* =====================================================
SCHUSS
===================================================== */

function shoot() {

/*
Zugvektor.
*/

let dx =
dragCurrentX -
dragStartX;

let dy =
dragCurrentY -
dragStartY;


let distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
Kein Schuss bei praktisch keinem Zug.
*/

if (distance < 5) {
return;
}


/*
Maximale Zugdistanz.
*/

if (distance > MAX_DRAG_DISTANCE) {

const factor =
MAX_DRAG_DISTANCE /
distance;

dx *= factor;
dy *= factor;

distance =
MAX_DRAG_DISTANCE;
}


/*
-----------------------------------------------------
ENTGEGENGESETZTE RICHTUNG

Maus wird nach rechts gezogen
-> Kugel fliegt nach links.

Maus wird nach oben gezogen
-> Kugel fliegt nach unten.
-----------------------------------------------------
*/

const forceX =
-dx *
FORCE_SCALE;

const forceY =
-dy *
FORCE_SCALE;


/*
-----------------------------------------------------
MATTER.JS KRAFT

Die Kraft wird im Mittelpunkt der Kugel
angewendet.

Dadurch erhalten wir einen echten
physikalischen Impuls anstatt einer
einfachen Positionsänderung.
-----------------------------------------------------
*/

Phaser.Physics.Matter.Matter.Body.applyForce(

whiteBall,

whiteBall.position,

{
x: forceX,
y: forceY
}
);
}


/* =====================================================
UPDATE
===================================================== */

function update() {

/*
-----------------------------------------------------
WEISSE KUGEL ZEICHNEN
-----------------------------------------------------
*/

const graphics =
whiteBall.renderSprite;


graphics.clear();


/*
Schatten
*/

graphics.fillStyle(
0x000000,
0.30
);

graphics.fillCircle(
whiteBall.position.x + 3,
whiteBall.position.y + 4,
BALL_RADIUS
);


/*
Weiße Kugel
*/

const gradient =
graphics.createRadialGradient(
whiteBall.position.x - 4,
whiteBall.position.y - 5,
1,

whiteBall.position.x,
whiteBall.position.y,
BALL_RADIUS
);


gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.7,
"#eeeeee"
);

gradient.addColorStop(
1,
"#999999"
);


graphics.fillStyle(
gradient
);


graphics.fillCircle(
whiteBall.position.x,
whiteBall.position.y,
BALL_RADIUS
);


/*
Kleiner roter Punkt als Markierung.
Kann später entfernt werden.
*/

graphics.fillStyle(
0xc62828
);

graphics.fillCircle(
whiteBall.position.x,
whiteBall.position.y,
2
);
}

</script>

</body>
</html>
