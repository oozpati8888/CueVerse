<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101010;
}

canvas {
display: block;
margin: auto;
touch-action: none;
}
</style>
</head>

<body>

<script>

const GAME_W = 900;
const GAME_H = 500;

const TABLE_X = 50;
const TABLE_Y = 50;

const TABLE_W = 800;
const TABLE_H = 400;

const BALL_R = 10;
const POCKET_R = 24;
const RAIL = 24;

let ball;
let ballGraphic;

let aimGraphic;
let cueGraphic;

let aimAngle = 0;
let aiming = false;
let shooting = false;

let power = 0;

const MAX_POWER = 180;


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101010',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {

create: create,

update: update
}
};

new Phaser.Game(config);


/* =========================================================
CREATE
========================================================= */

function create() {

const scene = this;


/* =====================================================
TABLE
===================================================== */

const table =
scene.add.graphics();


// Schatten

table.fillStyle(
0x000000,
0.35
);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
18
);


// Rahmen

table.fillStyle(
0x171717,
1
);

table.fillRoundedRect(
TABLE_X - 28,
TABLE_Y - 28,
TABLE_W + 56,
TABLE_H + 56,
16
);


// Goldkante

table.lineStyle(
4,
0xc9a34a,
1
);

table.strokeRoundedRect(
TABLE_X - 24,
TABLE_Y - 24,
TABLE_W + 48,
TABLE_H + 48,
13
);


// Bande

table.fillStyle(
0x4a2c19,
1
);

table.fillRoundedRect(
TABLE_X - 18,
TABLE_Y - 18,
TABLE_W + 36,
TABLE_H + 36,
10
);


// Spielfeld

table.fillStyle(
0x126247,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


table.lineStyle(
3,
0x0b3e30,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* =====================================================
TASCHEN
===================================================== */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* =====================================================
RAILS
===================================================== */

createRails(scene);


/* =====================================================
WEISSE KUGEL
===================================================== */

ball =
scene.matter.add.circle(

TABLE_X + 220,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.92,

friction: 0.01,

frictionAir: 0.025,

density: 0.004
}
);


/* =====================================================
GRAPHICS
===================================================== */

ballGraphic =
scene.add.graphics();

aimGraphic =
scene.add.graphics();

cueGraphic =
scene.add.graphics();


/* =====================================================
MOUSE / TOUCH
===================================================== */

scene.input.on(
'pointerdown',
function(pointer) {

if (!ball) {
return;
}

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
* Wenn neben der Kugel gedrückt wird:
* ZIELRICHTUNG ändern
*/

if (
distance > 18 &&
distance < 90
) {

aiming = true;

shooting = false;

setAimFromPointer(
pointer
);

return;
}


/*
* Wenn direkt auf der Kugel:
* Schuss vorbereiten
*/

if (distance <= 18) {

shooting = true;

aiming = false;

power = 0;
}
}
);


scene.input.on(
'pointermove',
function(pointer) {

if (!ball) {
return;
}


/*
* ZIELEN
*/

if (aiming) {

setAimFromPointer(
pointer
);

return;
}


/*
* SCHUSSKRAFT
*/

if (shooting) {

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


/*
* Projektion auf die
* entgegengesetzte Schussrichtung
*/

const dragX =
-dx;

const dragY =
-dy;


const along =
dragX *
Math.cos(aimAngle)
+
dragY *
Math.sin(aimAngle);


power =
Phaser.Math.Clamp(
along,
0,
MAX_POWER
);
}
}
);


scene.input.on(
'pointerup',
function(pointer) {

if (aiming) {

aiming = false;

return;
}


if (!shooting) {
return;
}


shooting = false;


if (power < 5) {

power = 0;

return;
}


/*
* SCHUSS
*/

const force =
power * 0.00007;


scene.matter.body.applyForce(

ball,

ball.position,

{
x:
Math.cos(aimAngle)
* force,

y:
Math.sin(aimAngle)
* force
}
);


power = 0;
}
);


/* =====================================================
TEXT
===================================================== */

scene.add.text(

TABLE_X,

12,

'OOZ BALL',

{
fontFamily: 'Arial',

fontSize: '24px',

fontStyle: 'bold',

color: '#d6b15a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 120,

16,

'8 BALL',

{
fontFamily: 'Arial',

fontSize: '14px',

color: '#ffffff',

alpha: 0.65
}
);
}


/* =========================================================
ZIELRICHTUNG
========================================================= */

function setAimFromPointer(pointer) {

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


if (
Math.abs(dx) < 0.001 &&
Math.abs(dy) < 0.001
) {
return;
}


aimAngle =
Math.atan2(
dy,
dx
);
}


/* =========================================================
TASCHEN
========================================================= */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();


g.fillStyle(
0x0b0b0b,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x292929,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* =========================================================
RAILS
========================================================= */

function createRails(scene) {

const gap =
POCKET_R * 2.2;

const half =
TABLE_W / 2;


/* TOP */

addRail(
scene,
TABLE_X +
(half - gap) / 2,

TABLE_Y -
RAIL / 2,

half - gap,

RAIL
);


addRail(
scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y -
RAIL / 2,

half - gap,

RAIL
);


/* BOTTOM */

addRail(
scene,

TABLE_X +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


addRail(
scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


/* SIDES */

const side =
TABLE_H / 2 -
gap;


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
side / 2,

RAIL,

side
);


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
TABLE_H -
side / 2,

RAIL,

side
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
side / 2,

RAIL,

side
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
TABLE_H -
side / 2,

RAIL,

side
);
}


/* =========================================================
MATTER RAIL
========================================================= */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,
y,

width,
height,

{
isStatic: true,

restitution: 0.95,

friction: 0
}
);
}


/* =========================================================
WEISSE KUGEL
========================================================= */

function drawBall() {

ballGraphic.clear();


/*
* Schatten
*/

ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(

ball.position.x + 2,

ball.position.y + 2,

BALL_R + 2
);


/*
* Kugel
*/

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/*
* Glanz
*/

ballGraphic.fillStyle(
0xeaf4ff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

2
);
}


/* =========================================================
AIM-KREIS + ZIELLINIE + KÖ
========================================================= */

function drawAim() {

aimGraphic.clear();

cueGraphic.clear();


if (!ball) {
return;
}


const bx =
ball.position.x;

const by =
ball.position.y;


/*
* =====================================================
* 360° AIM-KREIS
* =====================================================
*/

aimGraphic.lineStyle(
2,
0xffffff,
0.75
);

aimGraphic.strokeCircle(
bx,
by,
27
);


aimGraphic.lineStyle(
1,
0xffffff,
0.35
);

aimGraphic.strokeCircle(
bx,
by,
34
);


/*
* VORDERER STRICH
*/

const frontX =
bx +
Math.cos(aimAngle) *
38;

const frontY =
by +
Math.sin(aimAngle) *
38;


aimGraphic.lineStyle(
3,
0xffffff,
1
);

aimGraphic.beginPath();

aimGraphic.moveTo(
bx,
by
);

aimGraphic.lineTo(
frontX,
frontY
);

aimGraphic.strokePath();


/*
* SEITLICHER STRICH
*/

const sideAngle =
aimAngle +
Math.PI / 2;


const sideX =
bx +
Math.cos(sideAngle) *
27;

const sideY =
by +
Math.sin(sideAngle) *
27;


aimGraphic.lineStyle(
3,
0xd6b15a,
1
);

aimGraphic.beginPath();

aimGraphic.moveTo(
bx,
by
);

aimGraphic.lineTo(
sideX,
sideY
);

aimGraphic.strokePath();


/*
* =====================================================
* EXAKTE ZIELLINIE
* =====================================================
*/

const lineLength = 350;


const targetX =
bx +
Math.cos(aimAngle) *
lineLength;

const targetY =
by +
Math.sin(aimAngle) *
lineLength;


aimGraphic.lineStyle(
2,
0xffffff,
0.85
);

aimGraphic.beginPath();

aimGraphic.moveTo(
bx,
by
);

aimGraphic.lineTo(
targetX,
targetY
);

aimGraphic.strokePath();


/*
* =====================================================
* KÖ
* =====================================================
*
* Die Spitze endet exakt an der
* Oberfläche der weißen Kugel.
*/

const cueGap = 2;

const cueLength =
190 +
power * 0.35;


const tipX =
bx -
Math.cos(aimAngle) *
(BALL_R + cueGap);


const tipY =
by -
Math.sin(aimAngle) *
(BALL_R + cueGap);


const buttX =
tipX -
Math.cos(aimAngle) *
cueLength;


const buttY =
tipY -
Math.sin(aimAngle) *
cueLength;


/*
* Kö-Schatten
*/

cueGraphic.lineStyle(
8,
0x000000,
0.25
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX + 2,
buttY + 2
);

cueGraphic.lineTo(
tipX + 2,
tipY + 2
);

cueGraphic.strokePath();


/*
* Kö
*/

cueGraphic.lineStyle(
5,
0xc9a34a,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX,
buttY
);

cueGraphic.lineTo(
tipX,
tipY
);

cueGraphic.strokePath();


/*
* Kö-Spitze
*/

cueGraphic.lineStyle(
3,
0xf2f2f2,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
tipX +
Math.cos(aimAngle) * 7,

tipY +
Math.sin(aimAngle) * 7
);

cueGraphic.strokePath();


/*
* Griff
*/

cueGraphic.lineStyle(
9,
0x5a321b,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX -
Math.cos(aimAngle) * 10,

buttY -
Math.sin(aimAngle) * 10
);

cueGraphic.lineTo(
buttX -
Math.cos(aimAngle) * 35,

buttY -
Math.sin(aimAngle) * 35
);

cueGraphic.strokePath();
}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!ball) {
return;
}


drawBall();

drawAim();
}

</script>

</body>
</html>
