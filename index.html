<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #111;
touch-action: none;
}

canvas {
display: block;
margin: auto;
}
</style>

<!-- Phaser 3 -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

</head>

<body>

<script>

/* =========================================================
OOZ BALL
ECHTER OOZ-TISCH + MATTER PHYSICS
========================================================= */

const TABLE_W = 800;
const TABLE_H = 400;

const BALL_RADIUS = 10;

/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

width: TABLE_W,
height: TABLE_H,

backgroundColor: '#111111',

scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

positionIterations: 12,
velocityIterations: 10
}
},

scene: {
preload: preload,
create: create,
update: update
}
};

new Phaser.Game(config);


/* =========================================================
VARIABLEN
========================================================= */

let whiteBall;

let ballGraphic;

let aimGraphic;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

const MAX_DRAG = 220;

const FORCE_SCALE = 0.00008;


/* =========================================================
BILDER LADEN
========================================================= */

function preload() {

/*
Dein vorhandenes Bild aus GitHub.
Dateiname muss exakt sein:
ooz-table.jpg
*/

this.load.image(
'oozTable',
'ooz-table.jpg'
);
}


/* =========================================================
SPIEL ERSTELLEN
========================================================= */

function create() {

/* -----------------------------------------------------
1. DEIN ECHTER OOZ-TISCH
----------------------------------------------------- */

const tableImage = this.add.image(
TABLE_W / 2,
TABLE_H / 2,
'oozTable'
);

/*
Das Bild wird exakt auf unser 800 × 400
Spielfeld gelegt.
*/

tableImage.setDisplaySize(
TABLE_W,
TABLE_H
);

tableImage.setDepth(0);


/* -----------------------------------------------------
2. UNSICHTBARE BANDE
----------------------------------------------------- */

const wallOptions = {

isStatic: true,

restitution: 1.0,

friction: 0,

frictionStatic: 0
};

/*
Oben
*/

this.matter.add.rectangle(
TABLE_W / 2,
-5,
TABLE_W,
10,
wallOptions
);

/*
Unten
*/

this.matter.add.rectangle(
TABLE_W / 2,
TABLE_H + 5,
TABLE_W,
10,
wallOptions
);

/*
Links
*/

this.matter.add.rectangle(
-5,
TABLE_H / 2,
10,
TABLE_H,
wallOptions
);

/*
Rechts
*/

this.matter.add.rectangle(
TABLE_W + 5,
TABLE_H / 2,
10,
TABLE_H,
wallOptions
);


/* -----------------------------------------------------
3. WEISSE KUGEL
----------------------------------------------------- */

whiteBall = this.matter.add.circle(

200,
TABLE_H / 2,

BALL_RADIUS,

{

restitution: 0.92,

friction: 0.01,

frictionAir: 0.025,

density: 0.004,

sleepThreshold: 10
}
);


/* -----------------------------------------------------
4. KUGEL-GRAFIK
----------------------------------------------------- */

ballGraphic = this.add.graphics();

ballGraphic.setDepth(10);


/* -----------------------------------------------------
5. ZIEL-/STOSSLINIE
----------------------------------------------------- */

aimGraphic = this.add.graphics();

aimGraphic.setDepth(9);


/* -----------------------------------------------------
6. MOUSE / TOUCH
----------------------------------------------------- */

this.input.on(
'pointerdown',
function(pointer) {

const dx =
pointer.worldX -
whiteBall.position.x;

const dy =
pointer.worldY -
whiteBall.position.y;

const distance =
Math.sqrt(dx * dx + dy * dy);

/*
Nur starten, wenn man die Kugel
ungefähr trifft.
*/

if (distance < BALL_RADIUS * 3) {

dragging = true;

dragStartX =
whiteBall.position.x;

dragStartY =
whiteBall.position.y;
}
}
);


this.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

drawAimLine(
pointer.worldX,
pointer.worldY
);
}
);


this.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}

dragging = false;

aimGraphic.clear();

shoot(
pointer.worldX,
pointer.worldY
);
}
);
}


/* =========================================================
STOß
========================================================= */

function shoot(targetX, targetY) {

const dx =
targetX -
whiteBall.position.x;

const dy =
targetY -
whiteBall.position.y;

let distance =
Math.sqrt(dx * dx + dy * dy);

if (distance < 5) {
return;
}

/*
Maximale Stärke begrenzen
*/

distance =
Math.min(
distance,
MAX_DRAG
);

const factor =
distance /
Math.sqrt(dx * dx + dy * dy);

const limitedDX =
dx * factor;

const limitedDY =
dy * factor;


/*
Gegenrichtung des Ziehens.
*/

const forceX =
-limitedDX *
FORCE_SCALE;

const forceY =
-limitedDY *
FORCE_SCALE;


thisMatterApplyForce(
forceX,
forceY
);
}


/* =========================================================
FORCE
========================================================= */

function thisMatterApplyForce(
forceX,
forceY
) {

whiteBall.isSleeping = false;

Phaser.Physics.Matter.Matter.Body.applyForce(

whiteBall,

whiteBall.position,

{
x: forceX,
y: forceY
}
);
}


/* =========================================================
AIM-LINIE
========================================================= */

function drawAimLine(
pointerX,
pointerY
) {

aimGraphic.clear();

const ballX =
whiteBall.position.x;

const ballY =
whiteBall.position.y;


let dx =
pointerX - ballX;

let dy =
pointerY - ballY;


let distance =
Math.sqrt(dx * dx + dy * dy);


if (distance < 1) {
return;
}


if (distance > MAX_DRAG) {

const scale =
MAX_DRAG /
distance;

dx *= scale;
dy *= scale;
}


/*
Linie zeigt die spätere Stoßrichtung.
*/

aimGraphic.lineStyle(
2,
0xffffff,
0.8
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ballX,
ballY
);

aimGraphic.lineTo(
ballX - dx,
ballY - dy
);

aimGraphic.strokePath();
}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!whiteBall) {
return;
}


/* Kugel zeichnen */

ballGraphic.clear();


/*
Schatten
*/

ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(
whiteBall.position.x + 2,
whiteBall.position.y + 2,
BALL_RADIUS + 1
);


/*
Weiße Kugel
*/

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(
whiteBall.position.x,
whiteBall.position.y,
BALL_RADIUS
);


/*
Kleiner Glanzpunkt
*/

ballGraphic.fillStyle(
0xffffff,
0.9
);

ballGraphic.fillCircle(
whiteBall.position.x - 3,
whiteBall.position.y - 3,
2
);
}

</script>

</body>
</html>
