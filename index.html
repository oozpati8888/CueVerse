<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CueVerse Royal Table</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:
radial-gradient(circle at 50% 0%,#252525 0,#080808 55%,#000 100%);
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

.top{
width:96%;
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 10px;
}

.player{
min-width:150px;
font-size:15px;
line-height:1.5;
}

.player strong{color:#e3bd4a}

.logo{
color:#e3bd4a;
font-size:28px;
font-weight:bold;
letter-spacing:4px;
text-shadow:0 0 15px #8f6c19;
}

.stake{
color:#e3bd4a;
font-weight:bold;
margin-bottom:12px;
}

.game{
width:96%;
max-width:1200px;
margin:auto;
}

.frame{
padding:20px;
border-radius:25px;
background:
linear-gradient(135deg,#050505,#3b2a13,#080808);
border:3px solid #c49a32;
box-shadow:
0 0 35px rgba(212,175,55,.3),
inset 0 0 25px #000;
}

canvas{
display:block;
width:100%;
height:auto;
border-radius:12px;
cursor:crosshair;
box-shadow:0 15px 40px #000;
}

.controls{
margin:18px auto;
max-width:850px;
}

.power{
display:flex;
align-items:center;
gap:12px;
}

.power span:first-child{
color:#e3bd4a;
font-weight:bold;
}

#power{
flex:1;
accent-color:#e3bd4a;
}

#powerValue{
width:55px;
color:#e3bd4a;
}

button{
padding:14px 28px;
margin:9px;
border:1px solid #d4af37;
border-radius:10px;
background:linear-gradient(#f0cb5b,#b88618);
color:#080808;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.status{
min-height:25px;
color:#bbb;
}

.help{
color:#777;
font-size:12px;
margin-top:8px;
}
</style>
</head>

<body>

<div class="top">

<div class="player">
👤 <strong>Orhan</strong><br>
Level 1<br>
🪙 10.000 Coins
</div>

<div class="logo">CUEVERSE</div>

<div class="player">
<strong>OOZ Player</strong><br>
Level 12<br>
🪙 10.000 Coins
</div>

</div>

<div class="stake">ROYAL TABLE · Einsatz 100 Coins</div>

<div class="game">

<div class="frame">
<canvas id="table" width="1200" height="600"></canvas>
</div>

<div class="controls">

<div class="power">
<span>POWER</span>

<input
id="power"
type="range"
min="1"
max="100"
value="55"
>

<span id="powerValue">55%</span>
</div>

<button id="shoot">STOSS AUSFÜHREN</button>
<button id="reset">NEUSTART</button>

<div id="status" class="status">
Ziehe die Maus zum Zielen und stelle die Stoßstärke ein.
</div>

<div class="help">
Maus bewegen = zielen · Power einstellen · Stoß ausführen
</div>

</div>
</div>

<script>

const canvas=document.getElementById("table");
const ctx=canvas.getContext("2d");

const powerSlider=document.getElementById("power");
const powerValue=document.getElementById("powerValue");
const shootButton=document.getElementById("shoot");
const resetButton=document.getElementById("reset");
const statusText=document.getElementById("status");

const W=canvas.width;
const H=canvas.height;

/* Spielfeld */
const rail=58;
const left=rail;
const right=W-rail;
const top=rail;
const bottom=H-rail;

const ballR=15;

/* Taschen */
const pockets=[
{x:left,y:top},
{x:W/2,y:top},
{x:right,y:top},
{x:left,y:bottom},
{x:W/2,y:bottom},
{x:right,y:bottom}
];

/* Physik */
const friction=0.992;
const cushionLoss=0.88;
const restitution=0.96;

let balls=[];
let aiming=true;
let mouse={x:850,y:300};

/* =========================
KUGEL ERSTELLEN
========================= */

function makeBall(x,y,color,number){

balls.push({
x:x,
y:y,
vx:0,
vy:0,
color:color,
number:number,
active:true
});

}

/* =========================
BREAK AUFBAU
========================= */

function setup(){

balls=[];

/* Weiße Kugel */
makeBall(280,H/2,"white",0);

/*
Standard-Dreieck.
Die Kugeln stehen enger zusammen,
damit der Break sofort sichtbar reagiert.
*/

const startX=860;
const startY=H/2;
const spacing=ballR*2+0.5;

const colors=[
"#f4c542",
"#2674d9",
"#d92d3a",
"#8b42d6",
"#f28c28",
"#1fa36b",
"#a83a24",
"#111",
"#f4c542",
"#2674d9",
"#d92d3a",
"#8b42d6",
"#f28c28",
"#1fa36b",
"#d92d3a"
];

let number=1;

for(let row=0;row<5;row++){

for(let col=0;col<=row;col++){

const x=startX+row*spacing;
const y=startY+(col-row/2)*spacing;

makeBall(
x,
y,
colors[number-1],
number
);

number++;
}
}

}

setup();

/* =========================
TISCH ZEICHNEN
========================= */

function drawTable(){

ctx.clearRect(0,0,W,H);

/* Außenfläche */
const outer=ctx.createLinearGradient(0,0,W,H);
outer.addColorStop(0,"#24170b");
outer.addColorStop(.5,"#6b4516");
outer.addColorStop(1,"#160d05");

ctx.fillStyle=outer;
ctx.fillRect(0,0,W,H);

/* Tuch */
const cloth=ctx.createRadialGradient(
W/2,H/2,40,
W/2,H/2,650
);

cloth.addColorStop(0,"#087451");
cloth.addColorStop(.55,"#075b40");
cloth.addColorStop(1,"#023725");

ctx.fillStyle=cloth;

ctx.fillRect(
rail,
rail,
W-rail*2,
H-rail*2
);

/* Banden */
ctx.strokeStyle="#153e31";
ctx.lineWidth=28;

ctx.strokeRect(
rail,
rail,
W-rail*2,
H-rail*2
);

/* Goldkante */
ctx.strokeStyle="#c69b35";
ctx.lineWidth=2;

ctx.strokeRect(
rail+14,
rail+14,
W-(rail+14)*2,
H-(rail+14)*2
);

/* Mittellinie */
ctx.strokeStyle="rgba(255,255,255,.10)";
ctx.lineWidth=2;

ctx.beginPath();
ctx.moveTo(W/2,rail+20);
ctx.lineTo(W/2,bottom-20);
ctx.stroke();

/* Taschen */

pockets.forEach(p=>{

const g=ctx.createRadialGradient(
p.x-5,p.y-5,2,
p.x,p.y,32
);

g.addColorStop(0,"#222");
g.addColorStop(.5,"#000");
g.addColorStop(1,"#050505");

ctx.fillStyle=g;

ctx.beginPath();
ctx.arc(p.x,p.y,31,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=4;
ctx.stroke();

});

/* Diamanten */

ctx.fillStyle="#d8bd77";

for(let x=150;x<W-150;x+=150){

diamond(x,rail/2);
diamond(x,bottom+rail/2);

}

}

function diamond(x,y){

ctx.beginPath();
ctx.moveTo(x,y-5);
ctx.lineTo(x+5,y);
ctx.lineTo(x,y+5);
ctx.lineTo(x-5,y);
ctx.closePath();
ctx.fill();

}

/* =========================
KUGELN
========================= */

function drawBall(b){

if(!b.active)return;

const g=ctx.createRadialGradient(
b.x-5,
b.y-6,
2,
b.x,
b.y,
ballR
);

if(b.number===0){

g.addColorStop(0,"#fff");
g.addColorStop(.55,"#eee");
g.addColorStop(1,"#999");

}else{

g.addColorStop(0,"#fff");
g.addColorStop(.12,b.color);
g.addColorStop(.72,b.color);
g.addColorStop(1,"#111");

}

/* Schatten */
ctx.fillStyle="rgba(0,0,0,.35)";
ctx.beginPath();
ctx.ellipse(
b.x+5,
b.y+7,
ballR,
ballR*.55,
0,0,Math.PI*2
);
ctx.fill();

/* Kugel */
ctx.fillStyle=g;

ctx.beginPath();
ctx.arc(
b.x,
b.y,
ballR,
0,
Math.PI*2
);
ctx.fill();

/* Glanz */
ctx.fillStyle="rgba(255,255,255,.7)";

ctx.beginPath();
ctx.arc(
b.x-5,
b.y-6,
3,
0,
Math.PI*2
);
ctx.fill();

/* Nummer */
if(b.number>0){

ctx.fillStyle="#fff";

ctx.beginPath();
ctx.arc(
b.x,
b.y,
6,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle="#111";
ctx.font="bold 8px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
b.number,
b.x,
b.y
);

}

}

/* =========================
ZIELLINIE + QUEUE
========================= */

function drawAim(){

if(!aiming)return;

const cue=balls[0];

if(!cue || !cue.active)return;

const dx=mouse.x-cue.x;
const dy=mouse.y-cue.y;

const len=Math.hypot(dx,dy);

if(len<1)return;

const nx=dx/len;
const ny=dy/len;

/* Ziel-Linie */

ctx.save();

ctx.setLineDash([12,8]);

ctx.strokeStyle="rgba(255,255,255,.85)";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
cue.x,
cue.y
);

ctx.lineTo(
cue.x+nx*520,
cue.y+ny*520
);

ctx.stroke();

ctx.restore();

/* Queue */

const qLength=310;

ctx.save();

ctx.translate(
cue.x-nx*qLength,
cue.y-ny*qLength
);

ctx.rotate(Math.atan2(ny,nx));

/* Griff */

const qGradient=ctx.createLinearGradient(
0,-6,
0,6
);

qGradient.addColorStop(0,"#4b2410");
qGradient.addColorStop(.4,"#d19a43");
qGradient.addColorStop(.6,"#e3bc65");
qGradient.addColorStop(1,"#3a1808");

ctx.fillStyle=qGradient;

ctx.fillRect(
0,
-5,
qLength,
10
);

/* Spitze */

ctx.fillStyle="#eee";

ctx.fillRect(
qLength-14,
-4,
14,
8
);

ctx.restore();

}

/* =========================
STOß
========================= */

function shoot(){

if(!aiming)return;

const cue=balls[0];

if(!cue || !cue.active)return;

const dx=mouse.x-cue.x;
const dy=mouse.y-cue.y;

const len=Math.hypot(dx,dy);

if(len<10)return;

const nx=dx/len;
const ny=dy/len;

const p=Number(powerSlider.value)/100;

/*
Deutlich kräftiger als die alte Version.
Der Break kann jetzt wirklich schnell werden.
*/

const maxSpeed=26;

cue.vx=nx*(4+p*maxSpeed);
cue.vy=ny*(4+p*maxSpeed);

aiming=false;
shootButton.disabled=true;

statusText.textContent=
"🎱 Stoß ausgeführt – Kugeln in Bewegung.";

}

/* =========================
KOLLISIONEN
========================= */

function resolveCollision(a,b){

const dx=b.x-a.x;
const dy=b.y-a.y;

const dist=Math.hypot(dx,dy);

if(dist===0 || dist>ballR*2)return;

const nx=dx/dist;
const ny=dy/dist;

const overlap=ballR*2-dist;

/* Kugeln auseinanderdrücken */

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;

b.x+=nx*overlap/2;
b.y+=ny*overlap/2;

/* Relativgeschwindigkeit */

const rvx=b.vx-a.vx;
const rvy=b.vy-a.vy;

const velAlongNormal=
rvx*nx+rvy*ny;

if(velAlongNormal>0)return;

/*
Gleiche Masse.
Impulsübertragung.
*/

const impulse=
-(1+restitution)*velAlongNormal/2;

a.vx-=impulse*nx;
a.vy-=impulse*ny;

b.vx+=impulse*nx;
b.vy+=impulse*ny;

}

/* =========================
PHYSIK
========================= */

function physics(){

let moving=false;

balls.forEach(b=>{

if(!b.active)return;

b.x+=b.vx;
b.y+=b.vy;

/* Reibung */

b.vx*=friction;
b.vy*=friction;

if(Math.abs(b.vx)<.035)b.vx=0;
if(Math.abs(b.vy)<.035)b.vy=0;

if(
Math.abs(b.vx)>.035 ||
Math.abs(b.vy)>.035
){
moving=true;
}

/* Bande links */

if(b.x-ballR<rail+15){

b.x=rail+15+ballR;

b.vx=
Math.abs(b.vx)*cushionLoss;
}

/* Bande rechts */

if(b.x+ballR>right-15){

b.x=right-15-ballR;

b.vx=
-Math.abs(b.vx)*cushionLoss;
}

/* Bande oben */

if(b.y-ballR<rail+15){

b.y=rail+15+ballR;

b.vy=
Math.abs(b.vy)*cushionLoss;
}

/* Bande unten */

if(b.y+ballR>bottom-15){

b.y=bottom-15-ballR;

b.vy=
-Math.abs(b.vy)*cushionLoss;
}

/* Taschen */

pockets.forEach(p=>{

const d=Math.hypot(
b.x-p.x,
b.y-p.y
);

if(d<27){

b.active=false;
b.vx=0;
b.vy=0;

}

});

});

/* Kugel-Kollisionen */

for(let i=0;i<balls.length;i++){

for(let j=i+1;j<balls.length;j++){

if(
balls[i].active &&
balls[j].active
){

resolveCollision(
balls[i],
balls[j]
);

}

}

}

if(!moving && !aiming){

aiming=true;
shootButton.disabled=false;

statusText.textContent=
"Deine Runde – ziele und stoße.";
}

requestAnimationFrame(physics);

}

/* =========================
RENDER LOOP
========================= */

function render(){

drawTable();

balls.forEach(drawBall);

drawAim();

requestAnimationFrame(render);

}

/* =========================
MOUSE
========================= */

canvas.addEventListener(
"mousemove",
function(e){

const r=canvas.getBoundingClientRect();

mouse.x=
(e.clientX-r.left)*
(W/r.width);

mouse.y=
(e.clientY-r.top)*
(H/r.height);

}
);

/* =========================
TOUCH
========================= */

canvas.addEventListener(
"touchmove",
function(e){

e.preventDefault();

const r=canvas.getBoundingClientRect();
const t=e.touches[0];

mouse.x=
(t.clientX-r.left)*
(W/r.width);

mouse.y=
(t.clientY-r.top)*
(H/r.height);

},
{passive:false}
);

/* =========================
BUTTONS
========================= */

shootButton.addEventListener(
"click",
shoot
);

powerSlider.addEventListener(
"input",
function(){

powerValue.textContent=
this.value+"%";

}
);

resetButton.addEventListener(
"click",
function(){

setup();

aiming=true;

shootButton.disabled=false;

statusText.textContent=
"Break bereit – ziele und stoße.";

}
);

/* Start */

physics();
render();

</script>

</body>
</html>
