<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse OOZ Ball</title>
<style>
:root {
--bg-dark: #07101e;
--wood-red: #8b261a;
--cloth-blue: #329bbd;
--panel-bg: #111a24;
--accent-green: #2ecc71;
}

body {
background-color: var(--bg-dark);
color: white;
font-family: 'Segoe UI', Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
overflow: hidden;
user-select: none;
}

/* Haupt-Interface im Stil von Miniclip 8 Ball Pool */
.game-interface {
background: linear-gradient(135deg, #16222f 0%, #0d151f 100%);
padding: 30px;
border-radius: 20px;
box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
border: 1px solid #233547;
display: flex;
flex-direction: column;
align-items: center;
}

/* Top-Bar Spielerprofile */
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
width: 880px;
margin-bottom: 20px;
background: rgba(0, 0, 0, 0.4);
padding: 10px 20px;
border-radius: 50px;
border: 1px solid #1f2f3e;
}

.player-profile {
display: flex;
align-items: center;
gap: 12px;
}

.avatar {
width: 45px;
height: 45px;
border-radius: 8px;
border: 2px solid var(--accent-green);
background: #444;
}

.player-info {
font-weight: bold;
font-size: 1.05rem;
}

.vs-badge {
background: #cca43b;
color: #000;
font-weight: 900;
padding: 4px 12px;
border-radius: 4px;
font-size: 0.85rem;
}

/* Tisch-Layout mit separatem Power-Meter links */
.table-area {
display: flex;
align-items: center;
gap: 25px;
}

/* Interaktives Power-Meter (links wie im Screenshot) */
.power-meter-container {
width: 24px;
height: 380px;
background: #111;
border: 3px solid #333;
border-radius: 12px;
position: relative;
overflow: hidden;
box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

.power-fill {
position: absolute;
bottom: 0;
width: 100%;
height: 0%;
background: linear-gradient(to top, #ffcc00, #ff3300);
transition: height 0.05s ease;
}

.power-cue-indicator {
position: absolute;
bottom: 0;
width: 100%;
height: 4px;
background: white;
box-shadow: 0 0 8px white;
}

/* Tischrahmen */
.table-frame {
background: var(--wood-red);
padding: 24px;
border-radius: 16px;
box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.2);
border: 3px solid #61180f;
position: relative;
}

canvas {
background-color: var(--cloth-blue);
display: block;
border-radius: 4px;
box-shadow: inset 0 10px 30px rgba(0,0,0,0.4);
}

.toast-banner {
margin-top: 15px;
background: rgba(0, 0, 0, 0.7);
padding: 8px 30px;
border-radius: 20px;
border: 1px solid #333;
font-size: 0.9rem;
color: #ddd;
}
</style>
</head>
<body>

<div class="game-interface">
<!-- Spielerleiste oben -->
<div class="top-bar">
<div class="player-profile">
<div class="avatar" style="border-color: #cca43b;"></div>
<div class="player-info">ooz <span style="color: #cca43b;">★ 200</span></div>
</div>
<div class="vs-badge">VS</div>
<div class="player-profile" style="flex-direction: row-reverse;">
<div class="avatar" style="border-color: #2ecc71;"></div>
<div class="player-info" style="text-align: right;">Ginevra <span style="color: #2ecc71;">★ 133</span></div>
</div>
</div>

<!-- Spielfeld -->
<div class="table-area">
<!-- Linkes Power-Meter -->
<div class="power-meter-container">
<div class="power-fill" id="powerFill"></div>
</div>

<!-- Billardtisch -->
<div class="table-frame" id="tableFrame">
<canvas id="poolCanvas" width="840" height="420"></canvas>
</div>
</div>

<div class="toast-banner">
Du hast Anstoß, viel Glück!
</div>
</div>

<script>
const canvas = document.getElementById("poolCanvas");
const ctx = canvas.getContext("2d");
const powerFill = document.getElementById("powerFill");

// Konfigurationen & Abmessungen
const BALL_RADIUS = 11;
const POCKET_RADIUS = 22;
const FRICTION = 0.985;

// Positionen der 6 Taschen
const pockets = [
{ x: 5, y: 5 }, { x: canvas.width / 2, y: 2 }, { x: canvas.width - 5, y: 5 },
{ x: 5, y: canvas.height - 5 }, { x: canvas.width / 2, y: canvas.height - 2 }, { x: canvas.width - 5, y: canvas.height - 5 }
];

// Farbcodes exakt wie im realen Spiel
const ballColors = {
1: "#f1c40f", 2: "#2980b9", 3: "#e74c3c", 4: "#9b59b6", 5: "#e67e22",
6: "#2ecc7 green", 7: "#7f8c8d", 8: "#111111", 9: "#f1c40f", 10: "#2980b9",
11: "#e74c3c", 12: "#9b59b6", 13: "#e67e22", 14: "#2ecc71", 15: "#7f8c8d"
};

class Ball {
constructor(x, y, number, isCue = false) {
this.x = x;
this.y = y;
this.vx = 0;
this.vy = 0;
this.number = number;
this.isCue = isCue;
this.color = isCue ? "#ffffff" : ballColors[number];
this.isStriped = number > 8;
this.isActive = true;
}

update() {
if (!this.isActive) return;
this.x += this.vx;
this.y += this.vy;
this.vx *= FRICTION;
this.vy *= FRICTION;

if (Math.abs(this.vx) < 0.008) this.vx = 0;
if (Math.abs(this.vy) < 0.008) this.vy = 0;

// Banden-Bounce
const margin = BALL_RADIUS + 12; // Abstand zur inneren Bande
if (this.x < margin) { this.x = margin; this.vx *= -1; }
if (this.x > canvas.width - margin) { this.x = canvas.width - margin; this.vx *= -1; }
if (this.y < margin) { this.y = margin; this.vy *= -1; }
if (this.y > canvas.height - margin) { this.y = canvas.height - margin; this.vy *= -1; }
}

draw() {
if (!this.isActive) return;

ctx.save();
// 3D Kugel-Schatten
ctx.beginPath();
ctx.arc(this.x + 3, this.y + 4, BALL_RADIUS, 0, Math.PI * 2);
ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
ctx.fill();

// Basis-Kugel
ctx.beginPath();
ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
ctx.fillStyle = this.color;
ctx.fill();

if (!this.isCue) {
if (this.isStriped) {
// Halbe Kugel (Weißer Mittelstreifen)
ctx.beginPath();
ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
ctx.clip();
ctx.fillStyle = "#ffffff";
ctx.fillRect(this.x - BALL_RADIUS, this.y - BALL_RADIUS * 0.5, BALL_RADIUS * 2, BALL_RADIUS);
}

// Nummern-Spiegel
ctx.beginPath();
ctx.arc(this.x, this.y, BALL_RADIUS * 0.4, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();

ctx.fillStyle = "#000000";
ctx.font = "bold 7px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText(this.number, this.x, this.y + 0.5);
}

// Hochglanz Reflexion
let grad = ctx.createRadialGradient(this.x - 3, this.y - 3, 1, this.x, this.y, BALL_RADIUS);
grad.addColorStop(0, "rgba(255, 255, 255, 0.5)");
grad.addColorStop(1, "rgba(0, 0, 0, 0.3)");
ctx.beginPath();
ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
ctx.fillStyle = grad;
ctx.fill();
ctx.restore();
}
}

// Setup Spielfeld (Weiße Kugel links, perfektes Dreieck rechts)
let balls = [];
let cueBall = new Ball(220, 210, 0, true);
balls.push(cueBall);

// Rack-Reihenfolge exakt nach Screenshot
const rackOrder = [
1,
2, 3,
4, 8, 5,
6, 7, 9, 10,
11, 12, 13, 14, 15
];

function createRack() {
const startX = 580;
const startY = 210;
