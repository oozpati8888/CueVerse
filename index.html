<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let balls = [];

function resize() {
const r = canvas.getBoundingClientRect();
const dpr = window.devicePixelRatio || 1;

canvas.width = r.width * dpr;
canvas.height = r.height * dpr;

W = r.width;
H = r.height;

ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

createRack();
}

window.addEventListener("resize", resize);


/* =========================================================
BILLARDKUGEL
========================================================= */

class Ball {

constructor(x, y, color, number, type) {
this.x = x;
this.y = y;

this.vx = 0;
this.vy = 0;

this.r = 13;

this.color = color;
this.number = number;
this.type = type;
}

draw() {

const r = this.r;

/* Schatten */
ctx.beginPath();
ctx.arc(
this.x + 2,
this.y + 3,
r,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,.35)";
ctx.fill();

/* Kugel */

const g = ctx.createRadialGradient(
this.x - r * .35,
this.y - r * .4,
1,
this.x,
this.y,
r
);

if (this.type === "white") {

g.addColorStop(0, "#ffffff");
g.addColorStop(.65, "#eeeeee");
g.addColorStop(1, "#aaaaaa");

ctx.beginPath();
ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
ctx.fillStyle = g;
ctx.fill();

return;
}


/* Schwarze 8 */

if (this.type === "eight") {

g.addColorStop(0, "#555");
g.addColorStop(.45, "#111");
g.addColorStop(1, "#000");

ctx.beginPath();
ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
ctx.fillStyle = g;
ctx.fill();

ctx.beginPath();
ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
ctx.fillStyle = "#fff";
ctx.fill();

ctx.fillStyle = "#111";
ctx.font = "bold 7px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText("8", this.x, this.y);

return;
}


/* Gestreifte Kugel */

if (this.type === "stripe") {

ctx.beginPath();
ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
ctx.fillStyle = "#fff";
ctx.fill();

ctx.save();

ctx.beginPath();
ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
ctx.clip();

ctx.fillStyle = this.color;

ctx.fillRect(
this.x - r,
this.y - r * .34,
r * 2,
r * .68
);

ctx.restore();

} else {

/* Volle Kugel */

g.addColorStop(0, "#ffffff");
g.addColorStop(.18, this.color);
g.addColorStop(1, this.color);

ctx.beginPath();
ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
ctx.fillStyle = g;
ctx.fill();
}


/* Nummernfeld */

ctx.beginPath();
ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
ctx.fillStyle = "#fff";
ctx.fill();

ctx.fillStyle = "#111";
ctx.font = "bold 6px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
this.number,
this.x,
this.y
);
}
}


/* =========================================================
FARBEN
========================================================= */

const solidColors = [
"#f4bd32",
"#1768d8",
"#e52e3e",
"#7138bb",
"#f07827",
"#078866"
];

const stripeColors = [
"#f4bd32",
"#1768d8",
"#e52e3e",
"#7138bb",
"#f07827",
"#078866"
];


/* =========================================================
EXAKTES RACK
2 - 3 - 3 - 3 - 2 = 13 KUGELN
========================================================= */

function createRack() {

balls = [];

const cx = W * 0.76;
const cy = H * 0.50;

/*
Genau diese 13 Positionen:

● ●
● ● ●
● 8 ●
● ● ●
● ●

= 13
*/

const spacing = 27;

const positions = [

/* Reihe 1 - 2 */
[-0.5, -2],
[ 0.5, -2],

/* Reihe 2 - 3 */
[-1, -1],
[ 0, -1],
[ 1, -1],

/* Reihe 3 - 3 */
[-1, 0],
[ 0, 0], // SCHWARZE 8
[ 1, 0],

/* Reihe 4 - 3 */
[-1, 1],
[ 0, 1],
[ 1, 1],

/* Reihe 5 - 2 */
[-0.5, 2],
[ 0.5, 2]
];


let normalIndex = 0;

positions.forEach((pos) => {

const x = cx + pos[0] * spacing;
const y = cy + pos[1] * spacing;

/* Schwarze 8 exakt in der Mitte */

if (pos[0] === 0 && pos[1] === 0) {

balls.push(
new Ball(
x,
y,
"#000000",
8,
"eight"
)
);

return;
}


/* Abwechselnd volle / gestreifte Kugeln */

const type =
normalIndex % 2 === 0
? "solid"
: "stripe";


const color =
type === "solid"
? solidColors[
Math.floor(normalIndex / 2) % 6
]
: stripeColors[
Math.floor(normalIndex / 2) % 6
];


/*
Nummern 1-7 und 9-15.
Wir benutzen hier genau 12 farbige Kugeln.
*/

const number =
normalIndex < 6
? normalIndex + 1
: normalIndex + 3;


balls.push(
new Ball(
x,
y,
color,
number,
type
)
);

normalIndex++;
});


/* =====================================================
WEISSE SPIELKUGEL
===================================================== */

balls.push(
new Ball(
W * 0.25,
H * 0.50,
"#ffffff",
0,
"white"
)
);


/* Sicherheitskontrolle */

const rackBalls =
balls.filter(
b => b.type !== "white"
);

if (rackBalls.length !== 13) {

console.error(
"FEHLER: Rack hat " +
rackBalls.length +
" statt 13 Kugeln!"
);

} else {

console.log(
"OK: 13 Rack-Kugeln + 1 weiße = 14 Kugeln"
);
}
}


/* =========================================================
KUGEL-KOLLISION
========================================================= */

function collide(a, b) {

const dx = b.x - a.x;
const dy = b.y - a.y;

const distance =
Math.sqrt(dx * dx + dy * dy);

const minDistance =
a.r + b.r;

if (
distance > 0 &&
distance < minDistance
) {

const nx = dx / distance;
const ny = dy / distance;

const overlap =
minDistance - distance;

a.x -= nx * overlap / 2;
a.y -= ny * overlap / 2;

b.x += nx * overlap / 2;
b.y += ny * overlap / 2;


const relativeVelocity =
(b.vx - a.vx) * nx +
(b.vy - a.vy) * ny;

if (relativeVelocity > 0) return;


const impulse =
relativeVelocity;


a.vx += nx * impulse;
a.vy += ny * impulse;

b.vx -= nx * impulse;
b.vy -= ny * impulse;
}
}


/* =========================================================
PHYSIK
========================================================= */

function updatePhysics() {

balls.forEach(ball => {

ball.x += ball.vx;
ball.y += ball.vy;

ball.vx *= 0.985;
ball.vy *= 0.985;


if (Math.abs(ball.vx) < 0.01)
ball.vx = 0;

if (Math.abs(ball.vy) < 0.01)
ball.vy = 0;


/* Bande */

if (ball.x - ball.r < 0) {

ball.x = ball.r;
ball.vx = Math.abs(ball.vx);
}

if (ball.x + ball.r > W) {

ball.x = W - ball.r;
ball.vx = -Math.abs(ball.vx);
}

if (ball.y - ball.r < 0) {

ball.y = ball.r;
ball.vy = Math.abs(ball.vy);
}

if (ball.y + ball.r > H) {

ball.y = H - ball.r;
ball.vy = -Math.abs(ball.vy);
}
});


/* Kugel-Kollisionen */

for (
let i = 0;
i < balls.length;
i++
) {

for (
let j = i + 1;
j < balls.length;
j++
) {

collide(
balls[i],
balls[j]
);
}
}
}


/* =========================================================
ZIELEN / STOSS
========================================================= */

let cueBall = null;

let aiming = false;
let mouseX = 0;
let mouseY = 0;


function getCueBall() {

return balls.find(
b => b.type === "white"
);
}


canvas.addEventListener(
"pointerdown",
function(e) {

cueBall = getCueBall();

if (!cueBall) return;

aiming = true;

updatePointer(e);
}
);


canvas.addEventListener(
"pointermove",
function(e) {

updatePointer(e);
}
);


canvas.addEventListener(
"pointerup",
function() {

if (!aiming) return;

aiming = false;

cueBall = getCueBall();

if (!cueBall) return;


const dx =
cueBall.x - mouseX;

const dy =
cueBall.y - mouseY;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (distance < 8)
return;


const power =
Math.min(
distance / 10,
25
);


cueBall.vx =
dx / distance * power;

cueBall.vy =
dy / distance * power;
}
);


function updatePointer(e) {

const r =
canvas.getBoundingClientRect();

mouseX =
e.clientX - r.left;

mouseY =
e.clientY - r.top;
}


/* =========================================================
ZEICHNEN
========================================================= */

function draw() {

ctx.clearRect(
0,
0,
W,
H
);


/* Kugeln */

balls.forEach(
ball => ball.draw()
);


/* Zielschnur + Queue */

cueBall = getCueBall();


if (
aiming &&
cueBall
) {

const dx =
cueBall.x - mouseX;

const dy =
cueBall.y - mouseY;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance > 5) {

/* Ziellinie */

ctx.save();

ctx.strokeStyle =
"rgba(255,255,255,.75)";

ctx.lineWidth = 2;

ctx.setLineDash(
[8, 7]
);

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x +
dx / distance * 450,

cueBall.y +
dy / distance * 450
);

ctx.stroke();

ctx.restore();


/* Queue */

ctx.save();

const angle =
Math.atan2(
dy,
dx
);

ctx.translate(
cueBall.x,
cueBall.y
);

ctx.rotate(angle);


const queueLength =
Math.min(
distance * 4,
420
);


ctx.fillStyle =
"#d4a64b";

ctx.fillRect(
-queueLength,
-2.5,
queueLength,
5
);


ctx.fillStyle =
"#f0f0f0";

ctx.fillRect(
-queueLength,
-2.5,
18,
5
);


ctx.restore();
}
}


updatePhysics();

requestAnimationFrame(draw);
}


/* =========================================================
START
========================================================= */

resize();
draw();

</script>
