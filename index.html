<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse - OOZ Ball</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
padding: 0;
background: #07090d;
color: white;
font-family: Arial, sans-serif;
}

body {
min-height: 100vh;
}

.game {
width: 100%;
max-width: 1200px;
margin: auto;
padding: 15px;
}

.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}

.player {
font-weight: bold;
font-size: 14px;
}

.logo {
font-size: 25px;
font-weight: 900;
letter-spacing: 5px;
color: #e6bd58;
}

.room {
text-align: center;
color: #e6bd58;
font-weight: bold;
margin-bottom: 15px;
}

/* BILLARDTISCH */

.table-frame {
width: 100%;
padding: 25px;
background: linear-gradient(
135deg,
#e0ad3b,
#8c5b08,
#e8bd4e,
#704603
);

border-radius: 28px;

box-shadow:
0 20px 50px rgba(0,0,0,.8),
inset 0 0 0 4px #3c2607;
}

canvas {
display: block;
width: 100%;
height: auto;

border-radius: 15px;

box-shadow:
0 0 0 8px #3c0808,
0 0 0 14px #8e1715,
0 15px 30px rgba(0,0,0,.8);
}

/* BEDIENUNG */

.controls {
margin-top: 20px;
display: flex;
gap: 15px;
align-items: center;
}

.power {
flex: 1;
background: #11151c;
border: 1px solid #444;
padding: 15px;
border-radius: 15px;
}

.power-title {
color: #e6bd58;
font-weight: bold;
letter-spacing: 2px;
margin-bottom: 8px;
}

input {
width: 100%;
}

button {
background: linear-gradient(#ffe48a,#c69228);
border: none;
padding: 16px 22px;
border-radius: 13px;
font-weight: bold;
cursor: pointer;
}

.status {
text-align: center;
margin-top: 15px;
}

@media(max-width:700px) {

.game {
padding: 7px;
}

.table-frame {
padding: 13px;
}

.logo {
font-size: 17px;
}

.player {
font-size: 10px;
}

.controls {
flex-direction: column;
}

button {
width: 100%;
}
}
</style>
</head>

<body>

<div class="game">

<div class="header">

<div class="player">
ORHAN<br>
LEVEL 1 · 🪙 10.000
</div>

<div class="logo">
CUEVERSE
</div>

<div class="player">
OOZ PLAYER<br>
LEVEL 12 · 🪙 10.000
</div>

</div>

<div class="room">
ROYAL TABLE · 100 COINS
</div>

<div class="table-frame">

<canvas
id="poolTable"
width="1200"
height="680">
</canvas>

</div>

<div class="controls">

<div class="power">

<div class="power-title">
SHOT POWER
</div>

<input
id="power"
type="range"
min="1"
max="100"
value="50">

</div>

<button id="shoot">
STOSS AUSFÜHREN
</button>

<button id="reset">
NEUSTART
</button>

</div>

<div
id="status"
class="status">
Kugeln stehen bereit.
</div>

</div>


<script>

/* ============================================================
CUEVERSE
OOZ BALL ROYAL TABLE
============================================================ */

const canvas = document.getElementById("poolTable");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/* ------------------------------------------------------------
SPIELFELD
------------------------------------------------------------ */

const table = {

left: 100,
right: 1100,

top: 90,
bottom: 590

};


/* ------------------------------------------------------------
TASCHEN
------------------------------------------------------------ */

const pocketRadius = 34;

const pockets = [

{
x: table.left,
y: table.top
},

{
x: W / 2,
y: table.top
},

{
x: table.right,
y: table.top
},

{
x: table.left,
y: table.bottom
},

{
x: W / 2,
y: table.bottom
},

{
x: table.right,
y: table.bottom
}

];


/* ------------------------------------------------------------
KUGELN
------------------------------------------------------------ */

const ballRadius = 17;

let balls = [];

let angle = 0;

let moving = false;


/* ------------------------------------------------------------
KUGEL ERSTELLEN
------------------------------------------------------------ */

function createBall(
x,
y,
color,
number
) {

return {

x: x,
y: y,

vx: 0,
vy: 0,

radius: ballRadius,

color: color,

number: number,

active: true

};

}


/* ------------------------------------------------------------
NEUES SPIEL
------------------------------------------------------------ */

function newGame() {

balls = [];

/*
WEISSE KUGEL
*/

balls.push(
createBall(
300,
340,
"#ffffff",
0
)
);


/*
6 VOLLKUGELN

Keine Streifen.
Keine halben Kugeln.
*/

balls.push(
createBall(
820,
305,
"#e32626",
1
)
);

balls.push(
createBall(
820,
340,
"#1769d5",
2
);

balls.push(
createBall(
820,
375,
"#f0c51c",
3
)
);

balls.push(
createBall(
785,
322,
"#7623b7",
4
)
);

balls.push(
createBall(
785,
358,
"#ef7b18",
5
)
);

balls.push(
createBall(
855,
340,
"#15934b",
6
)
);


/*
SCHWARZE 8

EXAKT IN DER MITTE
DES RACKS
*/

balls.push(
createBall(
820,
340,
"#050505",
8
)
);


angle = 0;

moving = false;

document.getElementById("status").textContent =
"7 Objektkugeln · schwarze 8 in der Mitte.";

draw();

}


/* ------------------------------------------------------------
TISCH ZEICHNEN
------------------------------------------------------------ */

function drawTable() {

ctx.clearRect(
0,
0,
W,
H
);


/*
ÄUSSERER HOLZRAHMEN
*/

const wood =
ctx.createLinearGradient(
0,
0,
0,
H
);

wood.addColorStop(
0,
"#bd3025"
);

wood.addColorStop(
0.5,
"#75110f"
);

wood.addColorStop(
1,
"#3d0808"
);


ctx.fillStyle = wood;

roundedRectangle(
35,
35,
W - 70,
H - 70,
30
);

ctx.fill();


/*
GOLDENE KANTE
*/

ctx.strokeStyle = "#d6a83e";

ctx.lineWidth = 5;

roundedRectangle(
48,
48,
W - 96,
H - 96,
24
);

ctx.stroke();


/*
GRÜN/BLAUES TISCHFELD
*/

const cloth =
ctx.createRadialGradient(
W / 2,
H / 2,
50,
W / 2,
H / 2,
650
);

cloth.addColorStop(
0,
"#38c5dc"
);

cloth.addColorStop(
0.6,
"#109db9"
);

cloth.addColorStop(
1,
"#056c87"
);


ctx.fillStyle = cloth;

ctx.fillRect(
table.left,
table.top,
table.right - table.left,
table.bottom - table.top
);


/*
BANDEN
*/

ctx.fillStyle = "#8d1715";

ctx.fillRect(
table.left,
55,
table.right - table.left,
35
);

ctx.fillRect(
table.left,
table.bottom,
table.right - table.left,
35
);

ctx.fillRect(
55,
table.top,
45,
table.bottom - table.top
);

ctx.fillRect(
table.right,
table.top,
45,
table.bottom - table.top
);


/*
OOZ BALL GRAVUR
*/

ctx.save();

ctx.globalAlpha = 0.28;

ctx.beginPath();

ctx.arc(
W / 2,
H / 2,
80,
0,
Math.PI * 2
);

ctx.strokeStyle = "#064e60";

ctx.lineWidth = 5;

ctx.stroke();


ctx.fillStyle = "#064e60";

ctx.textAlign = "center";

ctx.font = "900 38px Arial";

ctx.fillText(
"OOZ",
W / 2,
H / 2
);


ctx.font = "900 14px Arial";

ctx.fillText(
"BALL",
W / 2,
H / 2 + 27
);

ctx.restore();


/*
TASCHEN
*/

drawPockets();

}


/* ------------------------------------------------------------
TASCHEN ZEICHNEN
------------------------------------------------------------ */

function drawPockets() {

pockets.forEach(
pocket => {

/*
ÄUSSERER SCHWARZER RING
*/

ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
pocketRadius + 8,
0,
Math.PI * 2
);

ctx.fillStyle = "#190606";

ctx.fill();


/*
ROTE/BRÄUNLICHE LEDERKANTE
*/

ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
pocketRadius + 3,
0,
Math.PI * 2
);

ctx.fillStyle = "#260707";

ctx.fill();


/*
ECHTES SCHWARZES LOCH
*/

const hole =
ctx.createRadialGradient(
pocket.x - 7,
pocket.y - 7,
2,
pocket.x,
pocket.y,
pocketRadius
);

hole.addColorStop(
0,
"#303030"
);

hole.addColorStop(
0.35,
"#090909"
);

hole.addColorStop(
1,
"#000000"
);


ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
pocketRadius,
0,
Math.PI * 2
);

ctx.fillStyle = hole;

ctx.fill();


/*
INNENRAND
*/

ctx.beginPath();

ctx.arc(
pocket.x,
pocket.y,
pocketRadius - 5,
0,
Math.PI * 2
);

ctx.strokeStyle = "#333";

ctx.lineWidth = 3;

ctx.stroke();

}
);

}


/* ------------------------------------------------------------
KUGELN ZEICHNEN
------------------------------------------------------------ */

function drawBall(ball) {

if (!ball.active) {
return;
}


/*
SCHATTEN
*/

ctx.beginPath();

ctx.ellipse(
ball.x + 5,
ball.y + 7,
ball.radius,
ball.radius * 0.55,
0,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(0,0,0,.45)";

ctx.fill();


/*
3D KUGEL
*/

const gradient =
ctx.createRadialGradient(
ball.x - 7,
ball.y - 8,
2,
ball.x,
ball.y,
ball.radius
);


gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.15,
ball.color
);

gradient.addColorStop(
0.75,
ball.color
);

gradient.addColorStop(
1,
"#111111"
);


ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI * 2
);

ctx.fillStyle =
gradient;

ctx.fill();


/*
WEISSER GLANZ
*/

ctx.beginPath();

ctx.arc(
ball.x - 6,
ball.y - 7,
3.5,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(255,255,255,.8)";

ctx.fill();


/*
NUMMER
*/

if (ball.number !== 0) {

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
7,
0,
Math.PI * 2
);

ctx.fillStyle = "#ffffff";

ctx.fill();


ctx.fillStyle = "#111";

ctx.font =
"bold 9px Arial";

ctx.textAlign = "center";

ctx.textBaseline = "middle";

ctx.fillText(
ball.number,
ball.x,
ball.y
);

}

}


/* ------------------------------------------------------------
ALLES ZEICHNEN
------------------------------------------------------------ */

function draw() {

drawTable();


/*
KUGELN
werden bewusst NACH dem Tisch gezeichnet,
damit sie garantiert sichtbar sind.
*/

balls.forEach(
ball => {

drawBall(ball);

}
);


/*
ZIELLINIE
*/

const cue =
balls[0];

if (
cue &&
cue.active &&
!moving
) {

const lineLength = 220;

const x2 =
cue.x +
Math.cos(angle) *
lineLength;

const y2 =
cue.y +
Math.sin(angle) *
lineLength;


ctx.beginPath();

ctx.moveTo(
cue.x,
cue.y
);

ctx.lineTo(
x2,
y2
);

ctx.strokeStyle =
"rgba(255,255,255,.7)";

ctx.lineWidth = 2;

ctx.setLineDash([
10,
8
]);

ctx.stroke();

ctx.setLineDash([]);

}

}


/* ------------------------------------------------------------
STOß
------------------------------------------------------------ */

function shoot() {

if (moving) {
return;
}


const cue =
balls[0];


const power =
Number(
document.getElementById("power").value
);


const velocity =
260 +
power * 8;


cue.vx =
Math.cos(angle) *
velocity;


cue.vy =
Math.sin(angle) *
velocity;


moving = true;

document.getElementById("status").textContent =
"Stoß läuft ...";

}


/* ------------------------------------------------------------
PHYSIK
------------------------------------------------------------ */

function update() {

if (moving) {

balls.forEach(
ball => {

if (!ball.active) {
return;
}


ball.x +=
ball.vx *
0.016;


ball.y +=
ball.vy *
0.016;


/*
REIBUNG
*/

ball.vx *=
0.985;

ball.vy *=
0.985;


/*
BANDEN
*/

if (
ball.x - ball.radius <
table.left
) {

ball.x =
table.left +
ball.radius;

ball.vx =
Math.abs(ball.vx) *
0.8;

}


if (
ball.x + ball.radius >
table.right
) {

ball.x =
table.right -
ball.radius;

ball.vx =
-Math.abs(ball.vx) *
0.8;

}


if (
ball.y - ball.radius <
table.top
) {

ball.y =
table.top +
ball.radius;

ball.vy =
Math.abs(ball.vy) *
0.8;

}


if (
ball.y + ball.radius >
table.bottom
) {

ball.y =
table.bottom -
ball.radius;

ball.vy =
-Math.abs(ball.vy) *
0.8;

}


/*
TASCHENPRÜFUNG
*/

pockets.forEach(
pocket => {

const distance =
Math.hypot(
ball.x - pocket.x,
ball.y - pocket.y
);


if (
distance <
pocketRadius - 4
) {

ball.active =
false;

}

}
);


/*
STOPP
*/

if (
Math.abs(ball.vx) < 0.8 &&
Math.abs(ball.vy) < 0.8
) {

ball.vx = 0;
ball.vy = 0;

}

}
);


/*
Prüfen ob alle Kugeln stehen
*/

let anyMoving = false;


balls.forEach(
ball => {

if (
Math.abs(ball.vx) > 0 ||
Math.abs(ball.vy) > 0
) {

anyMoving = true;

}

}
);


if (!anyMoving) {

moving = false;

document.getElementById("status").textContent =
"Kugeln stehen — nächster Stoß.";

}

}


draw();

requestAnimationFrame(update);

}


/* ------------------------------------------------------------
ZIELEN
------------------------------------------------------------ */

canvas.addEventListener(
"pointermove",
function(event) {

if (moving) {
return;
}


const rect =
canvas.getBoundingClientRect();


const mouseX =
(event.clientX - rect.left) *
(canvas.width / rect.width);


const mouseY =
(event.clientY - rect.top) *
(canvas.height / rect.height);


const cue =
balls[0];


angle =
Math.atan2(
mouseY - cue.y,
mouseX - cue.x
);


draw();

}
);


/* ------------------------------------------------------------
BUTTONS
------------------------------------------------------------ */

document
.getElementById("shoot")
.addEventListener(
"click",
shoot
);


document
.getElementById("reset")
.addEventListener(
"click",
newGame
);


/* ------------------------------------------------------------
ABGERUNDETES RECHTECK
------------------------------------------------------------ */

function roundedRectangle(
x,
y,
width,
height,
radius
) {

ctx.beginPath();

ctx.moveTo(
x + radius,
y
);

ctx.lineTo(
x + width - radius,
y
);

ctx.quadraticCurveTo(
x + width,
y,
x + width,
y + radius
);

ctx.lineTo(
x + width,
y + height - radius
);

ctx.quadraticCurveTo(
x + width,
y + height,
x + width - radius,
y + height
);

ctx.lineTo(
x + radius,
y + height
);

ctx.quadraticCurveTo(
x,
y + height,
x,
y + height - radius
);

ctx.lineTo(
x,
y + radius
);

ctx.quadraticCurveTo(
x,
y,
x + radius,
y
);

ctx.closePath();

}


/* ------------------------------------------------------------
START
------------------------------------------------------------ */

newGame();

update();

</script>

</body>
</html>
