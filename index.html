<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CueVerse OOZ Ball</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080b10;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

#game{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

header{
height:64px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:#10151d;
border-bottom:1px solid #26303c;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:2px;
}

.logo span{
color:#27e6a2;
}

.status{
font-size:14px;
color:#aeb8c5;
}

#area{
flex:1;
min-height:0;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

#tableWrap{
width:min(1100px,96vw);
aspect-ratio:2 / 1;
position:relative;
}

canvas{
width:100%;
height:100%;
display:block;
border-radius:20px;
box-shadow:
0 20px 70px rgba(0,0,0,.7),
0 0 0 2px #202a34;
}

#controls{
height:82px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
gap:18px;
background:#10151d;
border-top:1px solid #26303c;
}

button{
border:0;
border-radius:12px;
padding:12px 20px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:#202a35;
color:white;
}

button:hover{
background:#2c3948;
}

#shoot{
background:#27e6a2;
color:#06120d;
min-width:130px;
}

#shoot:hover{
background:#48f0b4;
}

.powerBox{
display:flex;
align-items:center;
gap:10px;
}

input[type=range]{
width:180px;
}

#powerText{
width:42px;
color:#27e6a2;
font-weight:bold;
}

@media(max-width:650px){
header{
height:52px;
padding:0 12px;
}

.logo{
font-size:19px;
}

.status{
font-size:11px;
}

#area{
padding:8px;
}

#controls{
height:72px;
gap:8px;
}

button{
padding:10px 12px;
font-size:12px;
}

.powerBox{
gap:5px;
}

input[type=range]{
width:100px;
}
}
</style>
</head>

<body>

<div id="game">

<header>
<div class="logo">CUEVERSE <span>OOZ</span> BALL</div>
<div class="status" id="status">Dein Stoß 🎱</div>
</header>

<div id="area">
<div id="tableWrap">
<canvas id="canvas"></canvas>
</div>
</div>

<div id="controls">

<div class="powerBox">
<span>POWER</span>
<input id="power" type="range" min="5" max="100" value="55">
<span id="powerText">55%</span>
</div>

<button id="reset">NEUES SPIEL</button>
<button id="shoot">STOSS 🎱</button>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const powerSlider = document.getElementById("power");
const powerText = document.getElementById("powerText");
const shootButton = document.getElementById("shoot");
const resetButton = document.getElementById("reset");
const statusText = document.getElementById("status");

let W = 1000;
let H = 500;

const table = {
x:55,
y:45,
w:890,
h:410
};

const ballR = 13;

let balls = [];
let cueBall;
let aiming = false;
let aimX = 0;
let aimY = 0;
let shooting = false;

const pockets = [
{x:table.x,y:table.y},
{x:table.x+table.w/2,y:table.y-2},
{x:table.x+table.w,y:table.y},
{x:table.x,y:table.y+table.h},
{x:table.x+table.w/2,y:table.y+table.h+2},
{x:table.x+table.w,y:table.y+table.h}
];

const colors = [
"#f4d03f",
"#2471a3",
"#c0392b",
"#8e44ad",
"#e67e22",
"#16a085",
"#922b21",
"#111111"
];

function resize(){

const rect = canvas.getBoundingClientRect();

W = rect.width;
H = rect.height;

const scaleX = W / 1000;
const scaleY = H / 500;

canvas.width = Math.round(W * devicePixelRatio);
canvas.height = Math.round(H * devicePixelRatio);

ctx.setTransform(
devicePixelRatio * scaleX,
0,
0,
devicePixelRatio * scaleY,
0,
0
);
}

window.addEventListener("resize",resize);

function createBall(x,y,color,number){

return {
x,
y,
vx:0,
vy:0,
color,
number,
active:true
};
}

function resetGame(){

balls = [];

cueBall = createBall(
table.x + table.w*0.25,
table.y + table.h/2,
"#ffffff",
0
);

balls.push(cueBall);

const startX = table.x + table.w*0.70;
const startY = table.y + table.h/2;

let n = 1;

for(let row=0;row<5;row++){

for(let col=0;col<=row;col++){

const x =
startX +
row*(ballR*1.75);

const y =
startY +
(col-row/2)*(ballR*2.05);

balls.push(
createBall(
x,
y,
colors[(n-1)%colors.length],
n
)
);

n++;
}
}

shooting=false;
statusText.textContent="Dein Stoß 🎱";
}

resetGame();

function drawTable(){

ctx.clearRect(0,0,1000,500);

// Schatten
ctx.fillStyle="#050709";
roundRect(
table.x-18,
table.y-18,
table.w+36,
table.h+36,
25
);
ctx.fill();

// Holzrahmen
const wood=ctx.createLinearGradient(
table.x,
table.y,
table.x,
table.y+table.h
);

wood.addColorStop(0,"#b87935");
wood.addColorStop(.5,"#744319");
wood.addColorStop(1,"#b87935");

ctx.fillStyle=wood;

roundRect(
table.x-14,
table.y-14,
table.w+28,
table.h+28,
20
);

ctx.fill();

// Spielfläche
const green=ctx.createLinearGradient(
table.x,
table.y,
table.x+table.w,
table.y+table.h
);

green.addColorStop(0,"#087b55");
green.addColorStop(.5,"#075f43");
green.addColorStop(1,"#034a35");

ctx.fillStyle=green;

roundRect(
table.x,
table.y,
table.w,
table.h,
12
);

ctx.fill();

// kleine Tischmarkierungen
ctx.strokeStyle="rgba(255,255,255,.10)";
ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
table.x+table.w*.25,
table.y
);

ctx.lineTo(
table.x+table.w*.25,
table.y+table.h
);

ctx.stroke();

drawPockets();
}

function drawPockets(){

for(const p of pockets){

const g=ctx.createRadialGradient(
p.x,p.y,2,
p.x,p.y,22
);

g.addColorStop(0,"#000");
g.addColorStop(.75,"#030303");
g.addColorStop(1,"#171717");

ctx.fillStyle=g;

ctx.beginPath();
ctx.arc(p.x,p.y,21,0,Math.PI*2);
ctx.fill();
}
}

function drawBalls(){

for(const b of balls){

if(!b.active) continue;

ctx.save();

// Schatten
ctx.fillStyle="rgba(0,0,0,.35)";
ctx.beginPath();
ctx.ellipse(
b.x+4,
b.y+5,
ballR,
ballR*.65,
0,
0,
Math.PI*2
);
ctx.fill();

// Ball
const gradient=ctx.createRadialGradient(
b.x-5,
b.y-6,
2,
b.x,
b.y,
ballR
);

if(b.number===0){

gradient.addColorStop(0,"#ffffff");
gradient.addColorStop(.65,"#eeeeee");
gradient.addColorStop(1,"#aaa");

}else{

gradient.addColorStop(0,"#ffffff");
gradient.addColorStop(.18,b.color);
gradient.addColorStop(1,b.color);
}

ctx.fillStyle=gradient;

ctx.beginPath();
ctx.arc(
b.x,
b.y,
ballR,
0,
Math.PI*2
);
ctx.fill();

ctx.strokeStyle="rgba(0,0,0,.35)";
ctx.lineWidth=1;

ctx.stroke();

if(b.number>0){

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(
b.x,
b.y,
5.5,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle="#111";
ctx.font="bold 7px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
b.number,
b.x,
b.y+0.5
);
}

ctx.restore();
}
}

function drawAim(){

if(!cueBall.active || shooting) return;

const dx=aimX-cueBall.x;
const dy=aimY-cueBall.y;

const len=Math.hypot(dx,dy);

if(len<5) return;

const nx=dx/len;
const ny=dy/len;

const lineLength=160;

ctx.save();

ctx.strokeStyle="rgba(255,255,255,.7)";
ctx.lineWidth=2;
ctx.setLineDash([8,7]);

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x+nx*lineLength,
cueBall.y+ny*lineLength
);

ctx.stroke();

ctx.restore();

// Queue
ctx.save();

ctx.strokeStyle="#d7b47b";
ctx.lineWidth=5;

ctx.beginPath();

ctx.moveTo(
cueBall.x-nx*55,
cueBall.y-ny*55
);

ctx.lineTo(
cueBall.x-nx*180,
cueBall.y-ny*180
);

ctx.stroke();

ctx.restore();
}

function draw(){

drawTable();
drawBalls();
drawAim();

requestAnimationFrame(draw);
}

draw();

function updatePhysics(){

if(!shooting) return;

let moving=false;

for(const b of balls){

if(!b.active) continue;

b.x+=b.vx;
b.y+=b.vy;

b.vx*=0.985;
b.vy*=0.985;

if(Math.abs(b.vx)>0.03 || Math.abs(b.vy)>0.03){
moving=true;
}else{
b.vx=0;
b.vy=0;
}

// Bande gauche/droite
if(
b.x-ballR<table.x &&
b.vx<0
){
b.x=table.x+ballR;
b.vx*=-0.88;
}

if(
b.x+ballR>table.x+table.w &&
b.vx>0
){
b.x=table.x+table.w-ballR;
b.vx*=-0.88;
}

// Bande haut/bas
if(
b.y-ballR<table.y &&
b.vy<0
){
b.y=table.y+ballR;
b.vy*=-0.88;
}

if(
b.y+ballR>table.y+table.h &&
b.vy>0
){
b.y=table.y+table.h-ballR;
b.vy*=-0.88;
}

checkPocket(b);
}

collideBalls();

if(!moving){

shooting=false;

for(const b of balls){
b.vx=0;
b.vy=0;
}

statusText.textContent="Dein Stoß 🎱";
}

requestAnimationFrame(updatePhysics);
}

function collideBalls(){

for(let i=0;i<balls.length;i++){

const a=balls[i];

if(!a.active) continue;

for(let j=i+1;j<balls.length;j++){

const b=balls[j];

if(!b.active) continue;

const dx=b.x-a.x;
const dy=b.y-a.y;

const dist=Math.hypot(dx,dy);
const minDist=ballR*2;

if(dist>0 && dist<minDist){

const nx=dx/dist;
const ny=dy/dist;

const overlap=minDist-dist;

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;

b.x+=nx*overlap/2;
b.y+=ny*overlap/2;

const dvx=a.vx-b.vx;
const dvy=a.vy-b.vy;

const impact=dvx*nx+dvy*ny;

if(impact>0){

a.vx-=impact*nx;
a.vy-=impact*ny;

b.vx+=impact*nx;
b.vy+=impact*ny;
}
}
}
}
}

function checkPocket(b){

for(const p of pockets){

const d=Math.hypot(
b.x-p.x,
b.y-p.y
);

if(d<20){

b.active=false;
b.vx=0;
b.vy=0;

if(b.number===0){

statusText.textContent="Weiße Kugel versenkt – neuer Ball!";

setTimeout(()=>{

cueBall.active=true;
cueBall.x=table.x+table.w*.25;
cueBall.y=table.y+table.h/2;
cueBall.vx=0;
cueBall.vy=0;

},700);

}else{

statusText.textContent=
"Kugel "+b.number+" versenkt! 🎯";
}

return;
}
}
}

function shoot(){

if(shooting) return;

const dx=aimX-cueBall.x;
const dy=aimY-cueBall.y;

const len=Math.hypot(dx,dy);

if(len<5) return;

const nx=dx/len;
const ny=dy/len;

const power=Number(powerSlider.value);

const speed=power*.105;

cueBall.vx=nx*speed;
cueBall.vy=ny*speed;

shooting=true;

statusText.textContent="Kugeln bewegen sich… 🎱";

updatePhysics();
}

function pointerPosition(e){

const rect=canvas.getBoundingClientRect();

return {
x:(e.clientX-rect.left)/rect.width*1000,
y:(e.clientY-rect.top)/rect.height*500
};
}

canvas.addEventListener("pointermove",e=>{

const p=pointerPosition(e);

aimX=p.x;
aimY=p.y;
});

canvas.addEventListener("pointerdown",e=>{

if(shooting) return;

const p=pointerPosition(e);

aimX=p.x;
aimY=p.y;

shoot();
});

shootButton.addEventListener("click",shoot);

resetButton.addEventListener("click",()=>{

resetGame();

});

powerSlider.addEventListener("input",()=>{

powerText.textContent=
powerSlider.value+"%";

});

function roundRect(x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.arcTo(
x+w,y,
x+w,y+h,
r
);

ctx.arcTo(
x+w,y+h,
x,y+h,
r
);

ctx.arcTo(
x,y+h,
x,y,
r
);

ctx.arcTo(
x,y,
x+w,y,
r
);

ctx.closePath();
}

</script>

</body>
</html>
