<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OOZ BALL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c}
#game{width:100%;height:100%}canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body><div id="game"></div>
<script>
// ============================================================
// OOZ BALL – STABILES ZIELEN + SAUBERES ZURÜCKZIEHEN
// ============================================================
const TABLE_W=1000, TABLE_H=500;
const TABLE_X=90, TABLE_Y=110;
const BALL_R=13;
const MAX_PULL=280;
const MAX_SPEED=28;

let scene, whiteBall;
let tableG, ballG, aimG, cueG, uiG;
let aimAngle=0;
let isPulling=false;
let pullDistance=0;
let pointerInside=false;

const config={
type:Phaser.AUTO,
parent:"game",
width:TABLE_W+TABLE_X*2,
height:TABLE_H+TABLE_Y*2,
backgroundColor:"#07111c",
scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
physics:{
default:"matter",
matter:{
gravity:{x:0,y:0},
enableSleeping:true,
positionIterations:16,
velocityIterations:16,
constraintIterations:4
},
},
scene:{create,update}
};
new Phaser.Game(config);

function create(){
scene=this;
drawTable();
createRails();

whiteBall=scene.matter.add.circle(
TABLE_X+TABLE_W*0.34,
TABLE_Y+TABLE_H*0.50,
BALL_R,
{
restitution:0.94,
friction:0.0005,
frictionAir:0.0007,
density:0.004,
slop:0.001,
sleepThreshold:3
}
);

// Keine automatische Rotation/keine störende Winkeländerung.
whiteBall.frictionAir=0.0007;

ballG=scene.add.graphics();
aimG=scene.add.graphics();
cueG=scene.add.graphics();
uiG=scene.add.graphics();

setupInput();
redraw();
}

function drawTable(){
tableG=scene.add.graphics();

tableG.fillStyle(0x0e151d,1);
tableG.fillRoundedRect(TABLE_X-52,TABLE_Y-52,TABLE_W+104,TABLE_H+104,34);

tableG.lineStyle(5,0xd2ad68,1);
tableG.strokeRoundedRect(TABLE_X-36,TABLE_Y-36,TABLE_W+72,TABLE_H+72,27);

tableG.fillStyle(0x681f19,1);
tableG.fillRoundedRect(TABLE_X-18,TABLE_Y-18,TABLE_W+36,TABLE_H+36,18);

tableG.fillStyle(0x087f88,1);
tableG.fillRect(TABLE_X,TABLE_Y,TABLE_W,TABLE_H);

tableG.lineStyle(3,0x8de8e8,0.42);
tableG.strokeRect(TABLE_X+7,TABLE_Y+7,TABLE_W-14,TABLE_H-14);

// Dezente Spielfeldmarkierung
tableG.lineStyle(2,0xffffff,0.045);
tableG.lineBetween(TABLE_X+TABLE_W/2,TABLE_Y+10,TABLE_X+TABLE_W/2,TABLE_Y+TABLE_H-10);

drawPocket(TABLE_X,TABLE_Y,"TL");
drawPocket(TABLE_X+TABLE_W/2,TABLE_Y,"TC");
drawPocket(TABLE_X+TABLE_W,TABLE_Y,"TR");
drawPocket(TABLE_X,TABLE_Y+TABLE_H,"BL");
drawPocket(TABLE_X+TABLE_W/2,TABLE_Y+TABLE_H,"BC");
drawPocket(TABLE_X+TABLE_W,TABLE_Y+TABLE_H,"BR");

scene.add.text(TABLE_X,TABLE_Y-77,"OOZ BALL",{
fontFamily:"Arial",fontSize:"30px",fontStyle:"bold",color:"#e8cb87"
});
scene.add.text(TABLE_X+TABLE_W-85,TABLE_Y-73,"8 BALL",{
fontFamily:"Arial",fontSize:"18px",fontStyle:"bold",color:"#e8cb87"
});
}

// Keine einfachen runden Kreise: Taschen werden als Aussparung/Trapez dargestellt.
function drawPocket(x,y,pos){
const g=tableG;
const w=72,h=42;
g.fillStyle(0x050609,1);
g.lineStyle(3,0x202a33,1);
g.beginPath();

if(pos==="TC"){
g.moveTo(x-w/2,y);g.lineTo(x+w/2,y);
g.lineTo(x+w/2-12,y+h);g.lineTo(x-w/2+12,y+h);
}else if(pos==="BC"){
g.moveTo(x-w/2+12,y-h);g.lineTo(x+w/2-12,y-h);
g.lineTo(x+w/2,y);g.lineTo(x-w/2,y);
}else if(pos==="TL"){
g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w-20,y+h);g.lineTo(x,y+h);
}else if(pos==="TR"){
g.moveTo(x-w,y);g.lineTo(x,y);g.lineTo(x,y+h);g.lineTo(x-w+20,y+h);
}else if(pos==="BL"){
g.moveTo(x,y-h);g.lineTo(x+w-20,y-h);g.lineTo(x+w,y);g.lineTo(x,y);
}else if(pos==="BR"){
g.moveTo(x-w+20,y-h);g.lineTo(x,y-h);g.lineTo(x,y);g.lineTo(x-w,y);
}
g.closePath();g.fillPath();g.strokePath();
}

function createRails(){
const rail=16;
const options={
isStatic:true,
restitution:0.96,
friction:0,
frictionStatic:0,
slop:0.001
};

scene.matter.add.rectangle(TABLE_X+TABLE_W/2,TABLE_Y-rail/2,TABLE_W,rail,options);
scene.matter.add.rectangle(TABLE_X+TABLE_W/2,TABLE_Y+TABLE_H+rail/2,TABLE_W,rail,options);
scene.matter.add.rectangle(TABLE_X-rail/2,TABLE_Y+TABLE_H/2,rail,TABLE_H,options);
scene.matter.add.rectangle(TABLE_X+TABLE_W+rail/2,TABLE_Y+TABLE_H/2,rail,TABLE_H,options);
}

function setupInput(){
scene.input.topOnly=true;

scene.input.on("pointermove",pointer=>{
pointerInside=true;
if(!whiteBall || isMoving()) return;

if(!isPulling){
// ZIELEN: Nur der Winkel ändert sich.
// Das Zentrum der Kugel bleibt absolut unverändert.
const dx=pointer.worldX-whiteBall.position.x;
const dy=pointer.worldY-whiteBall.position.y;
if(Math.hypot(dx,dy)>18){
aimAngle=Math.atan2(dy,dx);
}
}else{
// STOßPHASE: Winkel bleibt eingefroren.
// Nur der Abstand des Kös zur Kugel verändert sich.
updatePull(pointer.worldX,pointer.worldY);
}
});

scene.input.on("pointerdown",pointer=>{
if(!whiteBall || isMoving()) return;

// Beim Drücken wird die aktuelle Richtung einmalig festgelegt.
const dx=pointer.worldX-whiteBall.position.x;
const dy=pointer.worldY-whiteBall.position.y;
if(Math.hypot(dx,dy)>18){
aimAngle=Math.atan2(dy,dx);
}

isPulling=true;
pullDistance=0;
updatePull(pointer.worldX,pointer.worldY);
});

scene.input.on("pointerup",()=>{
if(!isPulling) return;
isPulling=false;
shoot();
});

scene.input.on("pointerout",()=>{
pointerInside=false;
});
}

function updatePull(px,py){
// Rückwärtsrichtung des Kös = genau entgegengesetzt zur Stoßrichtung.
const backX=-Math.cos(aimAngle);
const backY=-Math.sin(aimAngle);
const fromBallX=px-whiteBall.position.x;
const fromBallY=py-whiteBall.position.y;

// Nur Bewegung auf der Kö-Achse zählt. Seitliches Wackeln wird ignoriert.
const projected=fromBallX*backX+fromBallY*backY;
pullDistance=Phaser.Math.Clamp(projected-BALL_R,0,MAX_PULL);
}

function shoot(){
const power=Phaser.Math.Clamp(pullDistance/MAX_PULL,0,1);
if(power<0.025){
pullDistance=0;
return;
}

// Nicht vom Mausweg abhängig: Geschwindigkeit liegt exakt auf aimAngle.
const speed=Phaser.Math.Clamp(Math.pow(power,0.72)*MAX_SPEED,0,MAX_SPEED);
const vx=Math.cos(aimAngle)*speed;
const vy=Math.sin(aimAngle)*speed;

scene.matter.body.setVelocity(whiteBall,{x:vx,y:vy});
scene.matter.body.setAngularVelocity(0);
pullDistance=0;
}

function isMoving(){
if(!whiteBall) return false;
return Math.hypot(whiteBall.velocity.x,whiteBall.velocity.y)>0.05;
}

function drawBall(){
ballG.clear();
const x=whiteBall.position.x;
const y=whiteBall.position.y;

ballG.fillStyle(0x000000,0.22);
ballG.fillCircle(x+3,y+4,BALL_R+2);

ballG.fillStyle(0xf6f5f1,1);
ballG.fillCircle(x,y,BALL_R);

ballG.lineStyle(1.5,0xc7c7c7,1);
ballG.strokeCircle(x,y,BALL_R);

ballG.fillStyle(0xffffff,0.9);
ballG.fillCircle(x-4,y-4,3);
}

function drawAim(){
aimG.clear();
if(!whiteBall) return;

const x=whiteBall.position.x;
const y=whiteBall.position.y;
const dx=Math.cos(aimAngle);
const dy=Math.sin(aimAngle);

// Ziel-/Stoßlinie
aimG.lineStyle(2,0xffffff,0.82);
aimG.lineBetween(x+BALL_R+2,y,x+dx*1500,y+dy*1500);

// Präzisionsring um die Kugel
aimG.lineStyle(2,0xffffff,0.48);
aimG.strokeCircle(x,y,BALL_R+8);
aimG.strokeCircle(x,y,BALL_R+11);

// Kreuz exakt im Kugelzentrum
aimG.lineStyle(2,0xffffff,0.82);
aimG.lineBetween(x-7,y,x+7,y);
aimG.lineBetween(x,y-7,x,y+7);

// Kleine Richtungsspitze
aimG.fillStyle(0xffffff,0.9);
const tx=x+dx*(BALL_R+22),ty=y+dy*(BALL_R+22);
aimG.fillTriangle(
tx+dx*7,ty+dy*7,
tx-dy*5,ty+dx*5,
tx+dy*5,ty-dx*5
);
}

function drawCue(){
cueG.clear();
if(!whiteBall) return;

const x=whiteBall.position.x;
const y=whiteBall.position.y;
const dx=Math.cos(aimAngle);
const dy=Math.sin(aimAngle);
const backX=-dx;
const backY=-dy;

// Die Spitze bleibt IMMER außerhalb der weißen Kugel.
const tipGap=7;
const tipDistance=BALL_R+tipGap+pullDistance;
const tipX=x+backX*tipDistance;
const tipY=y+backY*tipDistance;

// Langer hochwertiger Standard-Kö
const cueLength=500;
const buttX=tipX+backX*cueLength;
const buttY=tipY+backY*cueLength;

// Schatten
cueG.lineStyle(18,0x000000,0.22);
cueG.lineBetween(buttX+5,buttY+5,tipX+5,tipY+5);

// Ahornschaft
cueG.lineStyle(9,0xd7bd91,1);
cueG.lineBetween(buttX,buttY,tipX,tipY);
cueG.lineStyle(3,0xfff2cf,0.85);
cueG.lineBetween(buttX,buttY,tipX,tipY);

// Griffbereich
const gripStart=cueLength*0.55;
const gripX=tipX+backX*gripStart;
const gripY=tipY+backY*gripStart;
cueG.lineStyle(27,0x17181c,1);
cueG.lineBetween(gripX,gripY,buttX,buttY);

// Ledergriff-Detail
cueG.lineStyle(20,0x26272c,1);
cueG.lineBetween(gripX+backX*12,gripY+backY*12,buttX-backX*12,buttY-backY*12);

// Goldene Ringe
for(let i=0;i<4;i++){
const d=gripStart+35+i*38;
const cx=tipX+backX*d;
const cy=tipY+backY*d;
cueG.lineStyle(3,0xc9a45a,1);
cueG.lineBetween(cx-dy*12,cy+dx*12,cx+dy*12,cy-dx*12);
}

// Butt-End
cueG.lineStyle(31,0x0c0d10,1);
cueG.lineBetween(buttX-backX*17,buttY-backY*17,buttX,buttY);
cueG.lineStyle(4,0xd4b15f,1);
cueG.lineBetween(buttX-backX*16,buttY-backY*16,buttX-backX*2,buttY-backY*2);

// Ferrule
const ferruleD=BALL_R+tipGap+4;
const fx=x+backX*ferruleD;
const fy=y+backY*ferruleD;
cueG.lineStyle(8,0xf5f2e9,1);
cueG.lineBetween(fx,fy,tipX,tipY);

// Tip
cueG.lineStyle(5,0x4b3025,1);
cueG.lineBetween(tipX-backX*6,tipY-backY*6,tipX,tipY);
}

function drawPower(){
uiG.clear();
if(!isPulling) return;

const x=TABLE_X-48;
const y=TABLE_Y+25;
const h=190;
const w=20;
const p=Phaser.Math.Clamp(pullDistance/MAX_PULL,0,1);

uiG.lineStyle(3,0xd4b15f,1);
uiG.strokeRoundedRect(x,y,w,h,9);

if(p>0){
uiG.fillStyle(0xe2a51a,1);
uiG.fillRoundedRect(x+3,y+h*p*0,w-6,h*p,5);
}
}

function redraw(){
drawBall();
drawAim();
drawCue();
drawPower();
}

function update(){
if(!whiteBall) return;

const v=Math.hypot(whiteBall.velocity.x,whiteBall.velocity.y);

// Nur sehr kleine Restgeschwindigkeit auf Null setzen.
// Dadurch bleibt eine saubere Gerade erhalten.
if(v<0.025){
scene.matter.body.setVelocity(whiteBall,{x:0,y:0});
scene.matter.body.setAngularVelocity(0);
}

redraw();
}
</script>
</body>
</html>
