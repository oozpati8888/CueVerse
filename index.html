<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #05070b;
touch-action: none;
}

#game {
width: 100vw;
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

canvas {
display: block;
max-width: 100vw;
max-height: 100vh;
width: 100%;
height: auto;
touch-action: none;
}
</style>
</head>

<body>

<div id="game">
<canvas id="canvas" width="1536" height="768"></canvas>
</div>

<script>
/* =========================================================
OOZ BALL
13 Kugeln + 1 weiße Kugel
6 volle + 6 gestreifte + schwarze 8
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 1536;
const H = 768;

/* ---------- TISCHBILD ---------- */

const tableImage = new Image();
tableImage.src = "ooz-table.jpg";

let imageReady = false;

tableImage.onload = () => {
imageReady = true;
draw();
};


/* ---------- MATTER PHYSICS ---------- */

const Engine = Matter.Engine;
const Bodies = Matter.Bodies;
const Body = Matter.Body;
const Composite = Matter.Composite;

const engine = Engine.create();

engine.gravity.x = 0;
engine.gravity.y = 0;

const world = engine.world;


/* ---------- SPIELFELD ---------- */

/*
Das Spielfeld liegt innerhalb des Rahmens.
Die Werte sind auf dein 1536x768 Tischbild abgestimmt.
*/

const PLAY_LEFT = 92;
const PLAY_RIGHT = 1444;
const PLAY_TOP = 94;
const PLAY_BOTTOM = 674;


/* ---------- BÄNDER ---------- */

const wallThickness = 40;

Composite.add(world, [

Bodies.rectangle(
(PLAY_LEFT + PLAY_RIGHT) / 2,
PLAY_TOP - wallThickness / 2,
PLAY_RIGHT - PLAY_LEFT,
wallThickness,
{
isStatic: true,
restitution: 0.92,
friction: 0
}
),

Bodies.rectangle(
(PLAY_LEFT + PLAY_RIGHT) / 2,
PLAY_BOTTOM + wallThickness / 2,
PLAY_RIGHT - PLAY_LEFT,
wallThickness,
{
isStatic: true,
restitution: 0.92,
friction: 0
}
),

Bodies.rectangle(
PLAY_LEFT - wallThickness / 2,
(PLAY_TOP + PLAY_BOTTOM) / 2,
wallThickness,
PLAY_BOTTOM - PLAY_TOP,
{
isStatic: true,
restitution: 0.92,
friction: 0
}
),

Bodies.rectangle(
PLAY_RIGHT + wallThickness / 2,
(PLAY_TOP + PLAY_BOTTOM) / 2,
wallThickness,
PLAY_BOTTOM - PLAY_TOP,
{
isStatic: true,
restitution: 0.92,
friction: 0
}
)

]);


/* ---------- KUGELN ---------- */

const BALL_RADIUS = 22;

const colors = {
1: "#f2d300",
2: "#2459d6",
3: "#d92323",
4: "#7d35c8",
5: "#ef5a19",
6: "#159447",

9: "#f2d300",
10: "#2459d6",
11: "#d92323",
12: "#7d35c8",
13: "#ef5a19",
14: "#159447"
};

const balls = [];


/* ---------- KUGEL ERSTELLEN ---------- */

function createBall(number, x, y) {

const ball = Bodies.circle(
x,
y,
BALL_RADIUS,
{
restitution: 0.93,
friction: 0.002,
frictionAir: 0.012,
density: 0.004,
inertia: Infinity,
label: "ball-" + number
}
);

ball.ballNumber = number;
ball.isCue = false;

Composite.add(world, ball);
balls.push(ball);

return ball;
}


/* ---------- WEISSE KUGEL ---------- */

const cueBall = Bodies.circle(
300,
384,
BALL_RADIUS,
{
restitution: 0.93,
friction: 0.002,
frictionAir: 0.010,
density: 0.004,
inertia: Infinity,
label: "cue-ball"
}
);

cueBall.ballNumber = 0;
cueBall.isCue = true;

Composite.add(world, cueBall);


/* ---------- 13 KUGELN ---------- */

/*
1
2 3
4 8 5
6 9 10 11
12 13 14

= 13 Objektkugeln
*/

const rackX = 1190;
const rackY = 384;

const gap = BALL_RADIUS * 2 + 1;
const rowStepX = gap * 0.866;

const rackPositions = [

[0, 0],

[1, -0.5],
[1, 0.5],

[2, -1],
[2, 0],
[2, 1],

[3, -1.5],
[3, -0.5],
[3, 0.5],
[3, 1.5],

[4, -1],
[4, 0],
[4, 1]

];


/*
Wir setzen die Nummern bewusst einzeln.
Die 8 bleibt in der Mitte.
*/

const rackNumbers = [
1,
2, 3,
4, 8, 5,
6, 9, 10, 11,
12, 13, 14
];

for (let i = 0; i < rackPositions.length; i++) {

const row = rackPositions[i][0];
const offset = rackPositions[i][1];

const x = rackX + row * rowStepX;
const y = rackY + offset * gap;

createBall(
rackNumbers[i],
x,
y
);
}


/* ---------- ZEICHNEN ---------- */

function drawBall(ball) {

const x = ball.position.x;
const y = ball.position.y;

/* Schatten */

ctx.beginPath();
ctx.arc(
x + 3,
y + 4,
BALL_RADIUS + 1,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fill();


/* weiße Kugel */

if (ball.isCue) {

const gradient = ctx.createRadialGradient(
x - 7,
y - 8,
2,
x,
y,
BALL_RADIUS
);

gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.65, "#eeeeee");
gradient.addColorStop(1, "#cfcfcf");

ctx.beginPath();
ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle = gradient;
ctx.fill();

ctx.strokeStyle = "#999";
ctx.lineWidth = 1;
ctx.stroke();

return;
}


const number = ball.ballNumber;

/* schwarze 8 */

if (number === 8) {

const gradient = ctx.createRadialGradient(
x - 7,
y - 8,
2,
x,
y,
BALL_RADIUS
);

gradient.addColorStop(0, "#444");
gradient.addColorStop(0.55, "#111");
gradient.addColorStop(1, "#000");

ctx.beginPath();
ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle = gradient;
ctx.fill();

drawNumber(number, x, y, true);

return;
}


const isStripe = number >= 9;

/* Grundfarbe */

ctx.beginPath();
ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle = colors[number];
ctx.fill();


/* Streifen */

if (isStripe) {

ctx.save();

ctx.beginPath();
ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.clip();

ctx.fillStyle = "#ffffff";

ctx.fillRect(
x - BALL_RADIUS,
y - 8,
BALL_RADIUS * 2,
16
);

ctx.restore();
}


/* Glanz */

const shine = ctx.createRadialGradient(
x - 7,
y - 8,
1,
x,
y,
BALL_RADIUS
);

shine.addColorStop(
0,
"rgba(255,255,255,0.75)"
);

shine.addColorStop(
0.25,
"rgba(255,255,255,0.15)"
);

shine.addColorStop(
1,
"rgba(0,0,0,0)"
);

ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI * 2
);

ctx.fillStyle = shine;
ctx.fill();


/* Nummer */

drawNumber(
number,
x,
y,
false
);
}


/* ---------- NUMMER ---------- */

function drawNumber(number, x, y, blackBall) {

const circleRadius = 8;

ctx.beginPath();

ctx.arc(
x,
y,
circleRadius,
0,
Math.PI * 2
);

ctx.fillStyle = "#ffffff";
ctx.fill();


ctx.fillStyle = "#111";

ctx.font = "bold 11px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
number,
x,
y + 0.5
);
}


/* ---------- ZIELLINIE ---------- */

let aiming = false;
let aimX = 0;
let aimY = 0;

function drawAim() {

if (!aiming) return;

const bx = cueBall.position.x;
const by = cueBall.position.y;

const dx = aimX - bx;
const dy = aimY - by;

const length = Math.sqrt(
dx * dx + dy * dy
);

if (length < 1) return;

const nx = dx / length;
const ny = dy / length;

const lineLength = 250;

ctx.beginPath();

ctx.moveTo(
bx,
by
);

ctx.lineTo(
bx + nx * lineLength,
by + ny * lineLength
);

ctx.strokeStyle =
"rgba(255,255,255,0.85)";

ctx.lineWidth = 2;

ctx.setLineDash([10, 8]);

ctx.stroke();

ctx.setLineDash([]);


/* Power-Anzeige */

const power =
Math.min(length / 220, 1);

ctx.beginPath();

ctx.arc(
bx,
by,
BALL_RADIUS + 6,
-Math.PI / 2,
-Math.PI / 2 + Math.PI * 2 * power
);

ctx.strokeStyle =
"rgba(255,215,80,0.9)";

ctx.lineWidth = 4;

ctx.stroke();
}


/* ---------- MOUSE / TOUCH ---------- */

function getPointerPosition(e) {

const rect =
canvas.getBoundingClientRect();

return {
x:
(e.clientX - rect.left)
* W / rect.width,

y:
(e.clientY - rect.top)
* H / rect.height
};
}


canvas.addEventListener(
"pointerdown",
function(e) {

const p =
getPointerPosition(e);

const dx =
p.x - cueBall.position.x;

const dy =
p.y - cueBall.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
Nur schießen wenn die weiße Kugel
fast stillsteht.
*/

const speed =
Math.sqrt(
cueBall.velocity.x *
cueBall.velocity.x +
cueBall.velocity.y *
cueBall.velocity.y
);

if (
distance < 100 &&
speed < 0.15
) {

aiming = true;

aimX = p.x;
aimY = p.y;

canvas.setPointerCapture(e.pointerId);
}
}
);


canvas.addEventListener(
"pointermove",
function(e) {

if (!aiming) return;

const p =
getPointerPosition(e);

aimX = p.x;
aimY = p.y;
}
);


canvas.addEventListener(
"pointerup",
function(e) {

if (!aiming) return;

aiming = false;

const p =
getPointerPosition(e);

const dx =
p.x - cueBall.position.x;

const dy =
p.y - cueBall.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (distance < 10) return;


/*
WICHTIG:
Gegensätzliche Richtung =
weißer Ball läuft in Richtung
der Kugeln.
*/

const nx = dx / distance;
const ny = dy / distance;


/*
DEUTLICH stärker als vorher.
*/

const power =
Math.min(distance, 260);

const FORCE =
0.00055;


Body.applyForce(
cueBall,
cueBall.position,
{
x: -nx * power * FORCE,
y: -ny * power * FORCE
}
);
}
);


/* ---------- PHYSIK ---------- */

let lastTime = performance.now();

function physicsLoop(time) {

const delta =
Math.min(
time - lastTime,
25
);

lastTime = time;

Engine.update(
engine,
delta
);


/*
Kleine Geschwindigkeiten komplett stoppen.
Dadurch rollen die Kugeln sauber aus.
*/

for (const ball of [cueBall, ...balls]) {

const vx = ball.velocity.x;
const vy = ball.velocity.y;

const speed =
Math.sqrt(
vx * vx +
vy * vy
);

if (speed < 0.025) {

Body.setVelocity(
ball,
{
x: 0,
y: 0
}
);
}
}


requestAnimationFrame(
physicsLoop
);
}


/* ---------- RENDER ---------- */

function draw() {

ctx.clearRect(
0,
0,
W,
H
);


/* Tischbild */

if (imageReady) {

ctx.drawImage(
tableImage,
0,
0,
W,
H
);

} else {

ctx.fillStyle = "#173b48";

ctx.fillRect(
0,
0,
W,
H
);
}


/* Kugeln */

drawBall(cueBall);

for (const ball of balls) {
drawBall(ball);
}


/* Ziellinie */

drawAim();

requestAnimationFrame(
draw
);
}


/* ---------- START ---------- */

requestAnimationFrame(
physicsLoop
);

requestAnimationFrame(
draw
);

</script>

</body>
</html>
