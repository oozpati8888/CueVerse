<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse – Royal Table</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

.game{
max-width:900px;
margin:auto;
min-height:100vh;
background:
radial-gradient(circle at 50% 20%,#292929 0,#101010 35%,#050505 75%);
padding:18px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.player{
font-size:14px;
color:#ddd;
}

.player strong{
display:block;
color:#e2bd55;
font-size:18px;
letter-spacing:1px;
}

.logo{
color:#e5bd55;
font-weight:bold;
font-size:22px;
letter-spacing:5px;
}

.title{
text-align:center;
color:#e4bd55;
font-weight:bold;
letter-spacing:2px;
margin:12px 0 18px;
}

.table-frame{
background:linear-gradient(135deg,#9a6b16,#e5bd55,#8b5c12);
padding:10px;
border-radius:28px;
box-shadow:0 8px 35px #000;
}

.table{
position:relative;
width:100%;
aspect-ratio:2/1;
background:
radial-gradient(circle at center,#07825d,#006b4c 55%,#004b37);
border:10px solid #191919;
border-radius:8px;
overflow:hidden;
box-shadow:
inset 0 0 25px #002d21,
inset 0 0 0 3px #765016;
}

.pocket{
position:absolute;
width:38px;
height:38px;
background:#000;
border-radius:50%;
box-shadow:inset 0 3px 5px #222;
z-index:5;
}

.p1{left:-8px;top:-8px}
.p2{left:calc(50% - 19px);top:-8px}
.p3{right:-8px;top:-8px}
.p4{left:-8px;bottom:-8px}
.p5{left:calc(50% - 19px);bottom:-8px}
.p6{right:-8px;bottom:-8px}

canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
}

.controls{
margin-top:20px;
}

label{
color:#e2bd55;
font-weight:bold;
letter-spacing:2px;
}

.power-row{
display:flex;
align-items:center;
gap:15px;
}

input[type=range]{
flex:1;
accent-color:#e2bd55;
}

.power-value{
width:55px;
text-align:right;
color:#e2bd55;
font-size:20px;
font-weight:bold;
}

.buttons{
display:flex;
gap:18px;
margin-top:20px;
}

button{
flex:1;
padding:17px;
border:0;
border-radius:15px;
background:linear-gradient(#f0cf69,#b98218);
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 15px #000;
}

button:active{
transform:scale(.98);
}

.status{
margin-top:18px;
color:#ccc;
font-size:16px;
}

.hint{
color:#777;
margin-top:10px;
font-size:13px;
}

@media(max-width:600px){
.game{padding:10px}
.logo{font-size:17px}
.player strong{font-size:15px}
.table-frame{padding:7px}
.table{border-width:7px}
.pocket{width:30px;height:30px}
.p2,.p5{margin-left:-15px}
.buttons{gap:10px}
button{font-size:14px;padding:15px 8px}
}
</style>
</head>

<body>

<div class="game">

<div class="top">
<div class="player">
<strong>ORHAN</strong>
Level 1 · 🪙 10.000
</div>

<div class="logo">CUEVERSE</div>

<div class="player" style="text-align:right">
<strong>OOZ PLAYER</strong>
Level 12 · 🪙 10.000
</div>
</div>

<div class="title">ROYAL TABLE · 100 COINS</div>

<div class="table-frame">
<div class="table">

<div class="pocket p1"></div>
<div class="pocket p2"></div>
<div class="pocket p3"></div>
<div class="pocket p4"></div>
<div class="pocket p5"></div>
<div class="pocket p6"></div>

<canvas id="pool"></canvas>

</div>
</div>

<div class="controls">

<label>SHOT POWER</label>

<div class="power-row">
<input id="power" type="range" min="10" max="100" value="65">
<div class="power-value">
<span id="powerText">65</span>%
</div>
</div>

<div class="buttons">
<button id="shoot">STOSS AUSFÜHREN</button>
<button id="restart">NEUSTART</button>
</div>

<div class="status" id="status">
Break bereit – ziele und stoße.
</div>

<div class="hint">
Auf dem Tisch ziehen = zielen · Power einstellen · Stoß ausführen
</div>

</div>

</div>

<script>
const canvas = document.getElementById("pool");
const ctx = canvas.getContext("2d");

let W,H;
let balls=[];
let aiming=true;
let angle=0;

const friction=0.985;
const stopSpeed=0.045;
const wallBounce=0.82;
const ballBounce=0.92;

const powerSlider=document.getElementById("power");
const powerText=document.getElementById("powerText");
const statusText=document.getElementById("status");

powerSlider.addEventListener("input",()=>{
powerText.textContent=powerSlider.value;
});

function resize(){
const rect=canvas.getBoundingClientRect();
W=canvas.width=rect.width;
H=canvas.height=rect.height;
resetGame();
}

function createBall(x,y,color,number){
return{
x,y,
vx:0,
vy:0,
r:Math.min(W,H)*0.027,
color,
number,
active:true
};
}

function resetGame(){
balls=[];

const r=Math.min(W,H)*0.027;

const cue=createBall(W*.18,H*.5,"white",0);
cue.r=r;
balls.push(cue);

const colors=[
"#f4c400","#174fba","#df2525","#7b3fb4",
"#f28c18","#17864b","#87251c","#111"
];

let startX=W*.73;
let startY=H*.5;
let n=1;

for(let row=0;row<5;row++){
for(let col=0;col<=row;col++){
let x=startX+row*r*1.75;
let y=startY+(col-row/2)*r*2.05;

let color=colors[(n-1)%colors.length];

balls.push(createBall(x,y,color,n));
n++;
}
}

aiming=true;
statusText.textContent="Break bereit – ziele und stoße.";
draw();
}

function drawBall(b){
if(!b.active)return;

ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);

const grad=ctx.createRadialGradient(
b.x-b.r*.35,
b.y-b.r*.35,
b.r*.1,
b.x,
b.y,
b.r
);

if(b.number===0){
grad.addColorStop(0,"#ffffff");
grad.addColorStop(.7,"#eeeeee");
grad.addColorStop(1,"#aaa");
}else{
grad.addColorStop(0,"#ffffff");
grad.addColorStop(.18,b.color);
grad.addColorStop(1,b.color);
}

ctx.fillStyle=grad;
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=1;
ctx.stroke();

if(b.number>0){
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(b.x,b.y,b.r*.42,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";
ctx.font=`bold ${Math.max(8,b.r*.75)}px Arial`;
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(b.number,b.x,b.y);
}
}

function drawAim(){
const cue=balls[0];

if(!cue.active)return;

ctx.save();

ctx.strokeStyle="rgba(255,255,255,.7)";
ctx.lineWidth=1.5;
ctx.setLineDash([7,6]);

const length=180;

ctx.beginPath();
ctx.moveTo(cue.x,cue.y);
ctx.lineTo(
cue.x+Math.cos(angle)*length,
cue.y+Math.sin(angle)*length
);
ctx.stroke();

ctx.restore();
}

function draw(){
ctx.clearRect(0,0,W,H);

balls.forEach(drawBall);

if(aiming && !moving()){
drawAim();
}
}

function moving(){
return balls.some(b=>b.active &&
Math.abs(b.vx)>stopSpeed ||
b.active && Math.abs(b.vy)>stopSpeed
);
}

function update(){
let anyMoving=false;

balls.forEach(b=>{
if(!b.active)return;

b.x+=b.vx;
b.y+=b.vy;

// Realistische Tischreibung:
b.vx*=friction;
b.vy*=friction;

// Sehr langsame Kugeln werden wirklich gestoppt.
if(Math.hypot(b.vx,b.vy)<stopSpeed){
b.vx=0;
b.vy=0;
}

// Banden
if(b.x-b.r<0){
b.x=b.r;
b.vx=Math.abs(b.vx)*wallBounce;
}

if(b.x+b.r>W){
b.x=W-b.r;
b.vx=-Math.abs(b.vx)*wallBounce;
}

if(b.y-b.r<0){
b.y=b.r;
b.vy=Math.abs(b.vy)*wallBounce;
}

if(b.y+b.r>H){
b.y=H-b.r;
b.vy=-Math.abs(b.vy)*wallBounce;
}

if(Math.abs(b.vx)>stopSpeed || Math.abs(b.vy)>stopSpeed){
anyMoving=true;
}
});

handleCollisions();

if(anyMoving){
draw();
requestAnimationFrame(update);
}else{
aiming=true;
statusText.textContent="Kugeln stehen – nächster Stoß.";
draw();
}
}

function handleCollisions(){

for(let i=0;i<balls.length;i++){

const a=balls[i];

if(!a.active)continue;

for(let j=i+1;j<balls.length;j++){

const b=balls[j];

if(!b.active)continue;

let dx=b.x-a.x;
let dy=b.y-a.y;

let dist=Math.hypot(dx,dy);
let minDist=a.r+b.r;

if(dist===0){
dx=.01;
dy=.01;
dist=.014;
}

if(dist<minDist){

const nx=dx/dist;
const ny=dy/dist;

const overlap=minDist-dist;

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;
b.x+=nx*overlap/2;
b.y+=ny*overlap/2;

const rvx=b.vx-a.vx;
const rvy=b.vy-a.vy;

const velocityAlongNormal=rvx*nx+rvy*ny;

if(velocityAlongNormal>0)continue;

const impulse=
-(1+ballBounce)*velocityAlongNormal/2;

a.vx-=impulse*nx;
a.vy-=impulse*ny;

b.vx+=impulse*nx;
b.vy+=impulse*ny;
}
}
}
}

function shoot(){

if(moving())return;

const cue=balls[0];

const power=Number(powerSlider.value);

const force=power*.22;

cue.vx=Math.cos(angle)*force;
cue.vy=Math.sin(angle)*force;

aiming=false;

statusText.textContent="Stoß läuft…";

requestAnimationFrame(update);
}

function restart(){
resetGame();
}

canvas.addEventListener("pointermove",e=>{

const rect=canvas.getBoundingClientRect();

const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

const cue=balls[0];

angle=Math.atan2(y-cue.y,x-cue.x);

if(!moving()){
draw();
}
});

canvas.addEventListener("pointerdown",e=>{

if(moving())return;

const rect=canvas.getBoundingClientRect();

const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

const cue=balls[0];

angle=Math.atan2(y-cue.y,x-cue.x);

draw();
});

document.getElementById("shoot").addEventListener("click",shoot);
document.getElementById("restart").addEventListener("click",restart);

window.addEventListener("resize",resize);

resize();
</script>

</body>
</html>
