<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101010;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

/* =====================================================
OOZ BALL
PREMIUM QUEUE / AIM SYSTEM
===================================================== */

const GAME_W = 900;
const GAME_H = 500;

const TABLE_X = 50;
const TABLE_Y = 50;

const TABLE_W = 800;
const TABLE_H = 400;

const RAIL = 24;
const POCKET_R = 24;

const BALL_R = 10;


/* =====================================================
VARIABLEN
===================================================== */

let ball;
let ballGraphic;

let aimGraphic;
let cueGraphic;
let powerGraphic;
let spinGraphic;

let dragging = false;

let aimDX = -1;
let aimDY = 0;

let shotPower = 0;


/* =====================================================
PHASER
===================================================== */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101010',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {
create: create,
update: update
}
};

new Phaser.Game(config);


/* =====================================================
CREATE
===================================================== */

function create() {

const scene = this;


/* =================================================
TISCH
================================================= */

const table = scene.add.graphics();


/* Schatten */

table.fillStyle(
0x000000,
0.45
);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
18
);


/* Außenrahmen */

table.fillStyle(
0x171717,
1
);

table.fillRoundedRect(
TABLE_X - 28,
TABLE_Y - 28,
TABLE_W + 56,
TABLE_H + 56,
16
);


/* Goldkante */

table.lineStyle(
4,
0xc9a34a,
1
);

table.strokeRoundedRect(
TABLE_X - 24,
TABLE_Y - 24,
TABLE_W + 48,
TABLE_H + 48,
13
);


/* Bande */

table.fillStyle(
0x4a2c19,
1
);

table.fillRoundedRect(
TABLE_X - 18,
TABLE_Y - 18,
TABLE_W + 36,
TABLE_H + 36,
10
);


/* Tuch */

table.fillStyle(
0x126247,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* Tuchkante */

table.lineStyle(
3,
0x0b3e30,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* =================================================
TASCHEN
================================================= */

drawPocket(scene, TABLE_X, TABLE_Y);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* =================================================
BANDEN
================================================= */

createRails(scene);


/* =================================================
WEISSE KUGEL
================================================= */

ball = scene.matter.add.circle(

TABLE_X + 200,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.94,

friction: 0.006,

frictionAir: 0.012,

density: 0.004
}
);


/* =================================================
GRAPHICS
================================================= */

ballGraphic =
scene.add.graphics();

aimGraphic =
scene.add.graphics();

cueGraphic =
scene.add.graphics();

powerGraphic =
scene.add.graphics();

spinGraphic =
scene.add.graphics();


drawBall();


/* =================================================
POINTER DOWN
================================================= */

scene.input.on(
'pointerdown',
function(pointer) {

if (!ball) {
return;
}


const speed =
Math.sqrt(
ball.velocity.x *
ball.velocity.x +

ball.velocity.y *
ball.velocity.y
);


/* Nur schießen wenn Kugel steht */

if (speed > 0.10) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance <= 55) {

dragging = true;

updateAim(
pointer.worldX,
pointer.worldY
);
}
}
);


/* =================================================
POINTER MOVE
================================================= */

scene.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

updateAim(
pointer.worldX,
pointer.worldY
);
}
);


/* =================================================
POINTER UP
================================================= */

scene.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}


dragging = false;


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


const power =
Math.min(
distance,
220
);


aimGraphic.clear();

cueGraphic.clear();

powerGraphic.clear();

spinGraphic.clear();


if (distance < 8) {
return;
}


/* Schussrichtung */

const dirX =
-dx / distance;

const dirY =
-dy / distance;


/* Stärkere Kraft */

const force =
power * 0.00013;


scene.matter.body.applyForce(

ball,

ball.position,

{
x: dirX * force,

y: dirY * force
}
);


shotPower = 0;
}
);


/* =================================================
LOGO
================================================= */

scene.add.text(

TABLE_X,

12,

'OOZ BALL',

{
fontFamily: 'Arial',

fontSize: '24px',

fontStyle: 'bold',

color: '#d6b15a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 120,

16,

'8 BALL',

{
fontFamily: 'Arial',

fontSize: '14px',

color: '#ffffff',

alpha: 0.65
}
);
}


/* =====================================================
AIM
===================================================== */

function updateAim(
mouseX,
mouseY
) {

const dx =
mouseX -
ball.position.x;

const dy =
mouseY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance < 1) {
return;
}


/* Richtung nach hinten */

const backX =
dx / distance;

const backY =
dy / distance;


/* Schussrichtung */

aimDX =
-backX;

aimDY =
-backY;


shotPower =
Math.min(
distance,
220
);


drawAim();

drawCue();

drawPower();

drawSpin();
}


/* =====================================================
ZIELLINIE
===================================================== */

function drawAim() {

aimGraphic.clear();


const startX =
ball.position.x;

const startY =
ball.position.y;


const lineLength =
700;


const endX =
startX +
aimDX *
lineLength;

const endY =
startY +
aimDY *
lineLength;


/* Schatten */

aimGraphic.lineStyle(
4,
0x000000,
0.22
);

aimGraphic.beginPath();

aimGraphic.moveTo(
startX,
startY
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Präzise weiße Linie */

aimGraphic.lineStyle(
1.5,
0xffffff,
0.95
);

aimGraphic.beginPath();

aimGraphic.moveTo(
startX,
startY
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Mittelpunkt-Ring */

aimGraphic.lineStyle(
1,
0xffffff,
0.85
);

aimGraphic.strokeCircle(
startX,
startY,
BALL_R + 5
);
}


/* =====================================================
PREMIUM QUEUE
===================================================== */

function drawCue() {

cueGraphic.clear();


if (!dragging) {
return;
}


const centerX =
ball.position.x;

const centerY =
ball.position.y;


/* =================================================
WICHTIG:

Queue-Spitze befindet sich NICHT
im Mittelpunkt der Kugel.

Sie endet knapp VOR der Kugel.
================================================= */

const TIP_GAP = 3;


const tipDistance =
BALL_R +
TIP_GAP;


const tipX =
centerX -
aimDX *
tipDistance;

const tipY =
centerY -
aimDY *
tipDistance;


/* Langer Queue */

const cueLength =
290 +
shotPower * 0.75;


const buttX =
tipX -
aimDX *
cueLength;

const buttY =
tipY -
aimDY *
cueLength;


/* =================================================
QUEUE SCHATTEN
================================================= */

cueGraphic.lineStyle(
11,
0x000000,
0.32
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =================================================
HOLZSCHAFT
================================================= */

cueGraphic.lineStyle(
7,
0xb87932,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* heller Mittelstreifen */

cueGraphic.lineStyle(
2,
0xffe0a0,
0.95
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =================================================
QUEUE-SPITZE
================================================= */

cueGraphic.fillStyle(
0xf4f0df,
1
);

cueGraphic.fillCircle(
tipX,
tipY,
2.2
);


/* =================================================
JOINT
================================================= */

const jointDistance =
cueLength * 0.28;


const jointX =
tipX -
aimDX *
jointDistance;

const jointY =
tipY -
aimDY *
jointDistance;


cueGraphic.lineStyle(
8,
0x7b4825,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
jointX,
jointY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =================================================
GRIFF
================================================= */

const gripStart =
cueLength * 0.68;


const gripX =
tipX -
aimDX *
gripStart;

const gripY =
tipY -
aimDY *
gripStart;


cueGraphic.lineStyle(
9,
0x171717,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
gripX,
gripY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =================================================
GOLDDETAILS
================================================= */

for (
let i = 0;
i < 5;
i++
) {

const p =
0.70 +
i * 0.055;


const ringX =
tipX -
aimDX *
cueLength *
p;

const ringY =
tipY -
aimDY *
cueLength *
p;


cueGraphic.fillStyle(
0xd3aa4d,
1
);

cueGraphic.fillCircle(
ringX,
ringY,
1.8
);
}


/* =================================================
BUTT-KAPPE
================================================= */

cueGraphic.fillStyle(
0xc9a34a,
1
);

cueGraphic.fillCircle(
buttX,
buttY,
4
);
}


/* =====================================================
POWER
===================================================== */

function drawPower() {

powerGraphic.clear();


if (!dragging) {
return;
}


const x = 20;
const y = 120;

const width = 18;
const height = 170;


powerGraphic.fillStyle(
0x151515,
1
);

powerGraphic.fillRoundedRect(
x,
y,
width,
height,
7
);


const fillHeight =
height *
(shotPower / 220);


powerGraphic.fillStyle(
0xc9a34a,
1
);

powerGraphic.fillRoundedRect(

x + 4,

y +
height -
fillHeight +
4,

width - 8,

Math.max(
2,
fillHeight - 8
),

4
);
}


/* =====================================================
SPIN / EFFET
===================================================== */

function drawSpin() {

spinGraphic.clear();


if (!dragging) {
return;
}


const x =
ball.position.x;

const y =
ball.position.y;


/* kleiner Effet-Kreis */

spinGraphic.lineStyle(
1.5,
0xffffff,
0.45
);

spinGraphic.strokeCircle(
x,
y,
BALL_R + 9
);


/* Mittelpunkt */

spinGraphic.fillStyle(
0xffffff,
0.8
);

spinGraphic.fillCircle(
x,
y,
1.5
);
}


/* =====================================================
POCKET
===================================================== */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();


g.fillStyle(
0x0b0b0b,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x292929,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* =====================================================
RAILS
===================================================== */

function createRails(scene) {

const gap =
POCKET_R * 2.2;

const mid =
TABLE_W / 2;


/* OBEN */

addRail(
scene,
TABLE_X +
(mid - gap) / 2,
TABLE_Y -
RAIL / 2,
mid - gap,
RAIL
);


addRail(
scene,
TABLE_X +
mid +
(mid - gap) / 2,
TABLE_Y -
RAIL / 2,
mid - gap,
RAIL
);


/* UNTEN */

addRail(
scene,
TABLE_X +
(mid - gap) / 2,
TABLE_Y +
TABLE_H +
RAIL / 2,
mid - gap,
RAIL
);


addRail(
scene,
TABLE_X +
mid +
(mid - gap) / 2,
TABLE_Y +
TABLE_H +
RAIL / 2,
mid - gap,
RAIL
);


/* SEITEN */

const sideLength =
TABLE_H / 2 -
gap;


addRail(
scene,
TABLE_X -
RAIL / 2,
TABLE_Y +
sideLength / 2,
RAIL,
sideLength
);


addRail(
scene,
TABLE_X -
RAIL / 2,
TABLE_Y +
TABLE_H -
sideLength / 2,
RAIL,
sideLength
);


addRail(
scene,
TABLE_X +
TABLE_W +
RAIL / 2,
TABLE_Y +
sideLength / 2,
RAIL,
sideLength
);


addRail(
scene,
TABLE_X +
TABLE_W +
RAIL / 2,
TABLE_Y +
TABLE_H -
sideLength / 2,
RAIL,
sideLength
);
}


/* =====================================================
MATTER RAIL
===================================================== */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,
y,
width,
height,

{
isStatic: true,

restitution: 0.95,

friction: 0
}
);
}


/* =====================================================
BALL
===================================================== */

function drawBall() {

ballGraphic.clear();


/* Schatten */

ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(

ball.position.x + 2,

ball.position.y + 2,

BALL_R + 2
);


/* Kugel */

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/* Glanz */

ballGraphic.fillStyle(
0xeaf4ff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

2
);
}


/* =====================================================
UPDATE
===================================================== */

function update() {

if (!ball) {
return;
}


drawBall();


if (!dragging) {

cueGraphic.clear();

aimGraphic.clear();

powerGraphic.clear();

spinGraphic.clear();
}
}

</script>

</body>
</html>
