<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #07101b;
font-family: Arial, sans-serif;
}

#game {
width: 100%;
height: 100%;
}

canvas {
display: block;
touch-action: none;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>

<body>

<div id="game"></div>

<script>

/* =========================================================
OOZ BALL
MATHEMATISCHES CUE-SYSTEM
========================================================= */

const TABLE_W = 1000;
const TABLE_H = 500;

const TABLE_X = 90;
const TABLE_Y = 100;

const BALL_R = 13;

/* Geschwindigkeit */
const MAX_SHOT_SPEED = 17;

/* wie weit der Kö maximal zurückgezogen werden kann */
const MAX_PULL = 260;

/* Reibung */
const BALL_FRICTION_AIR = 0.006;

/* Bande */
const RAIL_RESTITUTION = 0.96;


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

parent: "game",

width: TABLE_W + TABLE_X * 2,
height: TABLE_H + TABLE_Y * 2,

backgroundColor: "#07101b",

scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},

physics: {
default: "matter",

matter: {
gravity: {
x: 0,
y: 0
},

enableSleeping: true,

positionIterations: 10,
velocityIterations: 10,
constraintIterations: 4
}
},

scene: {
preload: preload,
create: create,
update: update
}
};

new Phaser.Game(config);


/* =========================================================
VARIABLEN
========================================================= */

let scene;

let whiteBall;

let tableGraphics;
let aimGraphics;
let cueGraphics;
let spinGraphics;

let aiming = false;
let shooting = false;

let aimAngle = 0;

let pullDistance = 0;

let pointerX = 0;
let pointerY = 0;

let startPointerX = 0;
let startPointerY = 0;


/* =========================================================
PRELOAD
========================================================= */

function preload() {
}


/* =========================================================
CREATE
========================================================= */

function create() {

scene = this;

drawTable();

createRails();

createWhiteBall();

createGraphics();

createInput();

drawEverything();
}


/* =========================================================
TISCH
========================================================= */

function drawTable() {

tableGraphics = scene.add.graphics();

/* Außenrahmen */

tableGraphics.fillStyle(0x141b25, 1);

tableGraphics.fillRoundedRect(
TABLE_X - 35,
TABLE_Y - 35,
TABLE_W + 70,
TABLE_H + 70,
30
);


/* Goldener Rahmen */

tableGraphics.lineStyle(
5,
0xc9a45a,
1
);

tableGraphics.strokeRoundedRect(
TABLE_X - 22,
TABLE_Y - 22,
TABLE_W + 44,
TABLE_H + 44,
22
);


/* Holz */

tableGraphics.fillStyle(
0x511d18,
1
);

tableGraphics.fillRoundedRect(
TABLE_X - 12,
TABLE_Y - 12,
TABLE_W + 24,
TABLE_H + 24,
18
);


/* Spielfläche */

tableGraphics.fillStyle(
0x087f87,
1
);

tableGraphics.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* leichter innerer Rand */

tableGraphics.lineStyle(
3,
0x64d7d2,
0.7
);

tableGraphics.strokeRect(
TABLE_X + 5,
TABLE_Y + 5,
TABLE_W - 10,
TABLE_H - 10
);


/* Logo */

const logo = scene.add.text(
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H / 2,
"OOZ BALL",
{
fontFamily: "Arial",
fontSize: "64px",
fontStyle: "bold",
color: "#ffffff",
alpha: 0.10
}
);

logo.setOrigin(0.5);


/* Taschen */

const pockets = [
[TABLE_X, TABLE_Y],
[TABLE_X + TABLE_W / 2, TABLE_Y],
[TABLE_X + TABLE_W, TABLE_Y],

[TABLE_X, TABLE_Y + TABLE_H],
[TABLE_X + TABLE_W / 2, TABLE_Y + TABLE_H],
[TABLE_X + TABLE_W, TABLE_Y + TABLE_H]
];

for (const p of pockets) {

tableGraphics.fillStyle(
0x05070a,
1
);

tableGraphics.fillCircle(
p[0],
p[1],
28
);

tableGraphics.lineStyle(
3,
0x263442,
1
);

tableGraphics.strokeCircle(
p[0],
p[1],
28
);
}


/* Titel */

scene.add.text(
TABLE_X,
TABLE_Y - 70,
"OOZ BALL",
{
fontFamily: "Arial",
fontSize: "30px",
fontStyle: "bold",
color: "#e8c77d"
}
);

scene.add.text(
TABLE_X + TABLE_W - 90,
TABLE_Y - 67,
"8 BALL",
{
fontFamily: "Arial",
fontSize: "18px",
fontStyle: "bold",
color: "#e8c77d"
}
);
}


/* =========================================================
Banden
========================================================= */

function createRails() {

const thickness = 18;


/* oben */

scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y - thickness / 2,
TABLE_W,
thickness,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0
}
);


/* unten */

scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H + thickness / 2,
TABLE_W,
thickness,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0
}
);


/* links */

scene.matter.add.rectangle(
TABLE_X - thickness / 2,
TABLE_Y + TABLE_H / 2,
thickness,
TABLE_H,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0
}
);


/* rechts */

scene.matter.add.rectangle(
TABLE_X + TABLE_W + thickness / 2,
TABLE_Y + TABLE_H / 2,
thickness,
TABLE_H,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0
}
);
}


/* =========================================================
WEISSE KUGEL
========================================================= */

function createWhiteBall() {

const x = TABLE_X + TABLE_W * 0.32;
const y = TABLE_Y + TABLE_H * 0.50;

whiteBall = scene.matter.add.circle(
x,
y,
BALL_R,
{
restitution: 0.90,

friction: 0.002,

frictionStatic: 0,

frictionAir: BALL_FRICTION_AIR,

density: 0.004,

slop: 0.001,

sleepThreshold: 10
}
);
}


/* =========================================================
GRAPHICS
========================================================= */

function createGraphics() {

aimGraphics = scene.add.graphics();

cueGraphics = scene.add.graphics();

spinGraphics = scene.add.graphics();
}


/* =========================================================
INPUT
========================================================= */

function createInput() {

scene.input.on(
"pointermove",
function(pointer) {

pointerX = pointer.worldX;
pointerY = pointer.worldY;

if (shooting) {
return;
}

updateAim();
}
);


scene.input.on(
"pointerdown",
function(pointer) {

if (!whiteBall) {
return;
}

if (isBallMoving()) {
return;
}

pointerX = pointer.worldX;
pointerY = pointer.worldY;

updateAim();


/*
* Jetzt beginnt das Zurückziehen.
*
* Der Spieler zieht NICHT die Kugel.
* Er zieht ausschließlich den Kö zurück.
*/

aiming = true;

startPointerX = pointerX;
startPointerY = pointerY;

pullDistance = 0;
}
);


scene.input.on(
"pointermove",
function(pointer) {

if (!aiming) {
return;
}

pointerX = pointer.worldX;
pointerY = pointer.worldY;

updatePull();
}
);


scene.input.on(
"pointerup",
function() {

if (!aiming) {
return;
}

aiming = false;

shoot();
}
);
}


/* =========================================================
ZIELRICHTUNG
========================================================= */

function updateAim() {

if (!whiteBall) {
return;
}

const dx =
pointerX - whiteBall.position.x;

const dy =
pointerY - whiteBall.position.y;


if (Math.abs(dx) < 0.001 &&
Math.abs(dy) < 0.001) {

return;
}


/*
* Winkel vom Ball zum Mauszeiger.
*
* Der Kö liegt auf der entgegengesetzten Seite.
*/

aimAngle = Math.atan2(
dy,
dx
);
}


/* =========================================================
KÖ ZURÜCKZIEHEN
========================================================= */

function updatePull() {

/*
* Richtung nach hinten:
*
* genau entgegengesetzt zur Stoßrichtung.
*/

const dx =
pointerX - startPointerX;

const dy =
pointerY - startPointerY;


/*
* Projektion auf die Kö-Achse.
*
* Dadurch kann der Kö sauber nur
* entlang seiner eigenen Achse gezogen werden.
*/

const axisX = -Math.cos(aimAngle);
const axisY = -Math.sin(aimAngle);


let distance =
dx * axisX +
dy * axisY;


distance =
Phaser.Math.Clamp(
distance,
0,
MAX_PULL
);


pullDistance = distance;
}


/* =========================================================
STOß
========================================================= */

function shoot() {

if (isBallMoving()) {
return;
}


/*
* Keine Kraft = kein Stoß
*/

if (pullDistance < 5) {

pullDistance = 0;

return;
}


/*
* Pull-Distance -> Geschwindigkeit
*/

const power =
pullDistance / MAX_PULL;


const speed =
power * MAX_SHOT_SPEED;


/*
* EXAKTE STOßRICHTUNG
*
* Der Ball bewegt sich genau entlang
* der Zielachse.
*/

const velocityX =
Math.cos(aimAngle) * speed;

const velocityY =
Math.sin(aimAngle) * speed;


/*
* Alte Bewegung vollständig löschen.
*
* Dadurch entstehen keine alten
* seitlichen Geschwindigkeiten.
*/

scene.matter.body.setVelocity(
whiteBall,
{
x: 0,
y: 0
}
);


/*
* Exakte Geschwindigkeit setzen.
*/

scene.matter.body.setVelocity(
whiteBall,
{
x: velocityX,
y: velocityY
}
);


pullDistance = 0;

shooting = true;


scene.time.delayedCall(
120,
function() {
shooting = false;
}
);
}


/* =========================================================
BEWEGT SICH DER BALL?
========================================================= */

function isBallMoving() {

if (!whiteBall) {
return false;
}

const vx =
whiteBall.velocity.x;

const vy =
whiteBall.velocity.y;

return Math.sqrt(
vx * vx +
vy * vy
) > 0.08;
}


/* =========================================================
ZEICHNEN
========================================================= */

function drawEverything() {

drawAim();

drawCue();

drawSpinMarker();
}


/* =========================================================
ZIELLINIE
========================================================= */

function drawAim() {

aimGraphics.clear();


if (!whiteBall) {
return;
}


/*
* Die Linie startet exakt
* am Mittelpunkt der weißen Kugel.
*/

const startX =
whiteBall.position.x;

const startY =
whiteBall.position.y;


const lineLength = 1300;


const endX =
startX +
Math.cos(aimAngle) *
lineLength;

const endY =
startY +
Math.sin(aimAngle) *
lineLength;


/*
* Haupt-Ziellinie
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.82
);

aimGraphics.beginPath();

aimGraphics.moveTo(
startX,
startY
);

aimGraphics.lineTo(
endX,
endY
);

aimGraphics.strokePath();


/*
* Mittelpunkt der Kugel
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.35
);

aimGraphics.strokeCircle(
startX,
startY,
BALL_R + 6
);


/*
* Mittelpunkt-Markierung
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.8
);

aimGraphics.beginPath();

aimGraphics.moveTo(
startX - 9,
startY
);

aimGraphics.lineTo(
startX + 9,
startY
);

aimGraphics.moveTo(
startX,
startY - 9
);

aimGraphics.lineTo(
startX,
startY + 9
);

aimGraphics.strokePath();
}


/* =========================================================
PREMIUM KÖ
========================================================= */

function drawCue() {

cueGraphics.clear();


if (!whiteBall) {
return;
}


/*
* Stoßrichtung:
* Ball bewegt sich in aimAngle.
*/

const dirX =
Math.cos(aimAngle);

const dirY =
Math.sin(aimAngle);


/*
* Rückwärtsrichtung des Kö.
*/

const backX = -dirX;
const backY = -dirY;


/*
* Die Spitze liegt NICHT im Ball.
*
* Sie endet exakt an der Kugeloberfläche.
*/

const tipGap = 2;

const tipDistance =
BALL_R + tipGap + pullDistance;


const tipX =
whiteBall.position.x -
dirX * tipDistance;

const tipY =
whiteBall.position.y -
dirY * tipDistance;


/*
* Länge des Kö.
*/

const cueLength = 390;


const buttX =
tipX -
dirX * cueLength;

const buttY =
tipY -
dirY * cueLength;


/*
* Schatten
*/

cueGraphics.lineStyle(
10,
0x000000,
0.25
);

cueGraphics.beginPath();

cueGraphics.moveTo(
buttX + 3,
buttY + 5
);

cueGraphics.lineTo(
tipX + 3,
tipY + 5
);

cueGraphics.strokePath();


/*
* Schaft
*/

cueGraphics.lineStyle(
6,
0xe8d2a0,
1
);

cueGraphics.beginPath();

cueGraphics.moveTo(
buttX,
buttY
);

cueGraphics.lineTo(
tipX,
tipY
);

cueGraphics.strokePath();


/*
* dunkler Griffbereich
*/

const gripStart =
cueLength * 0.62;


const gripX =
tipX -
dirX * gripStart;

const gripY =
tipY -
dirY * gripStart;


cueGraphics.lineStyle(
18,
0x191b20,
1
);

cueGraphics.beginPath();

cueGraphics.moveTo(
gripX,
gripY
);

cueGraphics.lineTo(
buttX,
buttY
);

cueGraphics.strokePath();


/*
* Goldene Zierlinien
*/

for (let i = 0; i < 4; i++) {

const d =
gripStart +
i * 38;

const x =
tipX -
dirX * d;

const y =
tipY -
dirY * d;


cueGraphics.lineStyle(
2,
0xc9a45a,
0.9
);

cueGraphics.beginPath();

cueGraphics.moveTo(
x - backX * 8,
y - backY * 8
);

cueGraphics.lineTo(
x + backX * 8,
y + backY * 8
);

cueGraphics.strokePath();
}


/*
* Ferrule
*/

const ferruleDistance =
tipDistance + 8;


const ferruleX =
whiteBall.position.x -
dirX * ferruleDistance;

const ferruleY =
whiteBall.position.y -
dirY * ferruleDistance;


cueGraphics.lineStyle(
7,
0xffffff,
1
);

cueGraphics.beginPath();

cueGraphics.moveTo(
ferruleX,
ferruleY
);

cueGraphics.lineTo(
tipX,
tipY
);

cueGraphics.strokePath();


/*
* Leder-Spitze
*/

cueGraphics.lineStyle(
5,
0x4d3428,
1
);

cueGraphics.beginPath();

cueGraphics.moveTo(
tipX - dirX * 8,
tipY - dirY * 8
);

cueGraphics.lineTo(
tipX,
tipY
);

cueGraphics.strokePath();


/*
* WICHTIG:
*
* Die Spitze befindet sich mathematisch
* auf der Oberfläche der Kugel.
*
* Deshalb sieht der Kö nicht mehr so aus,
* als würde er IN der Kugel stecken.
*/
}


/* =========================================================
SPIN / EFFE
========================================================= */

function drawSpinMarker() {

spinGraphics.clear();


if (!whiteBall) {
return;
}


/*
* kleiner Zielpunkt auf der weißen Kugel.
*
* Später können wir ihn verschieben:
* oben = Rückwärts-/Topspin
* unten = Backspin
* links = Links-Effet
* rechts = Rechts-Effet
*/

spinGraphics.fillStyle(
0xffffff,
0.9
);

spinGraphics.fillCircle(
whiteBall.position.x,
whiteBall.position.y,
2
);
}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!whiteBall) {
return;
}


/*
* Sehr kleine Restgeschwindigkeiten
* werden auf 0 gesetzt.
*
* Dadurch bleibt die Kugel sauber stehen
* und kriecht nicht ewig weiter.
*/

const vx =
whiteBall.velocity.x;

const vy =
whiteBall.velocity.y;


const speed =
Math.sqrt(
vx * vx +
vy * vy
);


if (speed < 0.035) {

scene.matter.body.setVelocity(
whiteBall,
{
x: 0,
y: 0
}
);
}


/*
* Zeichnung immer aktualisieren.
*/

drawEverything();
}

</script>

</body>
</html>
