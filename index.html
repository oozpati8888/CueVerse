<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #080b12;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

/* =====================================================
OOZ BALL
QUEUE SYSTEM
===================================================== */

const GAME_W = 1000;
const GAME_H = 560;

const TABLE_X = 90;
const TABLE_Y = 80;

const TABLE_W = 820;
const TABLE_H = 410;

const BALL_R = 12;

const POCKET_R = 25;

const RAIL = 22;


/* =====================================================
VARIABLES
===================================================== */

let ball;
let ballGraphic;

let aimGraphic;
let cueGraphic;
let powerGraphic;

let aiming = false;

let shotDirection = {
x: 1,
y: 0
};

let pullDistance = 0;

const MAX_PULL = 190;

const CUE_LENGTH = 250;

const CUE_TIP_GAP = 3;


/* =====================================================
PHASER
===================================================== */

const config = {

type: Phaser.AUTO,

width: GAME_W,

height: GAME_H,

backgroundColor: '#080b12',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {

create: create,

update: update
}
};

new Phaser.Game(config);


/* =====================================================
CREATE
===================================================== */

function create() {

const scene = this;


/* =================================================
TABLE
================================================= */

const table = scene.add.graphics();


/* Schatten */

table.fillStyle(
0x000000,
0.45
);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
20
);


/* Außenrahmen */

table.fillStyle(
0x171717,
1
);

table.fillRoundedRect(
TABLE_X - 27,
TABLE_Y - 27,
TABLE_W + 54,
TABLE_H + 54,
16
);


/* Goldkante */

table.lineStyle(
4,
0xd4ad55,
1
);

table.strokeRoundedRect(
TABLE_X - 22,
TABLE_Y - 22,
TABLE_W + 44,
TABLE_H + 44,
13
);


/* Bande */

table.fillStyle(
0x452719,
1
);

table.fillRoundedRect(
TABLE_X - 17,
TABLE_Y - 17,
TABLE_W + 34,
TABLE_H + 34,
10
);


/* Tuch */

table.fillStyle(
0x08705a,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* leichte Tuchkante */

table.lineStyle(
3,
0x075541,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* =================================================
POCKETS
================================================= */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* =================================================
RAILS
================================================= */

createRails(scene);


/* =================================================
WHITE BALL
================================================= */

ball = scene.matter.add.circle(

TABLE_X + 230,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.94,

friction: 0.005,

frictionAir: 0.008,

density: 0.002
}
);


/* Kugelgrafik */

ballGraphic =
scene.add.graphics();


drawBall();


/* =================================================
AIM
================================================= */

aimGraphic =
scene.add.graphics();


/* =================================================
QUEUE
================================================= */

cueGraphic =
scene.add.graphics();


/* =================================================
POWER
================================================= */

powerGraphic =
scene.add.graphics();


drawPowerBar();


/* =================================================
INPUT
================================================= */

scene.input.on(
'pointerdown',
function(pointer) {

if (isMoving()) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
* Der Spieler kann in der Nähe
* der weißen Kugel beginnen.
*/

if (distance < 100) {

aiming = true;

updateAim(pointer);
}
}
);


scene.input.on(
'pointermove',
function(pointer) {

if (!aiming) {
return;
}

updateAim(pointer);
}
);


scene.input.on(
'pointerup',
function(pointer) {

if (!aiming) {
return;
}

aiming = false;

shoot();

}
);


/* =================================================
LOGO
================================================= */

scene.add.text(

TABLE_X,

30,

'OOZ BALL',

{
fontFamily: 'Arial',

fontSize: '25px',

fontStyle: 'bold',

color: '#d8b45c'
}
);


scene.add.text(

TABLE_X + TABLE_W - 70,

34,

'8 BALL',

{
fontFamily: 'Arial',

fontSize: '14px',

fontStyle: 'bold',

color: '#ffffff',

alpha: 0.65
}
);
}


/* =====================================================
AIM SYSTEM
===================================================== */

function updateAim(pointer) {

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance < 1) {
return;
}


/*
* Richtung vom Maus/Fingerpunkt
* zur Kugel.
*
* Das ist die Schussrichtung.
*/

shotDirection.x =
-dx / distance;

shotDirection.y =
-dy / distance;


/*
* Abstand, wie weit der Queue
* zurückgezogen wurde.
*/

pullDistance =
Math.min(
distance,
MAX_PULL
);


drawAim();

drawCue();

drawPowerBar();
}


/* =====================================================
AIM LINE
===================================================== */

function drawAim() {

aimGraphic.clear();


const lineLength = 520;


const endX =
ball.position.x +
shotDirection.x *
lineLength;


const endY =
ball.position.y +
shotDirection.y *
lineLength;


/* äußere Linie */

aimGraphic.lineStyle(
5,
0x000000,
0.35
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Hauptlinie */

aimGraphic.lineStyle(
2,
0xffffff,
0.92
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Zielkreis */

aimGraphic.lineStyle(
2,
0xffffff,
0.8
);

aimGraphic.strokeCircle(
ball.position.x,
ball.position.y,
22
);


aimGraphic.lineStyle(
1,
0xffffff,
0.45
);

aimGraphic.strokeCircle(
ball.position.x,
ball.position.y,
17
);
}


/* =====================================================
PREMIUM QUEUE
===================================================== */

function drawCue() {

cueGraphic.clear();


/*
* Queue-Spitze befindet sich IMMER
* hinter der Kugel.
*/

const tipX =
ball.position.x -
shotDirection.x *
(BALL_R + CUE_TIP_GAP + pullDistance);


const tipY =
ball.position.y -
shotDirection.y *
(BALL_R + CUE_TIP_GAP + pullDistance);


/*
* Queue-Ende
*/

const buttX =
tipX -
shotDirection.x *
CUE_LENGTH;


const buttY =
tipY -
shotDirection.y *
CUE_LENGTH;


/*
* Winkel
*/

const angle =
Math.atan2(
shotDirection.y,
shotDirection.x
);


/*
* Quer-Vektor
*/

const nx =
-Math.sin(angle);

const ny =
Math.cos(angle);


/* =================================================
QUEUE SHADOW
================================================= */

cueGraphic.lineStyle(
12,
0x000000,
0.28
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX + nx * 2,
buttY + ny * 2
);

cueGraphic.lineTo(
tipX + nx * 2,
tipY + ny * 2
);

cueGraphic.strokePath();


/* =================================================
SHAFT
================================================= */

cueGraphic.lineStyle(
7,
0xe5c79a,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX,
buttY
);

cueGraphic.lineTo(
tipX,
tipY
);

cueGraphic.strokePath();


/* heller Mittelstreifen */

cueGraphic.lineStyle(
2,
0xffffff,
0.65
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX + nx * 2,
buttY + ny * 2
);

cueGraphic.lineTo(
tipX + nx * 2,
tipY + ny * 2
);

cueGraphic.strokePath();


/* =================================================
FERRULE
================================================= */

const ferruleStartX =
tipX -
shotDirection.x * 18;

const ferruleStartY =
tipY -
shotDirection.y * 18;


cueGraphic.lineStyle(
8,
0xf2f2e8,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
ferruleStartX,
ferruleStartY
);

cueGraphic.lineTo(
tipX,
tipY
);

cueGraphic.strokePath();


/* =================================================
TIP
================================================= */

cueGraphic.lineStyle(
5,
0x29313c,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
tipX +
shotDirection.x * 5,

tipY +
shotDirection.y * 5
);

cueGraphic.strokePath();


/* =================================================
BUTT CAP
================================================= */

cueGraphic.lineStyle(
11,
0x181b20,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX -
shotDirection.x * 4,

buttY -
shotDirection.y * 4
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* gold ring */

const ringX =
buttX +
shotDirection.x * 22;

const ringY =
buttY +
shotDirection.y * 22;


cueGraphic.lineStyle(
3,
0xd4ad55,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
ringX + nx * 7,
ringY + ny * 7
);

cueGraphic.lineTo(
ringX - nx * 7,
ringY - ny * 7
);

cueGraphic.strokePath();
}


/* =====================================================
POWER BAR
===================================================== */

function drawPowerBar() {

powerGraphic.clear();


const x = 30;

const y = TABLE_Y;

const w = 20;

const h = TABLE_H;


/* Rahmen */

powerGraphic.fillStyle(
0x171717,
1
);

powerGraphic.fillRoundedRect(
x,
y,
w,
h,
8
);


/* Goldrahmen */

powerGraphic.lineStyle(
2,
0xd4ad55,
1
);

powerGraphic.strokeRoundedRect(
x,
y,
w,
h,
8
);


const amount =
pullDistance /
MAX_PULL;


const fill =
h *
amount;


if (fill > 0) {

powerGraphic.fillStyle(
0xd4ad55,
1
);

powerGraphic.fillRect(

x + 4,

y + h - fill - 4,

w - 8,

fill
);
}
}


/* =====================================================
SHOOT
===================================================== */

function shoot() {

if (pullDistance < 8) {

drawCue();

return;
}


/*
* Queue verschwindet beim Stoß.
*/

cueGraphic.clear();


aimGraphic.clear();


/*
* Geschwindigkeit.
*
* Deutlich schneller als vorher.
*/

const minSpeed = 3.5;

const maxSpeed = 20;


const strength =
pullDistance /
MAX_PULL;


const speed =
minSpeed +
(maxSpeed - minSpeed) *
strength;


/*
* Direkte Geschwindigkeit
* für sauberes Pool-Gefühl.
*/

thisMatterSetVelocity(
speed
);


pullDistance = 0;

drawPowerBar();
}


/* =====================================================
SET VELOCITY
===================================================== */

function thisMatterSetVelocity(speed) {

Phaser.Physics.Matter.Matter.Body.setVelocity(

ball,

{
x:
shotDirection.x *
speed,

y:
shotDirection.y *
speed
}
);
}


/* =====================================================
BALL
===================================================== */

function drawBall() {

ballGraphic.clear();


/* Schatten */

ballGraphic.fillStyle(
0x000000,
0.28
);

ballGraphic.fillCircle(

ball.position.x + 3,

ball.position.y + 3,

BALL_R + 2
);


/* Kugel */

ballGraphic.fillStyle(
0xf4f4f4,
1
);

ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/* Highlight */

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

3
);
}


/* =====================================================
POCKET
===================================================== */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();


g.fillStyle(
0x050505,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x303030,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* =====================================================
RAILS
===================================================== */

function createRails(scene) {

const gap =
POCKET_R * 2.3;


const half =
TABLE_W / 2;


/* TOP */

addRail(

scene,

TABLE_X +
(half - gap) / 2,

TABLE_Y - RAIL / 2,

half - gap,

RAIL
);


addRail(

scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y - RAIL / 2,

half - gap,

RAIL
);


/* BOTTOM */

addRail(

scene,

TABLE_X +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


addRail(

scene,

TABLE_X +
half +
(half - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

half - gap,

RAIL
);


/* LEFT */

const side =
TABLE_H / 2 -
gap;


addRail(

scene,

TABLE_X - RAIL / 2,

TABLE_Y +
side / 2,

RAIL,

side
);


addRail(

scene,

TABLE_X - RAIL / 2,

TABLE_Y +
TABLE_H -
side / 2,

RAIL,

side
);


/* RIGHT */

addRail(

scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
side / 2,

RAIL,

side
);


addRail(

scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
TABLE_H -
side / 2,

RAIL,

side
);
}


/* =====================================================
MATTER RAIL
===================================================== */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,

y,

width,

height,

{

isStatic: true,

restitution: 0.96,

friction: 0
}
);
}


/* =====================================================
MOVING?
===================================================== */

function isMoving() {

if (!ball) {
return false;
}


const vx =
ball.velocity.x;

const vy =
ball.velocity.y;


return Math.sqrt(
vx * vx +
vy * vy
) > 0.15;
}


/* =====================================================
UPDATE
===================================================== */

function update() {

if (!ball) {
return;
}


drawBall();


/*
* Queue nur anzeigen,
* wenn wir gerade zielen.
*/

if (aiming) {

drawCue();

}
}

</script>

</body>
</html>
