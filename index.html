<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse OOZ Ball</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: Arial, Helvetica, sans-serif;
background:
radial-gradient(circle at 50% 35%, #243b52 0%, #0a121c 75%);
color: white;
user-select: none;
-webkit-user-select: none;
}

body {
display: flex;
align-items: center;
justify-content: center;
}

.game {
width: min(1120px, 97vw);
display: flex;
flex-direction: column;
align-items: center;
}

/* ================= TOP BAR ================= */

.topbar {
width: 100%;
height: 68px;
margin-bottom: 18px;
padding: 8px 20px;

display: flex;
align-items: center;
justify-content: space-between;

border-radius: 40px;

background:
linear-gradient(
180deg,
rgba(28,40,54,.98),
rgba(8,15,23,.98)
);

border: 1px solid #405365;

box-shadow:
0 15px 40px rgba(0,0,0,.55),
inset 0 1px rgba(255,255,255,.1);
}

.player {
display: flex;
align-items: center;
gap: 10px;
}

.avatar {
width: 46px;
height: 46px;
border-radius: 11px;

background:
radial-gradient(circle at 35% 30%, #777, #222 55%, #080808);

border: 2px solid #d6ad3b;

box-shadow:
0 0 12px rgba(214,173,59,.25);
}

.player-name {
font-size: 15px;
font-weight: 800;
}

.level {
margin-top: 3px;
font-size: 12px;
color: #d8ad3c;
}

.vs {
padding: 6px 14px;
border-radius: 6px;

background:
linear-gradient(#e5c45d,#9b741f);

color: #111;
font-weight: 900;
font-size: 12px;

box-shadow:
0 2px 8px rgba(0,0,0,.5);
}

/* ================= TABLE ================= */

.table-area {
display: flex;
align-items: center;
gap: 17px;
}

.power-box {
width: 24px;
height: 400px;

position: relative;
overflow: hidden;

border-radius: 13px;
border: 2px solid #394650;

background: #080c10;

box-shadow:
inset 0 0 15px #000,
0 8px 25px rgba(0,0,0,.5);
}

.power-fill {
position: absolute;
left: 0;
bottom: 0;

width: 100%;
height: 0%;

background:
linear-gradient(
to top,
#23c76d,
#ffd52d 55%,
#ff3d22
);

transition: height .03s linear;
}

.table-frame {
padding: 25px;

border-radius: 18px;

background:
linear-gradient(
135deg,
#a86e2c,
#70401d 42%,
#321806
);

border: 3px solid #281106;

box-shadow:
0 25px 60px rgba(0,0,0,.7),
inset 0 2px 2px rgba(255,255,255,.2),
inset 0 -8px 15px rgba(0,0,0,.5);
}

#poolCanvas {
display: block;

width: min(840px, 82vw);
height: auto;

border-radius: 5px;

box-shadow:
inset 0 0 30px rgba(0,0,0,.55),
0 0 3px #000;
}

.info {
margin-top: 14px;

min-width: 340px;

padding: 9px 24px;

text-align: center;

border-radius: 25px;

background: rgba(0,0,0,.7);

border: 1px solid #394a59;

color: #e6e6e6;

font-size: 14px;

box-shadow:
0 6px 20px rgba(0,0,0,.35);
}

@media(max-width:800px) {

.game {
transform: scale(.82);
}

.power-box {
height: 300px;
width: 20px;
}

.table-frame {
padding: 14px;
}
}
</style>
</head>

<body>

<div class="game">

<div class="topbar">

<div class="player">
<div class="avatar"></div>

<div>
<div class="player-name">ooz</div>
<div class="level">★ 200</div>
</div>
</div>

<div class="vs">VS</div>

<div class="player">

<div style="text-align:right">
<div class="player-name">Ginevra</div>
<div class="level">★ 133</div>
</div>

<div class="avatar"
style="border-color:#2ecc71">
</div>

</div>

</div>


<div class="table-area">

<div class="power-box">
<div id="powerFill"
class="power-fill">
</div>
</div>

<div class="table-frame">

<canvas
id="poolCanvas"
width="840"
height="420">
</canvas>

</div>

</div>

<div id="info" class="info">
Ziehe auf dem Tisch von der weißen Kugel weg – loslassen zum Stoß.
</div>

</div>


<script>

/* ============================================================
CUEVERSE OOZ BALL
============================================================ */

const canvas =
document.getElementById("poolCanvas");

const ctx =
canvas.getContext("2d");

const powerFill =
document.getElementById("powerFill");

const info =
document.getElementById("info");


/* ================= TABLE ================= */

const TABLE = {
left: 30,
right: 810,
top: 30,
bottom: 390
};

const R = 11;

const POCKET_R = 25;


/* ================= PHYSICS ================= */

const FRICTION = 0.992;

const WALL = 0.93;

const BALL_BOUNCE = 0.96;

const MAX_SPEED = 28;


/* ================= POCKETS ================= */

const pockets = [

{x: TABLE.left, y: TABLE.top},

{
x:(TABLE.left + TABLE.right)/2,
y:TABLE.top
},

{x:TABLE.right, y:TABLE.top},

{x:TABLE.left, y:TABLE.bottom},

{
x:(TABLE.left + TABLE.right)/2,
y:TABLE.bottom
},

{x:TABLE.right, y:TABLE.bottom}

];


/* ================= COLORS ================= */

const colors = {

1:"#f4c20d",
2:"#1769c2",
3:"#d93632",
4:"#7137a8",
5:"#e87518",
6:"#15894a",

8:"#090909",

9:"#f4c20d",
10:"#1769c2",
11:"#d93632",
12:"#7137a8",
13:"#e87518",
14:"#15894a"
};


/* ============================================================
BALL
============================================================ */

class Ball {

constructor(x,y,number,isCue=false) {

this.x=x;
this.y=y;

this.vx=0;
this.vy=0;

this.number=number;

this.isCue=isCue;

this.active=true;

this.striped =
!isCue &&
number >= 9 &&
number <= 14;

this.color =
isCue
? "#ffffff"
: colors[number];
}


speed() {

return Math.hypot(
this.vx,
this.vy
);
}


update() {

if(!this.active)
return;


this.x += this.vx;
this.y += this.vy;


this.vx *= FRICTION;
this.vy *= FRICTION;


if(Math.abs(this.vx)<0.015)
this.vx=0;

if(Math.abs(this.vy)<0.015)
this.vy=0;


/* Taschen */

for(const pocket of pockets) {

const d =
Math.hypot(
this.x-pocket.x,
this.y-pocket.y
);

if(d < POCKET_R) {

this.active=false;

this.vx=0;
this.vy=0;

if(this.isCue) {

info.textContent =
"Foul – weiße Kugel!";

setTimeout(() => {

this.active=true;

this.x=220;
this.y=210;

},700);
}

return;
}
}


/* Banden */

const minX =
TABLE.left + R;

const maxX =
TABLE.right - R;

const minY =
TABLE.top + R;

const maxY =
TABLE.bottom - R;


if(this.x < minX) {

this.x=minX;

this.vx=
Math.abs(this.vx)*WALL;
}


if(this.x > maxX) {

this.x=maxX;

this.vx=
-Math.abs(this.vx)*WALL;
}


if(this.y < minY) {

this.y=minY;

this.vy=
Math.abs(this.vy)*WALL;
}


if(this.y > maxY) {

this.y=maxY;

this.vy=
-Math.abs(this.vy)*WALL;
}
}


/* ========================================================
REALISTISCHERE KUGEL
======================================================== */

draw() {

if(!this.active)
return;


ctx.save();


/* Schatten */

ctx.beginPath();

ctx.ellipse(
this.x+3,
this.y+4,
R*1.02,
R*.78,
0,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(0,0,0,.38)";

ctx.fill();


/* Kugel-Grundform */

const g =
ctx.createRadialGradient(
this.x-4.5,
this.y-5,
1,
this.x,
this.y,
R+2
);

if(this.isCue) {

g.addColorStop(0,"#ffffff");
g.addColorStop(.35,"#fafafa");
g.addColorStop(.75,"#d7d7d7");
g.addColorStop(1,"#777");

} else {

g.addColorStop(
0,
"#ffffff"
);

g.addColorStop(
.16,
this.color
);

g.addColorStop(
.72,
this.color
);

g.addColorStop(
1,
"#111"
);
}


ctx.beginPath();

ctx.arc(
this.x,
this.y,
R,
0,
Math.PI*2
);

ctx.fillStyle=g;

ctx.fill();


/* Streifen */

if(this.striped) {

ctx.save();

ctx.beginPath();

ctx.arc(
this.x,
this.y,
R,
0,
Math.PI*2
);

ctx.clip();


ctx.fillStyle="#f8f8f8";

ctx.fillRect(
this.x-R,
this.y-4.5,
R*2,
9
);


/*
Farbige dünne Kanten
*/

ctx.fillStyle=this.color;

ctx.fillRect(
this.x-R,
this.y-6.5,
R*2,
2
);

ctx.fillRect(
this.x-R,
this.y+4.5,
R*2,
2
);

ctx.restore();
}


/* Nummern-Kreis */

if(!this.isCue) {

ctx.beginPath();

ctx.arc(
this.x,
this.y,
4.35,
0,
Math.PI*2
);

ctx.fillStyle="#ffffff";

ctx.fill();


ctx.strokeStyle=
"rgba(0,0,0,.35)";

ctx.lineWidth=.5;

ctx.stroke();


ctx.fillStyle=
this.number===8
? "#ffffff"
: "#111";


ctx.font=
"bold 6px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
this.number,
this.x,
this.y+.2
);
}


/* Glanz */

ctx.beginPath();

ctx.arc(
this.x-4,
this.y-4.5,
2.1,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.fill();


ctx.restore();
}
}


/* ============================================================
BALLS
============================================================ */

let balls=[];

let cueBall;


function createRack() {

balls=[];


cueBall =
new Ball(
220,
210,
0,
true
);

balls.push(cueBall);


/*
6 VOLLE
6 HALBE
1 SCHWARZE
*/

const rackNumbers=[

1,

9,2,

10,8,3,

11,4,12,5,

13,6,14

];


const startX=600;

const startY=210;

const spacing=22.5;

let n=0;


for(let row=0;row<5;row++) {

for(
let col=0;
col<=row;
col++
) {

const x =
startX +
row*spacing*.866;

const y =
startY +
(col-row/2)*spacing;


balls.push(
new Ball(
x,
y,
rackNumbers[n++]
)
);
}
}
}


/* ============================================================
BALL COLLISION
============================================================ */

function collide(a,b) {

if(!a.active || !b.active)
return;


let dx=b.x-a.x;

let dy=b.y-a.y;

let dist=Math.hypot(dx,dy);

const minDist=R*2;


if(dist===0) {

dx=.01;

dy=0;

dist=.01;
}


if(dist>=minDist)
return;


const nx=dx/dist;

const ny=dy/dist;


const overlap=
minDist-dist;


a.x -= nx*overlap/2;
a.y -= ny*overlap/2;

b.x += nx*overlap/2;
b.y += ny*overlap/2;


const rvx=b.vx-a.vx;

const rvy=b.vy-a.vy;


const vel=
rvx*nx+
rvy*ny;


if(vel>0)
return;


const impulse=
-(1+BALL_BOUNCE)*vel/2;


const ix=impulse*nx;

const iy=impulse*ny;


a.vx-=ix;
a.vy-=iy;

b.vx+=ix;
b.vy+=iy;
}


/* ============================================================
TABLE
============================================================ */

function drawTable() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* Tuch */

const cloth =
ctx.createLinearGradient(
0,0,
0,canvas.height
);

cloth.addColorStop(
0,
"#08794a"
);

cloth.addColorStop(
.5,
"#087044"
);

cloth.addColorStop(
1,
"#045b37"
);


ctx.fillStyle=cloth;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* Banden */

ctx.strokeStyle=
"rgba(0,0,0,.48)";

ctx.lineWidth=8;

ctx.strokeRect(
TABLE.left,
TABLE.top,
TABLE.right-TABLE.left,
TABLE.bottom-TABLE.top
);


/* Mittellinie */

ctx.strokeStyle=
"rgba(255,255,255,.15)";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
260,
TABLE.top
);

ctx.lineTo(
260,
TABLE.bottom
);

ctx.stroke();


/* Taschen */

for(const p of pockets) {

const pg=
ctx.createRadialGradient(
p.x-3,
p.y-3,
1,
p.x,
p.y,
POCKET_R
);

pg.addColorStop(
0,
"#000"
);

pg.addColorStop(
.65,
"#050505"
);

pg.addColorStop(
1,
"#26302c"
);


ctx.beginPath();

ctx.arc(
p.x,
p.y,
POCKET_R,
0,
Math.PI*2
);

ctx.fillStyle=pg;

ctx.fill();


ctx.strokeStyle=
"rgba(255,255,255,.08)";

ctx.lineWidth=2;

ctx.stroke();
}
}


/* ============================================================
AIMING
============================================================ */

let aiming=false;

let aimX=0;

let aimY=0;

let power=0;


/*
Wichtig:
Jetzt darf man AUF DEM GANZEN TISCH ziehen.
Nicht mehr nur exakt auf die weiße Kugel.
*/

function getPosition(e) {

const rect=
canvas.getBoundingClientRect();


const clientX =
e.touches
? e.touches[0].clientX
: e.clientX;

const clientY =
e.touches
? e.touches[0].clientY
: e.clientY;


return {

x:
(clientX-rect.left)*
canvas.width/
rect.width,

y:
(clientY-rect.top)*
canvas.height/
rect.height
};
}


/* ============================================================
QUEUE
============================================================ */

function drawCue() {

if(!aiming || !cueBall.active)
return;


const dx=
cueBall.x-aimX;

const dy=
cueBall.y-aimY;


const distance=
Math.hypot(dx,dy);


if(distance<2)
return;


const nx=dx/distance;

const ny=dy/distance;


/*
Queue hinter der weißen Kugel
*/

const cueLength=
130+power*2.2;


const startX=
cueBall.x-nx*cueLength;

const startY=
cueBall.y-ny*cueLength;


const endX=
cueBall.x-nx*18;

const endY=
cueBall.y-ny*18;


ctx.save();


/* Queue Schatten */

ctx.beginPath();

ctx.moveTo(
startX+3,
startY+3
);

ctx.lineTo(
endX+3,
endY+3
);

ctx.strokeStyle=
"rgba(0,0,0,.4)";

ctx.lineWidth=7;

ctx.stroke();


/* Queue */

const q=
ctx.createLinearGradient(
startX,
startY,
endX,
endY
);

q.addColorStop(
0,
"#5b3218"
);

q.addColorStop(
.7,
"#c28a43"
);

q.addColorStop(
.92,
"#f0d9aa"
);

q.addColorStop(
1,
"#ffffff"
);


ctx.beginPath();

ctx.moveTo(
startX,
startY
);

ctx.lineTo(
endX,
endY
);

ctx.strokeStyle=q;

ctx.lineWidth=5;

ctx.stroke();


/* Ziel-Linie */

ctx.setLineDash([6,7]);

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x+nx*170,
cueBall.y+ny*170
);

ctx.strokeStyle=
"rgba(255,255,255,.48)";

ctx.lineWidth=1.5;

ctx.stroke();


ctx.restore();
}


/* ============================================================
UPDATE
============================================================ */

function update() {

for(const ball of balls)
ball.update();


for(
let i=0;
i<balls.length;
i++
) {

for(
let j=i+1;
j<balls.length;
j++
) {

collide(
balls[i],
balls[j]
);
}
}
}


/* ============================================================
DRAW
============================================================ */

function draw() {

drawTable();


for(const ball of balls)
ball.draw();


drawCue();
}


/* ============================================================
GAME LOOP
============================================================ */

function loop() {

update();

draw();

requestAnimationFrame(loop);
}


/* ============================================================
INPUT
============================================================ */

function startAim(e) {

e.preventDefault();


if(!cueBall.active)
return;


if(ballsMoving())
return;


const p=
getPosition(e);


/*
Wir erlauben Start überall in der Nähe
der weißen Kugel und sogar etwas weiter.
*/

const d=
Math.hypot(
p.x-cueBall.x,
p.y-cueBall.y
);


if(d>170)
return;


aiming=true;

aimX=p.x;

aimY=p.y;

power=0;


info.textContent=
"Ziehe zurück und lasse los.";
}


function moveAim(e) {

if(!aiming)
return;


e.preventDefault();


const p=
getPosition(e);


aimX=p.x;

aimY=p.y;


const d=
Math.hypot(
cueBall.x-aimX,
cueBall.y-aimY
);


power=
Math.min(
100,
Math.max(
0,
d*.72
)
);


powerFill.style.height=
power+"%";
}


function shoot() {

if(!aiming)
return;


aiming=false;


powerFill.style.height="0%";


const dx=
cueBall.x-aimX;

const dy=
cueBall.y-aimY;


const distance=
Math.hypot(dx,dy);


if(distance<8) {

info.textContent=
"Ziehe weiter zurück.";

return;
}


const nx=dx/distance;

const ny=dy/distance;


/*
Sehr kräftiger Stoß.
*/

const force=
Math.min(
MAX_SPEED,
5+power*.25
);


cueBall.vx=
nx*force;

cueBall.vy=
ny*force;


info.textContent=
"Stoß läuft …";
}


/* ================= MOUSE ================= */

canvas.addEventListener(
"mousedown",
startAim
);

canvas.addEventListener(
"mousemove",
moveAim
);

window.addEventListener(
"mouseup",
shoot
);


/* ================= TOUCH ================= */

canvas.addEventListener(
"touchstart",
startAim,
{passive:false}
);

canvas.addEventListener(
"touchmove",
moveAim,
{passive:false}
);

window.addEventListener(
"touchend",
shoot,
{passive:false}
);


/* ============================================================
CHECK MOVING
============================================================ */

function ballsMoving() {

return balls.some(
b =>
b.active &&
b.speed()>0.12
);
}


/* ============================================================
START
============================================================ */

createRack();

loop();

</script>

</body>
</html>
