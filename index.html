<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #111;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

const TABLE_W = 800;
const TABLE_H = 400;

const BALL_RADIUS = 10;

const config = {
type: Phaser.AUTO,

width: TABLE_W + 100,
height: TABLE_H + 100,

backgroundColor: '#151515',

physics: {
default: 'matter',

matter: {
gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {
create: create,
update: update
}
};

const game = new Phaser.Game(config);

let ball;
let ballGraphic;

let aimGraphic;

let dragging = false;

let startX = 0;
let startY = 0;

const TABLE_X = 50;
const TABLE_Y = 50;

function create() {

const scene = this;

// =========================
// TISCH
// =========================

const table = scene.add.graphics();

// Außenrahmen
table.fillStyle(0x222222, 1);
table.fillRect(
TABLE_X - 25,
TABLE_Y - 25,
TABLE_W + 50,
TABLE_H + 50
);

// Spielfeld
table.fillStyle(0x176b52, 1);
table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);

// Spielfeldrand
table.lineStyle(4, 0x3b2414, 1);
table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);

// =========================
// BANDEN
// =========================

const railThickness = 18;

scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y - railThickness / 2,
TABLE_W,
railThickness,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H + railThickness / 2,
TABLE_W,
railThickness,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

scene.matter.add.rectangle(
TABLE_X - railThickness / 2,
TABLE_Y + TABLE_H / 2,
railThickness,
TABLE_H,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

scene.matter.add.rectangle(
TABLE_X + TABLE_W + railThickness / 2,
TABLE_Y + TABLE_H / 2,
railThickness,
TABLE_H,
{
isStatic: true,
restitution: 1,
friction: 0
}
);

// =========================
// WEISSE KUGEL
// =========================

const ballX = TABLE_X + 200;
const ballY = TABLE_Y + TABLE_H / 2;

ball = scene.matter.add.circle(
ballX,
ballY,
BALL_RADIUS,
{
restitution: 0.92,
friction: 0.01,
frictionAir: 0.025,
density: 0.004
}
);

// =========================
// KUGEL ZEICHNEN
// =========================

ballGraphic = scene.add.graphics();

drawBall();

// =========================
// ZIELLINIE
// =========================

aimGraphic = scene.add.graphics();

// =========================
// MOUSE / TOUCH
// =========================

scene.input.on(
'pointerdown',
function(pointer) {

const dx = pointer.worldX - ball.position.x;
const dy = pointer.worldY - ball.position.y;

const distance = Math.sqrt(
dx * dx + dy * dy
);

if (distance < 35) {

dragging = true;

startX = pointer.worldX;
startY = pointer.worldY;
}
}
);

scene.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

aimGraphic.clear();

aimGraphic.lineStyle(
3,
0xffffff,
0.9
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
ball.position.x +
(ball.position.x - pointer.worldX),

ball.position.y +
(ball.position.y - pointer.worldY)
);

aimGraphic.strokePath();
}
);

scene.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}

dragging = false;

aimGraphic.clear();

const dx =
pointer.worldX - ball.position.x;

const dy =
pointer.worldY - ball.position.y;

const distance =
Math.sqrt(dx * dx + dy * dy);

if (distance < 5) {
return;
}

// Schusskraft
const force = Math.min(
distance,
200
) * 0.00006;

scene.matter.body.applyForce(
ball,
ball.position,
{
x: -dx * force,
y: -dy * force
}
);
}
);

// =========================
// TEXT
// =========================

scene.add.text(
TABLE_X,
10,
'OOZ BALL',
{
fontFamily: 'Arial',
fontSize: '24px',
color: '#ffffff',
fontStyle: 'bold'
}
);
}


function drawBall() {

ballGraphic.clear();

// Schatten
ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(
ball.position.x + 2,
ball.position.y + 2,
BALL_RADIUS + 1
);

// Kugel
ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(
ball.position.x,
ball.position.y,
BALL_RADIUS
);

// kleiner Glanzpunkt
ballGraphic.fillStyle(
0xffffff,
0.8
);

ballGraphic.fillCircle(
ball.position.x - 3,
ball.position.y - 3,
2
);
}


function update() {

if (!ball) {
return;
}

drawBall();
}

</script>

</body>
</html>
