<script>
"use strict";

/* =========================================
OOZ BALL – EINSTELLUNGEN
========================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const tableImage = new Image();
tableImage.src = "OOZ_BALL_table_1320x720_6pockets.png";
const statusText = document.getElementById("status");
const powerFill = document.getElementById("powerFill");

const W = 1320;
const H = 720;

const TABLE = {
left: 106, // 
right: 1220, 
top: 96,
bottom: 625
};

const BALL_RADIUS = 18;

/* Stärkerer Stoß, kontrolliertes Ausrollen */
const MAX_POWER = 45;
const powerSlider = document.getElementById("powerSlider");
const powerCue = document.getElementById("powerCue");
const MAX_DRAG = 190;
const FRICTION = 0.99;
const WALL_BOUNCE = 1.0;
const BALL_BOUNCE = 1.0;

/* Taschenradius und sichtbare Versenk-Animation */
const POCKET_CAPTURE = 30;
const POCKET_OPENING = 52;
const POCKET_ANIMATION_SPEED = 0.025;

const COLORS = {
1: "#f5d32c", 2: "#2455d8", 3: "#d83232", 4: "#753cc5",
5: "#f18a28", 6: "#23944f", 7: "#8b2525", 8: "#101010",
9: "#f5d32c", 10: "#2455d8", 11: "#d83232", 12: "#753cc5",
13: "#f18a28", 14: "#23944f", 15: "#8b2525"
};

const POCKETS = [
// Obere Reihe (Links, Mitte, Rechts)
{ x: TABLE.left, y: TABLE.top },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.top },
{ x: TABLE.right, y: TABLE.top },

// Untere Reihe (Links, Mitte, Rechts)
{ x: TABLE.left, y: TABLE.bottom },
{ x: (TABLE.left + TABLE.right) / 2, y: TABLE.bottom },
{ x: TABLE.right, y: TABLE.bottom }
];

/* OOZ BALL – ORIGINAL POLYGON-KANTEN VOM YOUTUBE-KANAL */
const POCKET_JAWS = [];




let balls = [];
let spinX = 0;
let spinY = 0;

document.querySelectorAll(".spinPoint").forEach(point => {
point.addEventListener("click", () => {
spinX = Number(point.dataset.x);
spinY = Number(point.dataset.y);

document.querySelectorAll(".spinPoint").forEach(p => {
p.classList.toggle("selected", p === point);
});
});
});
let cueBall = null;
let aiming = false;
let aimX = 0;
let aimY = 0;
let cueDirX = 1;
let cueDirY = 0;
let shotInProgress = false;
let gameOver = false;
let currentPlayer =1;
  let playerGroups = {
1: null,
2: null
};

let firstContactBall = null;
let foulThisTurn = false;
let ballInHand = false;
let draggingCueBall =false;
let handX =0;
let handY =0;
let turnPocketedBalls = [];
let turnMessage = "";

/* =========================================
KUGELN ERZEUGEN
========================================= */

function createBall(x, y, number, type) {
const ball = {
x, y,
vx: 0,
vy: 0,
number,
type,
radius: BALL_RADIUS,
angle: 0,
active: true,
pocketing: false,
pocketScale: 1,
pocketX: x,
pocketY: y
};

balls.push(ball);
return ball;
}

function setupBalls() {
balls = [];
console.log("setupBalls gestartet");
gameOver = false;
currentPlayer = 1;  

/* 15 Objektkugeln: 7 Volle, 7 Halbe und die schwarze 8 */
const rack = [
[1],
[2, 3],
[4, 8, 5],
[6, 9, 10, 7],
[11, 12, 13, 14, 15]
];

const startX = 960;
const startY = 340;
const spacingX = BALL_RADIUS * Math.sqrt(3);
const spacingY = BALL_RADIUS * 2;

rack.forEach((row, rowIndex) => {
row.forEach((number, index) => {
const x = startX + rowIndex * spacingX;
const y = startY +
(index - (row.length - 1) / 2) * spacingY;

let type = "solid";

if (number === 8) {
type = "eight";
} else if (number >= 9) {
type = "stripe";
}

createBall(x, y, number, type);
});
});

cueBall = createBall(340, 340, 0, "cue");
ballInHand = true;

aiming = false;
shotInProgress = false;
powerFill.style.width = "0%";

updateStatus();
}

/* =========================================
KUGEL ZEICHNEN
Die Nummern drehen sich mit der Kugel.
========================================= */

function drawBall(ball) {
if (!ball.active && !ball.pocketing) return;

const r = ball.radius;

// Berechnet das weiche Schrumpfen im Loch
let scale = ball.pocketing ? (1 - (ball.pocketFall || 0) * 0.65) : 1;

ctx.save();
ctx.translate(ball.x, ball.y);
ctx.scale(scale, scale);

/* Schatten (wird schwächer, wenn die Kugel tiefer fällt) */
ctx.beginPath();
ctx.ellipse(3, 5, r * 1.02, r * 0.78, 0, 0, Math.PI * 2);
ctx.fillStyle = ball.pocketing ? `rgba(0,0,0,${0.42 * (1 - ball.pocketFall)})` : "rgba(0,0,0,0.42)";
ctx.fill();

/* Rotation der Kugeloberfläche */
ctx.rotate(ball.angle || 0);

/* Grundkugel */
ctx.beginPath();
ctx.arc(0, 0, r, 0, Math.PI * 2);
ctx.fillStyle = "#10131a";
ctx.fill();

ctx.save();
ctx.beginPath();
ctx.arc(0, 0, r - 0.7, 0, Math.PI * 2);
ctx.clip();

const color = ball.type === "cue" ? "#ffffff" : COLORS[ball.number];

const gradient = ctx.createRadialGradient(
-r * 0.38, -r * 0.45, 1,
r * 0.12, r * 0.18, r * 1.3
);

if (ball.type === "cue") {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.65, "#eeeeee");
gradient.addColorStop(1, "#aab2c0");
} else {
gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.17, color);
gradient.addColorStop(0.7, color);
gradient.addColorStop(1, "#090c13");
}

ctx.fillStyle = gradient;
ctx.fillRect(-r, -r, r * 2, r * 2);
ctx.restore();

/* Weiße Fläche für die Nummer */
if (ball.type !== "cue") {
ctx.beginPath();
ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();

/* Gestreifte Kugeln */
if (ball.type === "stripe") {
ctx.save();
ctx.beginPath();
ctx.arc(0, 0, r - 0.7, 0, Math.PI * 2);
ctx.clip();

ctx.fillStyle = COLORS[ball.number];
ctx.fillRect(-r, -r, r * 2, r * 0.35);
ctx.fillRect(-r, r * 0.65, r * 2, r * 0.35);
ctx.restore();

ctx.beginPath();
ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();
}

/* Kugelnummer Text */
ctx.save();
if (ball.type !== "cue") {
const const_angle = ball.angle || 0;
const const_rollX = Math.cos(const_angle);
const const_rollY = Math.sin(const_angle);
ctx.rotate(const_angle);

ctx.beginPath();
ctx.ellipse(0, 0, r * 0.43, r * 0.43 * Math.max(0.22, Math.abs(Math.cos(const_angle))), 0, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.fill();

ctx.fillStyle = "#111111";
ctx.font = "bold 12px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText(String(ball.number), 0, 0);
}
ctx.restore();
}

/* Glanzpunkt */
ctx.beginPath();
ctx.ellipse(-r * 0.36, -r * 0.48, r * 0.24, r * 0.12, -0.55, 0, Math.PI * 2);
ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
ctx.fill();

ctx.beginPath();
ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(255,255,255,0.23)";
ctx.lineWidth = 1;
ctx.stroke();

ctx.restore();
}



/* =========================================
ZIELLINIE UND QUEUE
========================================= */

function drawAim() {
if (!cueBall || !cueBall.active || !aiming) return;

// Stoßrichtung bestimmen
let dx = aiming ? aimX - cueBall.x : cueDirX;
let dy = aiming ? aimY - cueBall.y : cueDirY;
let distance = Math.hypot(dx, dy);

if (distance < 0.001) {
dx = -1;
dy = 0;
distance = 1;
}

const nx = dx / distance;
const ny = dy / distance;

// Richtung für den nächsten Stoß speichern
if (aiming && distance > 5) {
cueDirX = nx;
cueDirY = ny;
}

const power = aiming
? Math.min(distance, MAX_DRAG) / MAX_DRAG
: 0;

ctx.save();

// Kö-Spitze bleibt immer HINTER der weißen Kugel
const tipGap = 7;
const pullback = power * 95;

// Die Kö-Spitze bleibt hinter der weißen Kugel
const tipX = cueBall.x - nx * (BALL_RADIUS + tipGap + pullback);
const tipY = cueBall.y - ny * (BALL_RADIUS + tipGap + pullback);

// Kö-Ende: vom Ball weg nach hinten verlängern
const cueLength = 450;
const tailX = cueBall.x - nx * (BALL_RADIUS + tipGap + pullback + cueLength);
const tailY = cueBall.y - ny * (BALL_RADIUS + tipGap + pullback + cueLength);

ctx.lineCap = "round";

// Schatten
ctx.beginPath();
ctx.moveTo(tailX + 3, tailY + 4);
ctx.lineTo(tipX + 3, tipY + 4);
ctx.strokeStyle = "rgba(0,0,0,0.65)";
ctx.lineWidth = 14;
ctx.stroke();

// Dunkler Griff
ctx.beginPath();
ctx.moveTo(tailX, tailY);
ctx.lineTo(tipX, tipY);
ctx.strokeStyle = "#35200e";
 
ctx.lineWidth = 11;
ctx.stroke();

// Goldener Kö
const gold = ctx.createLinearGradient(tailX, tailY, tipX, tipY);
gold.addColorStop(0, "#704511");
gold.addColorStop(0.18, "#fff0a6");
gold.addColorStop(0.36, "#b98223");
gold.addColorStop(0.55, "#fff7cf");
gold.addColorStop(0.76, "#c28b2d");
gold.addColorStop(1, "#fff0b0");

ctx.beginPath();
ctx.moveTo(tailX, tailY);
ctx.lineTo(tipX, tipY);
ctx.strokeStyle = gold;
ctx.lineWidth = 7;
ctx.stroke();

// Feine Mittelader
ctx.beginPath();
ctx.moveTo(tailX, tailY);
ctx.lineTo(tipX, tipY);
ctx.strokeStyle = "rgba(255,255,235,0.9)";
ctx.lineWidth = 1.5;
ctx.stroke();

// Goldringe
for (const t of [0.12, 0.18, 0.24, 0.78, 0.84]) {
const x = tailX + (tipX - tailX) * t;
const y = tailY + (tipY - tailY) * t;

ctx.beginPath();
ctx.arc(x, y, 5, 0, Math.PI * 2);
ctx.strokeStyle = "#fff0ad";
ctx.lineWidth = 2;
ctx.stroke();
}

// Helle Kö-Spitze
ctx.beginPath();
ctx.moveTo(tipX, tipY);
ctx.lineTo(
cueBall.x + nx * (BALL_RADIUS + 2),
cueBall.y + ny * (BALL_RADIUS + 2)
);
ctx.strokeStyle = "#f5e8c8";
ctx.lineWidth = 3;
ctx.stroke();

// OOZ BALL – Zielhilfe
let hitBall = null;
let hitDistance = Infinity;

for (const ball of balls) {
if (!ball.active || ball === cueBall) continue;

const bx = ball.x - cueBall.x;
const by = ball.y - cueBall.y;
const projection = bx * nx + by * ny;

if (projection <= 0) continue;

const perpendicular = Math.abs(bx * ny - by * nx);

if (perpendicular <= BALL_RADIUS * 2 && projection > 0) {

    // Exakten Abstand bis zum Kugelkontakt berechnen
    const offset = Math.sqrt(
        Math.pow(BALL_RADIUS * 2, 2) -
        Math.pow(perpendicular, 2)
    );

    const actualHitDistance = projection - offset;

    // Nur Treffer vor der weißen Kugel berücksichtigen
    if (actualHitDistance >= 0 &&
        actualHitDistance < hitDistance) {

        hitBall = ball;
        hitDistance = actualHitDistance;
    }
}
}

// Zielhilfe: Kugel oder Bande anzeigen
let hitDistanceToShow = hitBall ? hitDistance : Infinity;

// Wenn keine Kugel getroffen wird, Schnittpunkt mit der Bande berechnen
if (!hitBall) {
const wallDistances = [];

if (nx > 0) wallDistances.push((TABLE.right - cueBall.x) / nx);
if (nx < 0) wallDistances.push((TABLE.left - cueBall.x) / nx);
if (ny > 0) wallDistances.push((TABLE.bottom - cueBall.y) / ny);
if (ny < 0) wallDistances.push((TABLE.top - cueBall.y) / ny);

hitDistanceToShow = Math.min(
...wallDistances.filter(d => d > 0)
);
}

if (Number.isFinite(hitDistanceToShow)) {
const ghostX = cueBall.x + nx * hitDistanceToShow;
const ghostY = cueBall.y + ny * hitDistanceToShow;
// Ghost Ball mit zwei Zielstrichen
ctx.save();

// Weiße Ziellinie bis zum Mittelpunkt des Ghost Balls
ctx.beginPath();
ctx.setLineDash([]);
ctx.moveTo(cueBall.x, cueBall.y);
ctx.lineTo(ghostX, ghostY);
ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 2;
ctx.stroke();

// Kreis des Ghost Balls
ctx.beginPath();
ctx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI * 2);
ctx.strokeStyle = "#bdefff";
ctx.lineWidth = 2;
ctx.stroke();

// Richtung der weißen Kugel zum Ghost Ball
const angle = Math.atan2(
  ghostY - cueBall.y,
  ghostX - cueBall.x
  );

ctx.save();
ctx.translate(ghostX, ghostY);
ctx.rotate(angle);

ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 3;
ctx.lineCap = "round";



ctx.restore();

}

ctx.restore();

powerFill.style.width = (power * 100) + "%";
}

/* =========================================
TASCHEN
Kugeln werden animiert statt sofort gelöscht.
========================================= */

function checkPockets(ball) {
for (const pocket of POCKETS) {
const dx = ball.x - pocket.x;
const dy = ball.y - pocket.y;
const distance = Math.hypot(dx, dy);

// Die Kugel muss weiter in die Tasche rollen,
// bevor die Einloch-Animation beginnt.
const captureDistance = POCKET_OPENING / 2;

if (distance < captureDistance) {
ball.pocketing = true;
playPocketSound();
ball.pocketScale = 1;
ball.pocketX = pocket.x;
ball.pocketY = pocket.y;
ball.vx = 0;
ball.vy = 0;

return true;
}
}

return false;
}

function updatePocketAnimation(ball) {
const dx = ball.pocketX - ball.x;
const dy = ball.pocketY - ball.y;
const distance = Math.hypot(dx, dy);

// Reibung im Loch: Kugel bremst stark ab
ball.vx *= 0.4;
ball.vy *= 0.4;

if (distance > 1) {
// Zieht die Kugel elastisch und smooth zur Lochmitte
ball.x += dx * 0.18;
ball.y += dy * 0.18;
}

// Fortschritt des Fallens (Wert von 0 bis 1)
ball.pocketFall = (ball.pocketFall || 0) + POCKET_ANIMATION_SPEED;

// Sobald die Kugel ganz unten angekommen ist, wird sie gewertet
if (ball.pocketFall >= 1) {
ball.active = false;
ball.pocketing = false;

if (ball.type === "cue") {
// Logik für weiße Kugel (Zurücksetzen)
ball.x = 350;
ball.y = 360;
ball.vx = 0;
ball.vy = 0;
ball.active = true;
ball.pocketFall = 0;
ballInHand = true;
turnPocketedBalls.push(ball);
} else {
// Objektkugeln werden ganz normal versenkt gewertet
turnPocketedBalls.push(ball);
}
}
}



/* =========================================
BANDEN
========================================= */

function nearPocketOpening(ball, edge) {
const halfOpening = POCKET_OPENING / 2;

return POCKETS.some(pocket => {
if (edge === "top" || edge === "bottom") {
return (
Math.abs(ball.x - pocket.x) < halfOpening &&
Math.abs(ball.y - pocket.y) < BALL_RADIUS + 8
);
}

return (
Math.abs(ball.y - pocket.y) < halfOpening &&
Math.abs(ball.x - pocket.x) < BALL_RADIUS + 8
);
});
}
function collideWithPocketJaws(ball) {
const r = ball.radius;

for (const segment of POCKET_JAWS) {
const a = segment[0];
const b = segment[1];

const dx = b.x - a.x;
const dy = b.y - a.y;
const lengthSquared = dx * dx + dy * dy;

if (lengthSquared === 0) continue;

// Nächsten Punkt auf der Kante bestimmen
const t = Math.max(0, Math.min(1,
((ball.x - a.x) * dx + (ball.y - a.y) * dy) /
lengthSquared
));

const closestX = a.x + t * dx;
const closestY = a.y + t * dy;

const diffX = ball.x - closestX;
const diffY = ball.y - closestY;
const distance = Math.hypot(diffX, diffY);

if (distance >= r || distance < 0.0001) continue;

// Kugel aus der Kante herausdrücken
const nx = diffX / distance;
const ny = diffY / distance;

ball.x = closestX + nx * r;
ball.y = closestY + ny * r;

// Nur abprallen, wenn sich die Kugel auf die Kante zubewegt
const velocityTowardEdge = ball.vx * nx + ball.vy * ny;

if (velocityTowardEdge < 0) {
ball.vx -= 2 * velocityTowardEdge * nx;
ball.vy -= 2 * velocityTowardEdge * ny;
ball.vx *= WALL_BOUNCE;
ball.vy *= WALL_BOUNCE;
playBumperSound();
}
}
}


function updateWalls(ball) {
const r = ball.radius;

// Zuerst prüfen, ob die Kugel in eine Tasche fällt.
if (checkPockets(ball)) return;

// Obere Bande
if (ball.y - r < TABLE.top) {
if (!nearPocketOpening(ball, "top")) {
ball.y = TABLE.top + r;
ball.vy = Math.abs(ball.vy) * WALL_BOUNCE;
playBumperSound();
}
}

// Untere Bande
if (ball.y + r > TABLE.bottom) {
if (!nearPocketOpening(ball, "bottom")) {
ball.y = TABLE.bottom - r;
ball.vy = -Math.abs(ball.vy) * WALL_BOUNCE;
playBumperSound();
}
}

// Linke Bande
if (ball.x - r < TABLE.left) {
if (!nearPocketOpening(ball, "left")) {
ball.x = TABLE.left + r;
ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
playBumperSound();
}
}

// Rechte Bande
if (ball.x + r > TABLE.right) {
if (!nearPocketOpening(ball, "right")) {
ball.x = TABLE.right - r;
ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
playBumperSound();
}
}
}



/* =========================================
PHYSIK
========================================= */

/* =========================================
GHOST BALL & ZIELHILFE BERECHNUNG (UHRZEIGER)
========================================= */
function drawAimAssist() {
if (!aiming || !cueBall || shotInProgress) return;

let closestDist = Infinity;
let targetBall = null;

balls.forEach(b => {
if (!b.active || b.type === "cue") return;

const toBallX = b.x - cueBall.x;
const toBallY = b.y - cueBall.y;
const dot = toBallX * cueDirX + toBallY * cueDirY;

if (dot <= 0) return;

const projX = cueBall.x + cueDirX * dot;
const projY = cueBall.y + cueDirY * dot;

const distSq = (b.x - projX) * (b.x - projX) + (b.y - projY) * (b.y - projY);
const minDist = BALL_RADIUS * 2;

if (distSq < minDist * minDist) {
const diffX = projX - b.x;
const diffY = projY - b.y;
const offsetDist = Math.sqrt(minDist * minDist - distSq);
const hitDist = dot - offsetDist;

if (hitDist > 0 && hitDist < closestDist) {
closestDist = hitDist;
targetBall = b;
}
}
});

let ghostX = cueBall.x + cueDirX * 300;
let ghostY = cueBall.y + cueDirY * 300;

if (targetBall) {
ghostX = cueBall.x + cueDirX * closestDist;
ghostY = cueBall.y + cueDirY * closestDist;
}

// 1. Linie von Weiß zu Ghost Ball
ctx.beginPath();
ctx.moveTo(cueBall.x, cueBall.y);
ctx.lineTo(ghostX, ghostY);
ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
ctx.lineWidth = 2;
ctx.stroke();

// 2. Ghost Ball Kreis zeichnen
ctx.beginPath();
ctx.arc(ghostX, ghostY, BALL_RADIUS, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
ctx.lineWidth = 2;
ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
ctx.fill();
ctx.stroke();

// 3. Uhrzeiger-Striche rotieren lassen bei Ballkontakt
if (targetBall) {
const normalX = targetBall.x - ghostX;
const normalY = targetBall.y - ghostY;
const normalLen = Math.sqrt(normalX * normalX + normalY * normalY);

if (normalLen > 0) {
const nx = normalX / normalLen;
const ny = normalY / normalLen;

// Strich 1: Uhrzeiger für getroffenen Ball (Gelb)
ctx.beginPath();
ctx.moveTo(ghostX, ghostY);
ctx.lineTo(ghostX + nx * 120 , ghostY + ny * 120);
ctx.strokeStyle = "#f5d32c";
ctx.lineWidth = 3;
ctx.stroke();

// Strich 2: Uhrzeiger für weißen Abprallwinkel (Türkis - 90 Grad)
const cross = cueDirX * ny - cueDirY * nx;
const side = cross >= 0 ? 1 : -1;
const tx = ny * side;
const ty = -nx * side;

ctx.beginPath();
ctx.moveTo(ghostX, ghostY);
ctx.lineTo(ghostX + tx * 120, ghostY + ty * 120);
ctx.strokeStyle = "#42d6ce";
ctx.lineWidth = 3;
ctx.stroke();
}
}
}

function updatePhysics() {
    // Taschenanimation beibehalten
    for (const ball of balls) {
        if (ball.active && ball.pocketing) {
            updatePocketAnimation(ball);
        }
    }

    // Bewegung und Reibung wie in Ball.js
    for (const ball of balls) {
        if (!ball.active || ball.pocketing) continue;

        ball.x += ball.vx;
        ball.y += ball.vy;

        ball.vx *= FRICTION;
        ball.vy *= FRICTION;

        // Sehr langsame Kugeln anhalten
        if (Math.abs(ball.vx) < 0.04) ball.vx = 0;
        if (Math.abs(ball.vy) < 0.04) ball.vy = 0;

        // Kugelrotation beibehalten
        const rollDistance = Math.hypot(ball.vx, ball.vy);

        if (rollDistance > 0.001) {
            if (ball.rollAngle === undefined) {
                ball.rollAngle = ball.angle || 0;
            }

            ball.rollAngle += rollDistance / ball.radius;
            ball.angle = ball.rollAngle;
            ball.movementAngle = Math.atan2(ball.vy, ball.vx);
        }

        // Bestehende Banden- und Taschenlogik verwenden
        updateWalls(ball);
      collideWithPocketJaws(ball);
    }

    // Jede Kugelpaarung nur einmal prüfen
    const activeBalls = balls.filter(
        ball => ball.active && !ball.pocketing
    );

    for (let i = 0; i < activeBalls.length; i++) {
        for (let j = i + 1; j < activeBalls.length; j++) {
            const a = activeBalls[i];
            const b = activeBalls[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distance = Math.hypot(dx, dy);
            const minimumDistance = a.radius + b.radius;

            if (distance >= minimumDistance) continue;

            // Sonderfall: Kugeln liegen exakt übereinander
            if (distance < 0.0001) {
                a.x -= 0.01;
                b.x += 0.01;
                continue;
            }

            // Normalenvektor zwischen den Kugelmittelpunkten
            const nx = dx / distance;
            const ny = dy / distance;

            // Überlappung korrigieren
            const overlap = minimumDistance - distance;

            a.x -= nx * overlap / 2;
            a.y -= ny * overlap / 2;
            b.x += nx * overlap / 2;
            b.y += ny * overlap / 2;

            // Ersten Kontakt der weißen Kugel erkennen
            if (
                cueBall &&
                shotInProgress &&
                (a === cueBall || b === cueBall)
            ) {
                const otherBall = a === cueBall ? b : a;

                if (otherBall.type !== "cue" && !firstContactBall) {
                    firstContactBall = otherBall;
                }
            }

            // Relative Geschwindigkeit entlang der Kollisionsnormalen
            const relativeX = b.vx - a.vx;
            const relativeY = b.vy - a.vy;

            const relativeVelocity =
                relativeX * nx + relativeY * ny;

            // Nur reagieren, wenn sich die Kugeln annähern
            if (relativeVelocity < -0.0001) {
                const impulse =
                    -(1 + BALL_BOUNCE) * relativeVelocity / 2;

                a.vx -= impulse * nx;
                a.vy -= impulse * ny;

                b.vx += impulse * nx;
                b.vy += impulse * ny;

                // Vorhandene Kollisionssound-Funktion verwenden
                playBallCollision(
                    "balls-" +
                    Math.min(a.number, b.number) + "-" +
                    Math.max(a.number, b.number)
                );
            }
        }
    }

    // Prüfen, ob noch eine Kugel rollt
    shotInProgress = balls.some(ball =>
        ball.active &&
        !ball.pocketing &&
        (Math.abs(ball.vx) > 0.035 ||
         Math.abs(ball.vy) > 0.035)
    );

    updateStatus();
}

/* =========================================
STATUS UND RENDERING
========================================= */

function updateStatus() {
const remaining = balls.filter(ball =>
ball.active && ball.type !== "cue"
).length;

if (cueBall && !cueBall.active) return;

statusText.textContent = shotInProgress
? "OOZ BALL · Kugeln in Bewegung · Übrig: " + remaining
: "OOZ BALL · Bereit · Objektkugeln: " + remaining;
}

function draw() {
ctx.clearRect(0, 0, W, H);
ctx.fillText("kugeln: " + balls.length, 50, 50);

for (const ball of balls) {
drawBall(ball);
}

drawAim();
if (ballInHand && cueBall && cueBall.active) {
ctx.save();
ctx.font = "32px sans-serif";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.save();

ctx.font = "bold 34px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.shadowColor = "#ffd700";
ctx.shadowBlur = 12;
ctx.fillStyle = "#ffd700";

ctx.fillText("👆", cueBall.x, cueBall.y - cueBall.radius - 25);

ctx.shadowBlur = 0;
ctx.restore();
ctx.restore();
}
}

/* =========================================
MAUS UND TOUCH
========================================= */

function getPointerPosition(event) {
const rect = canvas.getBoundingClientRect();

return {
x: (event.clientX - rect.left) * W / rect.width,
y: (event.clientY - rect.top) * H / rect.height
};
}
let billiardAudioContext = null;

const SOUND = {
    CUE: new Audio("./sfx/cue.mp3"),
    COLLISION: new Audio("./sfx/collision.mp3"),
    BUMPER: new Audio("./sfx/bumper.mp3"),
    POCKET: new Audio("./sfx/pocket.mp3"),
    WHIP: new Audio("./sfx/whip.mp3"),
    WIN: new Audio("./sfx/win.mp3"),
    LOSE: new Audio("./sfx/lose.mp3"),
};

SOUND.WHIP.volume = 0.3;

for (const sound of Object.values(SOUND)) {
    sound.preload = "auto";
}

function playBilliardHit() {
    SOUND.CUE.currentTime = 0;
    SOUND.CUE.play().catch(() => {});
}

let lastCollisionSoundTime = 0;

function playBallCollision(contactKey) {
    const now = performance.now();

    // Verhindert zu häufige Kollisionsgeräusche
    if (now - lastCollisionSoundTime < 70) return;

    lastCollisionSoundTime = now;

    SOUND.COLLISION.currentTime = 0;
    SOUND.COLLISION.play().catch(() => {});
}

function playBumperSound() {
    SOUND.BUMPER.currentTime = 0;
    SOUND.BUMPER.play().catch(() => {});
}

function playPocketSound() {
    SOUND.POCKET.currentTime = 0;
    SOUND.POCKET.play().catch(() => {});
}

function pointerDown(event) {
if (gameOver || !cueBall || !cueBall.active || shotInProgress) return;

const p = getPointerPosition(event);

if (ballInHand) {
ballInHand = false;
draggingCueBall = false;
}

aimX = p.x;
aimY = p.y;
aiming = true;

canvas.setPointerCapture(event.pointerId);
draw();
}

function pointerMove(event) {
const p = getPointerPosition(event);

if (draggingCueBall && ballInHand) {
handX = p.x;
handY = p.y;

cueBall.x = Math.max(
cueBall.radius,
Math.min(W - cueBall.radius, p.x)
);
cueBall.y = Math.max(
cueBall.radius,
Math.min(H - cueBall.radius, p.y)
);

cueBall.vx = 0;
cueBall.vy = 0;
draw();
return;
}

if (!aiming) return;

aimX = p.x;
aimY = p.y;
draw();
}

function pointerUp() {
if (draggingCueBall) {
draggingCueBall = false;
ballInHand = true;
draw();
return;
}

if (!aiming) return;

aiming = false;

if (!cueBall || !cueBall.active) {
draw();
return;
}

const dx = cueBall.x - aimX;
const dy = cueBall.y - aimY;
const distance = Math.hypot(dx, dy);

if (distance > 5) {
cueDirX = dx / distance;
cueDirY = dy / distance;

firstContactBall = null;
foulThisTurn = false;

const power = Math.min(distance, MAX_DRAG) / MAX_DRAG;
const strength = Math.max(1, power * MAX_POWER);

cueBall.vx = -(dx / distance) * strength;
cueBall.vy = -(dy / distance) * strength;

shotInProgress = true;
playBilliardHit();
}

powerFill.style.width = "0%";
draw();
}

/* KRAFTREGLER MIT KÖ UND STOSS VERBINDEN */
powerSlider.addEventListener("input", function () {
if (gameOver || !cueBall || !cueBall.active ||
shotInProgress || ballInHand) {
return;
}

const power = 1 - Number(powerSlider.value) / 100;
const distance = Math.max(5, power * MAX_DRAG);

aiming = true;

aimX = cueBall.x - cueDirX * distance;
aimY = cueBall.y - cueDirY * distance;

powerFill.style.width = powerSlider.value + "%";

draw();
});

powerSlider.addEventListener("change", function () {
if (aiming && !shotInProgress && !ballInHand) {
pointerUp();
powerSlider.value = 0;
powerFill.style.width = "0%";
}
});

canvas.addEventListener("pointerdown", pointerDown);
canvas.addEventListener("pointermove", pointerMove);
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", pointerUp);

document.getElementById("resetButton").addEventListener(
"click",
setupBalls
);

/* =========================================
SPIELSCHLEIFE
========================================= */

function gameLoop() {
// 1. Spielfeld leeren
ctx.clearRect(0, 0, W, H);

// 2. DEIN REPARIERTER TISCH: Zeichnet das originale Bild auf das Canvas
if (tableImage.complete) {
ctx.drawImage(tableImage, 0, 0, W, H);
}

// 3. Physik berechnen
updatePhysics();

// 4. Ziellinie zeichnen
drawAimLine();

// 5. Kugeln zeichnen
balls.forEach(ball => drawBall(ball));

// 6. Ball-In-Hand Kreis zeichnen
if (ballInHand && !shotInProgress && !gameOver) {
ctx.beginPath();
ctx.arc(cueBall.x, cueBall.y, cueBall.radius * 1.4, 0, Math.PI * 2);
ctx.strokeStyle = "rgba(66, 214, 206, 0.6)";
ctx.lineWidth = 2;
ctx.stroke();
}

requestAnimationFrame(gameLoop);
}

/* START */
setupBalls();
draw();
gameLoop();

</script>
