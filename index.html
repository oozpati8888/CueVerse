<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101010;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

/* =========================================================
OOZ BALL
SCHRITT 2 – KÖ + SCHUSS
========================================================= */

const GAME_W = 900;
const GAME_H = 500;

const TABLE_X = 50;
const TABLE_Y = 50;

const TABLE_W = 800;
const TABLE_H = 400;

const RAIL = 24;
const POCKET_R = 24;

const BALL_R = 10;

let ball;
let ballGraphic;
let cueGraphic;
let aimGraphic;

let dragging = false;

let dragDistance = 0;
let shotAngle = 0;

const MAX_DRAG = 180;


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101010',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {

create: create,

update: update
}
};

new Phaser.Game(config);


/* =========================================================
CREATE
========================================================= */

function create() {

const scene = this;


/* =====================================================
TISCH
===================================================== */

const table =
scene.add.graphics();


/* Schatten */

table.fillStyle(
0x000000,
0.35
);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
18
);


/* Außenrahmen */

table.fillStyle(
0x171717,
1
);

table.fillRoundedRect(
TABLE_X - 28,
TABLE_Y - 28,
TABLE_W + 56,
TABLE_H + 56,
16
);


/* Goldkante */

table.lineStyle(
4,
0xc9a34a,
1
);

table.strokeRoundedRect(
TABLE_X - 24,
TABLE_Y - 24,
TABLE_W + 48,
TABLE_H + 48,
13
);


/* Bande */

table.fillStyle(
0x4a2c19,
1
);

table.fillRoundedRect(
TABLE_X - 18,
TABLE_Y - 18,
TABLE_W + 36,
TABLE_H + 36,
10
);


/* grünes Spielfeld */

table.fillStyle(
0x126247,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* Spielfeldkante */

table.lineStyle(
3,
0x0b3e30,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* =====================================================
TASCHEN
===================================================== */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* =====================================================
BANDEN
===================================================== */

createRails(scene);


/* =====================================================
WEISSE KUGEL
===================================================== */

ball =
scene.matter.add.circle(

TABLE_X + 200,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.92,

friction: 0.01,

frictionAir: 0.025,

density: 0.004
}
);


/* =====================================================
GRAFIKEN
===================================================== */

ballGraphic =
scene.add.graphics();

cueGraphic =
scene.add.graphics();

aimGraphic =
scene.add.graphics();


/* =====================================================
LOGO
===================================================== */

scene.add.text(

TABLE_X,

12,

'OOZ BALL',

{
fontFamily: 'Arial',

fontSize: '24px',

fontStyle: 'bold',

color: '#d6b15a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 120,

16,

'8 BALL',

{
fontFamily: 'Arial',

fontSize: '14px',

color: '#ffffff',

alpha: 0.65
}
);


/* =====================================================
MAUS / TOUCH START
===================================================== */

scene.input.on(
'pointerdown',

function(pointer) {

if (!ball) {
return;
}


/* Kugel darf nur geschossen werden,
wenn sie fast stillsteht */

const speed =
Math.sqrt(
ball.velocity.x *
ball.velocity.x +
ball.velocity.y *
ball.velocity.y
);

if (speed > 0.02) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance <= 35) {

dragging = true;

dragDistance = 0;

shotAngle =
Math.atan2(
dy,
dx
);
}
}
);


/* =====================================================
MAUS / TOUCH BEWEGUNG
===================================================== */

scene.input.on(
'pointermove',

function(pointer) {

if (!dragging) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


dragDistance =
Math.min(
distance,
MAX_DRAG
);


shotAngle =
Math.atan2(
dy,
dx
);


drawCue();


drawAimLine();
}
);


/* =====================================================
SCHUSS
===================================================== */

scene.input.on(
'pointerup',

function(pointer) {

if (!dragging) {
return;
}


dragging = false;


cueGraphic.clear();

aimGraphic.clear();


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


const power =
Math.min(
distance,
MAX_DRAG
);


if (power < 5) {

dragDistance = 0;

return;
}


/*
Kraft entgegen der
Zurückzieh-Richtung
*/

const force =
power * 0.00007;


scene.matter.body.applyForce(

ball,

ball.position,

{
x:
-dx * force,

y:
-dy * force
}
);


dragDistance = 0;
}
);
}


/* =========================================================
TASCHEN
========================================================= */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();


g.fillStyle(
0x0b0b0b,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x292929,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* =========================================================
BANDEN
========================================================= */

function createRails(scene) {

const gap =
POCKET_R * 2.2;

const mid =
TABLE_W / 2;


/* OBEN */

addRail(
scene,
TABLE_X +
(mid - gap) / 2,

TABLE_Y -
RAIL / 2,

mid - gap,

RAIL
);


addRail(
scene,

TABLE_X +
mid +
(mid - gap) / 2,

TABLE_Y -
RAIL / 2,

mid - gap,

RAIL
);


/* UNTEN */

addRail(
scene,

TABLE_X +
(mid - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

mid - gap,

RAIL
);


addRail(
scene,

TABLE_X +
mid +
(mid - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

mid - gap,

RAIL
);


/* SEITEN */

const sideLength =
TABLE_H / 2 -
gap;


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
TABLE_H -
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
TABLE_H -
sideLength / 2,

RAIL,

sideLength
);
}


/* =========================================================
MATTER BANDE
========================================================= */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,
y,
width,
height,

{
isStatic: true,

restitution: 0.95,

friction: 0
}
);
}


/* =========================================================
KÖ ZEICHNEN
========================================================= */

function drawCue() {

cueGraphic.clear();


if (!dragging) {
return;
}


/*
Richtung vom Ball weg
*/

const dirX =
Math.cos(shotAngle);

const dirY =
Math.sin(shotAngle);


/*
Köspitze bleibt nahe
an der weißen Kugel.

Je stärker zurückgezogen,
desto weiter wandert der Kö
nach hinten.
*/

const tipDistance =
BALL_R + 7;


const cueLength =
210;


const pull =
dragDistance;


const tipX =
ball.position.x -
dirX *
tipDistance -
dirX *
pull;


const tipY =
ball.position.y -
dirY *
tipDistance -
dirY *
pull;


const buttX =
tipX +
dirX *
cueLength;


const buttY =
tipY +
dirY *
cueLength;


/* =====================================================
CUE SCHATTEN
===================================================== */

cueGraphic.lineStyle(
10,
0x000000,
0.25
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX + 3,
tipY + 3
);

cueGraphic.lineTo(
buttX + 3,
buttY + 3
);

cueGraphic.strokePath();


/* =====================================================
CUE KÖRPER
===================================================== */

cueGraphic.lineStyle(
7,
0x8b5a2b,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =====================================================
GOLDENE LINIE
===================================================== */

cueGraphic.lineStyle(
2,
0xd6b15a,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =====================================================
CUE SPITZE
===================================================== */

cueGraphic.fillStyle(
0xe6e6e6,
1
);

cueGraphic.fillCircle(
tipX,
tipY,
4
);


/* =====================================================
GRIFF
===================================================== */

cueGraphic.lineStyle(
11,
0x171717,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
buttX - dirX * 15,
buttY - dirY * 15
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* =====================================================
GOLDENER ABSCHLUSS
===================================================== */

cueGraphic.fillStyle(
0xd6b15a,
1
);

cueGraphic.fillCircle(
buttX,
buttY,
5
);
}


/* =========================================================
ZIELLINIE
========================================================= */

function drawAimLine() {

aimGraphic.clear();


if (!dragging) {
return;
}


const dirX =
Math.cos(shotAngle);

const dirY =
Math.sin(shotAngle);


const lineLength =
260;


const endX =
ball.position.x +
dirX *
lineLength;


const endY =
ball.position.y +
dirY *
lineLength;


aimGraphic.lineStyle(
2,
0xffffff,
0.55
);


aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Kraftanzeige */

const powerLength =
dragDistance * 0.7;


aimGraphic.lineStyle(
4,
0xc9a34a,
0.85
);


aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(

ball.position.x +
dirX *
powerLength,

ball.position.y +
dirY *
powerLength
);

aimGraphic.strokePath();
}


/* =========================================================
WEISSE KUGEL
========================================================= */

function drawBall() {

ballGraphic.clear();


/* Schatten */

ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(

ball.position.x + 2,

ball.position.y + 2,

BALL_R + 2
);


/* Kugel */

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/* Glanz */

ballGraphic.fillStyle(
0xeaf4ff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

2
);
}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!ball) {
return;
}


/*
Weiße Kugel neu einsetzen,
falls sie durch eine Tasche
vom Tisch fällt.
*/

if (

ball.position.x <
TABLE_X - 50 ||

ball.position.x >
TABLE_X +
TABLE_W +
50 ||

ball.position.y <
TABLE_Y - 50 ||

ball.position.y >
TABLE_Y +
TABLE_H +
50

) {

this.matter.body.setPosition(

ball,

{
x:
TABLE_X + 200,

y:
TABLE_Y +
TABLE_H / 2
}
);


this.matter.body.setVelocity(

ball,

{
x: 0,
y: 0
}
);
}


drawBall();


/*
Kö nur anzeigen,
wenn gezogen wird.
*/

if (dragging) {

drawCue();

drawAimLine();

} else {

cueGraphic.clear();

aimGraphic.clear();
}
}

</script>

</body>
</html>
