
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CueVerse Prototype</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0d0d0d;color:#fff}
.screen{display:none;padding:24px}
.active{display:block}
h1{color:#d4af37}
.btn{display:block;background:#d4af37;color:#111;text-decoration:none;
padding:14px;border-radius:10px;margin:12px 0;font-weight:bold;text-align:center}
.card{background:#1b1b1b;padding:16px;border-radius:12px;margin:12px 0}
</style>
<script>
function show(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
window.onload=()=>show('splash');
</script>
</head>
<body>
<div id="splash" class="screen active">
<h1>CueVerse</h1>
<p>Play Beyond Luxury</p>
<a class="btn" href="#" onclick="show('home')">Enter Club</a>
</div>

<div id="home" class="screen">
<h1>Royal Lounge</h1>
<div class="card">👤 Orhan &nbsp; 🪙 10.000 Coins</div>
<a class="btn" href="#" onclick="show('play')">🎱 Play</a>
<a class="btn" href="#" onclick="show('shop')">🛒 Shop</a>
<a class="btn" href="#" onclick="show('profile')">👤 Profil</a>
</div>

<div id="play" class="screen">
<h1>Spiel wählen</h1>
<div class="card">100 Coins Room</div>
<div class="card">500 Coins Room</div>
<div class="card">2500 Coins Room</div>
<a class="btn" href="#" onclick="show('home')">Zurück</a>
</div>

<div id="shop" class="screen">
<h1>Shop</h1>
<div class="card">10.000 Coins – 9,99 €</div>
<div class="card">VIP Royal</div>
<a class="btn" href="#" onclick="show('home')">Zurück</a>
</div>

<div id="profile" class="screen">
<h1>Profil</h1>
<div class="card">Level 1<br>Siege: 0<br>Niederlagen: 0</div>
<a class="btn" href="#" onclick="show('home')">Zurück</a>
</div>
</body>
</html>
