<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101010;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

/* =====================================================
OOZ BALL
QUEUE + EXAKTES ZIELEN
===================================================== */

const GAME_W = 900;
const GAME_H = 500;

const TABLE_X = 50;
const TABLE_Y = 50;

const TABLE_W = 800;
const TABLE_H = 400;

const RAIL = 24;
const POCKET_R = 24;

const BALL_R = 10;


/* =====================================================
VARIABLEN
===================================================== */

let ball;
let ballGraphic;

let aimGraphic;
let cueGraphic;
let powerGraphic;

let dragging = false;

let aimDX = -1;
let aimDY = 0;

let shotPower = 0;


/* =====================================================
PHASER
===================================================== */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101010',

physics: {

default: 'matter',

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {
create: create,
update: update
}
};

new Phaser.Game(config);


/* =====================================================
CREATE
===================================================== */

function create() {

const scene = this;


/* =================================================
TISCH
================================================= */

const table = scene.add.graphics();


/* Schatten */

table.fillStyle(
0x000000,
0.40
);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
18
);


/* Außenrahmen */

table.fillStyle(
0x171717,
1
);

table.fillRoundedRect(
TABLE_X - 28,
TABLE_Y - 28,
TABLE_W + 56,
TABLE_H + 56,
16
);


/* Goldkante */

table.lineStyle(
4,
0xc9a34a,
1
);

table.strokeRoundedRect(
TABLE_X - 24,
TABLE_Y - 24,
TABLE_W + 48,
TABLE_H + 48,
13
);


/* Bande */

table.fillStyle(
0x4a2c19,
1
);

table.fillRoundedRect(
TABLE_X - 18,
TABLE_Y - 18,
TABLE_W + 36,
TABLE_H + 36,
10
);


/* Spielfeld */

table.fillStyle(
0x126247,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* Spielfeldkante */

table.lineStyle(
3,
0x0b3e30,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* =================================================
TASCHEN
================================================= */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* =================================================
Banden
================================================= */

createRails(scene);


/* =================================================
WEISSE KUGEL
================================================= */

ball = scene.matter.add.circle(

TABLE_X + 200,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.92,

friction: 0.01,

frictionAir: 0.025,

density: 0.004
}
);


/* =================================================
KUGEL GRAPHIK
================================================= */

ballGraphic =
scene.add.graphics();


/* =================================================
ZIELLINIE
================================================= */

aimGraphic =
scene.add.graphics();


/* =================================================
QUEUE
================================================= */

cueGraphic =
scene.add.graphics();


/* =================================================
POWER
================================================= */

powerGraphic =
scene.add.graphics();


/* =================================================
POINTER DOWN
================================================= */

scene.input.on(
'pointerdown',
function(pointer) {

if (!ball) {
return;
}


/* Kugel muss stehen */

const speed =
Math.sqrt(
ball.velocity.x *
ball.velocity.x +

ball.velocity.y *
ball.velocity.y
);


if (speed > 0.08) {
return;
}


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance <= 45) {

dragging = true;

updateAim(
pointer.worldX,
pointer.worldY
);
}
}
);


/* =================================================
POINTER MOVE
================================================= */

scene.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

updateAim(
pointer.worldX,
pointer.worldY
);
}
);


/* =================================================
POINTER UP
================================================= */

scene.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}


dragging = false;


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


const power =
Math.min(
distance,
180
);


aimGraphic.clear();

cueGraphic.clear();

powerGraphic.clear();


if (distance < 8) {
return;
}


/* =========================================
STOßRICHTUNG

Drag nach hinten
= Kugel fliegt nach vorne
========================================= */

const dirX =
-dx / distance;

const dirY =
-dy / distance;


/* =========================================
STOßKRAFT
========================================= */

const force =
power * 0.00007;


scene.matter.body.applyForce(

ball,

ball.position,

{
x: dirX * power * 0.00007,

y: dirY * power * 0.00007
}
);


shotPower = 0;
}
);


/* =================================================
LOGO
================================================= */

scene.add.text(

TABLE_X,

12,

'OOZ BALL',

{
fontFamily: 'Arial',

fontSize: '24px',

fontStyle: 'bold',

color: '#d6b15a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 120,

16,

'8 BALL',

{
fontFamily: 'Arial',

fontSize: '14px',

color: '#ffffff',

alpha: 0.65
}
);


drawBall();
}


/* =====================================================
AIM
===================================================== */

function updateAim(
mouseX,
mouseY
) {

if (!ball) {
return;
}


const dx =
mouseX -
ball.position.x;

const dy =
mouseY -
ball.position.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance < 1) {
return;
}


/* ================================================
DRAG-RICHTUNG

Diese Richtung zeigt nach hinten.
================================================ */

const backX =
dx / distance;

const backY =
dy / distance;


/* ================================================
SCHUSSRICHTUNG

Genau entgegengesetzt.
================================================ */

aimDX =
-backX;

aimDY =
-backY;


/* ================================================
POWER
================================================ */

shotPower =
Math.min(
distance,
180
);


drawAim();


drawCue();


drawPower();
}


/* =====================================================
ZIELLINIE
===================================================== */

function drawAim() {

aimGraphic.clear();


const startX =
ball.position.x;

const startY =
ball.position.y;


/* lange präzise Ziellinie */

const lineLength = 650;


const endX =
startX +
aimDX *
lineLength;

const endY =
startY +
aimDY *
lineLength;


/* dünner Schatten */

aimGraphic.lineStyle(
4,
0x000000,
0.25
);

aimGraphic.beginPath();

aimGraphic.moveTo(
startX,
startY
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* weiße Ziellinie */

aimGraphic.lineStyle(
1.5,
0xffffff,
0.95
);

aimGraphic.beginPath();

aimGraphic.moveTo(
startX,
startY
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


/* Mittelpunkt */

aimGraphic.lineStyle(
1,
0xffffff,
0.8
);

aimGraphic.strokeCircle(
startX,
startY,
BALL_R + 5
);
}


/* =====================================================
PREMIUM QUEUE
===================================================== */

function drawCue() {

cueGraphic.clear();


if (!dragging) {
return;
}


const centerX =
ball.position.x;

const centerY =
ball.position.y;


/* ================================================
QUEUE LÄNGE
================================================ */

const cueLength =
230 +
shotPower * 0.55;


/* ================================================
QUEUE BEGINNT EXAKT
IM MITTELPUNKT DER KUGEL
================================================ */

const tipX =
centerX;

const tipY =
centerY;


const buttX =
centerX -
aimDX *
cueLength;

const buttY =
centerY -
aimDY *
cueLength;


/* ================================================
SCHATTEN
================================================ */

cueGraphic.lineStyle(
10,
0x000000,
0.35
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* ================================================
QUEUE-SCHAFT
================================================ */

cueGraphic.lineStyle(
6,
0xd5a65a,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* ================================================
HELLER HOLZSTREIFEN
================================================ */

cueGraphic.lineStyle(
2,
0xffe7ad,
0.9
);

cueGraphic.beginPath();

cueGraphic.moveTo(
tipX,
tipY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* ================================================
TIP
================================================ */

cueGraphic.fillStyle(
0xf2eee5,
1
);

cueGraphic.fillCircle(
tipX,
tipY,
2.2
);


/* ================================================
JOINT
================================================ */

const jointDistance =
cueLength * 0.28;


const jointX =
centerX -
aimDX *
jointDistance;

const jointY =
centerY -
aimDY *
jointDistance;


cueGraphic.lineStyle(
7,
0x8b5a2b,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
jointX,
jointY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* ================================================
GRIFF
================================================ */

const gripStart =
cueLength * 0.68;


const gripStartX =
centerX -
aimDX *
gripStart;

const gripStartY =
centerY -
aimDY *
gripStart;


cueGraphic.lineStyle(
8,
0x191919,
1
);

cueGraphic.beginPath();

cueGraphic.moveTo(
gripStartX,
gripStartY
);

cueGraphic.lineTo(
buttX,
buttY
);

cueGraphic.strokePath();


/* ================================================
GOLDENE DETAILRINGE
================================================ */

for (
let i = 0;
i < 4;
i++
) {

const p =
0.70 +
i * 0.065;


const ringX =
centerX -
aimDX *
cueLength *
p;

const ringY =
centerY -
aimDY *
cueLength *
p;


cueGraphic.fillStyle(
0xc9a34a,
1
);

cueGraphic.fillCircle(
ringX,
ringY,
1.8
);
}
}


/* =====================================================
POWER
===================================================== */

function drawPower() {

powerGraphic.clear();


if (!dragging) {
return;
}


const x = 20;
const y = 120;

const width = 18;
const height = 170;


/* Außen */

powerGraphic.fillStyle(
0x151515,
1
);

powerGraphic.fillRoundedRect(
x,
y,
width,
height,
7
);


/* Innen */

const fillHeight =
height *
(shotPower / 180);


powerGraphic.fillStyle(
0xc9a34a,
1
);

powerGraphic.fillRoundedRect(
x + 4,
y +
height -
fillHeight +
4,

width - 8,

fillHeight - 8,

4
);
}


/* =====================================================
POCKET
===================================================== */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();


g.fillStyle(
0x0b0b0b,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);


g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);


g.lineStyle(
2,
0x292929,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* =====================================================
RAILS
===================================================== */

function createRails(scene) {

const gap =
POCKET_R * 2.2;

const mid =
TABLE_W / 2;


/* OBEN */

addRail(
scene,

TABLE_X +
(mid - gap) / 2,

TABLE_Y -
RAIL / 2,

mid - gap,

RAIL
);


addRail(
scene,

TABLE_X +
mid +
(mid - gap) / 2,

TABLE_Y -
RAIL / 2,

mid - gap,

RAIL
);


/* UNTEN */

addRail(
scene,

TABLE_X +
(mid - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

mid - gap,

RAIL
);


addRail(
scene,

TABLE_X +
mid +
(mid - gap) / 2,

TABLE_Y +
TABLE_H +
RAIL / 2,

mid - gap,

RAIL
);


/* SEITEN */

const sideLength =
TABLE_H / 2 -
gap;


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X -
RAIL / 2,

TABLE_Y +
TABLE_H -
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
sideLength / 2,

RAIL,

sideLength
);


addRail(
scene,

TABLE_X +
TABLE_W +
RAIL / 2,

TABLE_Y +
TABLE_H -
sideLength / 2,

RAIL,

sideLength
);
}


/* =====================================================
MATTER RAIL
===================================================== */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,
y,
width,
height,

{
isStatic: true,

restitution: 0.95,

friction: 0
}
);
}


/* =====================================================
WEISSE KUGEL
===================================================== */

function drawBall() {

ballGraphic.clear();


/* Schatten */

ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(

ball.position.x + 2,

ball.position.y + 2,

BALL_R + 2
);


/* Kugel */

ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x,

ball.position.y,

BALL_R
);


/* Glanz */

ballGraphic.fillStyle(
0xeaf4ff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,

ball.position.y - 3,

2
);
}


/* =====================================================
UPDATE
===================================================== */

function update() {

if (!ball) {
return;
}


drawBall();


/* ================================================
QUEUE NUR BEIM ZIELEN
================================================ */

if (!dragging) {

cueGraphic.clear();

aimGraphic.clear();

powerGraphic.clear();
}
}

</script>

</body>
</html>
