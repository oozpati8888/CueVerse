<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>OOZ BALL</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#07111c;
font-family:Arial,sans-serif;
}

body{
display:flex;
align-items:center;
justify-content:center;
}

canvas{
display:block;
touch-action:none;
user-select:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
"use strict";

/* =========================================================
OOZ BALL
BROWSER BILLARD ENGINE
========================================================= */

const {
Engine,
Bodies,
Body,
Composite,
Events
} = Matter;


/* =========================================================
CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WORLD_W = 1200;
const WORLD_H = 600;

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let dpr = 1;

function resize(){

dpr = Math.min(window.devicePixelRatio || 1,2);

const s = Math.min(
window.innerWidth / WORLD_W,
window.innerHeight / WORLD_H
);

scale = s;

offsetX =
(window.innerWidth - WORLD_W * scale) / 2;

offsetY =
(window.innerHeight - WORLD_H * scale) / 2;

canvas.width =
Math.round(window.innerWidth * dpr);

canvas.height =
Math.round(window.innerHeight * dpr);

canvas.style.width =
window.innerWidth + "px";

canvas.style.height =
window.innerHeight + "px";
}

window.addEventListener("resize",resize);
resize();


function screenToWorld(e){

return {
x:(e.clientX-offsetX)/scale,
y:(e.clientY-offsetY)/scale
};

}


/* =========================================================
TABLE
========================================================= */

const TABLE = {
x:100,
y:50,
w:1000,
h:500
};

const PLAY = {
x:125,
y:75,
w:950,
h:450
};

const BALL_RADIUS = 15;

const POCKET_RADIUS = 28;


/* =========================================================
PHYSICS
========================================================= */

const engine = Engine.create({

enableSleeping:true,

positionIterations:12,

velocityIterations:10,

constraintIterations:4
});

engine.gravity.x=0;
engine.gravity.y=0;

const world=engine.world;


/* =========================================================
POCKETS
========================================================= */

const pockets=[

{
x:PLAY.x,
y:PLAY.y
},

{
x:PLAY.x+PLAY.w/2,
y:PLAY.y
},

{
x:PLAY.x+PLAY.w,
y:PLAY.y
},

{
x:PLAY.x,
y:PLAY.y+PLAY.h
},

{
x:PLAY.x+PLAY.w/2,
y:PLAY.y+PLAY.h
},

{
x:PLAY.x+PLAY.w,
y:PLAY.y+PLAY.h
}

];


/* =========================================================
BANDS
========================================================= */

function createRails(){

const t=12;

const options={
isStatic:true,
restitution:0.92,
friction:0.015
};

const gap=POCKET_RADIUS+5;

const cx=PLAY.x+PLAY.w/2;


/* TOP */

Composite.add(world,[

Bodies.rectangle(
(PLAY.x+gap+cx-gap)/2,
PLAY.y-3,
cx-PLAY.x-2*gap,
t,
options
),

Bodies.rectangle(
(cx+gap+PLAY.x+PLAY.w-gap)/2,
PLAY.y-3,
PLAY.x+PLAY.w-cx-2*gap,
t,
options
)

]);


/* BOTTOM */

Composite.add(world,[

Bodies.rectangle(
(PLAY.x+gap+cx-gap)/2,
PLAY.y+PLAY.h+3,
cx-PLAY.x-2*gap,
t,
options
),

Bodies.rectangle(
(cx+gap+PLAY.x+PLAY.w-gap)/2,
PLAY.y+PLAY.h+3,
PLAY.x+PLAY.w-cx-2*gap,
t,
options
)

]);


/* LEFT */

Composite.add(
world,

Bodies.rectangle(
PLAY.x-3,
(PLAY.y+gap+PLAY.y+PLAY.h-gap)/2,
t,
PLAY.h-2*gap,
options
)
);


/* RIGHT */

Composite.add(
world,

Bodies.rectangle(
PLAY.x+PLAY.w+3,
(PLAY.y+gap+PLAY.y+PLAY.h-gap)/2,
t,
PLAY.h-2*gap,
options
)
);

}

createRails();


/* =========================================================
BALL SYSTEM
========================================================= */

let balls=[];

let cueBall=null;


function createBall(
x,
y,
type,
color,
number=0
){

const body=Bodies.circle(
x,
y,
BALL_RADIUS,
{

restitution:0.94,

friction:0.01,

frictionAir:0.009,

density:0.001,

slop:0.005,

label:type==="cue"
?"cueBall"
:"objectBall"

}
);


body.plugin={

type:type,

color:color,

number:number,

pocketed:false

};


Composite.add(world,body);

balls.push(body);

return body;
}


/* =========================================================
WEISSE
========================================================= */

cueBall=createBall(
330,
300,
"cue",
"#ffffff",
0
);


/* =========================================================
13 OBJEKTKUGELN
6 VOLL
6 GESTREIFT
1 SCHWARZE 8
========================================================= */

const solids=[

"#f4c51d",
"#1d55c7",
"#c62b2b",
"#6f2ca0",
"#f39a20",
"#159447"

];

const stripes=[

"#f4c51d",
"#1d55c7",
"#c62b2b",
"#6f2ca0",
"#f39a20",
"#159447"

];


/*
Kompakte 13-Kugel-Aufstellung.
*/

const rackX=850;
const rackY=300;

const horizontalSpacing=
Math.sqrt(3)*BALL_RADIUS;

const verticalSpacing=
BALL_RADIUS*2;


const positions=[

[0,0],

[1,-.5],
[1,.5],

[2,-1],
[2,0],
[2,1],

[3,-1.5],
[3,-.5],
[3,.5],
[3,1.5],

[4,-1],
[4,0],
[4,1]

];


const rackTypes=[

["solid",solids[0],1],

["solid",solids[1],2],

["solid",solids[2],3],

["stripe",stripes[0],9],

["eight","#111111",8],

["solid",solids[3],4],

["stripe",stripes[1],10],

["stripe",stripes[2],11],

["solid",solids[4],5],

["stripe",stripes[3],12],

["solid",solids[5],6],

["stripe",stripes[4],13],

["stripe",stripes[5],14]

];


positions.forEach((pos,i)=>{

const row=pos[0];
const col=pos[1];

const x=
rackX+
row*horizontalSpacing;

const y=
rackY+
col*verticalSpacing;

const data=rackTypes[i];

createBall(
x,
y,
data[0],
data[1],
data[2]
);

});


/* =========================================================
AIM / CUE
========================================================= */

let aimAngle=0;

let charging=false;

let pull=0;

let pressStart=null;

let shotInProgress=false;

const MAX_PULL=230;

const MIN_PULL=8;

const MAX_SPEED=25;


/* =========================================================
POINTER DOWN
========================================================= */

canvas.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

if(shotInProgress)
return;


const p=screenToWorld(e);


const dx=
p.x-cueBall.position.x;

const dy=
p.y-cueBall.position.y;

const distance=
Math.hypot(dx,dy);


/*
Nur direkt an der weißen Kugel
wird der Stoß gestartet.
*/

if(distance<60){

charging=true;

pressStart={
x:p.x,
y:p.y
};


/*
Die Zielrichtung wird beim
Beginn des Stoßes eingefroren.

Dadurch kann der Kö NICHT
wild nach links/rechts springen.
*/

aimAngle=
Math.atan2(dy,dx);

pull=0;


canvas.setPointerCapture?.(
e.pointerId
);

}

}
);


/* =========================================================
POINTER MOVE
========================================================= */

canvas.addEventListener(
"pointermove",
function(e){

e.preventDefault();

if(shotInProgress)
return;


const p=screenToWorld(e);


if(charging){

/*
Nur Bewegung entlang der
bereits festgelegten Achse
verändert die Stoßstärke.
*/

const ux=Math.cos(aimAngle);
const uy=Math.sin(aimAngle);


const mx=
p.x-pressStart.x;

const my=
p.y-pressStart.y;


const projection=
mx*ux+
my*uy;


pull=Math.max(
0,
Math.min(
MAX_PULL,
-projection
)
);


return;

}


/*
Außerhalb des Stoßes kann
die Richtung frei eingestellt
werden.
*/

const dx=
p.x-cueBall.position.x;

const dy=
p.y-cueBall.position.y;


if(Math.hypot(dx,dy)>5){

aimAngle=
Math.atan2(dy,dx);

}

}
);


/* =========================================================
POINTER UP = STOß
========================================================= */

canvas.addEventListener(
"pointerup",
function(e){

e.preventDefault();


if(!charging)
return;


charging=false;


canvas.releasePointerCapture?.(
e.pointerId
);


if(pull<MIN_PULL){

pull=0;

return;

}


/*
Stoßstärke mathematisch
aus dem Rückzug.
*/

const speed=
MAX_SPEED*
(pull/MAX_PULL);


const vx=
Math.cos(aimAngle)*speed;

const vy=
Math.sin(aimAngle)*speed;


/*
Exakt gerader Center-Hit.
*/

Body.setVelocity(
cueBall,
{
x:vx,
y:vy
}
);


Body.setAngularVelocity(
cueBall,
0
);


/*
Kugel darf schlafen,
wenn sie wirklich steht.
*/

Body.setSleeping(
cueBall,
false
);


shotInProgress=true;

pull=0;

}
);


/* =========================================================
PHYSIK-DÄMPFUNG
========================================================= */

Events.on(
engine,
"beforeUpdate",
function(){

for(const ball of balls){

if(ball.plugin.pocketed)
continue;


const speed=
Math.hypot(
ball.velocity.x,
ball.velocity.y
);


if(speed<0.018){

Body.setVelocity(
ball,
{
x:0,
y:0
}
);

Body.setAngularVelocity(
ball,
0
);

}

}

}
);


/* =========================================================
TASCHEN
========================================================= */

Events.on(
engine,
"afterUpdate",
function(){

for(const ball of balls){

if(ball.plugin.pocketed)
continue;


for(const pocket of pockets){

const distance=
Math.hypot(
ball.position.x-pocket.x,
ball.position.y-pocket.y
);


if(
distance<
POCKET_RADIUS-3
){

ball.plugin.pocketed=true;


Body.setVelocity(
ball,
{
x:0,
y:0
}
);


if(ball===cueBall){

/*
Scratch:
weiße Kugel kommt
wieder auf den Tisch.
*/

setTimeout(
function(){

ball.plugin.pocketed=false;

Body.setPosition(
ball,
{
x:330,
y:300
}
);

Body.setVelocity(
ball,
{
x:0,
y:0
}
);

shotInProgress=false;

},
400
);

}
else{

setTimeout(
function(){

Composite.remove(
world,
ball
);

},
150
);

}

break;

}

}

}


if(
shotInProgress &&
Math.hypot(
cueBall.velocity.x,
cueBall.velocity.y
)<0.08
){

Body.setVelocity(
cueBall,
{
x:0,
y:0
}
);

shotInProgress=false;

}

}
);


/* =========================================================
TABLE RENDER
========================================================= */

function roundedRect(
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.arcTo(
x+w,
y,
x+w,
y+h,
r
);

ctx.arcTo(
x+w,
y+h,
x,
y+h,
r
);

ctx.arcTo(
x,
y+h,
x,
y,
r
);

ctx.arcTo(
x,
y,
x+w,
y,
r
);

ctx.closePath();

}


/* =========================================================
TISCH
========================================================= */

function drawTable(){

ctx.fillStyle="#07111c";

ctx.fillRect(
0,
0,
WORLD_W,
WORLD_H
);


/* Außenrahmen */

ctx.fillStyle="#15151a";

roundedRect(
TABLE.x-25,
TABLE.y-25,
TABLE.w+50,
TABLE.h+50,
30
);

ctx.fill();


ctx.strokeStyle="#d8b477";

ctx.lineWidth=3;

ctx.stroke();


/* Bande */

ctx.fillStyle="#641f1a";

roundedRect(
TABLE.x,
TABLE.y,
TABLE.w,
TABLE.h,
22
);

ctx.fill();


ctx.strokeStyle="#b87943";

ctx.lineWidth=5;

ctx.stroke();


/* Spielfeld */

ctx.fillStyle="#0c6979";

roundedRect(
PLAY.x-7,
PLAY.y-7,
PLAY.w+14,
PLAY.h+14,
14
);

ctx.fill();


const cloth=
ctx.createLinearGradient(
PLAY.x,
PLAY.y,
PLAY.x+PLAY.w,
PLAY.y+PLAY.h
);

cloth.addColorStop(
0,
"#1993a5"
);

cloth.addColorStop(
0.5,
"#168296"
);

cloth.addColorStop(
1,
"#0c6475"
);


ctx.fillStyle=cloth;

roundedRect(
PLAY.x,
PLAY.y,
PLAY.w,
PLAY.h,
8
);

ctx.fill();


/* Kopflinie */

ctx.strokeStyle=
"rgba(255,255,255,.14)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
PLAY.x+PLAY.w*.25,
PLAY.y
);

ctx.lineTo(
PLAY.x+PLAY.w*.25,
PLAY.y+PLAY.h
);

ctx.stroke();


/* Logo */

ctx.fillStyle=
"rgba(255,255,255,.14)";

ctx.font=
"bold 52px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
"OOZ BALL",
WORLD_W/2,
WORLD_H/2
);


ctx.textAlign="left";

ctx.textBaseline="alphabetic";


/* Taschen */

pockets.forEach(
drawPocket
);

}


/* =========================================================
TASCHEN DESIGN
========================================================= */

function drawPocket(p){

const r=POCKET_RADIUS;

ctx.save();

ctx.translate(
p.x,
p.y
);


ctx.fillStyle="#07090c";

ctx.beginPath();


/*
Nicht einfach ein Kreis.

Die Öffnung bekommt eine
echte Billard-ähnliche Form.
*/

ctx.moveTo(
-r,
-r*.25
);


ctx.quadraticCurveTo(
-r*.6,
-r*.95,
0,
-r
);


ctx.quadraticCurveTo(
r*.6,
-r*.95,
r,
-r*.25
);


ctx.lineTo(
r*.72,
r*.72
);


ctx.quadraticCurveTo(
0,
r*1.05,
-r*.72,
r*.72
);


ctx.closePath();

ctx.fill();


ctx.strokeStyle=
"rgba(90,210,225,.35)";

ctx.lineWidth=3;

ctx.stroke();


ctx.restore();

}


/* =========================================================
BALLEN
========================================================= */

function drawBall(ball){

if(ball.plugin.pocketed)
return;


const x=ball.position.x;
const y=ball.position.y;


ctx.save();


/* Schatten */

ctx.fillStyle=
"rgba(0,0,0,.25)";

ctx.beginPath();

ctx.ellipse(
x+2,
y+3,
BALL_RADIUS*1.03,
BALL_RADIUS*.78,
0,
0,
Math.PI*2
);

ctx.fill();


/* Glanz */

const gradient=
ctx.createRadialGradient(
x-5,
y-6,
2,
x,
y,
BALL_RADIUS
);


if(ball===cueBall){

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.65,
"#f0f0f0"
);

gradient.addColorStop(
1,
"#bcbcbc"
);

}
else{

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.18,
ball.plugin.color
);

gradient.addColorStop(
1,
ball.plugin.color
);

}


ctx.fillStyle=gradient;

ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS,
0,
Math.PI*2
);

ctx.fill();


ctx.strokeStyle=
"rgba(0,0,0,.3)";

ctx.lineWidth=1.2;

ctx.stroke();


/* Gestreifte Kugel */

if(ball.plugin.type==="stripe"){

ctx.save();

ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS-1,
0,
Math.PI*2
);

ctx.clip();


ctx.fillStyle="#ffffff";

ctx.fillRect(
x-BALL_RADIUS,
y-5,
BALL_RADIUS*2,
10
);


ctx.restore();

}


/* Schwarze 8 */

if(ball.plugin.number===8){

ctx.fillStyle="#080808";

ctx.beginPath();

ctx.arc(
x,
y,
BALL_RADIUS-1,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#ffffff";

ctx.beginPath();

ctx.arc(
x,
y,
6,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#111";

ctx.font=
"bold 7px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
"8",
x,
y
);

}


/* Nummer */

if(
ball!==cueBall &&
ball.plugin.number &&
ball.plugin.number!==8
){

ctx.fillStyle="#ffffff";

ctx.beginPath();

ctx.arc(
x,
y,
6,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#111";

ctx.font=
"bold 6px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
String(ball.plugin.number),
x,
y
);

}


ctx.restore();

}


/* =========================================================
ZIELLINIE + KÖ
========================================================= */

function drawAim(){

if(
cueBall.plugin.pocketed ||
shotInProgress
)
return;


const ux=
Math.cos(aimAngle);

const uy=
Math.sin(aimAngle);


/* Ziellinie */

ctx.save();

ctx.strokeStyle=
"rgba(255,255,255,.78)";

ctx.lineWidth=2;

ctx.setLineDash([
12,
8
]);


ctx.beginPath();

ctx.moveTo(
cueBall.position.x+
ux*(BALL_RADIUS+3),

cueBall.position.y+
uy*(BALL_RADIUS+3)
);


ctx.lineTo(
cueBall.position.x+
ux*400,

cueBall.position.y+
uy*400
);


ctx.stroke();

ctx.setLineDash([]);


/*
WICHTIG:

Der Kö endet immer VOR der
weißen Kugel und steckt NICHT
in der Kugel.

Beim Zurückziehen bewegt sich
der gesamte Kö nach hinten.
*/


const cueLength=320;

const normalGap=32;

const backward=
normalGap+
pull;


const tipX=
cueBall.position.x-
ux*backward;

const tipY=
cueBall.position.y-
uy*backward;


const buttX=
tipX-
ux*cueLength;

const buttY=
tipY-
uy*cueLength;


/* Schaft */

const shaft=
ctx.createLinearGradient(
buttX,
buttY,
tipX,
tipY
);


shaft.addColorStop(
0,
"#211814"
);

shaft.addColorStop(
.15,
"#7b542f"
);

shaft.addColorStop(
.78,
"#ead8b9"
);

shaft.addColorStop(
1,
"#fff3dc"
);


ctx.strokeStyle=shaft;

ctx.lineWidth=7;

ctx.lineCap="round";


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
tipX,
tipY
);

ctx.stroke();


/* Hochwertiger Griff */

ctx.strokeStyle="#b8934e";

ctx.lineWidth=13;


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
buttX+ux*70,
buttY+uy*70
);

ctx.stroke();


ctx.strokeStyle="#17181d";

ctx.lineWidth=8;


ctx.beginPath();

ctx.moveTo(
buttX-ux*5,
buttY-uy*5
);

ctx.lineTo(
buttX+ux*52,
buttY+uy*52
);

ctx.stroke();


/* Ferrule */

ctx.strokeStyle="#dadada";

ctx.lineWidth=9;


ctx.beginPath();

ctx.moveTo(
tipX-ux*18,
tipY-uy*18
);

ctx.lineTo(
tipX,
tipY
);

ctx.stroke();


/* Leder-Tip */

ctx.strokeStyle="#171717";

ctx.lineWidth=4;


ctx.beginPath();

ctx.moveTo(
tipX-ux*3,
tipY-uy*3
);

ctx.lineTo(
tipX+ux*3,
tipY+uy*3
);

ctx.stroke();


/* Zielring */

ctx.strokeStyle=
"rgba(255,255,255,.7)";

ctx.lineWidth=2;


ctx.beginPath();

ctx.arc(
cueBall.position.x,
cueBall.position.y,
23,
0,
Math.PI*2
);

ctx.stroke();


ctx.restore();

}


/* =========================================================
POWER BAR
========================================================= */

function drawPower(){

const x=38;
const y=160;

const w=20;
const h=280;


ctx.strokeStyle="#d8b37b";

ctx.lineWidth=3;

ctx.strokeRect(
x,
y,
w,
h
);


const amount=
pull/MAX_PULL;


const filled=
amount*(h-8);


ctx.fillStyle=
amount>.75
?"#d94336"
:"#e5bb37";


ctx.fillRect(
x+4,
y+h-4-filled,
w-8,
filled
);


ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.font="13px Arial";

ctx.fillText(
"POWER",
28,
150
);

}


/* =========================================================
HUD
========================================================= */

function drawHUD(){

ctx.fillStyle="#e7c99b";

ctx.font=
"bold 28px Arial";

ctx.fillText(
"OOZ BALL",
42,
38
);


ctx.font=
"bold 16px Arial";

ctx.fillText(
"8 BALL",
WORLD_W-100,
38
);


drawPower();

}


/* =========================================================
RENDER LOOP
========================================================= */

function render(){

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.save();


ctx.translate(
offsetX,
offsetY
);


ctx.scale(
scale,
scale
);


drawTable();


for(const ball of balls){

drawBall(ball);

}


drawAim();


drawHUD();


ctx.restore();


requestAnimationFrame(render);

}


/* =========================================================
PHYSICS LOOP
========================================================= */

let lastTime=performance.now();


function physicsLoop(now){

const delta=
Math.min(
20,
now-lastTime
);


lastTime=now;


Engine.update(
engine,
delta
);


requestAnimationFrame(
physicsLoop
);

}


requestAnimationFrame(
physicsLoop
);


/* =========================================================
START
========================================================= */

render();

</script>
