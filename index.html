<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse Royal Table</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
min-height:100%;
background:
radial-gradient(circle at 50% -10%,#39352e 0,#171717 38%,#050505 75%);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

body{
overflow-x:hidden;
}

.topbar{
width:96%;
max-width:1280px;
margin:auto;
min-height:82px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:20px;
}

.player{
font-size:14px;
line-height:1.5;
color:#d9d9d9;
}

.player.right{
text-align:right;
}

.playerName{
color:#f0d078;
font-size:17px;
font-weight:700;
}

.logo{
color:#e5bd55;
font-size:27px;
font-weight:800;
letter-spacing:5px;
text-shadow:
0 1px 0 #5b4012,
0 0 18px rgba(226,186,78,.35);
}

.stake{
text-align:center;
color:#e8c45d;
font-weight:700;
font-size:13px;
letter-spacing:1px;
margin-bottom:12px;
}

.game{
width:96%;
max-width:1280px;
margin:auto;
}

.tableShell{
position:relative;
padding:25px;
border-radius:26px;

background:
linear-gradient(135deg,
#080604 0%,
#4b2e12 18%,
#1a1008 42%,
#6a4319 70%,
#080604 100%);

border:1px solid #d0a43e;

box-shadow:
0 20px 55px rgba(0,0,0,.85),
0 0 40px rgba(216,174,63,.18),
inset 0 0 35px rgba(0,0,0,.8);
}

.tableBevel{
position:relative;
padding:12px;

border-radius:18px;

background:
linear-gradient(145deg,
#1c1108,
#8b5a20 35%,
#3d220d 55%,
#120a04);

box-shadow:
inset 0 0 20px #000,
0 5px 12px rgba(0,0,0,.8);
}

canvas{
display:block;
width:100%;
height:auto;

border-radius:10px;

box-shadow:
0 12px 35px rgba(0,0,0,.9),
inset 0 0 30px rgba(0,0,0,.5);

cursor:crosshair;
touch-action:none;
}

.controls{
max-width:950px;
margin:18px auto 28px;
}

.powerRow{
display:flex;
align-items:center;
gap:13px;
}

.powerTitle{
color:#e8c45d;
font-size:12px;
font-weight:800;
letter-spacing:1.5px;
}

#power{
flex:1;
accent-color:#d9ad3c;
}

#powerValue{
min-width:55px;
color:#e8c45d;
font-weight:700;
}

button{
margin:11px 5px;
padding:13px 26px;
border-radius:9px;
border:1px solid #d7b34e;

background:
linear-gradient(#f4d575,#b88724);

color:#120d05;
font-weight:800;
letter-spacing:.5px;

box-shadow:
0 5px 12px rgba(0,0,0,.5),
inset 0 1px rgba(255,255,255,.5);

cursor:pointer;
}

button:active{
transform:translateY(1px);
}

button:disabled{
opacity:.38;
cursor:not-allowed;
}

.status{
min-height:24px;
color:#c7c7c7;
font-size:14px;
}

.help{
margin-top:6px;
color:#777;
font-size:11px;
}

@media(max-width:700px){

.topbar{
grid-template-columns:1fr auto 1fr;
gap:7px;
}

.player{
font-size:10px;
}

.playerName{
font-size:12px;
}

.logo{
font-size:17px;
letter-spacing:3px;
}

.tableShell{
padding:8px;
}

.tableBevel{
padding:5px;
}
}
</style>
</head>

<body>

<div class="topbar">

<div class="player">
<div class="playerName">ORHAN</div>
Level 1<br>
🪙 10.000 Coins
</div>

<div class="logo">CUEVERSE</div>

<div class="player right">
<div class="playerName">OOZ PLAYER</div>
Level 12<br>
🪙 10.000 Coins
</div>

</div>

<div class="stake">
ROYAL TABLE &nbsp; • &nbsp; 100 COINS
</div>

<div class="game">

<div class="tableShell">
<div class="tableBevel">
<canvas id="table" width="1400" height="700"></canvas>
</div>
</div>

<div class="controls">

<div class="powerRow">

<span class="powerTitle">SHOT POWER</span>

<input
id="power"
type="range"
min="1"
max="100"
value="65"
>

<span id="powerValue">65%</span>

</div>

<button id="shootButton">
STOSS AUSFÜHREN
</button>

<button id="resetButton">
NEUSTART
</button>

<div id="status" class="status">
Zielen und Stoßstärke einstellen.
</div>

<div class="help">
Maus bewegen = zielen • Power einstellen • Stoß ausführen
</div>

</div>

</div>

<script>

const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");

const powerSlider = document.getElementById("power");
const powerValue = document.getElementById("powerValue");
const shootButton = document.getElementById("shootButton");
const resetButton = document.getElementById("resetButton");
const statusText = document.getElementById("status");

const W = canvas.width;
const H = canvas.height;

/* --------------------------------------------------
TABLE GEOMETRY
-------------------------------------------------- */

const RAIL = 68;

const PLAY_LEFT = RAIL + 17;
const PLAY_RIGHT = W - RAIL - 17;
const PLAY_TOP = RAIL + 17;
const PLAY_BOTTOM = H - RAIL - 17;

const BALL_R = 17;

const pockets = [
{x:RAIL,y:RAIL},
{x:W/2,y:RAIL},
{x:W-RAIL,y:RAIL},
{x:RAIL,y:H-RAIL},
{x:W/2,y:H-RAIL},
{x:W-RAIL,y:H-RAIL}
];

/* --------------------------------------------------
PHYSICS
-------------------------------------------------- */

const BALL_RESTITUTION = 0.985;
const CUSHION_RESTITUTION = 0.88;

const STOP_SPEED = 5;

let balls = [];
let aiming = true;

let mouseX = 310;
let mouseY = H/2;

let lastTime = performance.now();

/* --------------------------------------------------
BALL COLORS
-------------------------------------------------- */

const ballColors = [
"#f4c72d",
"#2b73d2",
"#d83b43",
"#8d43c8",
"#ed8623",
"#20a36d",
"#b53a2a",
"#080808",
"#f4c72d",
"#2b73d2",
"#d83b43",
"#8d43c8",
"#ed8623",
"#20a36d",
"#d83b43"
];

/* --------------------------------------------------
CREATE BALL
-------------------------------------------------- */

function createBall(x,y,color,number){

balls.push({
x:x,
y:y,
vx:0,
vy:0,
color:color,
number:number,
active:true
});
}

/* --------------------------------------------------
SETUP
-------------------------------------------------- */

function setupTable(){

balls=[];

/* Cue ball */

createBall(
280,
H/2,
"#ffffff",
0
);

/*
Tight professional 15-ball triangle
*/

const startX = 1010;
const startY = H/2;

const spacing = BALL_R * 2 + 0.8;

let number=1;

for(let row=0;row<5;row++){

for(let col=0;col<=row;col++){

const x =
startX + row * spacing;

const y =
startY +
(col - row/2) * spacing;

createBall(
x,
y,
ballColors[number-1],
number
);

number++;
}
}
}

/* --------------------------------------------------
REALISTIC CLOTH TEXTURE
-------------------------------------------------- */

function drawClothTexture(){

ctx.save();

ctx.globalAlpha=.065;

for(let y=PLAY_TOP;y<PLAY_BOTTOM;y+=7){

ctx.strokeStyle =
y%14===0
? "#ffffff"
: "#001c12";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
PLAY_LEFT,
y
);

ctx.lineTo(
PLAY_RIGHT,
y
);

ctx.stroke();
}

ctx.restore();
}

/* --------------------------------------------------
TABLE
-------------------------------------------------- */

function drawTable(){

ctx.clearRect(
0,
0,
W,
H
);

/* Deep wood */

const wood =
ctx.createLinearGradient(
0,
0,
W,
H
);

wood.addColorStop(0,"#0d0703");
wood.addColorStop(.16,"#5c3714");
wood.addColorStop(.32,"#1d1006");
wood.addColorStop(.58,"#77491a");
wood.addColorStop(.78,"#281507");
wood.addColorStop(1,"#080402");

ctx.fillStyle=wood;

ctx.fillRect(
0,
0,
W,
H
);

/* Inner wood highlight */

ctx.strokeStyle="#b7832b";
ctx.lineWidth=3;

ctx.strokeRect(
25,
25,
W-50,
H-50
);

/* Cloth */

const cloth =
ctx.createRadialGradient(
W/2,
H/2,
40,
W/2,
H/2,
760
);

cloth.addColorStop(
0,
"#13825b"
);

cloth.addColorStop(
.45,
"#08704d"
);

cloth.addColorStop(
.8,
"#045339"
);

cloth.addColorStop(
1,
"#022d20"
);

ctx.fillStyle=cloth;

ctx.fillRect(
RAIL,
RAIL,
W-RAIL*2,
H-RAIL*2
);

drawClothTexture();

/* Cushions */

const cushion =
ctx.createLinearGradient(
0,
0,
0,
40
);

cushion.addColorStop(
0,
"#164a38"
);

cushion.addColorStop(
.5,
"#0b3a2b"
);

cushion.addColorStop(
1,
"#061e16"
);

ctx.strokeStyle=cushion;
ctx.lineWidth=36;

ctx.strokeRect(
RAIL,
RAIL,
W-RAIL*2,
H-RAIL*2
);

/* Gold rail line */

ctx.strokeStyle="#d2aa45";
ctx.lineWidth=2;

ctx.strokeRect(
RAIL+18,
RAIL+18,
W-(RAIL+18)*2,
H-(RAIL+18)*2
);

/* Table center marking */

ctx.strokeStyle=
"rgba(255,255,255,.075)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
W/2,
PLAY_TOP
);

ctx.lineTo(
W/2,
PLAY_BOTTOM
);

ctx.stroke();

/* Pockets */

pockets.forEach(drawPocket);

/* Rail diamonds */

drawRailDiamonds();
}

/* --------------------------------------------------
DIAMONDS
-------------------------------------------------- */

function drawRailDiamonds(){

ctx.fillStyle="#dfc47d";

const positions=[
.15,.30,.50,.70,.85
];

positions.forEach(p=>{

const x =
RAIL +
(W-RAIL*2)*p;

drawDiamond(
x,
34
);

drawDiamond(
x,
H-34
);
});

[0.25,0.5,0.75].forEach(p=>{

const y =
RAIL +
(H-RAIL*2)*p;

drawDiamond(
34,
y
);

drawDiamond(
W-34,
y
);
});
}

function drawDiamond(x,y){

ctx.beginPath();

ctx.moveTo(
x,
y-5
);

ctx.lineTo(
x+5,
y
);

ctx.lineTo(
x,
y+5
);

ctx.lineTo(
x-5,
y
);

ctx.closePath();

ctx.fill();
}

/* --------------------------------------------------
POCKET
-------------------------------------------------- */

function drawPocket(p){

const outer =
ctx.createRadialGradient(
p.x-5,
p.y-5,
2,
p.x,
p.y,
36
);

outer.addColorStop(
0,
"#101010"
);

outer.addColorStop(
.55,
"#000000"
);

outer.addColorStop(
1,
"#090909"
);

ctx.fillStyle=outer;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
34,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#22150b";
ctx.lineWidth=5;

ctx.stroke();
}

/* --------------------------------------------------
BALL RENDERING
-------------------------------------------------- */

function drawBall(ball){

if(!ball.active)return;

/* Soft contact shadow */

ctx.save();

ctx.globalAlpha=.38;

ctx.fillStyle="#000";

ctx.beginPath();

ctx.ellipse(
ball.x+6,
ball.y+9,
BALL_R*1.02,
BALL_R*.55,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

/* Ball body */

const g =
ctx.createRadialGradient(
ball.x-7,
ball.y-8,
2,
ball.x,
ball.y,
BALL_R
);

if(ball.number===0){

g.addColorStop(0,"#ffffff");
g.addColorStop(.28,"#fafafa");
g.addColorStop(.68,"#e5e5e5");
g.addColorStop(1,"#969696");

}else{

g.addColorStop(0,"#ffffff");
g.addColorStop(.10,ball.color);
g.addColorStop(.55,ball.color);
g.addColorStop(.86,ball.color);
g.addColorStop(1,"#080808");
}

ctx.fillStyle=g;

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
BALL_R,
0,
Math.PI*2
);

ctx.fill();

/* Top reflection */

ctx.fillStyle=
"rgba(255,255,255,.82)";

ctx.beginPath();

ctx.ellipse(
ball.x-5,
ball.y-7,
3.8,
2.6,
-.4,
0,
Math.PI*2
);

ctx.fill();

/* Secondary reflection */

ctx.fillStyle=
"rgba(255,255,255,.24)";

ctx.beginPath();

ctx.arc(
ball.x+6,
ball.y+5,
2,
0,
Math.PI*2
);

ctx.fill();

/* Number */

if(ball.number>0){

/*
White number disc
makes the ball much closer to
a real pool ball.
*/

ctx.fillStyle="#f7f7f7";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
6.5,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#111";

ctx.font="bold 8px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
ball.number,
ball.x,
ball.y
);
}

/* Thin edge */

ctx.strokeStyle=
"rgba(0,0,0,.42)";

ctx.lineWidth=1;

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
BALL_R,
0,
Math.PI*2
);

ctx.stroke();
}

/* --------------------------------------------------
FIND AIM DIRECTION
-------------------------------------------------- */

function getAim(){

const cue=balls[0];

if(!cue)return null;

const dx=
mouseX-cue.x;

const dy=
mouseY-cue.y;

const length=
Math.hypot(dx,dy);

if(length<1)return null;

return {
x:dx/length,
y:dy/length,
length:length
};
}

/* --------------------------------------------------
FIRST TARGET PREDICTION
-------------------------------------------------- */

function findFirstTarget(){

const cue=balls[0];

if(!cue || !cue.active)return null;

const aim=getAim();

if(!aim)return null;

let closest=null;

let closestT=Infinity;

balls.forEach(ball=>{

if(
!ball.active ||
ball.number===0
)return;

const rx=
ball.x-cue.x;

const ry=
ball.y-cue.y;

const projection=
rx*aim.x+
ry*aim.y;

if(projection<=0)return;

const perpendicular=
Math.abs(
rx*aim.y-
ry*aim.x
);

const collisionDistance=
BALL_R*2;

if(
perpendicular<=
collisionDistance
){

const offset=
Math.sqrt(
collisionDistance*
collisionDistance-
perpendicular*
perpendicular
);

const t=
projection-offset;

if(
t>0 &&
t<closestT
){

closestT=t;
closest=ball;
}
}
});

return closest;
}

/* --------------------------------------------------
AIM SYSTEM
-------------------------------------------------- */

function drawAim(){

if(!aiming)return;

const cue=balls[0];

if(
!cue ||
!cue.active
)return;

const aim=getAim();

if(!aim)return;

/* Long precise line */

ctx.save();

ctx.setLineDash([
13,
9
]);

ctx.strokeStyle=
"rgba(255,255,255,.82)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
cue.x,
cue.y
);

ctx.lineTo(
cue.x+aim.x*620,
cue.y+aim.y*620
);

ctx.stroke();

ctx.restore();


/* Target prediction */

const target=findFirstTarget();

if(target){

const dx=
target.x-cue.x;

const dy=
target.y-cue.y;

const dist=
Math.hypot(dx,dy);

const nx=dx/dist;
const ny=dy/dist;

/*
Ghost-ball position:
point where cue ball center
should arrive to hit target.
*/

const ghostX=
target.x-
nx*(BALL_R*2);

const ghostY=
target.y-
ny*(BALL_R*2);

ctx.save();

ctx.strokeStyle=
"rgba(255,215,90,.75)";

ctx.lineWidth=2;

ctx.setLineDash([
7,
7
]);

ctx.beginPath();

ctx.moveTo(
target.x,
target.y
);

ctx.lineTo(
ghostX,
ghostY
);

ctx.stroke();

ctx.restore();

/* Ghost ball */

ctx.strokeStyle=
"rgba(255,255,255,.32)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.arc(
ghostX,
ghostY,
BALL_R,
0,
Math.PI*2
);

ctx.stroke();
}

drawCue(
cue,
aim.x,
aim.y
);
}

/* --------------------------------------------------
PREMIUM CUE
-------------------------------------------------- */

function drawCue(
cue,
nx,
ny
){

const length=390;

ctx.save();

ctx.translate(
cue.x-nx*length,
cue.y-ny*length
);

ctx.rotate(
Math.atan2(ny,nx)
);

/*
Premium cue:
tip + ferrule + shaft +
decorative rings + ebony handle.
*/

/* Main shaft */

const shaft=
ctx.createLinearGradient(
0,
-5,
0,
5
);

shaft.addColorStop(
0,
"#f8ead1"
);

shaft.addColorStop(
.45,
"#d9b679"
);

shaft.addColorStop(
1,
"#7d4c1e"
);

ctx.fillStyle=shaft;

ctx.fillRect(
45,
-4,
275,
8
);

/* Gold decorative rings */

ctx.fillStyle="#d8ad42";

ctx.fillRect(
300,
-7,
5,
14
);

ctx.fillRect(
310,
-7,
4,
14
);

/* Ebony handle */

const handle=
ctx.createLinearGradient(
0,
-7,
0,
7
);

handle.addColorStop(
0,
"#050505"
);

handle.addColorStop(
.45,
"#2b180c"
);

handle.addColorStop(
1,
"#030303"
);

ctx.fillStyle=handle;

ctx.fillRect(
314,
-7,
62,
14
);

/* Leather grip lines */

ctx.strokeStyle=
"rgba(206,164,83,.65)";

ctx.lineWidth=1;

for(
let x=320;
x<372;
x+=7
){

ctx.beginPath();

ctx.moveTo(
x,
-7
);

ctx.lineTo(
x-4,
7
);

ctx.stroke();
}

/* Butt cap */

ctx.fillStyle="#d8ad42";

ctx.fillRect(
375,
-8,
7,
16
);

/* Ferrule */

ctx.fillStyle="#f4f0e6";

ctx.fillRect(
36,
-4,
9,
8
);

/* Tip */

ctx.fillStyle="#d6c3a3";

ctx.fillRect(
28,
-3,
9,
6
);

ctx.restore();
}

/* --------------------------------------------------
PHYSICS
-------------------------------------------------- */

function resolveCollision(a,b){

const dx=
b.x-a.x;

const dy=
b.y-a.y;

const distance=
Math.hypot(dx,dy);

const minDistance=
BALL_R*2;

if(
distance===0 ||
distance>minDistance
){
return;
}

const nx=dx/distance;
const ny=dy/distance;

const overlap=
minDistance-distance;

/* separate */

a.x-=nx*overlap/2;
a.y-=ny*overlap/2;

b.x+=nx*overlap/2;
b.y+=ny*overlap/2;

/* relative velocity */

const rvx=
b.vx-a.vx;

const rvy=
b.vy-a.vy;

const velocityNormal=
rvx*nx+
rvy*ny;

if(velocityNormal>0){
return;
}

const impulse=
-(1+BALL_RESTITUTION)*
velocityNormal/2;

a.vx-=
impulse*nx;

a.vy-=
impulse*ny;

b.vx+=
impulse*nx;

b.vy+=
impulse*ny;
}

/* --------------------------------------------------
POCKET CHECK
-------------------------------------------------- */

function checkPocket(ball){

for(
const pocket of pockets
){

const distance=
Math.hypot(
ball.x-pocket.x,
ball.y-pocket.y
);

if(distance<30){

/*
Fade-like simple pocket
behaviour.
*/

ball.active=false;

ball.vx=0;
ball.vy=0;

return true;
}
}

return false;
}

/* --------------------------------------------------
PHYSICS LOOP
-------------------------------------------------- */

function updatePhysics(now){

let dt=
(now-lastTime)/1000;

lastTime=now;

/*
Protect physics against
browser pauses/frame drops.
*/

if(dt>0.025){
dt=0.025;
}

let moving=false;

balls.forEach(ball=>{

if(!ball.active)return;

ball.x+=
ball.vx*dt;

ball.y+=
ball.vy*dt;

/*
Time-based friction.
This makes speed consistent
across different displays.
*/

const friction=
Math.pow(
.035,
dt
);

ball.vx*=friction;
ball.vy*=friction;

if(
Math.hypot(
ball.vx,
ball.vy
)<STOP_SPEED
){

ball.vx=0;
ball.vy=0;

}else{

moving=true;
}

/* left */

if(
ball.x-BALL_R<
PLAY_LEFT
){

ball.x=
PLAY_LEFT+BALL_R;

ball.vx=
Math.abs(ball.vx)*
CUSHION_RESTITUTION;
}

/* right */

if(
ball.x+BALL_R>
PLAY_RIGHT
){

ball.x=
PLAY_RIGHT-BALL_R;

ball.vx=
-Math.abs(ball.vx)*
CUSHION_RESTITUTION;
}

/* top */

if(
ball.y-BALL_R<
PLAY_TOP
){

ball.y=
PLAY_TOP+BALL_R;

ball.vy=
Math.abs(ball.vy)*
CUSHION_RESTITUTION;
}

/* bottom */

if(
ball.y+BALL_R>
PLAY_BOTTOM
){

ball.y=
PLAY_BOTTOM-BALL_R;

ball.vy=
-Math.abs(ball.vy)*
CUSHION_RESTITUTION;
}

checkPocket(ball);
});

/*
Several collision passes prevent
balls from sticking together.
*/

for(let pass=0;pass<2;pass++){

for(
let i=0;
i<balls.length;
i++
){

for(
let j=i+1;
j<balls.length;
j++
){

if(
balls[i].active &&
balls[j].active
){

resolveCollision(
balls[i],
balls[j]
);
}
}
}
}

if(
!moving &&
!aiming
){

aiming=true;

shootButton.disabled=false;

statusText.textContent=
"Deine Runde – ziele und stoße.";
}

requestAnimationFrame(
updatePhysics
);
}

/* --------------------------------------------------
RENDER LOOP
-------------------------------------------------- */

function render(){

drawTable();

balls.forEach(
drawBall
);

drawAim();

requestAnimationFrame(
render
);
}

/* --------------------------------------------------
MOUSE
-------------------------------------------------- */

canvas.addEventListener(
"mousemove",
function(event){

const rect=
canvas.getBoundingClientRect();

mouseX=
(event.clientX-rect.left)*
W/
rect.width;

mouseY=
(event.clientY-rect.top)*
H/
rect.height;
}
);

/* --------------------------------------------------
TOUCH
-------------------------------------------------- */

canvas.addEventListener(
"touchmove",
function(event){

event.preventDefault();

const rect=
canvas.getBoundingClientRect();

const touch=
event.touches[0];

mouseX=
(touch.clientX-rect.left)*
W/
rect.width;

mouseY=
(touch.clientY-rect.top)*
H/
rect.height;

},
{passive:false}
);

/* --------------------------------------------------
SHOOT
-------------------------------------------------- */

shootButton.addEventListener(
"click",
function(){

if(!aiming)return;

const cue=balls[0];

if(
!cue ||
!cue.active
){
return;
}

const aim=getAim();

if(!aim)return;

const power=
Number(powerSlider.value)/
100;

/*
High speed.
At 100% the cue ball has
enough velocity for a strong break.
*/

const MIN_SPEED=280;
const MAX_SPEED=1450;

const speed=
MIN_SPEED+
power*
(MAX_SPEED-MIN_SPEED);

cue.vx=
aim.x*speed;

cue.vy=
aim.y*speed;

aiming=false;

shootButton.disabled=true;

statusText.textContent=
"🎱 KRÄFTIGER STOß!";
}
);

/* --------------------------------------------------
POWER
-------------------------------------------------- */

powerSlider.addEventListener(
"input",
function(){

powerValue.textContent=
this.value+"%";
}
);

/* --------------------------------------------------
RESET
-------------------------------------------------- */

resetButton.addEventListener(
"click",
function(){

setupTable();

aiming=true;

shootButton.disabled=false;

statusText.textContent=
"Break bereit – ziele und stoße.";
}
);

/* --------------------------------------------------
START
-------------------------------------------------- */

setupTable();

requestAnimationFrame(
updatePhysics
);

requestAnimationFrame(
render
);

</script>

</body>
</html>
