<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CueVerse OOZ Ball</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at center,
#243b52 0%,
#07101b 75%
);
color:white;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

.game{
width:min(1120px,97vw);
display:flex;
flex-direction:column;
align-items:center;
}

/* ================= TOP ================= */

.topbar{
width:100%;
height:68px;
margin-bottom:16px;
padding:8px 20px;

display:flex;
align-items:center;
justify-content:space-between;

border-radius:40px;

background:
linear-gradient(
180deg,
#1d2b3a,
#09121d
);

border:1px solid #405365;

box-shadow:
0 15px 40px rgba(0,0,0,.55),
inset 0 1px rgba(255,255,255,.1);
}

.player{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:45px;
height:45px;
border-radius:10px;

background:
radial-gradient(
circle at 35% 30%,
#777,
#222 55%,
#080808
);

border:2px solid #d7ad3d;
}

.player-name{
font-size:15px;
font-weight:bold;
}

.level{
color:#d7ad3d;
font-size:12px;
margin-top:3px;
}

.vs{
padding:6px 14px;
border-radius:6px;

background:
linear-gradient(#e7c65e,#997020);

color:#111;
font-weight:900;
}

/* ================= TABLE AREA ================= */

.table-area{
display:flex;
align-items:center;
gap:16px;
}

.power-box{
width:24px;
height:400px;

background:#080c10;

border:2px solid #394650;
border-radius:13px;

overflow:hidden;

box-shadow:
inset 0 0 15px #000,
0 8px 25px rgba(0,0,0,.5);

position:relative;
}

.power-fill{
position:absolute;
left:0;
bottom:0;

width:100%;
height:0%;

background:
linear-gradient(
to top,
#20c96b,
#ffd52e 55%,
#ff3c21
);
}

.table-frame{
padding:25px;

border-radius:18px;

background:
linear-gradient(
135deg,
#aa712f,
#6c3d1b 45%,
#311806
);

border:3px solid #291106;

box-shadow:
0 25px 60px rgba(0,0,0,.7),
inset 0 2px 2px rgba(255,255,255,.2),
inset 0 -8px 15px rgba(0,0,0,.5);
}

#poolCanvas{
display:block;

width:min(840px,82vw);
height:auto;

border-radius:5px;

box-shadow:
inset 0 0 30px rgba(0,0,0,.55);
}

.info{
margin-top:14px;

min-width:380px;

padding:9px 24px;

text-align:center;

border-radius:25px;

background:rgba(0,0,0,.72);

border:1px solid #405364;

font-size:14px;
}

@media(max-width:800px){

.game{
transform:scale(.82);
}

.power-box{
height:300px;
}

.table-frame{
padding:14px;
}
}

</style>
</head>


<body>

<div class="game">

<div class="topbar">

<div class="player">

<div class="avatar"></div>

<div>
<div class="player-name">
ooz
</div>

<div class="level">
★ 200
</div>
</div>

</div>


<div class="vs">
VS
</div>


<div class="player">

<div style="text-align:right">

<div class="player-name">
Ginevra
</div>

<div class="level">
★ 133
</div>

</div>

<div class="avatar"
style="border-color:#2ecc71">
</div>

</div>

</div>


<div class="table-area">

<div class="power-box">
<div id="powerFill"
class="power-fill">
</div>
</div>


<div class="table-frame">

<canvas
id="poolCanvas"
width="840"
height="420">
</canvas>

</div>

</div>


<div id="info" class="info">
Ziehe den Kö zurück und lasse los.
</div>

</div>


<script>

/* =========================================================
CUEVERSE OOZ BALL
========================================================= */

const canvas =
document.getElementById("poolCanvas");

const ctx =
canvas.getContext("2d");

const powerFill =
document.getElementById("powerFill");

const info =
document.getElementById("info");


/* =========================================================
TISCH
========================================================= */

const TABLE = {

left:30,
right:810,

top:30,
bottom:390
};


const R = 11;

const POCKET_R = 25;


/* =========================================================
PHYSIK
========================================================= */

const FRICTION = 0.994;

const WALL_BOUNCE = 0.94;

const BALL_BOUNCE = 0.98;

const MAX_SPEED = 30;


/* =========================================================
TASCHEN
========================================================= */

const pockets = [

{
x:TABLE.left,
y:TABLE.top
},

{
x:(TABLE.left+TABLE.right)/2,
y:TABLE.top
},

{
x:TABLE.right,
y:TABLE.top
},

{
x:TABLE.left,
y:TABLE.bottom
},

{
x:(TABLE.left+TABLE.right)/2,
y:TABLE.bottom
},

{
x:TABLE.right,
y:TABLE.bottom
}

];


/* =========================================================
FARBEN
========================================================= */

const COLORS = {

1:"#f4c20d",
2:"#1769c2",
3:"#d93632",
4:"#7438aa",
5:"#ed7c1b",
6:"#168d4d",

8:"#090909",

9:"#f4c20d",
10:"#1769c2",
11:"#d93632",
12:"#7438aa",
13:"#ed7c1b",
14:"#168d4d"
};


/* =========================================================
KUGEL
========================================================= */

class Ball{

constructor(
x,
y,
number,
cue=false
){

this.x=x;
this.y=y;

this.vx=0;
this.vy=0;

this.number=number;

this.isCue=cue;

this.active=true;

this.striped=
!cue &&
number>=9 &&
number<=14;

this.color=
cue
? "#ffffff"
: COLORS[number];
}


speed(){

return Math.hypot(
this.vx,
this.vy
);
}


update(){

if(!this.active)
return;


this.x+=this.vx;
this.y+=this.vy;


this.vx*=FRICTION;
this.vy*=FRICTION;


if(Math.abs(this.vx)<0.015)
this.vx=0;

if(Math.abs(this.vy)<0.015)
this.vy=0;


/* Taschen */

for(const p of pockets){

const d=
Math.hypot(
this.x-p.x,
this.y-p.y
);

if(d<POCKET_R){

this.active=false;

this.vx=0;
this.vy=0;

if(this.isCue){

info.textContent=
"Foul – weiße Kugel.";

setTimeout(()=>{

this.active=true;

this.x=220;
this.y=210;

},700);

}

return;
}
}


/* Banden */

const minX=
TABLE.left+R;

const maxX=
TABLE.right-R;

const minY=
TABLE.top+R;

const maxY=
TABLE.bottom-R;


if(this.x<minX){

this.x=minX;

this.vx=
Math.abs(this.vx)*
WALL_BOUNCE;
}


if(this.x>maxX){

this.x=maxX;

this.vx=
-Math.abs(this.vx)*
WALL_BOUNCE;
}


if(this.y<minY){

this.y=minY;

this.vy=
Math.abs(this.vy)*
WALL_BOUNCE;
}


if(this.y>maxY){

this.y=maxY;

this.vy=
-Math.abs(this.vy)*
WALL_BOUNCE;
}

}


/* =====================================================
REALISTISCHE KUGEL
===================================================== */

draw(){

if(!this.active)
return;


ctx.save();


/* Schatten */

ctx.beginPath();

ctx.ellipse(
this.x+3,
this.y+4,
R*1.05,
R*.78,
0,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(0,0,0,.38)";

ctx.fill();


/* Kugel */

const gradient=
ctx.createRadialGradient(
this.x-4,
this.y-5,
1,
this.x,
this.y,
R+2
);


if(this.isCue){

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.45,
"#f2f2f2"
);

gradient.addColorStop(
.85,
"#bcbcbc"
);

gradient.addColorStop(
1,
"#6c6c6c"
);

}else{

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
.16,
this.color
);

gradient.addColorStop(
.75,
this.color
);

gradient.addColorStop(
1,
"#111111"
);
}


ctx.beginPath();

ctx.arc(
this.x,
this.y,
R,
0,
Math.PI*2
);

ctx.fillStyle=gradient;

ctx.fill();


/* =================================================
HALBE KUGELN
================================================= */

if(this.striped){

ctx.save();

ctx.beginPath();

ctx.arc(
this.x,
this.y,
R,
0,
Math.PI*2
);

ctx.clip();


/*
Weißer breiter Mittelbereich
*/

ctx.fillStyle="#f8f8f8";

ctx.fillRect(
this.x-R,
this.y-5.2,
R*2,
10.4
);


/*
Farbige obere/untere Bereiche
*/

ctx.fillStyle=this.color;

ctx.fillRect(
this.x-R,
this.y-10,
R*2,
4.8
);

ctx.fillRect(
this.x-R,
this.y+5.2,
R*2,
4.8
);


ctx.restore();
}


/* =================================================
NUMMER
================================================= */

if(!this.isCue){

ctx.beginPath();

ctx.arc(
this.x,
this.y,
4.4,
0,
Math.PI*2
);

ctx.fillStyle="#ffffff";

ctx.fill();


ctx.fillStyle=
this.number===8
? "#ffffff"
: "#111111";


ctx.font=
"bold 6px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillText(
this.number,
this.x,
this.y
);
}


/* Glanz */

ctx.beginPath();

ctx.arc(
this.x-4,
this.y-4.5,
2.1,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.fill();


ctx.restore();
}
}


/* =========================================================
KUGELN
========================================================= */

let balls=[];

let cueBall;


/* =========================================================
13 OBJEKTKUGELN
========================================================= */

function createRack(){

balls=[];


/* Weiße */

cueBall=
new Ball(
220,
210,
0,
true
);

balls.push(cueBall);


/*
EXAKT 13 KUGELN

VOLLE:
1 2 3 4 5 6

SCHWARZ:
8

HALBE:
9 10 11 12 13 14
*/


const rack=[

8,

1,9,

2,10,3,

11,4,12,5,

13,6,14

];


/*
1 + 2 + 3 + 4 + 3 = 13
*/

const startX=600;

const startY=210;

const spacing=23;


let index=0;


for(
let row=0;
row<5;
row++
){

/*
letzte Reihe nur 3 Kugeln
*/

const count=
row===4
? 3
: row+1;


for(
let col=0;
col<count;
col++
){

const x=
startX+
row*spacing*.86;


const y=
startY+
(col-(count-1)/2)*
spacing;


balls.push(
new Ball(
x,
y,
rack[index++]
)
);
}
}
}


/* =========================================================
KUGEL-KOLLISION
========================================================= */

function collide(a,b){

if(
!a.active ||
!b.active
)
return;


let dx=b.x-a.x;

let dy=b.y-a.y;

let distance=
Math.hypot(dx,dy);


const minDistance=
R*2;


if(distance===0){

dx=1;

dy=0;

distance=1;
}


if(distance>=minDistance)
return;


const nx=
dx/distance;

const ny=
dy/distance;


const overlap=
minDistance-distance;


a.x-=nx*overlap/2;

a.y-=ny*overlap/2;

b.x+=nx*overlap/2;

b.y+=ny*overlap/2;


const rvx=
b.vx-a.vx;

const rvy=
b.vy-a.vy;


const velocity=
rvx*nx+
rvy*ny;


if(velocity>0)
return;


const impulse=
-(1+BALL_BOUNCE)*
velocity/2;


const ix=
impulse*nx;

const iy=
impulse*ny;


a.vx-=ix;
a.vy-=iy;

b.vx+=ix;
b.vy+=iy;
}


/* =========================================================
TISCH ZEICHNEN
========================================================= */

function drawTable(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const cloth=
ctx.createLinearGradient(
0,0,
0,canvas.height
);

cloth.addColorStop(
0,
"#08794a"
);

cloth.addColorStop(
.5,
"#087044"
);

cloth.addColorStop(
1,
"#045b37"
);


ctx.fillStyle=cloth;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* Bande */

ctx.strokeStyle=
"rgba(0,0,0,.5)";

ctx.lineWidth=8;

ctx.strokeRect(
TABLE.left,
TABLE.top,
TABLE.right-TABLE.left,
TABLE.bottom-TABLE.top
);


/* Kopflinie */

ctx.strokeStyle=
"rgba(255,255,255,.14)";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
260,
TABLE.top
);

ctx.lineTo(
260,
TABLE.bottom
);

ctx.stroke();


/* Taschen */

for(const p of pockets){

const g=
ctx.createRadialGradient(
p.x-3,
p.y-3,
1,
p.x,
p.y,
POCKET_R
);

g.addColorStop(
0,
"#000"
);

g.addColorStop(
.7,
"#020202"
);

g.addColorStop(
1,
"#26302b"
);


ctx.beginPath();

ctx.arc(
p.x,
p.y,
POCKET_R,
0,
Math.PI*2
);

ctx.fillStyle=g;

ctx.fill();


ctx.strokeStyle=
"rgba(255,255,255,.08)";

ctx.lineWidth=2;

ctx.stroke();
}
}


/* =========================================================
POINTER SYSTEM
DAS IST DER WICHTIGE TEIL FÜR DEN STOSS
========================================================= */

let aiming=false;

let pointerX=0;

let pointerY=0;

let power=0;


/* Position umrechnen */

function getPointer(e){

const rect=
canvas.getBoundingClientRect();


return {

x:
(e.clientX-rect.left)*
canvas.width/
rect.width,

y:
(e.clientY-rect.top)*
canvas.height/
rect.height
};
}


/* =========================================================
KÖ
========================================================= */

function drawCue(){

if(!cueBall.active)
return;


/*
Wenn nicht gezogen wird,
steht der Kö automatisch hinter
der weißen Kugel.
*/

let dx;

let dy;


if(aiming){

dx=
cueBall.x-pointerX;

dy=
cueBall.y-pointerY;

}else{

/*
Standardrichtung nach rechts
*/

dx=1;

dy=0;
}


const distance=
Math.hypot(dx,dy);


if(distance<0.01)
return;


const nx=dx/distance;

const ny=dy/distance;


/*
Beim Zielen wandert der Kö
sichtbar nach hinten.
*/

const pullBack=
aiming
? 18+power*1.25
: 18;


const cueLength=
155;


const tipX=
cueBall.x-
nx*pullBack;

const tipY=
cueBall.y-
ny*pullBack;


const buttX=
cueBall.x-
nx*(pullBack+cueLength);

const buttY=
cueBall.y-
ny*(pullBack+cueLength);


ctx.save();


/* Schatten */

ctx.beginPath();

ctx.moveTo(
buttX+3,
buttY+3
);

ctx.lineTo(
tipX+3,
tipY+3
);

ctx.strokeStyle=
"rgba(0,0,0,.4)";

ctx.lineWidth=8;

ctx.stroke();


/* Kö */

const q=
ctx.createLinearGradient(
buttX,
buttY,
tipX,
tipY
);


q.addColorStop(
0,
"#44200e"
);

q.addColorStop(
.35,
"#9b5d28"
);

q.addColorStop(
.75,
"#d5a15a"
);

q.addColorStop(
.94,
"#eee0bd"
);

q.addColorStop(
1,
"#ffffff"
);


ctx.beginPath();

ctx.moveTo(
buttX,
buttY
);

ctx.lineTo(
tipX,
tipY
);

ctx.strokeStyle=q;

ctx.lineWidth=6;

ctx.lineCap="round";

ctx.stroke();


/* Queue-Spitze */

ctx.beginPath();

ctx.arc(
tipX,
tipY,
3,
0,
Math.PI*2
);

ctx.fillStyle="#dfefff";

ctx.fill();


/* Ziel-Linie beim Zielen */

if(aiming){

ctx.setLineDash([
6,
7
]);

ctx.beginPath();

ctx.moveTo(
cueBall.x,
cueBall.y
);

ctx.lineTo(
cueBall.x+
nx*240,

cueBall.y+
ny*240
);

ctx.strokeStyle=
"rgba(255,255,255,.65)";

ctx.lineWidth=1.5;

ctx.stroke();
}


ctx.restore();
}


/* =========================================================
POINTER DOWN
========================================================= */

function pointerDown(e){

e.preventDefault();


if(
!cueBall.active ||
ballsMoving()
)
return;


const p=
getPointer(e);


/*
Start muss nicht exakt auf der
weißen Kugel sein.

190 Pixel Radius.
*/

const distance=
Math.hypot(
p.x-cueBall.x,
p.y-cueBall.y
);


if(distance>190)
return;


aiming=true;

pointerX=p.x;

pointerY=p.y;

power=0;


try{
canvas.setPointerCapture(
e.pointerId
);
}catch(_){}


info.textContent=
"Kö zurückziehen – loslassen zum Stoßen.";
}


/* =========================================================
POINTER MOVE
========================================================= */

function pointerMove(e){

if(!aiming)
return;


e.preventDefault();


const p=
getPointer(e);


pointerX=p.x;

pointerY=p.y;


const distance=
Math.hypot(
cueBall.x-pointerX,
cueBall.y-pointerY
);


/*
Je weiter zurück,
desto stärker.
*/

power=
Math.min(
100,
Math.max(
0,
(distance-5)*.65
)
);


powerFill.style.height=
power+"%";
}


/* =========================================================
POINTER UP
========================================================= */

function pointerUp(e){

if(!aiming)
return;


e.preventDefault();


aiming=false;


powerFill.style.height="0%";


const dx=
cueBall.x-pointerX;

const dy=
cueBall.y-pointerY;


const distance=
Math.hypot(dx,dy);


if(distance<10){

info.textContent=
"Ziehe den Kö weiter zurück.";

return;
}


const nx=
dx/distance;

const ny=
dy/distance;


/*
KRÄFTIGER STOß

5 = Mindestgeschwindigkeit
bis 30 = Maximum
*/

const force=
Math.min(
MAX_SPEED,
5+power*.27
);


cueBall.vx=
nx*force;

cueBall.vy=
ny*force;


info.textContent=
"Stoß läuft …";
}


/* =========================================================
POINTER EVENTS
========================================================= */

canvas.addEventListener(
"pointerdown",
pointerDown
);

canvas.addEventListener(
"pointermove",
pointerMove
);

window.addEventListener(
"pointerup",
pointerUp
);


/* =========================================================
PHYSIK UPDATE
========================================================= */

function update(){

for(const ball of balls)
ball.update();


/*
Mehrere Kollisionsdurchläufe
verhindern, dass Kugeln ineinander
hängen bleiben.
*/

for(let pass=0;pass<2;pass++){

for(
let i=0;
i<balls.length;
i++
){

for(
let j=i+1;
j<balls.length;
j++
){

collide(
balls[i],
balls[j]
);
}
}
}
}


/* =========================================================
DRAW
========================================================= */

function draw(){

drawTable();


for(const ball of balls)
ball.draw();


/*
Kö wird ÜBER dem Tisch gezeichnet,
damit er klar sichtbar ist.
*/

if(!ballsMoving())
drawCue();
}


/* =========================================================
GAME LOOP
========================================================= */

function loop(){

update();

draw();

requestAnimationFrame(loop);
}


/* =========================================================
BEWEGUNG
========================================================= */

function ballsMoving(){

return balls.some(
ball =>
ball.active &&
ball.speed()>0.10
);
}


/* =========================================================
START
========================================================= */

createRack();

loop();

</script>

</body>
</html>
