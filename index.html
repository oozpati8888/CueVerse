<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #07111c;
}

#game {
width: 100%;
height: 100%;
}

canvas {
display: block;
touch-action: none;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>

<body>

<div id="game"></div>

<script>

/* =========================================================
OOZ BALL
========================================================= */

const TABLE_W = 1000;
const TABLE_H = 500;

const TABLE_X = 90;
const TABLE_Y = 110;

const BALL_R = 13;

const MAX_PULL = 300;
const MAX_SPEED = 22;

const RAIL_RESTITUTION = 0.97;

let scene;
let whiteBall;

let tableGraphics;
let ballGraphics;
let aimGraphics;
let cueGraphics;
let uiGraphics;

let aiming = false;
let pulling = false;

let aimAngle = 0;
let pullDistance = 0;

let pointerX = 0;
let pointerY = 0;

let startX = 0;
let startY = 0;


/* =========================================================
PHASER
========================================================= */

const config = {

type: Phaser.AUTO,

parent: "game",

width: TABLE_W + TABLE_X * 2,
height: TABLE_H + TABLE_Y * 2,

backgroundColor: "#07111c",

scale: {
mode: Phaser.Scale.FIT,
autoCenter: Phaser.Scale.CENTER_BOTH
},

physics: {

default: "matter",

matter: {

gravity: {
x: 0,
y: 0
},

enableSleeping: true,

positionIterations: 12,
velocityIterations: 12,
constraintIterations: 6
}
},

scene: {
preload,
create,
update
}
};

new Phaser.Game(config);


/* =========================================================
PRELOAD
========================================================= */

function preload() {
}


/* =========================================================
CREATE
========================================================= */

function create() {

scene = this;

drawTable();

createRails();

createWhiteBall();

tableGraphics = scene.add.graphics();
ballGraphics = scene.add.graphics();
aimGraphics = scene.add.graphics();
cueGraphics = scene.add.graphics();
uiGraphics = scene.add.graphics();

setupInput();

redraw();
}


/* =========================================================
TISCH
========================================================= */

function drawTable() {

const g = scene.add.graphics();

/* Außenbereich */

g.fillStyle(0x111923, 1);

g.fillRoundedRect(
TABLE_X - 45,
TABLE_Y - 45,
TABLE_W + 90,
TABLE_H + 90,
32
);


/* goldene Außenkante */

g.lineStyle(
5,
0xc9a35b,
1
);

g.strokeRoundedRect(
TABLE_X - 30,
TABLE_Y - 30,
TABLE_W + 60,
TABLE_H + 60,
25
);


/* rote Holzbanden */

g.fillStyle(
0x671d18,
1
);

g.fillRoundedRect(
TABLE_X - 16,
TABLE_Y - 16,
TABLE_W + 32,
TABLE_H + 32,
18
);


/* Spielfläche */

g.fillStyle(
0x087e87,
1
);

g.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* Stoff */

g.lineStyle(
3,
0x55cfd0,
0.65
);

g.strokeRect(
TABLE_X + 6,
TABLE_Y + 6,
TABLE_W - 12,
TABLE_H - 12
);


/*
* Sehr dezente Mitte.
* Kein großer Schriftzug mehr.
*/

g.lineStyle(
2,
0xffffff,
0.035
);

g.lineBetween(
TABLE_X + TABLE_W / 2,
TABLE_Y + 10,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H - 10
);


/*
* Taschen
*
* NICHT kreisförmig.
*
* Die Öffnungen sitzen in der Bande
* und haben eine längliche, leicht
* abgerundete Form.
*/

drawPocket(g, TABLE_X, TABLE_Y, "TL");
drawPocket(g, TABLE_X + TABLE_W / 2, TABLE_Y, "TC");
drawPocket(g, TABLE_X + TABLE_W, TABLE_Y, "TR");

drawPocket(g, TABLE_X, TABLE_Y + TABLE_H, "BL");
drawPocket(g, TABLE_X + TABLE_W / 2, TABLE_Y + TABLE_H, "BC");
drawPocket(g, TABLE_X + TABLE_W, TABLE_Y + TABLE_H, "BR");


/* Titel */

scene.add.text(
TABLE_X,
TABLE_Y - 72,
"OOZ BALL",
{
fontFamily: "Arial",
fontSize: "30px",
fontStyle: "bold",
color: "#e7c77d"
}
);


scene.add.text(
TABLE_X + TABLE_W - 82,
TABLE_Y - 68,
"8 BALL",
{
fontFamily: "Arial",
fontSize: "18px",
fontStyle: "bold",
color: "#e7c77d"
}
);
}


/* =========================================================
TASCHEN
========================================================= */

function drawPocket(g, x, y, type) {

const w = 58;
const h = 36;

g.fillStyle(
0x050608,
1
);


/*
* Eckentaschen:
* diagonale/abgerundete Öffnung.
*/

if (
type === "TL" ||
type === "TR" ||
type === "BL" ||
type === "BR"
) {

const left =
x - (type.includes("L") ? 3 : w - 3);

const top =
y - (type.includes("T") ? 3 : h - 3);

g.beginPath();

if (type === "TL") {
g.moveTo(x - 2, y - 2);
g.lineTo(x + w, y - 2);
g.lineTo(x + w - 16, y + h);
g.lineTo(x - 2, y + h);
}

if (type === "TR") {
g.moveTo(x - w, y - 2);
g.lineTo(x + 2, y - 2);
g.lineTo(x + 2, y + h);
g.lineTo(x - w + 16, y + h);
}

if (type === "BL") {
g.moveTo(x - 2, y - h);
g.lineTo(x + w - 16, y - h);
g.lineTo(x + w, y + 2);
g.lineTo(x - 2, y + 2);
}

if (type === "BR") {
g.moveTo(x - w + 16, y - h);
g.lineTo(x + 2, y - h);
g.lineTo(x + 2, y + 2);
g.lineTo(x - w, y + 2);
}

g.closePath();
g.fillPath();
}


/* Mitteltaschen */

if (
type === "TC" ||
type === "BC"
) {

g.beginPath();

if (type === "TC") {

g.moveTo(
x - w / 2,
y - 2
);

g.lineTo(
x + w / 2,
y - 2
);

g.lineTo(
x + w / 2 - 9,
y + h
);

g.lineTo(
x - w / 2 + 9,
y + h
);
}

if (type === "BC") {

g.moveTo(
x - w / 2 + 9,
y - h
);

g.lineTo(
x + w / 2 - 9,
y - h
);

g.lineTo(
x + w / 2,
y + 2
);

g.lineTo(
x - w / 2,
y + 2
);
}

g.closePath();
g.fillPath();
}
}


/* =========================================================
BANDEN
========================================================= */

function createRails() {

const t = 18;


scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y - t / 2,
TABLE_W,
t,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0,
frictionStatic: 0
}
);


scene.matter.add.rectangle(
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H + t / 2,
TABLE_W,
t,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0,
frictionStatic: 0
}
);


scene.matter.add.rectangle(
TABLE_X - t / 2,
TABLE_Y + TABLE_H / 2,
t,
TABLE_H,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0,
frictionStatic: 0
}
);


scene.matter.add.rectangle(
TABLE_X + TABLE_W + t / 2,
TABLE_Y + TABLE_H / 2,
t,
TABLE_H,
{
isStatic: true,
restitution: RAIL_RESTITUTION,
friction: 0,
frictionStatic: 0
}
);
}


/* =========================================================
WEISSE KUGEL
========================================================= */

function createWhiteBall() {

whiteBall = scene.matter.add.circle(

TABLE_X + TABLE_W * 0.32,

TABLE_Y + TABLE_H * 0.50,

BALL_R,

{
restitution: 0.90,

friction: 0.001,

frictionStatic: 0,

frictionAir: 0.002,

density: 0.004,

slop: 0.001,

sleepThreshold: 8
}
);
}


/* =========================================================
INPUT
========================================================= */

function setupInput() {

scene.input.on(
"pointermove",
function(pointer) {

pointerX = pointer.worldX;
pointerY = pointer.worldY;


if (!whiteBall) {
return;
}


if (!isMoving()) {

/*
* Immer auf die aktuelle Mausposition
* zielen.
*/

updateAim();


/*
* Wenn bereits gezogen wird:
* Kö entlang seiner Achse zurückziehen.
*/

if (aiming) {
updatePull();
}
}
}
);


scene.input.on(
"pointerdown",
function(pointer) {

if (!whiteBall) {
return;
}


if (isMoving()) {
return;
}


pointerX = pointer.worldX;
pointerY = pointer.worldY;


updateAim();


aiming = true;
pulling = true;

startX = pointerX;
startY = pointerY;

pullDistance = 0;
}
);


scene.input.on(
"pointerup",
function() {

if (!aiming) {
return;
}


aiming = false;
pulling = false;


shoot();
}
);
}


/* =========================================================
ZIELRICHTUNG
========================================================= */

function updateAim() {

const dx =
pointerX - whiteBall.position.x;

const dy =
pointerY - whiteBall.position.y;


if (
Math.abs(dx) < 0.001 &&
Math.abs(dy) < 0.001
) {
return;
}


aimAngle =
Math.atan2(dy, dx);
}


/* =========================================================
KÖ ZIEHEN
========================================================= */

function updatePull() {

/*
* Richtung hinter die Kugel
*/

const backX =
-Math.cos(aimAngle);

const backY =
-Math.sin(aimAngle);


/*
* Bewegung des Zeigers seit Beginn.
*/

const dx =
pointerX - startX;

const dy =
pointerY - startY;


/*
* Nur die Bewegung entlang
* der Kö-Achse wird verwendet.
*/

let distance =
dx * backX +
dy * backY;


distance =
Phaser.Math.Clamp(
distance,
0,
MAX_PULL
);


pullDistance = distance;
}


/* =========================================================
STOß
========================================================= */

function shoot() {

if (isMoving()) {
pullDistance = 0;
return;
}


if (pullDistance < 3) {
pullDistance = 0;
return;
}


/*
* Stärke
*/

const power =
pullDistance / MAX_PULL;


/*
* Nicht linear ganz am Anfang,
* damit kleine Bewegungen kontrollierbar
* bleiben.
*/

const speed =
Math.pow(power, 0.82) * MAX_SPEED;


/*
* EXAKTE RICHTUNG
*/

const vx =
Math.cos(aimAngle) * speed;

const vy =
Math.sin(aimAngle) * speed;


scene.matter.body.setVelocity(
whiteBall,
{
x: vx,
y: vy
}
);


pullDistance = 0;
}


/* =========================================================
BEWEGUNG
========================================================= */

function isMoving() {

if (!whiteBall) {
return false;
}


const vx =
whiteBall.velocity.x;

const vy =
whiteBall.velocity.y;


return Math.hypot(vx, vy) > 0.05;
}


/* =========================================================
WEISSE KUGEL ZEICHNEN
========================================================= */

function drawBall() {

ballGraphics.clear();


const x =
whiteBall.position.x;

const y =
whiteBall.position.y;


/*
* Schatten
*/

ballGraphics.fillStyle(
0x000000,
0.25
);

ballGraphics.fillCircle(
x + 3,
y + 4,
BALL_R + 2
);


/*
* Kugel
*/

ballGraphics.fillStyle(
0xf7f7f4,
1
);

ballGraphics.fillCircle(
x,
y,
BALL_R
);


/*
* leichter Rand
*/

ballGraphics.lineStyle(
1.5,
0xd2d2d2,
1
);

ballGraphics.strokeCircle(
x,
y,
BALL_R
);


/*
* Highlight
*/

ballGraphics.fillStyle(
0xffffff,
0.8
);

ballGraphics.fillCircle(
x - 4,
y - 4,
3
);
}


/* =========================================================
ZIELLINIE
========================================================= */

function drawAim() {

aimGraphics.clear();


if (!whiteBall) {
return;
}


const x =
whiteBall.position.x;

const y =
whiteBall.position.y;


const length = 1400;


const endX =
x +
Math.cos(aimAngle) * length;

const endY =
y +
Math.sin(aimAngle) * length;


/*
* Ziel-Linie
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.80
);

aimGraphics.lineBetween(
x,
y,
endX,
endY
);


/*
* Kugel-Mittelpunkt
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.35
);

aimGraphics.strokeCircle(
x,
y,
BALL_R + 7
);


/*
* Fadenkreuz
*/

aimGraphics.lineStyle(
2,
0xffffff,
0.75
);

aimGraphics.lineBetween(
x - 8,
y,
x + 8,
y
);

aimGraphics.lineBetween(
x,
y - 8,
x,
y + 8
);
}


/* =========================================================
PREMIUM KÖ
========================================================= */

function drawCue() {

cueGraphics.clear();


if (!whiteBall) {
return;
}


const dirX =
Math.cos(aimAngle);

const dirY =
Math.sin(aimAngle);


/*
* Rückwärtsrichtung
*/

const backX = -dirX;
const backY = -dirY;


/*
* GANZ WICHTIG:
*
* Spitze endet an der Oberfläche.
*
* Sie geht NICHT mehr in die Kugel.
*/

const tipDistance =
BALL_R + 3 + pullDistance;


const tipX =
whiteBall.position.x +
backX * tipDistance;

const tipY =
whiteBall.position.y +
backY * tipDistance;


/*
* langer hochwertiger Kö
*/

const cueLength = 430;


const buttX =
tipX +
backX * cueLength;

const buttY =
tipY +
backY * cueLength;


/*
* Schatten
*/

cueGraphics.lineStyle(
14,
0x000000,
0.20
);

cueGraphics.lineBetween(
buttX + 4,
buttY + 5,
tipX + 4,
tipY + 5
);


/*
* Hauptschaft
*/

cueGraphics.lineStyle(
7,
0xf0d4a0,
1
);

cueGraphics.lineBetween(
buttX,
buttY,
tipX,
tipY
);


/*
* heller Schaftstreifen
*/

cueGraphics.lineStyle(
2,
0xffffff,
0.75
);

cueGraphics.lineBetween(
buttX,
buttY,
tipX,
tipY
);


/*
* Griff
*/

const gripStart =
cueLength * 0.62;


const gripX =
tipX +
backX * gripStart;

const gripY =
tipY +
backY * gripStart;


cueGraphics.lineStyle(
22,
0x16181d,
1
);

cueGraphics.lineBetween(
gripX,
gripY,
buttX,
buttY
);


/*
* Goldene Griffverzierungen
*/

for (let i = 0; i < 5; i++) {

const d =
gripStart +
i * 34;


const cx =
tipX +
backX * d;

const cy =
tipY +
backY * d;


cueGraphics.lineStyle(
3,
0xcaa657,
1
);


cueGraphics.lineBetween(
cx - dirX * 9,
cy - dirY * 9,
cx + dirX * 9,
cy + dirY * 9
);
}


/*
* Butt-End
*/

cueGraphics.lineStyle(
25,
0x0c0d11,
1
);

cueGraphics.lineBetween(
buttX - backX * 12,
buttY - backY * 12,
buttX,
buttY
);


/*
* goldener Butt-Ring
*/

cueGraphics.lineStyle(
4,
0xd5b15e,
1
);

cueGraphics.lineBetween(
buttX - backX * 12,
buttY - backY * 12,
buttX - backX * 4,
buttY - backY * 4
);


/*
* Ferrule
*/

const ferruleX =
whiteBall.position.x +
backX * (BALL_R + 8);

const ferruleY =
whiteBall.position.y +
backY * (BALL_R + 8);


cueGraphics.lineStyle(
8,
0xffffff,
1
);

cueGraphics.lineBetween(
ferruleX,
ferruleY,
tipX,
tipY
);


/*
* Leder-Spitze
*/

cueGraphics.lineStyle(
4,
0x4a2e24,
1
);

cueGraphics.lineBetween(
tipX - backX * 7,
tipY - backY * 7,
tipX,
tipY
);


/*
* kleines Gold-Element direkt hinter
* der Ferrule
*/

cueGraphics.lineStyle(
3,
0xc9a45a,
1
);

cueGraphics.lineBetween(
ferruleX - dirX * 5,
ferruleY - dirY * 5,
ferruleX + dirX * 5,
ferruleY + dirY * 5
);
}


/* =========================================================
POWER-ANZEIGE
========================================================= */

function drawPower() {

uiGraphics.clear();


if (!aiming) {
return;
}


const power =
pullDistance / MAX_PULL;


const x =
TABLE_X - 42;

const y =
TABLE_Y + 30;

const h = 180;

const fill =
h * power;


uiGraphics.lineStyle(
3,
0xc9a45a,
1
);

uiGraphics.strokeRoundedRect(
x,
y,
18,
h,
8
);


if (fill > 0) {

uiGraphics.fillStyle(
0xe0a21b,
1
);

uiGraphics.fillRoundedRect(
x + 3,
y + h - fill + 3,
12,
fill - 6,
5
);
}
}


/* =========================================================
REDRAW
========================================================= */

function redraw() {

drawBall();

drawAim();

drawCue();

drawPower();
}


/* =========================================================
UPDATE
========================================================= */

function update() {

if (!whiteBall) {
return;
}


/*
* Kleine Restbewegungen eliminieren.
*/

const speed =
Math.hypot(
whiteBall.velocity.x,
whiteBall.velocity.y
);


if (speed < 0.035) {

scene.matter.body.setVelocity(
whiteBall,
{
x: 0,
y: 0
}
);
}


redraw();
}

</script>

</body>
</html>
