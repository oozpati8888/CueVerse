<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #05070b;
touch-action: none;
}

#game {
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

#table {
position: relative;
width: min(100vw, 1536px);
aspect-ratio: 1536 / 1024;
background-image: url("12726D74-5ECA-4F59-958C-EC7D2F0B4C3D.png");
background-size: 100% 100%;
background-repeat: no-repeat;
overflow: hidden;
}

canvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
}
</style>
</head>

<body>

<div id="game">
<div id="table"></div>
</div>

<script>
const {
Engine,
Render,
Runner,
Bodies,
Body,
Composite,
Events
} = Matter;

const table = document.getElementById("table");

const W = 1536;
const H = 1024;

/* ----------------------------------
MATTER PHYSICS
---------------------------------- */

const engine = Engine.create();

engine.gravity.x = 0;
engine.gravity.y = 0;

const world = engine.world;

/* Spielfeld ungefähr innerhalb
des grünen/blauen Tuchbereichs */
const left = 90;
const right = 1446;
const top = 90;
const bottom = 934;

const railThickness = 30;

/* Unsichtbare Banden */

Composite.add(world, [

Bodies.rectangle(
(left + right) / 2,
top - railThickness / 2,
right - left,
railThickness,
{
isStatic: true,
restitution: 0.95,
friction: 0
}
),

Bodies.rectangle(
(left + right) / 2,
bottom + railThickness / 2,
right - left,
railThickness,
{
isStatic: true,
restitution: 0.95,
friction: 0
}
),

Bodies.rectangle(
left - railThickness / 2,
(top + bottom) / 2,
railThickness,
bottom - top,
{
isStatic: true,
restitution: 0.95,
friction: 0
}
),

Bodies.rectangle(
right + railThickness / 2,
(top + bottom) / 2,
railThickness,
bottom - top,
{
isStatic: true,
restitution: 0.95,
friction: 0
}
)
]);

/* ----------------------------------
ZEICHENFLÄCHE
---------------------------------- */

const canvas = document.createElement("canvas");
canvas.width = W;
canvas.height = H;

table.appendChild(canvas);

const ctx = canvas.getContext("2d");

/* ----------------------------------
KUGELN
---------------------------------- */

const BALL_RADIUS = 23;

const balls = [];

function createBall(x, y, number, type) {

const body = Bodies.circle(
x,
y,
BALL_RADIUS,
{
restitution: 0.92,
friction: 0.005,
frictionAir: 0.018,
density: 0.004,
slop: 0.01
}
);

body.ballNumber = number;
body.ballType = type;

balls.push(body);

Composite.add(world, body);

return body;
}

/* ----------------------------------
FARBEN
---------------------------------- */

const colors = {
1: "#f4d21f",
2: "#1859d1",
3: "#e23c45",
4: "#743bd0",
5: "#f18b26",
6: "#159c79",
7: "#b82e32",

8: "#050505",

9: "#f4d21f",
10: "#1859d1",
11: "#e23c45",
12: "#743bd0",
13: "#f18b26",
14: "#159c79",
15: "#b82e32"
};

/* ----------------------------------
BALL DRAWING
---------------------------------- */

function drawBall(ball) {

const x = ball.position.x;
const y = ball.position.y;
const r = BALL_RADIUS;

ctx.save();

/* Schatten */

ctx.beginPath();
ctx.arc(
x + 3,
y + 4,
r,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,0.40)";
ctx.fill();

/* Kugel */

const gradient = ctx.createRadialGradient(
x - r * 0.35,
y - r * 0.35,
r * 0.05,
x,
y,
r
);

if (ball.ballNumber === 8) {

gradient.addColorStop(0, "#555");
gradient.addColorStop(0.35, "#161616");
gradient.addColorStop(1, "#000");

} else {

gradient.addColorStop(
0,
"#ffffff"
);

gradient.addColorStop(
0.18,
colors[ball.ballNumber]
);

gradient.addColorStop(
1,
"#111"
);
}

ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI * 2);

ctx.fillStyle = gradient;
ctx.fill();

/* Streifen */

if (ball.ballType === "stripe") {

ctx.save();

ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI * 2);
ctx.clip();

ctx.fillStyle = "rgba(255,255,255,0.88)";

ctx.fillRect(
x - r,
y - r * 0.35,
r * 2,
r * 0.7
);

ctx.restore();
}

/* Nummernfeld */

ctx.beginPath();
ctx.arc(
x,
y,
r * 0.43,
0,
Math.PI * 2
);

ctx.fillStyle = "#ffffff";
ctx.fill();

ctx.fillStyle = "#111";
ctx.font = "bold 15px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillText(
ball.ballNumber,
x,
y + 1
);

/* Glanz */

ctx.beginPath();
ctx.arc(
x - r * 0.35,
y - r * 0.35,
r * 0.16,
0,
Math.PI * 2
);

ctx.fillStyle = "rgba(255,255,255,0.75)";
ctx.fill();

ctx.restore();
}

/* ----------------------------------
15 OBJEKTKUGELN
7 VOLLE
7 HALBE
8 SCHWARZ
---------------------------------- */

/*
15
10 14
7 8 13
3 9 12 6
1 2 11 4 5
*/

const rackX = 1160;
const rackY = 512;

const spacingX = BALL_RADIUS * 1.78;
const spacingY = BALL_RADIUS * 2.02;

/* Reihe 1 */

createBall(
rackX,
rackY,
15,
"stripe"
);

/* Reihe 2 */

createBall(
rackX + spacingX,
rackY - spacingY / 2,
10,
"stripe"
);

createBall(
rackX + spacingX,
rackY + spacingY / 2,
14,
"stripe"
);

/* Reihe 3 */

createBall(
rackX + spacingX * 2,
rackY - spacingY,
7,
"solid"
);

createBall(
rackX + spacingX * 2,
rackY,
8,
"black"
);

createBall(
rackX + spacingX * 2,
rackY + spacingY,
13,
"stripe"
);

/* Reihe 4 */

createBall(
rackX + spacingX * 3,
rackY - spacingY * 1.5,
3,
"solid"
);

createBall(
rackX + spacingX * 3,
rackY - spacingY * 0.5,
9,
"stripe"
);

createBall(
rackX + spacingX * 3,
rackY + spacingY * 0.5,
12,
"stripe"
);

createBall(
rackX + spacingX * 3,
rackY + spacingY * 1.5,
6,
"solid"
);

/* Reihe 5 */

createBall(
rackX + spacingX * 4,
rackY - spacingY * 2,
1,
"solid"
);

createBall(
rackX + spacingX * 4,
rackY - spacingY,
2,
"solid"
);

createBall(
rackX + spacingX * 4,
rackY,
11,
"stripe"
);

createBall(
rackX + spacingX * 4,
rackY + spacingY,
4,
"solid"
);

createBall(
rackX + spacingX * 4,
rackY + spacingY * 2,
5,
"solid"
);

/* ----------------------------------
WEISSE KUGEL
---------------------------------- */

const cueBall = Bodies.circle(
330,
512,
BALL_RADIUS,
{
restitution: 0.94,
friction: 0.002,
frictionAir: 0.012,
density: 0.004
}
);

cueBall.isCueBall = true;

Composite.add(world, cueBall);

/* ----------------------------------
AIMING
---------------------------------- */

let aiming = false;
let aimX = 0;
let aimY = 0;

table.addEventListener("pointerdown", function(e) {

const rect = table.getBoundingClientRect();

const x = (e.clientX - rect.left)
* W / rect.width;

const y = (e.clientY - rect.top)
* H / rect.height;

const dx = x - cueBall.position.x;
const dy = y - cueBall.position.y;

if (Math.sqrt(dx * dx + dy * dy) < 70) {

aiming = true;

aimX = x;
aimY = y;
}
});

table.addEventListener("pointermove", function(e) {

if (!aiming) return;

const rect = table.getBoundingClientRect();

aimX = (e.clientX - rect.left)
* W / rect.width;

aimY = (e.clientY - rect.top)
* H / rect.height;
});

table.addEventListener("pointerup", function() {

if (!aiming) return;

const dx = cueBall.position.x - aimX;
const dy = cueBall.position.y - aimY;

const distance = Math.sqrt(
dx * dx + dy * dy
);

if (distance > 10) {

const power = Math.min(
distance,
260
);

const force = 0.000055 * power;

Body.applyForce(
cueBall,
cueBall.position,
{
x: dx / distance * force,
y: dy / distance * force
}
);
}

aiming = false;
});

/* ----------------------------------
ZEICHNEN
---------------------------------- */

function drawCueBall() {

const x = cueBall.position.x;
const y = cueBall.position.y;
const r = BALL_RADIUS;

ctx.save();

ctx.beginPath();
ctx.arc(x + 3, y + 4, r, 0, Math.PI * 2);
ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fill();

const gradient = ctx.createRadialGradient(
x - 8,
y - 8,
2,
x,
y,
r
);

gradient.addColorStop(0, "#ffffff");
gradient.addColorStop(0.7, "#eeeeee");
gradient.addColorStop(1, "#aaaaaa");

ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI * 2);
ctx.fillStyle = gradient;
ctx.fill();

ctx.restore();
}

function drawAim() {

if (!aiming) return;

const x = cueBall.position.x;
const y = cueBall.position.y;

const dx = x - aimX;
const dy = y - aimY;

const length = Math.sqrt(
dx * dx + dy * dy
);

if (length < 1) return;

const nx = dx / length;
const ny = dy / length;

ctx.save();

ctx.strokeStyle = "rgba(255,255,255,0.85)";
ctx.lineWidth = 3;

ctx.setLineDash([12, 8]);

ctx.beginPath();

ctx.moveTo(
x + nx * 30,
y + ny * 30
);

ctx.lineTo(
x + nx * 500,
y + ny * 500
);

ctx.stroke();

ctx.restore();
}

/* ----------------------------------
LOOP
---------------------------------- */

function draw() {

ctx.clearRect(0, 0, W, H);

drawCueBall();

for (const ball of balls) {
drawBall(ball);
}

drawAim();

requestAnimationFrame(draw);
}

draw();

/* ----------------------------------
PHYSICS LOOP
---------------------------------- */

let lastTime = performance.now();

function physicsLoop(time) {

const delta = Math.min(
time - lastTime,
32
);

lastTime = time;

Engine.update(engine, delta);

requestAnimationFrame(physicsLoop);
}

physicsLoop(performance.now());

</script>

</body>
</html>
