<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CueVerse – Royal Table</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #050505;
color: white;
font-family: Arial, sans-serif;
text-align: center;
}

.screen {
display: none;
min-height: 100vh;
padding: 25px 12px;
}

.active {
display: block;
}

h1, h2 {
color: #d4af37;
}

.info {
display: flex;
justify-content: space-between;
max-width: 900px;
margin: 10px auto 18px;
font-size: 15px;
}

.gold {
color: #d4af37;
}

#tableWrap {
width: 95%;
max-width: 900px;
margin: auto;
padding: 28px;
background: #24170b;
border: 10px solid #d4af37;
border-radius: 24px;
box-shadow: 0 0 35px rgba(212,175,55,.35);
}

#table {
position: relative;
width: 100%;
aspect-ratio: 2 / 1;
background: #075b42;
border: 18px solid #10251d;
border-radius: 12px;
box-shadow: inset 0 0 25px rgba(0,0,0,.7);
overflow: hidden;
}

.pocket {
position: absolute;
width: 6%;
aspect-ratio: 1;
background: #020202;
border-radius: 50%;
box-shadow: inset 0 0 8px #000;
}

.p1 { left: -2%; top: -3%; }
.p2 { right: -2%; top: -3%; }
.p3 { left: -2%; bottom: -3%; }
.p4 { right: -2%; bottom: -3%; }
.p5 { left: 47%; top: -5%; }
.p6 { left: 47%; bottom: -5%; }

.ball {
position: absolute;
width: 4.3%;
aspect-ratio: 1;
border-radius: 50%;
box-shadow: 2px 3px 5px rgba(0,0,0,.7);
display: flex;
align-items: center;
justify-content: center;
color: white;
font-size: clamp(8px, 1.4vw, 14px);
font-weight: bold;
user-select: none;
}

.white {
background: white;
color: #111;
}

.red {
background: #b5121b;
}

.yellow {
background: #e5b800;
color: #111;
}

.black {
background: #050505;
}

#cue {
position: absolute;
height: 5px;
background: linear-gradient(to right, #eee, #d4af37, #6b3518);
transform-origin: right center;
border-radius: 5px;
display: none;
pointer-events: none;
}

.controls {
max-width: 600px;
margin: 22px auto;
}

label {
display: block;
color: #aaa;
margin-bottom: 8px;
}

input[type="range"] {
width: 90%;
accent-color: #d4af37;
}

button {
border: 1px solid #d4af37;
background: #d4af37;
color: #050505;
font-weight: bold;
padding: 14px 25px;
border-radius: 10px;
margin: 8px;
font-size: 16px;
cursor: pointer;
}

button.back {
background: #222;
color: white;
border-color: #555;
}

.status {
color: #aaa;
min-height: 24px;
}
</style>
</head>

<body>

<div id="game" class="screen active">

<h1>🎱 CueVerse</h1>
<h2>ROYAL TABLE</h2>

<div class="info">
<div>
👤 <strong>Orhan</strong><br>
<span class="gold">10.000 Coins</span>
</div>

<div>
🪙 Einsatz<br>
<span class="gold">100 Coins</span>
</div>

<div>
<strong>OOZ Player</strong><br>
Level 12
</div>
</div>

<div id="tableWrap">
<div id="table">

<div class="pocket p1"></div>
<div class="pocket p2"></div>
<div class="pocket p3"></div>
<div class="pocket p4"></div>
<div class="pocket p5"></div>
<div class="pocket p6"></div>

<div class="ball white" id="cueBall" style="left:20%;top:48%;">
⚪
</div>

<div class="ball red" style="left:63%;top:45%;">1</div>
<div class="ball yellow" style="left:67%;top:40%;">2</div>
<div class="ball red" style="left:67%;top:50%;">3</div>
<div class="ball yellow" style="left:71%;top:35%;">4</div>
<div class="ball red" style="left:71%;top:45%;">5</div>
<div class="ball yellow" style="left:71%;top:55%;">6</div>
<div class="ball red" style="left:75%;top:30%;">7</div>
<div class="ball black" style="left:75%;top:40%;">8</div>
<div class="ball yellow" style="left:75%;top:50%;">9</div>
<div class="ball red" style="left:75%;top:60%;">10</div>
<div class="ball yellow" style="left:79%;top:35%;">11</div>
<div class="ball red" style="left:79%;top:45%;">12</div>
<div class="ball yellow" style="left:79%;top:55%;">13</div>
<div class="ball red" style="left:83%;top:40%;">14</div>
<div class="ball yellow" style="left:83%;top:50%;">15</div>

<div id="cue"></div>

</div>
</div>

<div class="controls">

<label>
Stoßstärke:
<span id="powerValue" class="gold">50%</span>
</label>

<input
id="power"
type="range"
min="1"
max="100"
value="50"
>

<div>
<button onclick="shoot()">STOSS AUSFÜHREN</button>
<button class="back" onclick="resetBall()">Kugel zurücksetzen</button>
</div>

<div id="status" class="status">
Deine Runde – positioniere den Stoß.
</div>

</div>

</div>

<script>

const power = document.getElementById("power");
const powerValue = document.getElementById("powerValue");
const cueBall = document.getElementById("cueBall");
const cue = document.getElementById("cue");
const statusText = document.getElementById("status");

power.addEventListener("input", function() {
powerValue.textContent = this.value + "%";
});

function shoot() {

const strength = Number(power.value);

statusText.textContent =
"🎱 Stoß ausgeführt – Stärke " + strength + "%";

cue.style.display = "block";

cue.style.width = (120 + strength * 2) + "px";

cue.style.left = "calc(20% - 120px)";
cue.style.top = "calc(48% + 1.8%)";

setTimeout(function() {

cueBall.style.left =
Math.min(82, 20 + strength * 0.55) + "%";

cue.style.display = "none";

statusText.textContent =
"Nächster Stoß bereit.";

}, 500);
}

function resetBall() {

cueBall.style.left = "20%";
cueBall.style.top = "48%";

statusText.textContent =
"Weiße Kugel zurückgesetzt.";

}

</script>

</body>
</html>
