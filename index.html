<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>OOZ BALL</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #101010;
}

canvas {
display: block;
margin: auto;
}
</style>
</head>

<body>

<script>

const GAME_W = 900;
const GAME_H = 500;

const TABLE_X = 50;
const TABLE_Y = 50;

const TABLE_W = 800;
const TABLE_H = 400;

const RAIL = 24;
const POCKET_R = 24;

const BALL_R = 10;

let ball;
let ballGraphic;
let aimGraphic;

let dragging = false;


/* ================================
PHASER
================================ */

const config = {

type: Phaser.AUTO,

width: GAME_W,
height: GAME_H,

backgroundColor: '#101010',

physics: {
default: 'matter',

matter: {
gravity: {
x: 0,
y: 0
},

enableSleeping: true,

debug: false
}
},

scene: {
create: create,
update: update
}
};

new Phaser.Game(config);


/* ================================
CREATE
================================ */

function create() {

const scene = this;

/* TABLE */

const table = scene.add.graphics();

// Schatten
table.fillStyle(0x000000, 0.35);

table.fillRoundedRect(
TABLE_X - 32,
TABLE_Y - 32,
TABLE_W + 64,
TABLE_H + 64,
18
);

// Außenrahmen
table.fillStyle(0x171717, 1);

table.fillRoundedRect(
TABLE_X - 28,
TABLE_Y - 28,
TABLE_W + 56,
TABLE_H + 56,
16
);

// Goldkante
table.lineStyle(
4,
0xc9a34a,
1
);

table.strokeRoundedRect(
TABLE_X - 24,
TABLE_Y - 24,
TABLE_W + 48,
TABLE_H + 48,
13
);

// Bande
table.fillStyle(
0x4a2c19,
1
);

table.fillRoundedRect(
TABLE_X - 18,
TABLE_Y - 18,
TABLE_W + 36,
TABLE_H + 36,
10
);

// grünes Spielfeld
table.fillStyle(
0x126247,
1
);

table.fillRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);

// Spielfeldkante
table.lineStyle(
3,
0x0b3e30,
1
);

table.strokeRect(
TABLE_X,
TABLE_Y,
TABLE_W,
TABLE_H
);


/* POCKETS */

drawPocket(
scene,
TABLE_X,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y
);

drawPocket(
scene,
TABLE_X,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W / 2,
TABLE_Y + TABLE_H
);

drawPocket(
scene,
TABLE_X + TABLE_W,
TABLE_Y + TABLE_H
);


/* RAILS */

createRails(scene);


/* WHITE BALL */

ball = scene.matter.add.circle(

TABLE_X + 200,

TABLE_Y + TABLE_H / 2,

BALL_R,

{
restitution: 0.92,
friction: 0.01,
frictionAir: 0.025,
density: 0.004
}
);


/* BALL GRAPHIC */

ballGraphic =
scene.add.graphics();

drawBall();


/* AIM LINE */

aimGraphic =
scene.add.graphics();


/* POINTER DOWN */

scene.input.on(
'pointerdown',
function(pointer) {

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (distance <= 35) {
dragging = true;
}
}
);


/* POINTER MOVE */

scene.input.on(
'pointermove',
function(pointer) {

if (!dragging) {
return;
}

const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

const maxDistance = 180;

const power =
Math.min(
distance,
maxDistance
);

const angle =
Math.atan2(
dy,
dx
);

const endX =
ball.position.x -
Math.cos(angle) * power;

const endY =
ball.position.y -
Math.sin(angle) * power;


aimGraphic.clear();


// weiße Ziellinie
aimGraphic.lineStyle(
2,
0xffffff,
0.9
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
endX,
endY
);

aimGraphic.strokePath();


// goldene Kraftanzeige
aimGraphic.lineStyle(
5,
0xc9a34a,
0.8
);

aimGraphic.beginPath();

aimGraphic.moveTo(
ball.position.x,
ball.position.y
);

aimGraphic.lineTo(
ball.position.x -
Math.cos(angle) * power * 0.45,

ball.position.y -
Math.sin(angle) * power * 0.45
);

aimGraphic.strokePath();
}
);


/* POINTER UP */

scene.input.on(
'pointerup',
function(pointer) {

if (!dragging) {
return;
}

dragging = false;

aimGraphic.clear();


const dx =
pointer.worldX -
ball.position.x;

const dy =
pointer.worldY -
ball.position.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (distance < 5) {
return;
}


const power =
Math.min(
distance,
180
);

const force =
power * 0.00007;


scene.matter.body.applyForce(

ball,

ball.position,

{
x: -dx * force,
y: -dy * force
}
);
}
);


/* LOGO */

scene.add.text(

TABLE_X,

12,

'OOZ BALL',

{
fontFamily: 'Arial',
fontSize: '24px',
fontStyle: 'bold',
color: '#d6b15a'
}
);


scene.add.text(

TABLE_X + TABLE_W - 120,

16,

'8 BALL',

{
fontFamily: 'Arial',
fontSize: '14px',
color: '#ffffff',
alpha: 0.65
}
);
}


/* ================================
POCKET
================================ */

function drawPocket(
scene,
x,
y
) {

const g =
scene.add.graphics();

// äußerer Rand
g.fillStyle(
0x0b0b0b,
1
);

g.fillCircle(
x,
y,
POCKET_R + 5
);

// Tasche
g.fillStyle(
0x000000,
1
);

g.fillCircle(
x,
y,
POCKET_R
);

// innere Kante
g.lineStyle(
2,
0x292929,
1
);

g.strokeCircle(
x,
y,
POCKET_R
);
}


/* ================================
RAILS
================================ */

function createRails(scene) {

const gap = POCKET_R * 2.2;

const mid =
TABLE_W / 2;


/* TOP */

addRail(
scene,
TABLE_X + (mid - gap) / 2,
TABLE_Y - RAIL / 2,
mid - gap,
RAIL
);

addRail(
scene,
TABLE_X + mid +
(mid - gap) / 2,
TABLE_Y - RAIL / 2,
mid - gap,
RAIL
);


/* BOTTOM */

addRail(
scene,
TABLE_X + (mid - gap) / 2,
TABLE_Y + TABLE_H + RAIL / 2,
mid - gap,
RAIL
);

addRail(
scene,
TABLE_X + mid +
(mid - gap) / 2,
TABLE_Y + TABLE_H + RAIL / 2,
mid - gap,
RAIL
);


/* LEFT / RIGHT */

const sideLength =
TABLE_H / 2 - gap;


addRail(
scene,
TABLE_X - RAIL / 2,
TABLE_Y + sideLength / 2,
RAIL,
sideLength
);

addRail(
scene,
TABLE_X - RAIL / 2,
TABLE_Y + TABLE_H -
sideLength / 2,
RAIL,
sideLength
);


addRail(
scene,
TABLE_X + TABLE_W + RAIL / 2,
TABLE_Y + sideLength / 2,
RAIL,
sideLength
);

addRail(
scene,
TABLE_X + TABLE_W + RAIL / 2,
TABLE_Y + TABLE_H -
sideLength / 2,
RAIL,
sideLength
);
}


/* ================================
MATTER RAIL
================================ */

function addRail(
scene,
x,
y,
width,
height
) {

scene.matter.add.rectangle(

x,
y,
width,
height,

{
isStatic: true,
restitution: 0.95,
friction: 0
}
);
}


/* ================================
BALL
================================ */

function drawBall() {

ballGraphic.clear();


// Schatten
ballGraphic.fillStyle(
0x000000,
0.25
);

ballGraphic.fillCircle(

ball.position.x + 2,
ball.position.y + 2,
BALL_R + 2
);


// Kugel
ballGraphic.fillStyle(
0xffffff,
1
);

ballGraphic.fillCircle(

ball.position.x,
ball.position.y,
BALL_R
);


// Glanz
ballGraphic.fillStyle(
0xeaf4ff,
1
);

ballGraphic.fillCircle(

ball.position.x - 3,
ball.position.y - 3,
2
);
}


/* ================================
UPDATE
================================ */

function update() {

if (!ball) {
return;
}

drawBall();
}

</script>

</body>
</html>
