<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-Ball Billard</title>
<style>
body {
background-color: #222;
color: white;
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
}
h1 {
margin-bottom: 10px;
}
canvas {
background-color: #076324; /* Billard-Grün */
border: 15px solid #5c3a21; /* Holzrahmen */
border-radius: 5px;
box-shadow: 0 10px 20px rgba(0,0,0,0.5);
cursor: crosshair;
}
p {
margin-top: 15px;
color: #aaa;
}
</style>
</head>
<body>

<h1>8-Ball Billard</h1>
<canvas id="billardCanvas" width="800" height="400"></canvas>
<p>Steuerung: <strong>Maus bewegen</strong> zum Zielen, <strong>Klicken und Ziehen</strong> für die Stoßkraft.</p>

<script>
const canvas = document.getElementById("billardCanvas");
const ctx = canvas.getContext("2d");

// Spiel-Physik und Objekte
const BALL_RADIUS = 12;
let isAiming = false;
let power = 0;

// Die weiße Kugel
let cueBall = {
x: 200,
y: 200,
vx: 0,
vy: 0,
color: "#ffffff"
};

// Beispielhaft ein paar farbige Kugeln (Zielkugeln)
let balls = [
cueBall,
{ x: 550, y: 200, vx: 0, vy: 0, color: "#f1c40f" }, // Gelb
{ x: 575, y: 185, vx: 0, vy: 0, color: "#2980b9" }, // Blau
{ x: 575, y: 215, vx: 0, vy: 0, color: "#e74c3c" }, // Rot
{ x: 600, y: 200, vx: 0, vy: 0, color: "#111111" } // Schwarze 8
];

// Maus-Interaktion für den Queue (Billard-Queue)
let mouse = { x: 0, y: 0 };

canvas.addEventListener("mousemove", (e) => {
const rect = canvas.getBoundingClientRect();
mouse.x = e.clientX - rect.left;
mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", () => {
if (cueBall.vx === 0 && cueBall.vy === 0) {
isAiming = true;
}
});

canvas.addEventListener("mouseup", () => {
if (isAiming) {
// Berechne Stoßrichtung basierend auf Mausposition
let dx = cueBall.x - mouse.x;
let dy = cueBall.y - mouse.y;

// Stoßkraft (skaliert)
cueBall.vx = dx * 0.08;
cueBall.vy = dy * 0.08;

isAiming = false;
}
});

// Haupt-Spielschleife (Game Loop)
function update() {
// Reibung (Verlangsamung der Kugeln)
const friction = 0.985;

balls.forEach(ball => {
ball.x += ball.vx;
ball.y += ball.vy;
ball.vx *= friction;
ball.vy *= friction;

// Stop, wenn die Bewegung minimal ist
if (Math.abs(ball.vx) < 0.01) ball.vx = 0;
if (Math.abs(ball.vy) < 0.01) ball.vy = 0;

// Kollision mit den Banden (Rahmen)
if (ball.x - BALL_RADIUS < 0) {
ball.x = BALL_RADIUS;
ball.vx *= -1;
}
if (ball.x + BALL_RADIUS > canvas.width) {
ball.x = canvas.width - BALL_RADIUS;
ball.vx *= -1;
}
if (ball.y - BALL_RADIUS < 0) {
ball.y = BALL_RADIUS;
ball.vy *= -1;
}
if (ball.y + BALL_RADIUS > canvas.height) {
ball.y = canvas.height - BALL_RADIUS;
ball.vy *= -1;
}
});

// Einfache Kollisionserkennung zwischen Kugeln
for (let i = 0; i < balls.length; i++) {
for (let j = i + 1; j < balls.length; j++) {
let b1 = balls[i];
let b2 = balls[j];

let dx = b2.x - b1.x;
let dy = b2.y - b1.y;
let distance = Math.sqrt(dx * dx + dy * dy);

if (distance < BALL_RADIUS * 2) {
// Einfacher elastischer Impulsaustausch bei Kollision
let tempVx = b1.vx;
let tempVy = b1.vy;
b1.vx = b2.vx;
b1.vy = b2.vy;
b2.vx = tempVx;
b2.vy = tempVy;

// Kugeln leicht auseinanderschieben, um Überlappung zu verhindern
let overlap = (BALL_RADIUS * 2) - distance;
let nx = dx / distance;
let ny = dy / distance;
b1.x -= nx * overlap / 2;
b1.y -= ny * overlap / 2;
b2.x += nx * overlap / 2;
b2.y += ny * overlap / 2;
}
}
}
}

function draw() {
// Hintergrund leeren
ctx.clearRect(0, 0, canvas.width, canvas.height);

// Kugeln zeichnen
balls.forEach(ball => {
ctx.beginPath();
ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
ctx.fillStyle = ball.color;
ctx.fill();
ctx.closePath();
});

// Ziel-Linie zeichnen (wenn die Kugel stillsteht und gezielt wird)
if (isAiming) {
ctx.beginPath();
ctx.moveTo(cueBall.x, cueBall.y);
ctx.lineTo(mouse.x, mouse.y);
ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
ctx.lineWidth = 2;
ctx.stroke();
}
}

function gameLoop() {
update();
draw();
requestAnimationFrame(gameLoop);
}

// Spiel starten
gameLoop();
</script>
</body>
</html>
